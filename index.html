function drawStages(ctx, save, width, height, page = 0, extra = {}) {
  panel(ctx, width, height);
  bigTitle(ctx, 'STAGES', 64, width, CYAN, 46);
  const cleared = save ? (save.highestCleared ?? 0) : 0;
  const coins = save ? (save.coins ?? 0) : 0;
  const shipInfo = extra.ship ?? null;
  const shipDef = equippedShip(save);
  const shipLevelNow = shipInfo?.level ?? Math.max(1, shipLevel(save, shipDef.id));
  const shipName = shipInfo?.name ?? shipDef.name;
  ctx.textAlign = 'center';
  ctx.fillStyle = GOLD;
  ctx.font = 'bold 21px sans-serif';
  ctx.fillText(`🪙 ${coins} coins`, width / 2, 108);
  ctx.fillStyle = '#a5f3fc';
  ctx.font = 'bold 19px sans-serif';
  ctx.fillText(`SHIP ${shipName}  Lv ${shipLevelNow}   •   ${cleared > 0 ? `STAGE ${cleared} CLEARED` : 'NO STAGE CLEARED YET'}`, width / 2, 138);
  const layout = layoutStageTiles(page);
  const lo = layout.page * STAGES_PER_PAGE + 1;
  const hi = lo + STAGES_PER_PAGE - 1;
  // Band label with page arrows — the band's theme name and accent.
  const bandTheme = themeFor(lo);
  ctx.fillStyle = bandTheme.accent;
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText(`${bandTheme.name} · STAGES ${lo}–${hi}`, width / 2, 180);
  for (const [rect, dir, enabled] of [
    [layout.prevArrow, -1, layout.prevEnabled],
    [layout.nextArrow, 1, layout.nextEnabled],
  ]) {
    ctx.save();
    ctx.strokeStyle = enabled ? CYAN : 'rgba(148, 163, 184, 0.35)';
    ctx.lineWidth = 2;
    ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
    ctx.fillStyle = enabled ? CYAN : '#64748b';
    ctx.beginPath();
    const cx = rect.x + rect.w / 2;
    const cy = rect.y + rect.h / 2;
    if (dir < 0) {
      ctx.moveTo(cx + 10, cy - 14);
      ctx.lineTo(cx - 10, cy);
      ctx.lineTo(cx + 10, cy + 14);
    } else {
      ctx.moveTo(cx - 10, cy - 14);
      ctx.lineTo(cx + 10, cy);
      ctx.lineTo(cx - 10, cy + 14);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  // The tiles: number, state, coin reward. Boss and midboss stages
  // are labelled on the tile (★ BOSS / ◆ MIDBOSS) — the fight is only
  // visible in-game otherwise. The next tile uses the band accent.
  const nextStage = Math.min(100, cleared + 1);
  for (const tile of layout.tiles) {
    const n = tile.stage;
    const isCleared = n <= cleared;
    const isNext = n === nextStage;
    const accessible = stageAccessible(save ?? { highestCleared: 0 }, n);
    const reward = stageCoins(n);
    const boss = isBossStage(n);
    const midboss = isMidbossStage(n);
    const stateText = isCleared
      ? (boss ? '✓ BOSS' : midboss ? '✓ MIDBOSS' : '✓ CLEAR')
      : (isNext
        ? (boss ? '★ BOSS' : midboss ? '◆ MIDBOSS' : '▶ NEXT')
        : (boss ? '🔒 BOSS' : midboss ? '🔒 MIDBOSS' : '🔒 LOCKED'));
    const stateColor = boss ? GOLD : midboss ? '#c084fc'
      : (isCleared ? GREEN : (isNext ? bandTheme.accent : '#94a3b8'));
    ctx.save();
    ctx.fillStyle = isCleared
      ? 'rgba(52, 211, 153, 0.16)'
      : (isNext ? 'rgba(226, 232, 240, 0.10)' : 'rgba(20, 27, 61, 0.96)');
    ctx.fillRect(tile.x, tile.y, tile.w, tile.h);
    ctx.strokeStyle = isCleared ? GREEN : (isNext ? bandTheme.accent : 'rgba(148, 163, 184, 0.45)');
    ctx.lineWidth = isNext ? 3 : 2;
    ctx.strokeRect(tile.x, tile.y, tile.w, tile.h);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = accessible ? '#e2e8f0' : '#64748b';
    ctx.font = 'bold 30px sans-serif';
    ctx.fillText(String(n), tile.x + tile.w / 2, tile.y + 34);
    ctx.font = 'bold 19px sans-serif';
    ctx.fillStyle = stateColor;
    ctx.fillText(stateText, tile.x + tile.w / 2, tile.y + 70);
    ctx.fillStyle = GOLD;
    ctx.font = '16px sans-serif';
    ctx.fillText(`🪙 ${isCleared ? reward.replay : reward.first}`, tile.x + tile.w / 2, tile.y + 94);
    ctx.restore();
  }
  ctx.textBaseline = 'alphabetic';
  // Big PLAY STAGE button for the next uncleared stage.
  if (cleared < 100) {
    const r = layout.play;
    ctx.save();
    ctx.fillStyle = GOLD;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = INK;
    ctx.font = 'bold 26px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`▶  PLAY STAGE ${nextStage}`, r.x + r.w / 2, r.y + r.h / 2 + 1);
    ctx.restore();
    ctx.textBaseline = 'alphabetic';
  } else {
    ctx.fillStyle = GOLD;
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText('★ ALL 100 STAGES CLEAR ★', width / 2, 512);
  }
  drawButton(ctx, layout.back, '◀  BACK  [H]');
}

function drawShop(ctx, save, width, height, extra = {}) {
  const section = extra.section ?? 'ships';
  const weapons = extra.weapons ?? WEAPONS;
  const chips = extra.chips ?? CHIPS;
  panel(ctx, width, height);
  const title = section === 'weapons' ? 'WEAPON SHOP' : section === 'chips' ? 'CHIP SHOP' : 'SHIP SHOP';
  bigTitle(ctx, title, 64, width, GOLD, 46);
  const coins = save ? (save.coins ?? 0) : 0;
  const equippedId = equippedShip(save).id;
  ctx.textAlign = 'center';
  ctx.fillStyle = GOLD;
  ctx.font = 'bold 21px sans-serif';
  let coinsLine = `🪙 ${coins} coins — clear stages to earn more`;
  if (section === 'chips' && save) {
    const slots = save.chips?.slots ?? [null, null];
    const filled = slots.filter(Boolean).length;
    coinsLine += `   •   CHIP SLOTS ${filled}/${chipSlotCount(save)}`;
  }
  ctx.fillText(coinsLine, width / 2, 100);
  // Section tabs: one section visible at a time.
  const tabLabels = { ships: 'SHIPS', weapons: 'WEAPONS', chips: 'CHIPS' };
  for (const [key, rect] of Object.entries(SHOP_SECTION_RECTS)) {
    const active = key === section;
    ctx.save();
    ctx.fillStyle = active ? GOLD : 'rgba(20, 27, 61, 0.96)';
    ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
    ctx.strokeStyle = active ? GOLD : 'rgba(148, 163, 184, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
    ctx.fillStyle = active ? INK : '#94a3b8';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(tabLabels[key], rect.x + rect.w / 2, rect.y + rect.h / 2 + 1);
    ctx.restore();
  }
  if (section === 'weapons') {
    ctx.fillStyle = '#a5f3fc';
    ctx.font = '17px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('Weapons unlock with pilot level — switching weapons is free.', width / 2, 110);
    const equippedWeaponId = equippedWeapon(save);
    for (const card of layoutShopWeapons(weapons)) {
      const def = card.weapon;
      const level = Math.max(1, weaponLevel(save, def.id));
      const owned = !!(save?.weapons?.owned && save.weapons.owned[def.id]);
      const isEquipped = def.id === equippedWeaponId && owned;
      const ws = weaponStats(def, level, shipStats(equippedShip(save), Math.max(1, shipLevel(save, equippedShip(save).id))));
      ctx.save();
      ctx.fillStyle = 'rgba(20, 27, 61, 0.96)';
      ctx.fillRect(card.x, card.y, card.w, card.h);
      ctx.strokeStyle = isEquipped ? GOLD : CYAN;
      ctx.lineWidth = isEquipped ? 3 : 2;
      ctx.strokeRect(card.x, card.y, card.w, card.h);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = CYAN;
      ctx.font = 'bold 24px sans-serif';
      ctx.fillText(def.name, card.x + 18, card.y + 36);
      ctx.fillStyle = '#e2e8f0';
      ctx.font = '15px sans-serif';
      const descLines = wrapText(ctx, def.desc, card.w - 36).slice(0, 2);
      descLines.forEach((line, li) => {
        ctx.fillText(line, card.x + 18, card.y + 60 + li * 20);
      });
      ctx.font = '17px sans-serif';
      ctx.fillText(`DMG ${ws.damage}   •   ${ws.rate.toFixed(1)}/s   •   RNG ${ws.range}`, card.x + 18, card.y + 110);
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText(owned ? `Lv ${level}/10` : 'Not owned', card.x + 18, card.y + 140);
      if (owned) {
        const pipGap = 22;
        const startX = card.x + 130;
        for (let p = 0; p < 10; p += 1) {
          ctx.beginPath();
          ctx.arc(startX + p * pipGap, card.y + 134, 6, 0, Math.PI * 2);
          ctx.fillStyle = p < level ? GOLD : 'rgba(148, 163, 184, 0.35)';
          ctx.fill();
        }
      }
      // Lock line, or the action button.
      const b = card.action;
      const pilotLevel = save?.pilot?.level ?? 1;
      if (!owned && pilotLevel < def.unlockPilotLevel) {
        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 17px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`🔒 Pilot Lv ${def.unlockPilotLevel}`, b.x + b.w / 2, b.y + b.h / 2 + 1);
      } else {
        const buy = save ? canBuyWeapon(save, def.id) : { ok: false, reason: 'broke' };
        const lvl = save ? canLevelWeapon(save, def.id) : { ok: false, reason: 'not-owned' };
        let label;
        let active = false;
        let gold = false;
        if (!owned) {
          label = buy.ok ? `BUY  🪙 ${def.price}` : `NEED  🪙 ${def.price}`;
          active = buy.ok;
          gold = buy.ok;
        } else if (isEquipped && !lvl.ok && lvl.reason === 'maxed') {
          label = 'EQUIPPED ★';
        } else if (isEquipped) {
          label = lvl.ok ? `LEVEL UP  🪙 ${lvl.cost}` : `NEED  🪙 ${weaponLevelCost(level)}`;
          active = lvl.ok;
          gold = lvl.ok;
        } else {
          label = 'EQUIP';
          active = true;
        }
        ctx.fillStyle = gold ? GOLD : (active ? 'rgba(34, 211, 238, 0.20)' : 'rgba(148, 163, 184, 0.18)');
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = gold ? GOLD : (active ? CYAN : 'rgba(148, 163, 184, 0.35)');
        ctx.lineWidth = 1.5;
        ctx.strokeRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = gold ? INK : (active ? CYAN : '#94a3b8');
        ctx.font = 'bold 18px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, b.x + b.w / 2, b.y + b.h / 2 + 1);
      }
      ctx.restore();
    }
  } else if (section === 'chips') {
    ctx.fillStyle = '#a5f3fc';
    ctx.font = '17px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('Chips slot into your loadout — tap SLOT to equip, tap a slotted chip to remove it.', width / 2, 110);
    const slots = save?.chips?.slots ?? [null, null];
    const freeSlot = slots.some((s) => s == null);
    for (const card of layoutShopChips(chips)) {
      const def = card.chip;
      const owned = !!(save?.chips?.owned && save.chips.owned[def.id]);
      const slotted = slots.includes(def.id);
      const color = RARITY_COLORS[def.rarity] ?? '#e2e8f0';
      ctx.save();
      ctx.fillStyle = 'rgba(20, 27, 61, 0.96)';
      ctx.fillRect(card.x, card.y, card.w, card.h);
      ctx.strokeStyle = slotted ? GOLD : color;
      ctx.lineWidth = slotted ? 3 : 2;
      ctx.strokeRect(card.x, card.y, card.w, card.h);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = color;
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText(def.name, card.x + 16, card.y + 28);
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText(def.rarity.toUpperCase(), card.x + card.w - 16 - ctx.measureText(def.rarity.toUpperCase()).width, card.y + 28);
      ctx.fillStyle = '#e2e8f0';
      ctx.font = '14px sans-serif';
      const descLines = wrapText(ctx, def.desc, card.w - 32).slice(0, 2);
      descLines.forEach((line, li) => {
        ctx.fillText(line, card.x + 16, card.y + 52 + li * 18);
      });
      // Lock line, or the action button.
      const b = card.action;
      const pilotLevel = save?.pilot?.level ?? 1;
      if (!owned && pilotLevel < def.unlockPilotLevel) {
        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`🔒 Pilot Lv ${def.unlockPilotLevel}`, b.x + b.w / 2, b.y + b.h / 2 + 1);
      } else {
        const buy = save ? canBuyChip(save, def.id) : { ok: false, reason: 'broke' };
        let label;
        let active = false;
        let gold = false;
        if (!owned) {
          label = buy.ok ? `BUY  🪙 ${def.price}` : `NEED  🪙 ${def.price}`;
          active = buy.ok;
          gold = buy.ok;
        } else if (slotted) {
          label = 'SLOTTED ◆';
          active = true;
        } else if (!freeSlot) {
          label = 'NO FREE SLOT';
          active = false;
        } else {
          label = 'SLOT';
          active = true;
        }
        ctx.fillStyle = gold ? GOLD : (active ? 'rgba(34, 211, 238, 0.20)' : 'rgba(148, 163, 184, 0.18)');
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = gold ? GOLD : (active ? CYAN : 'rgba(148, 163, 184, 0.35)');
        ctx.lineWidth = 1.5;
        ctx.strokeRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = gold ? INK : (active ? CYAN : '#94a3b8');
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, b.x + b.w / 2, b.y + b.h / 2 + 1);
      }
      ctx.restore();
    }
  } else {
    ctx.fillStyle = '#a5f3fc';
    ctx.font = '17px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('Ships level up with coins too — higher stages demand a stronger ship.', width / 2, 110);
    for (const card of layoutShopCards()) {
      const def = card.ship;
      const level = shipLevel(save, def.id);
      const owned = level > 0;
      const isEquipped = def.id === equippedId && owned;
      const stats = shipStats(def, Math.max(1, level));
      const color = RARITY_COLORS[def.rarity] ?? '#e2e8f0';
      ctx.save();
      ctx.fillStyle = 'rgba(20, 27, 61, 0.96)';
      ctx.fillRect(card.x, card.y, card.w, card.h);
      ctx.strokeStyle = isEquipped ? GOLD : color;
      ctx.lineWidth = isEquipped ? 3 : 2;
      ctx.strokeRect(card.x, card.y, card.w, card.h);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = color;
      ctx.font = 'bold 24px sans-serif';
      ctx.fillText(def.name, card.x + 18, card.y + 36);
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText(def.rarity.toUpperCase(), card.x + 18, card.y + 58);
      ctx.fillStyle = '#e2e8f0';
      ctx.font = '17px sans-serif';
      ctx.fillText(`♥ ${stats.hearts} hearts   •   speed ×${stats.speedMult.toFixed(2)}`, card.x + 18, card.y + 88);
      ctx.fillText(`Blaster ${stats.blasterDamage} dmg   •   ${stats.blasterRate.toFixed(1)}/s`, card.x + 18, card.y + 112);
      // The ship's unique power (Stage 2): one line under the stats.
      if (def.power) {
        ctx.fillStyle = GOLD;
        ctx.font = '13px sans-serif';
        const powerLine = `⚡ ${def.power.name}: ${def.power.desc}`;
        const wrapped = wrapText(ctx, powerLine, card.w - 36).slice(0, 1);
        ctx.fillText(wrapped[0] ?? powerLine, card.x + 18, card.y + 130);
      }
      // Level pips.
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText(owned ? `Lv ${level}/10` : 'Not owned', card.x + 18, card.y + 152);
      if (owned) {
        const pipGap = 22;
        const startX = card.x + 130;
        for (let p = 0; p < 10; p += 1) {
          ctx.beginPath();
          ctx.arc(startX + p * pipGap, card.y + 146, 6, 0, Math.PI * 2);
          ctx.fillStyle = p < level ? GOLD : 'rgba(148, 163, 184, 0.35)';
          ctx.fill();
        }
      }
      // Lock line, or the action button.
      const b = card.action;
      if (!owned && (save?.highestCleared ?? 0) < def.unlockStage) {
        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 17px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`🔒 Clear stage ${def.unlockStage}`, b.x + b.w / 2, b.y + b.h / 2 + 1);
      } else {
        // No save (a bare screenshot draw): nothing can be bought.
        const buy = save ? canBuyShip(save, def.id) : { ok: false, reason: 'broke' };
        const lvl = save ? canLevelShip(save, def.id) : { ok: false, reason: 'not-owned' };
        let label;
        let active = false;
        let gold = false;
        if (!owned) {
          label = buy.ok ? `BUY  🪙 ${def.price}` : `NEED  🪙 ${def.price}`;
          active = buy.ok;
          gold = buy.ok;
        } else if (isEquipped && !lvl.ok && lvl.reason === 'maxed') {
          label = 'EQUIPPED ★';
        } else if (isEquipped) {
          label = lvl.ok ? `LEVEL UP  🪙 ${lvl.cost}` : `NEED  🪙 ${shipLevelCost(level)}`;
          active = lvl.ok;
          gold = lvl.ok;
        } else {
          label = 'EQUIP';
          active = true;
        }
        ctx.fillStyle = gold ? GOLD : (active ? 'rgba(34, 211, 238, 0.20)' : 'rgba(148, 163, 184, 0.18)');
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = gold ? GOLD : (active ? CYAN : 'rgba(148, 163, 184, 0.35)');
        ctx.lineWidth = 1.5;
        ctx.strokeRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = gold ? INK : (active ? CYAN : '#94a3b8');
        ctx.font = 'bold 18px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, b.x + b.w / 2, b.y + b.h / 2 + 1);
      }
      ctx.restore();
    }
  }
  ctx.textBaseline = 'alphabetic';
  drawButton(ctx, SHOP_BACK_RECT, '◀  BACK  [H]');
}

// --- Profile: pilot level + XP bar, equipped loadout, Attribute
// Overview, Collection, Achievements (claimable from here).
function drawProfile(ctx, save, width, height, extra = {}) {
  const profile = extra.profile ?? profileFromSave(save, extra.profileOpts ?? {});
  const layout = layoutProfileSections(profile);
  panel(ctx, width, height);
  bigTitle(ctx, 'PROFILE', 64, width, '#c084fc', 46);

  // Pilot XP panel.
  const xp = layout.xp;
  ctx.save();
  ctx.fillStyle = 'rgba(20, 27, 61, 0.96)';
  ctx.fillRect(xp.x, xp.y, xp.w, xp.h);
  ctx.strokeStyle = '#c084fc';
  ctx.lineWidth = 2;
  ctx.strokeRect(xp.x, xp.y, xp.w, xp.h);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#c084fc';
  ctx.font = 'bold 24px sans-serif';
  ctx.fillText(`PILOT  Lv ${profile.pilot.level}`, xp.x + 18, xp.y + 34);
  const barX = xp.x + 18;
  const barY = xp.y + 46;
  const barW = xp.w - 36;
  const barH = 12;
  ctx.fillStyle = 'rgba(148, 163, 184, 0.4)';
  ctx.fillRect(barX, barY, barW, barH);
  ctx.fillStyle = '#c084fc';
  ctx.fillRect(barX, barY, barW * Math.max(0, Math.min(1, profile.pilot.xpProgress ?? 0)), barH);
  ctx.fillStyle = '#e2e8f0';
  ctx.font = '16px sans-serif';
  const xpIntoLevel = Math.round((profile.pilot.xpProgress ?? 0) * (profile.pilot.xpToNext ?? 0));
  ctx.fillText(`XP ${xpIntoLevel} / ${profile.pilot.xpToNext} to Lv ${profile.pilot.level + 1}`, xp.x + 18, xp.y + 72);
  ctx.restore();

  // Loadout panel: ship (+ power), weapon, chips, totals.
  const lo = layout.loadout;
  ctx.save();
  ctx.fillStyle = 'rgba(20, 27, 61, 0.96)';
  ctx.fillRect(lo.x, lo.y, lo.w, lo.h);
  ctx.strokeStyle = 'rgba(148, 163, 184, 0.4)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(lo.x, lo.y, lo.w, lo.h);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 18px sans-serif';
  ctx.fillText('LOADOUT', lo.x + 18, lo.y + 24);
  ctx.font = '18px sans-serif';
  ctx.fillStyle = CYAN;
  ctx.fillText(`SHIP ${profile.loadout.ship.name}  Lv ${profile.loadout.ship.level}`, lo.x + 18, lo.y + 50);
  if (profile.loadout.shipPower) {
    ctx.fillStyle = GOLD;
    ctx.font = '14px sans-serif';
    ctx.fillText(`⚡ ${profile.loadout.shipPower.name}: ${profile.loadout.shipPower.desc}`, lo.x + 18, lo.y + 72);
  }
  ctx.fillStyle = '#e2e8f0';
  ctx.font = '18px sans-serif';
  ctx.fillText(`WEAPON ${profile.loadout.weapon.name}  Lv ${profile.loadout.weapon.level}`, lo.x + 18, lo.y + 96);
  const chipNames = (profile.loadout.chips || []).map((c) => c.name);
  ctx.fillStyle = '#c084fc';
  ctx.fillText(`CHIPS: ${chipNames.length ? chipNames.join(', ') : '—'}`, lo.x + 18, lo.y + 120);
  // Lifetime totals, one compact line at the foot of the loadout.
  ctx.fillStyle = '#94a3b8';
  ctx.font = '13px sans-serif';
  ctx.fillText(
    `RUNS ${profile.totals.runsPlayed}  •  STAGES ${profile.totals.stagesCleared}  •  KILLS ${profile.totals.enemiesDestroyed}  •  BOSSES ${profile.totals.bossesKilled}`,
    lo.x + 18, lo.y + 136,
  );
  ctx.restore();

  // Attribute Overview panel: base stats, then the active chip effects.
  const at = layout.attributes;
  ctx.save();
  ctx.fillStyle = 'rgba(20, 27, 61, 0.96)';
  ctx.fillRect(at.x, at.y, at.w, at.h);
  ctx.strokeStyle = 'rgba(148, 163, 184, 0.4)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(at.x, at.y, at.w, at.h);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 18px sans-serif';
  ctx.fillText('ATTRIBUTES', at.x + 18, at.y + 24);
  const attrLines = [
    ['HEARTS', `${profile.attributes.hearts}`],
    ['SPEED', `×${profile.attributes.speedMult.toFixed(2)}`],
    ['WEAPON DAMAGE', `${profile.attributes.weaponDamage}`],
    ['FIRE RATE', `${profile.attributes.weaponRate.toFixed(1)}/s`],
    ['DASH COOLDOWN', `${profile.attributes.dashCooldown.toFixed(2)}s`],
    ['MAGNET RADIUS', `${profile.attributes.magnetRadius}`],
    ['SHARD VALUE', `${profile.attributes.shardValue} pts`],
  ];
  for (const effect of profile.attributes.chipEffects ?? []) {
    attrLines.push([effect.label, effect.value]);
  }
  ctx.font = '17px sans-serif';
  attrLines.forEach(([label, value], i) => {
    const y = at.y + 52 + i * 24;
    ctx.fillStyle = '#94a3b8';
    ctx.fillText(label, at.x + 18, y);
    ctx.fillStyle = '#e2e8f0';
    ctx.textAlign = 'right';
    ctx.fillText(value, at.x + at.w - 18, y);
    ctx.textAlign = 'left';
  });
  ctx.restore();

  // Collection panel: four category rows (ships / weapons / chips /
  // skins) with owned-vs-locked items and their unlock condition.
  const col = layout.collection;
  ctx.save();
  ctx.fillStyle = 'rgba(20, 27, 61, 0.96)';
  ctx.fillRect(col.x, col.y, col.w, col.h);
  ctx.strokeStyle = 'rgba(148, 163, 184, 0.4)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(col.x, col.y, col.w, col.h);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 18px sans-serif';
  ctx.fillText('COLLECTION', col.x + 18, col.y + 24);
  const categories = [
    ['SHIPS', profile.collection.ships, col.rows.ships],
    ['WEAPONS', profile.collection.weapons, col.rows.weapons],
    ['CHIPS', profile.collection.chips, col.rows.chips],
    ['SKINS', profile.collection.skins, col.rows.skins],
  ];
  for (const [label, cat, row] of categories) {
    ctx.fillStyle = '#94a3b8';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText(`${label}  ${cat.owned}/${cat.total}`, row.x, row.y + 16);
    // Items flow across the row (two lines for chips), each owned item
    // in white with a ✓, each locked one dimmed with its unlock gate.
    ctx.font = '13px sans-serif';
    let itemX = row.x;
    let itemY = row.y + 36;
    const maxX = row.x + row.w;
    for (const item of cat.items ?? []) {
      const text = item.owned ? `${item.name} ✓  ` : `${item.name} 🔒 ${item.short}  `;
      const w = ctx.measureText(text).width;
      if (itemX + w > maxX && itemX > row.x) {
        itemX = row.x;
        itemY += 18;
      }
      if (itemY > row.y + row.h - 2) break;
      ctx.fillStyle = item.owned ? '#e2e8f0' : '#64748b';
      ctx.fillText(text, itemX, itemY);
      itemX += w;
    }
  }
  ctx.restore();

  // Achievements panel: up to 5 rows, each with a CLAIM button when
  // the achievement is unlocked and unclaimed.
  const ac = layout.achievements;
  ctx.save();
  ctx.fillStyle = 'rgba(20, 27, 61, 0.96)';
  ctx.fillRect(ac.x, ac.y, ac.w, ac.h);
  ctx.strokeStyle = 'rgba(148, 163, 184, 0.4)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(ac.x, ac.y, ac.w, ac.h);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 18px sans-serif';
  const claimed = (profile.achievements ?? []).filter((a) => a.state === 'claimed').length;
  ctx.fillText(`ACHIEVEMENTS  ${claimed}/${profile.achievements.length}`, ac.x + 18, ac.y + 24);
  for (const row of ac.rows) {
    const a = row.achievement;
    ctx.fillStyle = '#e2e8f0';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText(a.name, row.x, row.y + 16);
    ctx.fillStyle = '#94a3b8';
    ctx.font = '13px sans-serif';
    ctx.fillText(a.desc, row.x, row.y + 33);
    const b = row.claim;
    const claimable = a.state === 'claimable';
    const isClaimed = a.state === 'claimed';
    ctx.fillStyle = claimable ? GOLD : (isClaimed ? 'rgba(52, 211, 153, 0.25)' : 'rgba(148, 163, 184, 0.18)');
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = claimable ? GOLD : 'rgba(148, 163, 184, 0.35)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = claimable ? INK : (isClaimed ? '#34d399' : '#94a3b8');
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(
      claimable ? `CLAIM +${a.reward}` : (isClaimed ? 'CLAIMED ✓' : `🔒 +${a.reward}`),
      b.x + b.w / 2, b.y + b.h / 2 + 1,
    );
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }
  if (ac.total > ac.shown) {
    ctx.fillStyle = '#94a3b8';
    ctx.font = '14px sans-serif';
    ctx.fillText(`+ ${ac.total - ac.shown} more achievements…`, ac.x + 18, ac.y + ac.h - 10);
  }
  ctx.restore();

  ctx.textBaseline = 'alphabetic';
  drawButton(ctx, PROFILE_BACK_RECT, '◀  BACK  [H]');
}

function createRenderer(canvas) {
  const ctx = canvas.getContext('2d');

  // CSS-pixel size of the canvas box, plus the device pixel ratio used
  // for a crisp backing store on phones (capped at 3 for speed).
  function resize() {
    const rect = canvas.getBoundingClientRect();
    const width = Math.max(320, Math.floor(rect.width));
    const height = Math.max(240, Math.floor(rect.height));
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const backingWidth = Math.floor(width * dpr);
    const backingHeight = Math.floor(height * dpr);
    if (canvas.width !== backingWidth || canvas.height !== backingHeight) {
      canvas.width = backingWidth;
      canvas.height = backingHeight;
    }
    return { width, height, dpr };
  }

  function draw(state, screen, best, extra = {}) {
    const skin = extra.skin ?? SKINS[0];
    const offers = extra.offers ?? [];
    const lifetimeShards = extra.lifetimeShards ?? 0;
    const pointer = extra.pointer ?? null;
    const upgradeAge = extra.upgradeAge ?? 0;
    const save = extra.save ?? null;
    const streakInfo = extra.streakInfo ?? null;
    const summary = extra.summary ?? null;
    const { width, height, dpr } = resize();
    // Work in CSS pixels; the backing store is denser on hi-DPI screens.
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // Sky: the current band's theme gradient (extra.theme, or band 0
    // SOLAR DAWN when none is given). It also fills the letterbox bars.
    const theme = extra.theme ?? THEMES[0];
    const sky = ctx.createLinearGradient(0, 0, 0, height);
    sky.addColorStop(0, theme.bg[0]);
    sky.addColorStop(0.55, theme.bg[1]);
    sky.addColorStop(1, theme.bg[2]);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, width, height);
    drawNebula(ctx, width, height);

    // Hit flash, full screen.
    if (state.flashes > 0) {
      ctx.fillStyle = `rgba(244, 114, 182, ${state.flashes * 0.25})`;
      ctx.fillRect(0, 0, width, height);
    }

    // The field, letterboxed with one uniform scale: everything below is
    // drawn in field coordinates, so drawn position == simulated position.
    const { scale, ox, oy } = viewTransform(width, height);
    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(scale, scale);
    // Hit shake: the field jolts ~3 px for 0.1 s. The HUD and overlays
    // are drawn after the matching restore(), so they stay steady.
    // REDUCE SHAKE (settings) softens it to a 1 px nudge.
    ctx.save();
    if (state.shakeTime > 0) {
      const mag = ((state.shakeMag || 3) * (save && save.settings.reduceShake ? 0.33 : 1)) * Math.max(0, state.shakeTime / 0.1);
      ctx.translate((Math.random() * 2 - 1) * mag, (Math.random() * 2 - 1) * mag);
    }
    drawStars(ctx, state);

    if (screen === SCREEN_TITLE) {
      drawGate(ctx, state, FIELD.width, FIELD.height);
    }

    // Particles, under the entities.
    for (const p of state.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Trail ribbon, in the skin's trail colour.
    for (let i = 0; i < state.trail.length; i += 1) {
      const dot = state.trail[i];
      ctx.globalAlpha = (dot.life / dot.maxLife) * 0.5 * (i / state.trail.length);
      ctx.fillStyle = skin.trail;
      ctx.beginPath();
      ctx.arc(dot.x, dot.y, 3 + 3 * (i / state.trail.length), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (screen === SCREEN_PLAY || screen === SCREEN_PAUSED || screen === SCREEN_OVER || screen === SCREEN_CLEAR || screen === SCREEN_UPGRADE) {
      for (const s of state.shards) drawShard(ctx, s.x, s.y, s.spin, s.pulse, s.golden);
      for (const s of state.shields) drawShieldCell(ctx, s.x, s.y, s.pulse);
      for (const m of state.mines) drawMine(ctx, m.x, m.y, m.radius, m.spin, m.pulse, m.age);
      for (const s of state.storms) drawStorm(ctx, s.x, s.y, s.spin, s.age);
      for (const e of state.enemies ?? []) drawEnemy(ctx, e);
      for (const b of state.bullets ?? []) drawBullet(ctx, b);
      for (const b of state.enemyBullets ?? []) drawEnemyBullet(ctx, b);
      for (const t of state.traps ?? []) drawTrap(ctx, t);
      for (const seg of state.pulseFx ?? []) drawPulseFx(ctx, seg);
      if (state.boss) drawBoss(ctx, state.boss);
      if (screen === SCREEN_PLAY || screen === SCREEN_PAUSED || screen === SCREEN_UPGRADE) drawShip(ctx, state, skin, extra.shipShape ?? 'skiff');
    }
    if (screen === SCREEN_PLAY && pointer && pointer.down && pointer.mode === 'relative') {
      drawJoystick(ctx, pointer);
    }
    // Magnet ring: when the pickup radius grows mid-run, a brief cyan
    // ring shows the new reach — the pull is visible, not invisible.
    if (screen === SCREEN_PLAY && state.magnetFlash > 0) {
      ctx.save();
      ctx.globalAlpha = 0.35 * Math.max(0, state.magnetFlash / 1.5);
      ctx.strokeStyle = CYAN;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(state.ship.x, state.ship.y, state.magnetRadius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    // First-run cues (teach by doing, not by a wall of text): while the
    // player has collected fewer than 3 shards in their very first run,
    // a pulsing hint floats over the ship; the dash cue appears the
    // first time a mine comes close while dash is ready.
    if (screen === SCREEN_PLAY && extra.firstRun && (state.shardsCollected ?? 0) < 3 && state.time < 10) {
      const pulse = 0.6 + 0.4 * Math.sin(state.time * 4);
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('DRAG TO STEER', state.ship.x, state.ship.y - 70);
      ctx.fillText('↓', state.ship.x, state.ship.y - 42);
      ctx.restore();
      ctx.textBaseline = 'alphabetic';
    }
    if (screen === SCREEN_PLAY && extra.dashCue) {
      const pulse = 0.6 + 0.4 * Math.sin(state.time * 4);
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.fillStyle = GOLD;
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('TAP DASH TO DODGE!', FIELD.width - 170, 540);
      ctx.restore();
      ctx.textBaseline = 'alphabetic';
    }
    // Floating score texts ("+10", "CLOSE! +5") rise and fade — only
    // while playing. On the game-over / win screens they would bleed
    // through the dim overlay onto the score lines, so they are not
    // drawn there.
    if (screen === SCREEN_PLAY || screen === SCREEN_PAUSED || screen === SCREEN_UPGRADE) {
      for (const f of state.floaters ?? []) {
        ctx.globalAlpha = Math.max(0, f.life / f.maxLife);
        ctx.fillStyle = f.color;
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(f.text, f.x, f.y);
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (screen === SCREEN_PLAY || screen === SCREEN_PAUSED || screen === SCREEN_UPGRADE) drawHud(ctx, state, best, FIELD.width, theme, { weaponLabel: extra.weaponLabel });
    if (screen === SCREEN_TITLE) drawTitle(ctx, state, best, FIELD.width, FIELD.height, skin, lifetimeShards, { save, streakInfo });
    if (screen === SCREEN_HANGAR) drawHangar(ctx, save, FIELD.width, FIELD.height, skin, state, { ship: extra.ship, shipShape: extra.shipShape, loadout: extra.loadout });
    if (screen === SCREEN_STAGES) drawStages(ctx, save, FIELD.width, FIELD.height, extra.stagesPage ?? 0, { ship: extra.ship });
    if (screen === SCREEN_SHOP) drawShop(ctx, save, FIELD.width, FIELD.height, { section: extra.section, weapons: extra.weapons, chips: extra.chips });
    if (screen === SCREEN_PROFILE) drawProfile(ctx, save, FIELD.width, FIELD.height, { profile: extra.profile, profileOpts: extra.profileOpts });
    if (screen === SCREEN_PAUSED) drawPaused(ctx, FIELD.width, FIELD.height);
    if (screen === SCREEN_OVER) drawOver(ctx, state, best, FIELD.width, FIELD.height, summary, { save });
    if (screen === SCREEN_CLEAR) drawClear(ctx, state, best, FIELD.width, FIELD.height, summary, { save });
    if (screen === SCREEN_STATS) drawStats(ctx, save, FIELD.width, FIELD.height);
    if (screen === SCREEN_MISSIONS) drawMissionsPanel(ctx, save, FIELD.width, FIELD.height);
    if (screen === SCREEN_SETTINGS) drawSettingsPanel(ctx, save, FIELD.width, FIELD.height, { fullscreenOn: extra.fullscreenOn ?? false });
    if (screen === SCREEN_REWARD) drawRewardPanel(ctx, save, FIELD.width, FIELD.height);
    if (screen === SCREEN_UPGRADE) drawUpgrade(ctx, state, offers, FIELD.width, FIELD.height, upgradeAge);
    ctx.restore();
    noGlow(ctx);
  }

  return { draw };
}

// ---- src/touchbtn.js ----
// Lumen Drift — on-screen touch buttons (DASH / pause). Pure logic:
// which buttons a screen shows, and the DOM call that shows or hides
// them. The buttons exist only while playing — on every menu screen
// they are hidden, so a thumb can never dash from the title or tap
// pause over a shop card. main.js calls applyTouchButtons every frame.

/** Which touch buttons are visible on `screen` (both only while playing). */
function touchButtonsFor(screen) {
  const visible = screen === SCREEN_PLAY;
  return { dash: visible, pause: visible };
}

/**
 * Show or hide the DASH / pause buttons. Touch devices only: on a
 * mouse/keyboard setup this is a no-op and CSS owns the buttons.
 * Missing elements are skipped, never thrown on.
 */
function applyTouchButtons(dashBtn, pauseBtn, screen, isTouch) {
  if (!isTouch) return;
  const { dash, pause } = touchButtonsFor(screen);
  if (dashBtn && dashBtn.style) dashBtn.style.display = dash ? 'block' : 'none';
  if (pauseBtn && pauseBtn.style) pauseBtn.style.display = pause ? 'block' : 'none';
}

// ---- src/shots.js ----
// Lumen Drift — the screenshot scenes behind ?shot=start|play|end|win|profile.
// Each scene plays the real rules forward from a fresh world for a fixed
// number of steps, steered by a simple autopilot (chase the nearest shard,
// keep clear of mines and storm shards), so the frame is what a real game
// looks like and the same seed always gives the same frame.
//
// - start: the title screen over a live, drifting field.
// - play: a busy mid-game — score ~340, combo x3, 2 hearts left.
// - end: the autopilot flies carelessly and the storm takes the skiff.
// - win: stage 1 clears at its target (500 points).
// - profile: the profile screen over a demo save (Lv 3 pilot, two ships,
//   a mortar, two chips, two achievements unlocked, one claimed).

const START_SECONDS = 6;
const PLAY_TARGET = 340;
const END_LIMIT_SECONDS = 600;

/** Steer toward `target` while dodging the nearest hazard in the way. */
function autopilot(state, careless) {
  const ship = state.ship;
  // Nearest shard to chase.
  let shard = null;
  let shardDist = Infinity;
  for (const s of state.shards) {
    const d = Math.hypot(s.x - ship.x, s.y - ship.y);
    if (d < shardDist) { shardDist = d; shard = s; }
  }
  let tx = shard ? shard.x : state.ship.x;
  let ty = shard ? shard.y : state.ship.y;
  // Dodge: if a mine or storm is close and ahead, veer away from it.
  const horizon = careless ? 60 : 130;
  for (const list of [state.mines, state.storms]) {
    for (const e of list) {
      const d = Math.hypot(e.x - ship.x, e.y - ship.y);
      if (d < horizon) {
        const away = Math.atan2(ship.y - e.y, ship.x - e.x);
        tx = ship.x + Math.cos(away) * 160;
        ty = ship.y + Math.sin(away) * 160;
      }
    }
  }
  const dx = tx - ship.x;
  const dy = ty - ship.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 10) return { x: 0, y: 0 };
  return { x: dx / dist, y: dy / dist };
}

/** Set `world` to the named scene and return the screen to draw over it. */
function stageShot(name, world) {
  // Stage 1 by default.
  world.setStage(1);
  world.reset();
  const state = world.state;
  if (name === 'win') {
    // Play forward until stage 1 clears, then let the victory settle.
    for (let i = 0; i < 60 * 240; i += 1) {
      const events = world.step(STEP, autopilot(state, false), null, false);
      if (events & EVENT_CLEAR) break;
    }
    state.score = Math.max(state.score, stageTarget(1));
    state.gateOpen = true;
    state.gateProgress = 1;
    for (let i = 0; i < 30; i += 1) world.step(STEP, { x: 0, y: 0 }, null, false);
    return { screen: SCREEN_CLEAR, best: state.score };
  }
  if (name === 'play') {
    for (let i = 0; i < 60 * 240; i += 1) {
      world.step(STEP, autopilot(state, false), null, false);
      if (state.score >= PLAY_TARGET) break;
    }
    // Let the field settle for a moment, then stage the exact HUD the
    // brief asks for: ~340 points, combo x3, two hearts. The autopilot
    // keeps the skiff alive; the numbers below are the scene's floor.
    // (A stage-1 clear event may fire mid-scene once the score passes
    // 500 — it is ignored here; the render stays 'play'.)
    for (let i = 0; i < 12; i += 1) world.step(STEP, autopilot(state, false), null, false);
    state.score = PLAY_TARGET;
    state.combo = 3;
    state.comboCount = 6;
    state.bestCombo = Math.max(3, state.bestCombo);
    state.hearts = 2;
    state.gateProgress = Math.min(1, state.score / stageTarget(1));
    return { screen: SCREEN_PLAY, best: state.score };
  }
  if (name === 'end') {
    // A reckless pilot: it wanders the middle of the field, never chases
    // a shard and never dodges, so the storm catches it early with a
    // modest score — a real game over, not a high-score run cut short.
    for (let i = 0; i < END_LIMIT_SECONDS / STEP; i += 1) {
      const wander = {
        x: Math.sin(state.time * 0.7) * 0.4,
        y: Math.cos(state.time * 0.5) * 0.3,
      };
      const events = world.step(STEP, wander, null, false);
      if (events & EVENT_OVER) break;
    }
    // Guarantee the game-over frame: if the reckless pilot survived the
    // whole limit (it should not), drain the hearts directly.
    if (state.hearts > 0) state.hearts = 0;
    for (let i = 0; i < 20; i += 1) world.step(STEP, { x: 0, y: 0 }, null, false);
    return { screen: SCREEN_OVER, best: state.score };
  }
  if (name === 'profile') {
    // A demo save with real progress: Lv 3 pilot, two ships, a mortar,
    // two chips (one slotted), two achievements unlocked, one claimed.
    const save = freshSave(localDate());
    save.coins = 1250;
    save.highestCleared = 12;
    save.pilot = { xp: 320, level: 3 };
    save.ships = { owned: { spark: { level: 3 }, comet: { level: 1 } }, equipped: 'comet' };
    save.weapons = { owned: { blaster: { level: 2 }, mortar: { level: 1 } }, equipped: 'mortar' };
    save.chips = { owned: { 'piercing-rounds': true, 'golden-touch': true }, slots: ['piercing-rounds', null] };
    save.achievements = { unlocked: { 'first-blood': true, 'boss-first': true }, claimed: { 'first-blood': true } };
    save.stats = { enemiesDestroyed: 342, bulletsDestroyed: 128, bossesKilled: 2, stagesCleared: 12, totalScore: 18400, runsPlayed: 31 };
    save.lifetime.shards = 500;
    const achievements = ACHIEVEMENTS.map((def) => ({
      id: def.id, name: def.name, desc: def.desc, reward: def.reward,
      state: save.achievements.claimed[def.id] ? 'claimed' : (save.achievements.unlocked[def.id] ? 'claimable' : 'locked'),
    }));
    return { screen: SCREEN_PROFILE, best: 0, extra: { save, profile: profileFromSave(save, { achievements }) } };
  }
  // start (and any unknown name): a live field behind the title.
  for (let i = 0; i < START_SECONDS / STEP; i += 1) {
    world.step(STEP, { x: 0, y: 0 }, null, false);
  }
  return { screen: SCREEN_TITLE, best: 0 };
}

// ---- src/main.js ----
// Lumen Drift — boot and the one loop. Input is read every frame, the world
// advances in fixed 1/60 s steps (several in a slow frame, none in a fast
// one), and the renderer paints what is there. The game moves between
// fifteen screens: title, stage select, ship shop, profile, hangar, play,
// upgrade (level-up choice), paused, game over and stage clear (which can
// continue into endless mode), plus the panels over Home — top scores,
// daily missions, settings and daily reward.
//
// ?seed=N fixes the storm's pattern. ?shot=start|play|end|win|profile (with
// &seed=N) stages that scene instead of running the loop, paints it twice
// and sets window.__shotReady for a screenshot. ?debug=win starts a live
// game one shard away from the stage-1 target, for testing the clear path.

/** The longest frame the loop catches up on; a longer stall is dropped. */
const MAX_FRAME = 0.25;

/** Boot trace for the on-page diagnostics overlay (see game/index.html):
 * guarded so it can never break the game, and a no-op outside a browser. */
function diag(msg) {
  try {
    if (typeof window !== 'undefined' && typeof window.__diag === 'function') window.__diag(msg);
  } catch { /* diagnostics never break the game */ }
}
diag('module evaluated');

const params = new URLSearchParams(window.location.search);
const shot = params.get('shot');
const seedParam = Number.parseInt(params.get('seed') ?? '', 10);
const seed = Number.isInteger(seedParam) ? seedParam : Math.floor(Math.random() * 4294967296);

const canvas = document.getElementById('game');
const status = document.getElementById('status');
const world = createWorld(createRandom(seed));
diag('world created');
const renderer = createRenderer(canvas);
diag('renderer created');
const audio = createAudio();
diag('audio created');

function readBest() {
  try {
    return Number.parseInt(window.localStorage.getItem(BEST_KEY) ?? '0', 10) || 0;
  } catch {
    return 0;
  }
}

function saveBest(value) {
  try {
    window.localStorage.setItem(BEST_KEY, String(value));
  } catch {
    // Storage can be off (private windows): the best then lasts this visit.
  }
}

function runShot(name) {
  const scene = stageShot(name, world);
  let painted = 0;
  function paint() {
    renderer.draw(world.state, scene.screen, scene.best, scene.extra ?? {});
    painted += 1;
    if (painted < 2) requestAnimationFrame(paint);
    else window.__shotReady = true;
  }
  requestAnimationFrame(paint);
}

function runGame() {
  const input = createInput(canvas);
  // On-screen touch buttons (shown only on touch devices by CSS).
  const dashBtn = document.getElementById('btn-dash');
  if (dashBtn) input.bindButton(dashBtn, ACTION_DASH);
  const pauseBtn = document.getElementById('btn-pause');
  if (pauseBtn) input.bindButton(pauseBtn, ACTION_PAUSE);
  // Fullscreen: the F key or the on-screen button. The button hides
  // itself where the browser cannot fullscreen the page (e.g. iPhone
  // Safari); the game plays the same either way.
  const fsBtn = document.getElementById('btn-fullscreen');
  const fsSupported = typeof document.documentElement.requestFullscreen === 'function';
  if (fsBtn && !fsSupported) fsBtn.style.display = 'none';
  if (fsBtn && fsSupported) input.bindButton(fsBtn, ACTION_FULLSCREEN);
  function toggleFullscreen() {
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    } else {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  }
  function syncFullscreenButton() {
    if (!fsBtn) return;
    const on = !!document.fullscreenElement;
    fsBtn.classList.toggle('on', on);
    fsBtn.setAttribute('aria-label', on ? 'Exit fullscreen' : 'Fullscreen');
  }
  document.addEventListener('fullscreenchange', syncFullscreenButton);
  let screen = SCREEN_TITLE;
  let firstFrameDrawn = false;
  // Local progress: one versioned save blob (best, top-5, history,
  // lifetime stats, streak, missions), seeded from the legacy keys.
  const today = localDate();
  let save = loadSave(window.localStorage, today, {
    best: readBest(),
    shards: loadLifetimeShards(window.localStorage),
  });
  const streakInfo = touchStreak(save, today);
  saveSave(window.localStorage, save);
  // The settings panel's mute toggle is persisted in the save.
  audio.setMuted(save.settings.muted);
  let best = save.best;
  let lifetimeShards = save.lifetime.shards;
  let skinId = loadSkinId(window.localStorage, lifetimeShards);
  // The dash cue (first-time teaching) has been displayed this run.
  let dashCueSeen = false;
  // Whether the dash cue should show right now (computed each frame).
  let dashCue = false;
  // Hangar bonuses apply from the start of every run.
  world.setHangar(hangarBonuses(save));
  // The last run's summary (top-5 rank, missions) for the game-over screen.
  let lastSummary = null;
  // The win bank of the current run: when a win continues into endless,
  // the endless death replaces this bank instead of adding a second one.
  let lastBanked = null;
  // True while the current run is an endless continuation of a win.
  let endlessRun = false;
  // Per-run stats for missions and the run history.
  let runStats = { dashes: 0, maxLevel: 1, playSeconds: 0 };
  let offers = [];
  let accumulator = 0;
  let last = performance.now();
  // Seconds since the LEVEL UP cards appeared (drives their animation).
  let upgradeAge = 0;
  // Which 10-stage band the stage select is showing (0 = stages 1–10).
  let stagesPage = 0;
  // Which shop section is showing: ships, weapons or chips.
  let shopSection = 'ships';

  // Debug hook for testing the clear path: one shard away from the
  // stage-1 target. (Stage is 1 by default.)
  if (params.get('debug') === 'win') {
    world.setStage(1);
    world.state.score = stageTarget(1) - 10;
    world.state.gateProgress = (stageTarget(1) - 10) / stageTarget(1);
    screen = SCREEN_PLAY;
  }

  function announce(text) {
    status.textContent = text;
  }

  // Pick up the equipped ship's stats (a shop purchase between runs
  // changes them), plus the equipped weapon, its levels, the slotted
  // chips and the ship itself — the world's loadout.
  function applyEquippedShip() {
    const stats = equippedShipStats(save);
    world.setShip(stats);
    const chipIds = equippedChips(save).map((chip) => chip.id);
    const weaponLevels = {};
    for (const [id, owned] of Object.entries(save.weapons?.owned ?? {})) {
      weaponLevels[id] = owned?.level ?? 1;
    }
    world.setLoadout({
      weaponId: save.weapons?.equipped ?? 'blaster',
      weaponLevel: save.weapons?.owned?.[save.weapons?.equipped ?? 'blaster']?.level ?? 1,
      weaponLevels,
      chipEffects: chipEffectsFor(chipIds),
      shipId: equippedShip(save).id,
    });
  }

  // The loadout as the renderer shows it: weapon name + level, slotted
  // chip names (hangar line, HUD label, profile screen).
  function loadoutView() {
    const weaponId = save.weapons?.equipped ?? 'blaster';
    const def = weaponById(weaponId);
    return {
      weapon: { id: weaponId, name: def?.name ?? 'BLASTER', level: save.weapons?.owned?.[weaponId]?.level ?? 1 },
      chips: equippedChips(save).map((chip) => chip.name),
    };
  }

  // The profile menu's view data: pilot.js's stats enriched with the
  // real weapon/chip rosters and the achievement states (claimable /
  // claimed / locked — the claim buttons pay coins once, from here).
  function buildProfile() {
    const achievements = ACHIEVEMENTS.map((def) => {
      const unlocked = !!(save.achievements?.unlocked && save.achievements.unlocked[def.id]);
      const claimed = !!(save.achievements?.claimed && save.achievements.claimed[def.id]);
      return {
        id: def.id, name: def.name, desc: def.desc, reward: def.reward,
        state: claimed ? 'claimed' : (unlocked ? 'claimable' : 'locked'),
      };
    });
    return profileFromSave(save, {
      weapons: WEAPONS,
      chips: CHIPS,
      chipEffects: chipEffectsFor(equippedChips(save).map((chip) => chip.id)),
      weaponStats,
      achievements,
    });
  }

  function startGame() {
    // Restart the current stage (world.reset keeps the stage).
    applyEquippedShip();
    world.reset();
    screen = SCREEN_PLAY;
    runStats = { dashes: 0, maxLevel: 1, playSeconds: 0 };
    lastBanked = null;
    endlessRun = false;
    input.clearPressed();
    input.clearTap();
    audio.unlock();
    audio.click();
    announce('Lumen Drift started. Collect star shards, dodge the mines.');
  }

  // Start a fresh run of stage n (from the stage select or the clear
  // screen's NEXT / REPLAY). Resets the run stats and the endless
  // bookkeeping, and clears the input so a stale tap cannot dash.
  function startStage(n) {
    const stage = Math.max(1, Math.min(100, n));
    world.setStage(stage);
    applyEquippedShip();
    world.reset();
    screen = SCREEN_PLAY;
    runStats = { dashes: 0, maxLevel: 1, playSeconds: 0 };
    lastBanked = null;
    endlessRun = false;
    input.clearPressed();
    input.clearTap();
    audio.unlock();
    audio.click();
    announce(`Stage ${stage} — clear it to earn coins for the ship shop.`);
  }

  function endGame(won) {
    screen = won ? SCREEN_CLEAR : SCREEN_OVER;
    input.clearPressed();
    input.clearTap();
    // Bank the run into the local save: top-5, history, lifetime stats,
    // and today's missions (which pay their shard rewards immediately).
    // Pilot XP and achievements (Stage 2) run off the world's per-run
    // counters — kills, bullets destroyed, boss kills, no-damage.
    const stage = world.state.endless ? 0 : (world.state.stage ?? 1);
    const cleared = won && !world.state.endless;
    const firstClear = cleared && stage > (save.highestCleared ?? 0);
    const worldStats = world.getRunStats ? world.getRunStats() : { kills: 0, bulletsDestroyed: 0, bossKilled: false, noDamage: true };
    const run = {
      score: world.state.score,
      level: world.state.level,
      bestCombo: world.state.bestCombo,
      shards: world.state.shardsCollected,
      dashes: runStats.dashes,
      upgrades: Object.entries(world.state.upgrades)
        .filter(([, n]) => n > 0).map(([id]) => id),
      playSeconds: Math.round(runStats.playSeconds),
      date: today,
      endless: world.state.endless,
      stage,
      cleared,
      firstClear,
      endlessSeconds: world.state.endless ? Math.round(runStats.playSeconds) : 0,
      kills: worldStats.kills,
      bulletsDestroyed: worldStats.bulletsDestroyed,
      bossKilled: worldStats.bossKilled,
      noDamage: worldStats.noDamage,
    };
    let result;
    let clear = null;
    let xpResult = null;
    let bossDrop = null;
    if (cleared) {
      // A stage clear pays coins (first clear, or the smaller replay
      // reward) and may unlock the next stage — and endless at stage 10.
      // The clear is banked now — if the player continues into endless,
      // the death at the end of that same run REPLACES this bank (see
      // below), so the run is counted exactly once, with its final score.
      // Pilot XP is awarded BEFORE recordStageClear moves
      // highestCleared (awardRunXp reads it for first-clear detection).
      xpResult = awardRunXp(save, run);
      clear = recordStageClear(save, stage);
      result = recordRun(save, run);
      lastBanked = { entry: result.entry, historyEntry: result.historyEntry, shards: run.shards };
      // Boss stages drop a chip on first clear (already owned: +100
      // coins instead). Midboss stages drop nothing.
      if (firstClear && isBossStage(stage)) {
        const drop = grantBossDrop(save, stage);
        if (drop?.granted) bossDrop = chipById(drop.granted)?.name ?? drop.granted;
        else if (drop?.coins) bossDrop = `+${drop.coins} coins (chip already owned)`;
      }
    } else if (endlessRun && lastBanked) {
      // The endless death replaces the clear's bank — and the clear
      // already awarded this run's XP, so no second award here.
      result = recordRun(save, run, { replace: lastBanked });
      lastBanked = null;
    } else {
      xpResult = awardRunXp(save, run);
      result = recordRun(save, run);
    }
    // Achievements unlock (but never pay) here — the coins are claimed
    // from the profile screen, once each.
    const newlyUnlocked = checkAchievements(save).map((id) => {
      const def = ACHIEVEMENTS.find((a) => a.id === id);
      return def ? { id: def.id, name: def.name, reward: def.reward } : { id, name: id, reward: 0 };
    });
    // The first-run cue is over once the run ends; the dash cue is
    // retired the same way, so it teaches exactly once.
    if (dashCueSeen) save.ftue.dashCueShown = true;
    const completed = updateMissions(save, run);
    saveSave(window.localStorage, save);
    best = save.best;
    lifetimeShards = save.lifetime.shards;
    // The legacy best/shards keys stay in sync for older readers.
    saveBest(best);
    saveLifetimeShards(window.localStorage, lifetimeShards);
    lastSummary = {
      rank: result.rank, gapToFirst: result.gapToFirst, completed,
      endless: world.state.endless, stage,
      coins: clear ? clear.coins : 0,
      firstClear: clear ? clear.firstClear : false,
      unlockedEndless: clear ? clear.unlockedEndless : false,
      achievements: newlyUnlocked,
      bossDrop,
      xpGained: xpResult ? xpResult.xpGained : 0,
      pilotLevel: save.pilot?.level ?? 1,
      leveledUp: xpResult ? xpResult.leveledUp : false,
    };
    if (won) audio.win();
    else audio.over();
    const achievementNote = newlyUnlocked.length
      ? ` ${newlyUnlocked.length} achievement${newlyUnlocked.length > 1 ? 's' : ''} unlocked — claim ${newlyUnlocked.length > 1 ? 'them' : 'it'} in PROFILE!`
      : '';
    const xpNote = xpResult ? ` +${xpResult.xpGained} XP.` : '';
    announce(won
      ? `Stage ${stage} clear! +${clear ? clear.coins : 0} coins${clear && clear.firstClear ? ' — first clear!' : ''}.${xpNote}${achievementNote} Press N for the next stage, R to replay.`
      : `Game over. Score ${world.state.score}.${xpNote}${achievementNote} Press R or tap PLAY AGAIN.`);
  }

  // Keep drifting past the Aurora Gate: the run goes endless — no reset,
  // the score keeps counting and the difficulty keeps scaling.
  function continueEndless() {
    world.enterEndless();
    screen = SCREEN_PLAY;
    endlessRun = true;
    accumulator = 0;
    input.clearPressed();
    input.clearTap();
    world.grantGrace(UPGRADE_GRACE);
    audio.levelup();
    announce('Endless drift — the storm never ends now. Keep collecting!');
  }

  // Buy one hangar part level with lifetime shards. The world picks the
  // new bonuses up on the next reset (the next run).
  function tryBuyHangar(index) {
    const part = HANGAR_PARTS[index];
    if (!part) return;
    const bought = buyHangarPart(save, part.id);
    if (bought.ok) {
      world.setHangar(hangarBonuses(save));
      saveSave(window.localStorage, save);
      audio.click();
      announce(`Bought ${part.name} level ${bought.level} for ${bought.cost} shards.`);
    } else if (bought.reason === 'broke') {
      announce(`Not enough shards for ${part.name}.`);
    } else if (bought.reason === 'maxed') {
      announce(`${part.name} is already maxed.`);
    }
  }

  // Open the hangar from the title. The input gate stops the tap that
  // opened it from also buying a part on the first frame.
  function enterHangar() {
    screen = SCREEN_HANGAR;
    input.clearPressed();
    input.clearTap();
    input.armGate();
    audio.click();
    announce('Hangar. Buy permanent ship upgrades with your shards. Press H to go back.');
  }

  // Open the stage select from the title. The input gate stops the tap
  // that opened it from also starting a stage on the first frame.
  function enterStages() {
    stagesPage = Math.floor(((save.highestCleared ?? 0)) / 10);
    screen = SCREEN_STAGES;
    input.clearPressed();
    input.clearTap();
    input.armGate();
    audio.click();
    announce('Stage select. Tap a stage to play it — clear stages to earn coins.');
  }

  // Open the ship shop from the title tab bar.
  function enterShop() {
    screen = SCREEN_SHOP;
    input.clearPressed();
    input.clearTap();
    input.armGate();
    audio.click();
    announce('Shop. Ships, weapons and chips — buy with coins. Press H to go back.');
  }

  // Open the profile screen from the title tab bar (or the P key).
  function enterProfile() {
    screen = SCREEN_PROFILE;
    input.clearPressed();
    input.clearTap();
    input.armGate();
    audio.click();
    announce('Profile. Pilot level, loadout, attributes, collection and achievements. Press P or H to go back.');
  }

  // Claim one unlocked achievement's coins (from the profile screen
  // only — never auto-paid). Failures are announced, never silent.
  function tryClaimAchievement(index) {
    const profile = buildProfile();
    const rows = layoutProfileSections(profile).achievements.rows;
    const row = rows[index];
    if (!row) return;
    const def = row.achievement;
    if (def.state !== 'claimable') {
      announce(def.state === 'claimed'
        ? `${def.name} is already claimed.`
        : `${def.name} is still locked.`);
      return;
    }
    const claimed = claimAchievement(save, def.id);
    if (claimed.ok) {
      saveSave(window.localStorage, save);
      audio.click();
      announce(`Claimed ${def.name}: +${claimed.reward} coins!`);
    } else {
      announce(`Could not claim ${def.name}.`);
    }
  }

  // One tap on a ship card's action button: buy it, level it up, or
  // equip it — whichever the button offered. Failures are announced,
  // never silent.
  function tryShopAction(index) {
    const cards = layoutShopCards();
    const card = cards[index];
    if (!card) return;
    const def = card.ship;
    const owned = (save.ships?.owned?.[def.id]?.level ?? 0) > 0;
    const isEquipped = equippedShip(save).id === def.id && owned;
    if (!owned) {
      const bought = buyShip(save, def.id);
      if (bought.ok) {
        applyEquippedShip();
        saveSave(window.localStorage, save);
        audio.click();
        announce(`Bought ${def.name} for ${bought.cost} coins — equipped!`);
      } else if (bought.reason === 'locked') {
        announce(`${def.name} unlocks when you clear stage ${def.unlockStage}.`);
      } else if (bought.reason === 'broke') {
        announce(`Not enough coins for ${def.name} — ${def.price} needed.`);
      }
      return;
    }
    if (!isEquipped) {
      const equipped = equipShip(save, def.id);
      if (equipped.ok) {
        applyEquippedShip();
        saveSave(window.localStorage, save);
        audio.click();
        announce(`Equipped ${def.name}.`);
      }
      return;
    }
    const levelled = levelUpShip(save, def.id);
    if (levelled.ok) {
      applyEquippedShip();
      saveSave(window.localStorage, save);
      audio.click();
      announce(`${def.name} is now Lv ${levelled.level} — ${levelled.cost} coins.`);
    } else if (levelled.reason === 'maxed') {
      announce(`${def.name} is already maxed at Lv 10.`);
    } else if (levelled.reason === 'broke') {
      announce(`Not enough coins to level ${def.name}.`);
    }
  }

  // One tap on a weapon card's action button: buy it, level it up, or
  // equip it — whichever the button offered. Weapon switching is free.
  function tryShopWeaponAction(index) {
    const cards = layoutShopWeapons(WEAPONS);
    const card = cards[index];
    if (!card) return;
    const def = card.weapon;
    const owned = !!(save.weapons?.owned && save.weapons.owned[def.id]);
    const isEquipped = (save.weapons?.equipped ?? 'blaster') === def.id && owned;
    if (!owned) {
      const bought = buyWeapon(save, def.id);
      if (bought.ok) {
        applyEquippedShip();
        saveSave(window.localStorage, save);
        audio.click();
        announce(`Bought ${def.name} for ${bought.cost} coins — equipped!`);
      } else if (bought.reason === 'locked') {
        announce(`${def.name} unlocks at Pilot Lv ${def.unlockPilotLevel}.`);
      } else if (bought.reason === 'broke') {
        announce(`Not enough coins for ${def.name} — ${def.price} needed.`);
      }
      return;
    }
    if (!isEquipped) {
      const equipped = equipWeapon(save, def.id);
      if (equipped.ok) {
        applyEquippedShip();
        saveSave(window.localStorage, save);
        audio.click();
        announce(`Equipped ${def.name}.`);
      }
      return;
    }
    const levelled = levelUpWeapon(save, def.id);
    if (levelled.ok) {
      applyEquippedShip();
      saveSave(window.localStorage, save);
      audio.click();
      announce(`${def.name} is now Lv ${levelled.level} — ${levelled.cost} coins.`);
    } else if (levelled.reason === 'maxed') {
      announce(`${def.name} is already maxed at Lv 10.`);
    } else if (levelled.reason === 'broke') {
      announce(`Not enough coins to level ${def.name}.`);
    }
  }

  // One tap on a chip card's action button: buy it, slot it into the
  // first free slot, or unslot it when it is already equipped.
  function tryShopChipAction(index) {
    const cards = layoutShopChips(CHIPS);
    const card = cards[index];
    if (!card) return;
    const def = card.chip;
    const owned = !!(save.chips?.owned && save.chips.owned[def.id]);
    const slots = save.chips?.slots ?? [null, null];
    const slotIndex = slots.indexOf(def.id);
    if (!owned) {
      const bought = buyChip(save, def.id);
      if (bought.ok) {
        saveSave(window.localStorage, save);
        audio.click();
        announce(`Bought ${def.name} for ${bought.cost} coins — tap SLOT to equip it.`);
      } else if (bought.reason === 'locked') {
        announce(`${def.name} unlocks at Pilot Lv ${def.unlockPilotLevel}.`);
      } else if (bought.reason === 'broke') {
        announce(`Not enough coins for ${def.name} — ${def.price} needed.`);
      }
      return;
    }
    if (slotIndex >= 0) {
      const removed = unslotChip(save, slotIndex);
      if (removed.ok) {
        applyEquippedShip();
        saveSave(window.localStorage, save);
        audio.click();
        announce(`Removed ${def.name} from the loadout.`);
      }
      return;
    }
    const free = slots.findIndex((s) => s == null);
    if (free < 0) {
      announce('No free chip slot — remove a chip first (pilot Lv 10 adds a third slot).');
      return;
    }
    const slotted = slotChip(save, def.id, free);
    if (slotted.ok) {
      applyEquippedShip();
      saveSave(window.localStorage, save);
      audio.click();
      announce(`${def.name} slotted.`);
    } else {
      announce(`Could not slot ${def.name}.`);
    }
  }

  // Cycle the ship skin through the skins already unlocked (title only).
  function cycleSkin(direction) {
    const unlocked = unlockedSkins(lifetimeShards);
    const index = unlocked.findIndex((s) => s.id === skinId);
    const next = unlocked[(index + direction + unlocked.length) % unlocked.length];
    if (!next || next.id === skinId) return;
    skinId = next.id;
    saveSkinId(window.localStorage, skinId);
    const following = nextUnlock(lifetimeShards);
    announce(following
      ? `Ship skin ${next.name}. Next skin ${following.skin.name} at ${following.need} shards.`
      : `Ship skin ${next.name}. All skins unlocked.`);
  }

  // Open a panel over Home (top scores, missions, settings, daily
  // reward). One tap on the X, the backdrop, Esc or Enter closes it.
  function openPanel(panelScreen, label) {
    screen = panelScreen;
    input.clearPressed();
    input.clearTap();
    audio.click();
    announce(`${label}. Tap ✕, the backdrop, or press Esc to go back.`);
  }

  function inRect(tap, rect) {
    return tap
      && tap.x >= rect.x && tap.x <= rect.x + rect.w
      && tap.y >= rect.y && tap.y <= rect.y + rect.h;
  }

  // A level rose: stop the world and offer one upgrade per level risen.
  function enterUpgrade() {
    offers = drawUpgrades(world.state, () => Math.random());
    if (offers.length === 0) {
      world.state.pendingLevelUps = 0;
      return;
    }
    screen = SCREEN_UPGRADE;
    accumulator = 0;
    upgradeAge = 0;
    input.clearPressed();
    input.clearTap();
    input.armGate();
    audio.levelup();
    announce(`Level ${world.state.level}! Choose an upgrade: ${
      offers.map((up, i) => `${i + 1} ${up.name}`).join(', ')
    }.`);
  }

  function applyPick(index) {
    const up = offers[index];
    if (!up) return;
    // A MERGE card evolves its two components into one merged effect;
    // anything else is a normal upgrade pick.
    const applied = up.isMerge ? applyMerge(world.state, up.id) : applyUpgrade(world.state, up.id);
    if (!applied) return;
    world.state.pendingLevelUps = Math.max(0, world.state.pendingLevelUps - 1);
    audio.levelup();
    if (world.state.pendingLevelUps > 0) {
      // Rare: one step crossed two levels — offer the next choice too.
      offers = drawUpgrades(world.state, () => Math.random());
      if (offers.length === 0) {
        world.state.pendingLevelUps = 0;
        screen = SCREEN_PLAY;
        accumulator = 0;
        input.clearPressed();
        input.clearTap();
        return;
      }
      announce(`Upgrade picked: ${up.name}. Choose another!`);
      upgradeAge = 0;
      input.clearPressed();
      input.clearTap();
      input.armGate();
      return;
    }
    screen = SCREEN_PLAY;
    accumulator = 0;
    input.clearPressed();
    input.clearTap();
    world.grantGrace(UPGRADE_GRACE);
    announce(`Upgrade picked: ${up.name} — ${up.desc} Back to the drift!`);
  }

  function frame(now) {
    requestAnimationFrame(frame);
    window.__lumen.screenName = screen;
    const elapsed = Math.min(MAX_FRAME, (now - last) / 1000);
    last = now;

    if (input.consume(ACTION_MUTE)) {
      const muted = audio.toggleMute();
      announce(muted ? 'Sound muted.' : 'Sound on.');
    }

    if (input.consume(ACTION_FULLSCREEN)) toggleFullscreen();

    if (screen === SCREEN_TITLE) {
      // The title floats over a live drifting field. Home is PLAY only:
      // the gear opens settings, the flame opens the daily reward, the
      // bottom tab bar (after the first run) opens hangar / missions /
      // scores. The skin selector lives in the hangar now.
      world.step(STEP, { x: 0, y: 0 }, null, false);
      const tap = input.takeTap();
      if (inRect(tap, GEAR_RECT)) {
        openPanel(SCREEN_SETTINGS, 'Settings');
      } else if (inRect(tap, FLAME_RECT) && save.streak.count > 0) {
        openPanel(SCREEN_REWARD, 'Daily reward');
      } else if (inRect(tap, PLAY_RECT)) {
        enterStages();
      } else if (inRect(tap, HANGAR_TAB_RECT) && save.lifetime.runs > 0) {
        enterHangar();
      } else if (inRect(tap, SHOP_TAB_RECT) && save.lifetime.runs > 0) {
        enterShop();
      } else if (inRect(tap, PROFILE_TAB_RECT) && save.lifetime.runs > 0) {
        enterProfile();
      } else if (inRect(tap, MISSIONS_TAB_RECT) && save.lifetime.runs > 0) {
        openPanel(SCREEN_MISSIONS, 'Daily missions');
      } else if (inRect(tap, SCORES_TAB_RECT) && save.lifetime.runs > 0) {
        openPanel(SCREEN_STATS, 'Top scores');
      } else if (input.consume('KeyT')) {
        openPanel(SCREEN_STATS, 'Top scores');
      } else if (input.consume('KeyH')) {
        enterHangar();
      } else if (input.consume('KeyP')) {
        enterProfile();
      } else if (input.consume(ACTION_CONFIRM) || input.consume(ACTION_RESTART)) {
        enterStages();
      }
    } else if (screen === SCREEN_HANGAR) {
      // Buy with keys 1-5 or by tapping a part's BUY button; ◀ ▶ (or
      // ←/→) cycles the ship skin; H, Esc or the BACK button returns to
      // the title. While the input gate is closed (the tap that opened
      // the hangar, or its first 400 ms), swallow everything — a stale
      // tap must never buy a part.
      if (!input.gateOpen()) {
        input.takeTap();
        input.clearPressed();
      } else {
        const tap = input.takeTap();
        if (inRect(tap, HANGAR_BACK_RECT)) {
          screen = SCREEN_TITLE;
          input.clearPressed();
          input.clearTap();
          announce('Lumen Drift. Press Enter or click to launch.');
        } else if (inRect(tap, HANGAR_SKIN_LEFT)) {
          cycleSkin(-1);
          input.clearPressed();
        } else if (inRect(tap, HANGAR_SKIN_RIGHT)) {
          cycleSkin(1);
          input.clearPressed();
        } else {
          const rows = layoutHangarParts();
          const bought = rows.findIndex((row) => inRect(tap, row.buy));
          if (bought >= 0) tryBuyHangar(bought);
          else if (input.consume(ACTION_PICK_1)) tryBuyHangar(0);
          else if (input.consume(ACTION_PICK_2)) tryBuyHangar(1);
          else if (input.consume(ACTION_PICK_3)) tryBuyHangar(2);
          else if (input.consume('Digit4')) tryBuyHangar(3);
          else if (input.consume('Digit5')) tryBuyHangar(4);
          else if (input.consume('ArrowLeft') || input.consume('KeyA')) cycleSkin(-1);
          else if (input.consume('ArrowRight') || input.consume('KeyD')) cycleSkin(1);
          else if (input.consume(ACTION_PAUSE) || input.consume('KeyH')) {
            screen = SCREEN_TITLE;
            input.clearPressed();
            input.clearTap();
            announce('Lumen Drift. Press Enter or click to launch.');
          }
        }
      }
    } else if (screen === SCREEN_STAGES) {
      // Stage select: tap a tile to play it (locked tiles announce why
      // they are locked), ◀ ▶ flip the 10-stage band, PLAY STAGE starts
      // the next uncleared stage, BACK returns to the title. While the
      // input gate is closed, swallow everything — a stale tap must
      // never start a stage.
      if (!input.gateOpen()) {
        input.takeTap();
        input.clearPressed();
      } else {
        const tap = input.takeTap();
        const layout = layoutStageTiles(stagesPage);
        const tile = layout.tiles.findIndex((t) => inRect(tap, t));
        if (inRect(tap, layout.back)) {
          screen = SCREEN_TITLE;
          input.clearPressed();
          input.clearTap();
          announce('Lumen Drift. Press Enter or click to launch.');
        } else if (inRect(tap, layout.prevArrow) && layout.prevEnabled) {
          stagesPage -= 1;
          input.clearPressed();
          audio.click();
        } else if (inRect(tap, layout.nextArrow) && layout.nextEnabled) {
          stagesPage += 1;
          input.clearPressed();
          audio.click();
        } else if (inRect(tap, layout.play) && (save.highestCleared ?? 0) < 100) {
          startStage((save.highestCleared ?? 0) + 1);
        } else if (tile >= 0) {
          const n = layout.tiles[tile].stage;
          if (n <= (save.highestCleared ?? 0) + 1) startStage(n);
          else announce(`Stage ${n} is locked — clear stage ${(save.highestCleared ?? 0) + 1} first.`);
        } else if (input.consume('ArrowLeft') && stagesPage > 0) {
          stagesPage -= 1;
          audio.click();
        } else if (input.consume('ArrowRight') && stagesPage < 9) {
          stagesPage += 1;
          audio.click();
        } else if (input.consume(ACTION_PAUSE) || input.consume('KeyH')) {
          screen = SCREEN_TITLE;
          input.clearPressed();
          input.clearTap();
          announce('Lumen Drift. Press Enter or click to launch.');
        }
      }
    } else if (screen === SCREEN_SHOP) {
      // Shop: three sections (SHIPS / WEAPONS / CHIPS) — tap a section
      // tab to switch, tap a card's action button to buy / level /
      // equip / slot. BACK (or H / Esc) returns to the title. Same
      // input-gate discipline as the hangar: no stale tap may spend coins.
      if (!input.gateOpen()) {
        input.takeTap();
        input.clearPressed();
      } else {
        const tap = input.takeTap();
        if (inRect(tap, SHOP_BACK_RECT)) {
          screen = SCREEN_TITLE;
          input.clearPressed();
          input.clearTap();
          announce('Lumen Drift. Press Enter or click to launch.');
        } else if (inRect(tap, SHOP_SECTION_RECTS.ships)) {
          shopSection = 'ships';
          input.clearPressed();
          audio.click();
        } else if (inRect(tap, SHOP_SECTION_RECTS.weapons)) {
          shopSection = 'weapons';
          input.clearPressed();
          audio.click();
        } else if (inRect(tap, SHOP_SECTION_RECTS.chips)) {
          shopSection = 'chips';
          input.clearPressed();
          audio.click();
        } else if (shopSection === 'weapons') {
          const cards = layoutShopWeapons(WEAPONS);
          const acted = cards.findIndex((card) => inRect(tap, card.action));
          if (acted >= 0) tryShopWeaponAction(acted);
          else if (input.consume(ACTION_PAUSE) || input.consume('KeyH')) {
            screen = SCREEN_TITLE;
            input.clearPressed();
            input.clearTap();
            announce('Lumen Drift. Press Enter or click to launch.');
          }
        } else if (shopSection === 'chips') {
          const cards = layoutShopChips(CHIPS);
          const acted = cards.findIndex((card) => inRect(tap, card.action));
          if (acted >= 0) tryShopChipAction(acted);
          else if (input.consume(ACTION_PAUSE) || input.consume('KeyH')) {
            screen = SCREEN_TITLE;
            input.clearPressed();
            input.clearTap();
            announce('Lumen Drift. Press Enter or click to launch.');
          }
        } else {
          const cards = layoutShopCards();
          const acted = cards.findIndex((card) => inRect(tap, card.action));
          if (acted >= 0) tryShopAction(acted);
          else if (input.consume(ACTION_PAUSE) || input.consume('KeyH')) {
            screen = SCREEN_TITLE;
            input.clearPressed();
            input.clearTap();
            announce('Lumen Drift. Press Enter or click to launch.');
          }
        }
      }
    } else if (screen === SCREEN_PROFILE) {
      // Profile: tap a CLAIM button to take an unlocked achievement's
      // coins (once each). BACK (or P / H / Esc) returns to the title.
      // Same input-gate discipline as the shop: no stale tap may claim.
      if (!input.gateOpen()) {
        input.takeTap();
        input.clearPressed();
      } else {
        const tap = input.takeTap();
        if (inRect(tap, PROFILE_BACK_RECT)) {
          screen = SCREEN_TITLE;
          input.clearPressed();
          input.clearTap();
          announce('Lumen Drift. Press Enter or click to launch.');
        } else {
          const rows = layoutProfileSections(buildProfile()).achievements.rows;
          const claimed = rows.findIndex((row) => inRect(tap, row.claim));
          if (claimed >= 0) tryClaimAchievement(claimed);
          else if (input.consume(ACTION_PAUSE) || input.consume('KeyH') || input.consume('KeyP')) {
            screen = SCREEN_TITLE;
            input.clearPressed();
            input.clearTap();
            announce('Lumen Drift. Press Enter or click to launch.');
          }
        }
      }
    } else if (screen === SCREEN_STATS || screen === SCREEN_MISSIONS || screen === SCREEN_SETTINGS || screen === SCREEN_REWARD) {
      // Panels over Home: the X, a tap on the backdrop, Esc/P or T
      // closes back to Home. Each panel also has its own taps — those
      // are checked FIRST, because the same press that taps a button
      // also counts as a confirm (input adds ACTION_CONFIRM on every
      // canvas press); checking close first would close the panel
      // instead of claiming / rerolling / toggling.
      const tap = input.takeTap();
      let handled = false;
      if (screen === SCREEN_MISSIONS) {
        const rows = layoutMissionRows();
        const rerolled = rows.findIndex((row) => inRect(tap, row.reroll));
        if (rerolled >= 0 && save.missions.list[rerolled]) {
          const result = rerollMission(save, save.missions.list[rerolled].id);
          if (result.ok) {
            saveSave(window.localStorage, save);
            audio.click();
            announce(`Mission rerolled: ${result.mission.name}.`);
          } else {
            announce('No rerolls left today — missions reset at midnight.');
          }
          handled = true;
        }
      } else if (screen === SCREEN_SETTINGS) {
        if (inRect(tap, SETTINGS_SOUND_RECT)) {
          save.settings.muted = !save.settings.muted;
          audio.setMuted(save.settings.muted);
          saveSave(window.localStorage, save);
          announce(save.settings.muted ? 'Sound muted.' : 'Sound on.');
          handled = true;
        } else if (inRect(tap, SETTINGS_FULLSCREEN_RECT)) {
          toggleFullscreen();
          handled = true;
        } else if (inRect(tap, SETTINGS_SHAKE_RECT)) {
          save.settings.reduceShake = !save.settings.reduceShake;
          saveSave(window.localStorage, save);
          announce(save.settings.reduceShake ? 'Screen shake reduced.' : 'Full screen shake on.');
          handled = true;
        }
      } else if (screen === SCREEN_REWARD) {
        if (inRect(tap, CLAIM_RECT)) {
          const claimed = claimDailyReward(save, today);
          if (claimed.claimed) {
            saveSave(window.localStorage, save);
            lifetimeShards = save.lifetime.shards;
            audio.levelup();
            announce(`Daily reward claimed: +${claimed.reward} shards!`);
          }
          handled = true;
        }
      }
      if (handled) {
        // Drain the confirm this press also raised, so it cannot leak
        // into the next screen.
        input.clearPressed();
        input.clearTap();
      } else if (inRect(tap, PANEL_CLOSE_RECT)
        || (tap && !inRect(tap, PANEL_CARD))
        || input.consume(ACTION_PAUSE)
        || input.consume('KeyT')) {
        screen = SCREEN_TITLE;
        input.clearPressed();
        input.clearTap();
        announce('Lumen Drift. Press Enter or click to launch.');
      }
    } else if (screen === SCREEN_PLAY) {
      if (input.consume(ACTION_PAUSE)) {
        screen = SCREEN_PAUSED;
        announce('Paused. Press P to resume.');
      } else if (world.state.hitStop > 0) {
        // Hit-stop: the world freezes for ~0.06 s after a hit while the
        // frame still renders — the impact reads instead of blurring past.
        world.state.hitStop -= elapsed;
      } else {
        const dash = input.consume(ACTION_DASH);
