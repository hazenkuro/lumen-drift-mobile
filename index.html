    if (typeof historyEntry.kills === 'number') save.stats.enemiesDestroyed -= historyEntry.kills;
    if (typeof historyEntry.bulletsDestroyed === 'number') save.stats.bulletsDestroyed -= historyEntry.bulletsDestroyed;
    if (historyEntry.bossKilled) save.stats.bossesKilled -= 1;
    if (historyEntry.cleared) save.stats.stagesCleared -= 1;
    if (typeof historyEntry.score === 'number') save.stats.totalScore -= historyEntry.score;
    save.stats.runsPlayed -= 1;
  }
  save.lifetime.runs += 1;
  save.stats.enemiesDestroyed += run.kills ?? 0;
  save.stats.bulletsDestroyed += run.bulletsDestroyed ?? 0;
  save.stats.bossesKilled += run.bossKilled ? 1 : 0;
  save.stats.stagesCleared += run.cleared ? 1 : 0;
  save.stats.totalScore += run.score ?? 0;
  save.stats.runsPlayed += 1;
  save.lifetime.shards += run.shards;
  save.shardBalance = (save.shardBalance ?? 0) + run.shards;
  save.lifetime.playSeconds += run.playSeconds || 0;
  if (run.score > save.best) save.best = run.score;
  const entry = {
    score: run.score, level: run.level, bestCombo: run.bestCombo,
    date: run.date, endless: !!run.endless, stage: run.stage ?? 0,
  };
  save.top5.push(entry);
  save.top5.sort((a, b) => b.score - a.score);
  save.top5 = save.top5.slice(0, 5);
  const rank = save.top5.indexOf(entry) + 1;
  const historyEntry = {
    score: run.score, level: run.level, bestCombo: run.bestCombo,
    shards: run.shards, dashes: run.dashes, upgrades: run.upgrades || [],
    date: run.date, endless: !!run.endless, stage: run.stage ?? 0,
    // Kept so an endless continuation (opts.replace) can take the
    // banked run's lifetime stats back out before re-banking it.
    kills: run.kills ?? 0, bulletsDestroyed: run.bulletsDestroyed ?? 0,
    bossKilled: !!run.bossKilled, cleared: !!run.cleared,
  };
  save.history.unshift(historyEntry);
  save.history = save.history.slice(0, 20);
  const gapToFirst = save.top5.length ? save.top5[0].score - run.score : 0;
  return { rank, gapToFirst, entry, historyEntry };
}

/**
 * Bank the run's stats into today's missions. Returns the missions that
 * were just completed (each pays its shard reward immediately). When the
 * third mission completes, the all-missions bonus chest (+100 shards)
 * pays once and is reported as a synthetic completion entry.
 */
function updateMissions(save, run) {
  const completed = [];
  for (const mission of save.missions.list) {
    if (mission.done) continue;
    const def = MISSION_DEFS.find((d) => d.id === mission.id);
    if (!def) continue;
    mission.progress = Math.min(def.target, Math.max(mission.progress, run[def.stat] || 0));
    if (mission.progress >= def.target) {
      mission.done = true;
      save.lifetime.shards += mission.reward;
      save.shardBalance = (save.shardBalance ?? 0) + mission.reward;
      completed.push({ id: mission.id, name: mission.name, reward: mission.reward });
    }
  }
  if (save.missions.list.length === 3
    && save.missions.list.every((m) => m.done)
    && !save.missions.allBonusPaid) {
    save.missions.allBonusPaid = true;
    save.lifetime.shards += ALL_MISSIONS_BONUS;
    save.shardBalance = (save.shardBalance ?? 0) + ALL_MISSIONS_BONUS;
    completed.push({ id: 'all', name: 'All 3 missions', reward: ALL_MISSIONS_BONUS });
  }
  return completed;
}

/**
 * Reroll one incomplete mission for another from the same tier (1/day).
 * Returns { ok, mission } or { ok: false, reason } ('used', 'done',
 * 'unknown'). The replacement resets progress — a reroll is a fresh
 * mission, not a free completion.
 */
function rerollMission(save, missionId) {
  if ((save.missions.rerollsUsed ?? 0) >= DAILY_REROLLS) return { ok: false, reason: 'used' };
  const mission = save.missions.list.find((m) => m.id === missionId);
  if (!mission) return { ok: false, reason: 'unknown' };
  if (mission.done) return { ok: false, reason: 'done' };
  const pool = MISSION_POOLS[mission.tier] || [];
  const alternatives = pool.filter((d) => d.id !== mission.id);
  if (alternatives.length === 0) return { ok: false, reason: 'unknown' };
  const pick = alternatives[hashStr(`${save.missions.date}:${missionId}`) % alternatives.length];
  mission.id = pick.id;
  mission.name = pick.name;
  mission.target = pick.target;
  mission.reward = pick.reward;
  mission.tier = pick.tier;
  mission.progress = 0;
  mission.done = false;
  save.missions.rerollsUsed = (save.missions.rerollsUsed ?? 0) + 1;
  return { ok: true, mission };
}

/** The 7-day calendar ending today: [{ date, visited, isToday }]. */
function streakCalendar(save, today) {
  const days = [];
  for (let i = 6; i >= 0; i -= 1) {
    const date = shiftDate(today, -i);
    days.push({
      date,
      visited: save.streak.visitedDays.includes(date),
      isToday: i === 0,
    });
  }
  return days;
}

/**
 * The daily-reward calendar: one box per cycle day (1-7) with its reward,
 * whether it is done (claimed in this cycle), current (today's, unclaimed)
 * or locked (a later cycle day). `claimedToday` is true once today's
 * reward has been claimed.
 */
function dailyRewardCalendar(save, today) {
  const cycleDay = cycleDayFor(save.streak.count);
  const claimedToday = save.dailyReward.lastClaimDate === today;
  return DAILY_REWARDS.map((reward, i) => {
    const day = i + 1;
    return {
      day,
      reward,
      done: day < cycleDay || (day === cycleDay && claimedToday),
      current: day === cycleDay && !claimedToday,
      locked: day > cycleDay,
    };
  });
}

/** The theme of a stage: band = floor((n-1)/10), clamped to 0–9. */
function themeFor(stage) {
  const n = typeof stage === 'number' && Number.isFinite(stage) ? stage : 1;
  return THEMES[Math.min(9, Math.max(0, Math.floor((n - 1) / 10)))];
}

/** Band index (0–9) of a stage. */
function bandOf(stage) {
  return themeFor(stage).band;
}

// ---- src/chips.js ----
// Lumen Drift — chips (stage 2, Wave A). Ability-changing slottables,
// not stat sticks. Pure logic: every function takes the save (or a list
// of chip ids) and returns plain data — no DOM, no storage, no import
// of world.js or weapons.js (Wave C owns the integration; it calls
// these with its state/save).
//
// Save shape: save.chips = { owned: { 'piercing-rounds': true, ... },
// slots: [null, null] } (slot entries are chip ids or null).
// Pilot level lives in save.pilot.level (Wave B owns pilot.js); read
// it defensively as save.pilot?.level ?? 1 everywhere below.

//
// Rarity gates: common unlocks at pilot Lv 1, rare at Lv 3, epic at
// Lv 5, legendary at Lv 8 — each chip's unlockPilotLevel matches its
// rarity gate (asserted in tests/chips.test.mjs).
//
// Where each effect is applied (Wave C / world integration):
//   pierce          weapons.js: extra pierce on blaster + laser bolts
//                   (state.chipEffects.pierce).
//   dashMine        world dash: leave a mine (damage 2, lasts 8 s) at
//                   the dash start point when state.chipEffects.dashMine.
//   shardBonus      shard pickup: +N points per shard.
//   dashCooldownMult world dash: dash cooldown * this (0.8 = -20%).
//   chainSpark      weapons.js: on an enemy kill, a roll under this
//                   chance chains 1 damage to the nearest other enemy
//                   within CHAIN_RADIUS (see weapons.js).
//   bulletWard      weapons.js: destroying an enemy bullet sets
//                   state.shield = true and state.shieldTimer = 2.
//   heartSiphon     shard pickup: every N shards collected restores 1
//                   heart (up to maxHearts). 0 = off.
//   overdrive       weapons.js: +25% weapon damage while hearts ==
//                   maxHearts (only when maxHearts is known).
//
// Boss first-clear drops (deterministic — NO RNG gating; a boss stage's
// first clear always pays its chip, or 100 coins when already owned):
//   S10  -> bullet-ward       S70  -> chain-spark
//   S30  -> heart-siphon      S90  -> piercing-rounds
//   S50  -> overdrive
//   (all other stages, including midboss stages, drop nothing.)
const CHIP_SLOT_COUNT = 2;

const CHIPS = [
  {
    id: 'piercing-rounds', name: 'PIERCING ROUNDS', rarity: 'common', price: 100, unlockPilotLevel: 1,
    desc: 'Bolts pierce +1 enemy.',
    effect: 'pierce+1',
  },
  {
    id: 'dash-mine', name: 'DASH MINE', rarity: 'common', price: 100, unlockPilotLevel: 1,
    desc: 'Dash leaves a damaging mine (damage 2, lasts 8 s).',
    effect: 'dash-mine',
  },
  {
    id: 'golden-touch', name: 'GOLDEN TOUCH', rarity: 'common', price: 100, unlockPilotLevel: 1,
    desc: 'Shards are worth +1 pt each.',
    effect: 'shard+1',
  },
  {
    id: 'swift-recovery', name: 'SWIFT RECOVERY', rarity: 'rare', price: 250, unlockPilotLevel: 3,
    desc: 'Dash cooldown −20%.',
    effect: 'dash-cd-20%',
  },
  {
    id: 'chain-spark', name: 'CHAIN SPARK', rarity: 'rare', price: 250, unlockPilotLevel: 3,
    desc: 'On an enemy kill, 25% chance lightning chains to a nearby enemy for 1 damage.',
    effect: 'chain-spark-25%',
  },
  {
    id: 'bullet-ward', name: 'BULLET WARD', rarity: 'rare', price: 250, unlockPilotLevel: 3,
    desc: 'Destroying an enemy bullet grants a 2 s shield.',
    effect: 'bullet-ward',
  },
  {
    id: 'heart-siphon', name: 'HEART SIPHON', rarity: 'epic', price: 600, unlockPilotLevel: 5,
    desc: 'Every 25 shards collected restores 1 heart (up to max).',
    effect: 'heart-siphon-25',
  },
  {
    id: 'overdrive', name: 'OVERDRIVE', rarity: 'legendary', price: 1200, unlockPilotLevel: 8,
    desc: 'At full hearts, +25% weapon damage.',
    effect: 'overdrive',
  },
];

function chipById(id) {
  return CHIPS.find((c) => c.id === id) || null;
}

function chipsOf(save) {
  if (save && save.chips && save.chips.owned) return save.chips;
  return { owned: {}, slots: [null, null] };
}

function ensureChips(save) {
  if (!save.chips) save.chips = { owned: {}, slots: [null, null] };
  if (!save.chips.owned) save.chips.owned = {};
  if (!Array.isArray(save.chips.slots)) save.chips.slots = [null, null];
  return save.chips;
}

/** Chip slots: 2, or 3 once the pilot reaches Lv 10. */
function chipSlotCount(save) {
  return pilotLevel(save) >= 10 ? CHIP_SLOT_COUNT + 1 : CHIP_SLOT_COUNT;
}

/**
 * Can this chip be bought right now? Returns { ok } or
 * { ok: false, reason } where reason is 'owned' | 'locked' | 'broke'
 * | 'unknown'. Locked = pilot level < unlockPilotLevel.
 */
function canBuyChip(save, id) {
  const def = chipById(id);
  if (!def) return { ok: false, reason: 'unknown' };
  if (chipsOf(save).owned[id]) return { ok: false, reason: 'owned' };
  if (pilotLevel(save) < def.unlockPilotLevel) return { ok: false, reason: 'locked' };
  if ((save.coins ?? 0) < def.price) return { ok: false, reason: 'broke' };
  return { ok: true, cost: def.price };
}

/**
 * Buy a chip. Deducts the price from save.coins and owns it (not
 * slotted — slotting is a separate step). Returns { ok: true, cost }
 * or the canBuy reason.
 */
function buyChip(save, id) {
  const check = canBuyChip(save, id);
  if (!check.ok) return check;
  ensureChips(save);
  save.coins = (save.coins ?? 0) - check.cost;
  save.chips.owned[id] = true;
  return { ok: true, cost: check.cost };
}

/**
 * Slot an owned chip into a slot (0-based). Returns { ok } or
 * { ok: false, reason } where reason is 'not-owned' | 'occupied' |
 * 'bad-slot'. A chip already slotted anywhere counts as 'occupied'
 * (one chip, one slot — no double-applying). Unknown ids report
 * 'not-owned'.
 */
function slotChip(save, id, slot) {
  const count = chipSlotCount(save);
  if (!Number.isInteger(slot) || slot < 0 || slot >= count) return { ok: false, reason: 'bad-slot' };
  if (!chipById(id) || !chipsOf(save).owned[id]) return { ok: false, reason: 'not-owned' };
  const chips = ensureChips(save);
  if (chips.slots.includes(id)) return { ok: false, reason: 'occupied' };
  if (chips.slots[slot] != null) return { ok: false, reason: 'occupied' };
  chips.slots[slot] = id;
  return { ok: true };
}

/**
 * Remove whatever is in a slot. Returns { ok: true, id } or
 * { ok: false, reason } where reason is 'bad-slot' | 'empty'.
 */
function unslotChip(save, slot) {
  const count = chipSlotCount(save);
  if (!Number.isInteger(slot) || slot < 0 || slot >= count) return { ok: false, reason: 'bad-slot' };
  const chips = ensureChips(save);
  const id = chips.slots[slot] ?? null;
  if (id == null) return { ok: false, reason: 'empty' };
  chips.slots[slot] = null;
  return { ok: true, id };
}

/** The slotted chips' definitions, in slot order (empty slots skipped). */
function equippedChips(save) {
  const chips = chipsOf(save);
  const out = [];
  for (let i = 0; i < chipSlotCount(save); i += 1) {
    const id = chips.slots[i];
    if (id != null) {
      const def = chipById(id);
      if (def) out.push(def);
    }
  }
  return out;
}

/**
 * The combined live effects of a list of chip ids. Always returns
 * exactly these keys (defaults: no chip equipped):
 *   { pierce, dashMine, shardBonus, dashCooldownMult, chainSpark,
 *     bulletWard, heartSiphon, overdrive }
 * Unknown ids are ignored. Duplicate ids in the list do not stack
 * (a chip can only be slotted once).
 */
function chipEffectsFor(chipIds) {
  const effects = {
    pierce: 0,
    dashMine: false,
    shardBonus: 0,
    dashCooldownMult: 1,
    chainSpark: 0,
    bulletWard: false,
    heartSiphon: 0,
    overdrive: false,
  };
  const seen = new Set();
  for (const id of chipIds || []) {
    if (seen.has(id)) continue;
    seen.add(id);
    switch (id) {
      case 'piercing-rounds':
        effects.pierce += 1;
        break;
      case 'dash-mine':
        effects.dashMine = true;
        break;
      case 'golden-touch':
        effects.shardBonus += 1;
        break;
      case 'swift-recovery':
        effects.dashCooldownMult *= 0.8;
        break;
      case 'chain-spark':
        effects.chainSpark = Math.max(effects.chainSpark, 0.25);
        break;
      case 'bullet-ward':
        effects.bulletWard = true;
        break;
      case 'heart-siphon':
        effects.heartSiphon = 25;
        break;
      case 'overdrive':
        effects.overdrive = true;
        break;
      default:
        break;
    }
  }
  return effects;
}

// --- Boss first-clear drops -------------------------------------------

const BOSS_DROPS = {
  10: 'bullet-ward',
  30: 'heart-siphon',
  50: 'overdrive',
  70: 'chain-spark',
  90: 'piercing-rounds',
};

/** The chip a first-clear of boss stage `stage` drops, or null. */
function bossDropChip(stage) {
  return BOSS_DROPS[stage] || null;
}

/**
 * Grant a boss stage's first-clear drop to the save. Returns
 * { granted: id } when the chip is newly owned, { coins: 100 } when
 * the chip was already owned (100 coins instead), or null when the
 * stage drops nothing. Idempotent per chip: a second grant of the
 * same stage pays the 100 coins.
 */
function grantBossDrop(save, stage) {
  const id = bossDropChip(stage);
  if (!id) return null;
  const chips = ensureChips(save);
  if (chips.owned[id]) {
    save.coins = (save.coins ?? 0) + 100;
    return { coins: 100 };
  }
  chips.owned[id] = true;
  return { granted: id };
}

function layoutUpgradeCards(offers) {

// --- Stage select: 10 tiles per page in a 5x2 grid, band arrows on the
// sides, a big PLAY STAGE button under the grid, BACK under that.
const STAGES_PER_PAGE = 10;
const STAGE_PAGE_COUNT = 10;
function layoutStageTiles(page) {
  const p = Math.max(0, Math.min(STAGE_PAGE_COUNT - 1, page | 0));
  const tileW = 180;
  const tileH = 110;
  const gap = 20;
  const totalW = 5 * tileW + 4 * gap;
  const x0 = (FIELD.width - totalW) / 2;
  const y0 = 200;
  const tiles = [];
  for (let i = 0; i < STAGES_PER_PAGE; i += 1) {
    const col = i % 5;
    const row = Math.floor(i / 5);
    tiles.push({
      x: x0 + col * (tileW + gap),
      y: y0 + row * (tileH + gap),
      w: tileW,
      h: tileH,
      stage: p * STAGES_PER_PAGE + i + 1,
    });
  }
  return {
    page: p,
    pageCount: STAGE_PAGE_COUNT,
    tiles,
    prevArrow: { x: 60, y: 245, w: 60, h: 60 },
    nextArrow: { x: 1160, y: 245, w: 60, h: 60 },
    prevEnabled: p > 0,
    nextEnabled: p < STAGE_PAGE_COUNT - 1,
    play: { x: 470, y: 480, w: 340, h: 64 },
    back: STAGES_BACK_RECT,
  };
}

/**
 * The profile menu's view data: pilot.js's profileStats (pilot,
 * loadout, attributes, collection, totals) enriched with the
 * display-ready bits the renderer needs — collection items (owned
 * vs locked, with the unlock condition per item), weapon/chip names
 * and rarities, and the chip effects as attribute lines.
 *
 * `opts` (all optional): { weapons (defs, default WEAPONS),
 * chips (defs, default CHIPS), chipEffects (the live effects object
 * from chipEffectsFor, default all-off), weaponStats (fn, default
 * the weapons.js one), achievements (view list [{id,name,desc,
 * reward,state}], default []) }. With no save at all (a bare
 * screenshot draw) it returns the fresh-save profile.
 */
function profileFromSave(save, opts = {}) {
  const s = save ?? freshSave(localDate());
  const base = profileStats(s);
  const weapons = opts.weapons ?? WEAPONS;
  const chips = opts.chips ?? CHIPS;
  const effects = opts.chipEffects ?? null;
  const weaponStatsFn = opts.weaponStats ?? null;

  const weaponDef = (weapons || []).find((w) => w.id === base.loadout.weapon.id)
    || { id: 'blaster', name: 'BLASTER', range: BLASTER.range, unlockPilotLevel: 1, price: 0, baseDamage: 1, damagePerLevel: 0, rate: 2 };
  // The Blaster's damage/rate come from the equipped ship (see
  // weapons.js weaponStats); other weapons use their own def + level.
  let weaponDamage = base.attributes.weaponDamage;
  let weaponRate = base.attributes.weaponRate;
  if (weaponDef.id !== 'blaster' && weaponStatsFn) {
    const ws = weaponStatsFn(weaponDef, base.loadout.weapon.level);
    weaponDamage = ws.damage;
    weaponRate = ws.rate;
  }
  const slotted = (base.loadout.chips || []).map((id) => {
    const def = (chips || []).find((c) => c.id === id) || chipById(id);
    return def ? { id: def.id, name: def.name, rarity: def.rarity } : { id, name: String(id).toUpperCase(), rarity: 'common' };
  });

  const effectLines = [];
  if (effects) {
    if ((effects.pierce ?? 0) > 0) effectLines.push({ label: 'PIERCING ROUNDS', value: `+${effects.pierce} pierce` });
    if (effects.dashMine) effectLines.push({ label: 'DASH MINE', value: 'dash leaves a mine' });
    if ((effects.shardBonus ?? 0) > 0) effectLines.push({ label: 'GOLDEN TOUCH', value: `+${effects.shardBonus} pts / shard` });
    if ((effects.dashCooldownMult ?? 1) !== 1) effectLines.push({ label: 'SWIFT RECOVERY', value: `dash ×${effects.dashCooldownMult}` });
    if ((effects.chainSpark ?? 0) > 0) effectLines.push({ label: 'CHAIN SPARK', value: `${Math.round(effects.chainSpark * 100)}% chain on kill` });
    if (effects.bulletWard) effectLines.push({ label: 'BULLET WARD', value: '2 s shield per orb' });
    if ((effects.heartSiphon ?? 0) > 0) effectLines.push({ label: 'HEART SIPHON', value: `1 heart / ${effects.heartSiphon} shards` });
    if (effects.overdrive) effectLines.push({ label: 'OVERDRIVE', value: '+25% dmg at full hearts' });
  }

  const shipItems = SHIPS.map((def) => ({
    name: def.name,
    owned: !!s.ships?.owned?.[def.id],
    unlock: def.unlockStage > 0 ? `Clear stage ${def.unlockStage}` : 'Starter',
    short: def.unlockStage > 0 ? `S${def.unlockStage}` : '',
  }));
  const weaponItems = (weapons || []).map((def) => ({
    name: def.name,
    owned: !!(s.weapons?.owned && s.weapons.owned[def.id]),
    unlock: def.unlockPilotLevel > 1 ? `Pilot Lv ${def.unlockPilotLevel}` : 'Pilot Lv 1',
    short: def.unlockPilotLevel > 1 ? `Lv ${def.unlockPilotLevel}` : '',
  }));
  const chipItems = (chips || []).map((def) => ({
    name: def.name,
    owned: !!(s.chips?.owned && s.chips.owned[def.id]),
    unlock: `Pilot Lv ${def.unlockPilotLevel}`,
    short: `Lv ${def.unlockPilotLevel}`,
  }));
  const skinItems = SKINS.map((def) => ({
    name: def.name,
    owned: (s.lifetime?.shards ?? 0) >= def.unlock,
    unlock: def.unlock > 0 ? `${def.unlock} ◆` : 'Starter',
    short: def.unlock > 0 ? `${def.unlock}◆` : '',
  }));

  return {
    pilot: base.pilot,
    loadout: {
      ship: { ...base.loadout.ship, name: (SHIPS.find((d) => d.id === base.loadout.ship.id)?.name) ?? 'SPARK' },
      shipPower: base.loadout.shipPower,
      weapon: { ...base.loadout.weapon, name: weaponDef.name },
      chips: slotted,
    },
    attributes: {
      shipPower: base.attributes.shipPower,
      hearts: base.attributes.hearts,
      speedMult: base.attributes.speedMult,
      weaponDamage,
      weaponRate,
      dashCooldown: base.attributes.dashCooldown * (effects?.dashCooldownMult ?? 1),
      magnetRadius: base.attributes.magnetRadius,
      shardValue: base.attributes.shardValue + (effects?.shardBonus ?? 0),
      chipEffects: effectLines,
    },
    collection: {
      ships: { ...base.collection.ships, items: shipItems },
      weapons: { owned: weaponItems.filter((i) => i.owned).length, total: weaponItems.length, items: weaponItems },
      chips: { owned: chipItems.filter((i) => i.owned).length, total: chipItems.length, items: chipItems },
      skins: { ...base.collection.skins, items: skinItems },
    },
    totals: base.totals,
    achievements: Array.isArray(opts.achievements) ? opts.achievements : [],
  };
}

const CYAN = '#22d3ee';
const MAGENTA = '#f472b6';
const GOLD = '#fbbf24';
const GREEN = '#34d399';
const INK = '#0b1026';

function glow(ctx, color, blur) {
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
}

function noGlow(ctx) {
  ctx.shadowBlur = 0;
}

function drawStars(ctx, state) {
  for (const star of state.stars) {
    const depth = 0.25 + star.layer * 0.35;
    const x = ((star.x - state.time * 8 * depth) % FIELD.width + FIELD.width) % FIELD.width;
    const y = star.y;
    const alpha = 0.35 + 0.65 * Math.abs(Math.sin(state.time * 1.5 + star.twinkle));
    ctx.globalAlpha = alpha * (0.5 + star.layer * 0.25);
    ctx.fillStyle = star.layer === 2 ? '#e0f2fe' : '#a5f3fc';
    ctx.beginPath();
    ctx.arc(x, y, star.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawNebula(ctx, width, height) {
  const blobs = [
    { x: 0.18, y: 0.22, r: 0.34, color: 'rgba(124, 58, 237, 0.20)' },
    { x: 0.85, y: 0.75, r: 0.38, color: 'rgba(219, 39, 119, 0.14)' },
    { x: 0.72, y: 0.12, r: 0.28, color: 'rgba(34, 211, 238, 0.10)' },
  ];
  for (const blob of blobs) {
    const gradient = ctx.createRadialGradient(
      blob.x * width, blob.y * height, 0,
      blob.x * width, blob.y * height, blob.r * width,
    );
    gradient.addColorStop(0, blob.color);
    gradient.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);
  }
}

function drawShard(ctx, x, y, spin, pulse, golden = false) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(spin);
  const twinkle = 0.75 + 0.25 * Math.sin(pulse * 3);
  // A golden shard is bigger, brighter, and spins with a wider glow.
  const scale = golden ? 1.45 : 1;
  ctx.scale(scale, scale);
  glow(ctx, golden ? '#fde047' : GOLD, golden ? 24 : 14);
  ctx.fillStyle = golden ? '#fde047' : GOLD;
  ctx.globalAlpha = twinkle;
  ctx.beginPath();
  ctx.moveTo(0, -11);
  ctx.lineTo(4, -4);
  ctx.lineTo(11, 0);
  ctx.lineTo(4, 4);
  ctx.lineTo(0, 11);
  ctx.lineTo(-4, 4);
  ctx.lineTo(-11, 0);
  ctx.lineTo(-4, -4);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#fffbeb';
  ctx.beginPath();
  ctx.arc(0, 0, 3.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawMine(ctx, x, y, radius, spin, pulse, age = 1) {
  // Telegraph: a fresh mine fades in over ~0.3 s with a shrinking
  // warning ring, so nothing appears at full strength without warning.
  const fade = Math.min(1, 0.3 + (age ?? 1) / 0.3);
  ctx.save();
  ctx.globalAlpha = fade;
  if ((age ?? 1) < 0.5) {
    ctx.strokeStyle = MAGENTA;
    ctx.lineWidth = 2;
    ctx.globalAlpha = (0.5 - age) * 1.2;
    ctx.beginPath();
    ctx.arc(x, y, radius + (0.5 - age) * 70, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = fade;
  }
  ctx.translate(x, y);
  ctx.rotate(spin);
  const throb = 1 + 0.08 * Math.sin(pulse * 4);
  glow(ctx, MAGENTA, 16);
  ctx.fillStyle = '#3b0764';
  ctx.strokeStyle = MAGENTA;
  ctx.lineWidth = 2;
  // Eight spikes around a dark core.
  ctx.beginPath();
  for (let i = 0; i < 8; i += 1) {
    const angle = (i / 8) * Math.PI * 2;
    const outer = radius * 1.35 * throb;
    const inner = radius * 0.7;
    const tipX = Math.cos(angle) * outer;
    const tipY = Math.sin(angle) * outer;
    const baseAngle = angle + Math.PI / 8;
    const baseX = Math.cos(baseAngle) * inner;
    const baseY = Math.sin(baseAngle) * inner;
    if (i === 0) ctx.moveTo(tipX, tipY);
    else ctx.lineTo(tipX, tipY);
    ctx.lineTo(baseX, baseY);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#f472b6';
  ctx.beginPath();
  ctx.arc(0, 0, radius * 0.34, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawStorm(ctx, x, y, spin, age = 1) {
  const fade = Math.min(1, 0.3 + (age ?? 1) / 0.3);
  ctx.save();
  ctx.globalAlpha = fade;
  if ((age ?? 1) < 0.5) {
    ctx.strokeStyle = '#a78bfa';
    ctx.lineWidth = 2;
    ctx.globalAlpha = (0.5 - age) * 1.2;
    ctx.beginPath();
    ctx.arc(x, y, 13 + (0.5 - age) * 70, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = fade;
  }
  ctx.translate(x, y);
  ctx.rotate(spin);
  glow(ctx, '#a78bfa', 14);
  ctx.fillStyle = '#c4b5fd';
  ctx.beginPath();
  ctx.moveTo(0, -13);
  ctx.lineTo(5, -2);
  ctx.lineTo(13, 0);
  ctx.lineTo(5, 3);
  ctx.lineTo(0, 13);
  ctx.lineTo(-5, 3);
  ctx.lineTo(-13, 0);
  ctx.lineTo(-5, -2);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#ede9fe';
  ctx.beginPath();
  ctx.arc(0, 0, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawEnemy(ctx, e) {
  // One silhouette per kind, so the threat reads at a glance: drifter a
  // grey-green spiky blob, dart a red triangle, bulwark a big purple
  // hexagon, spitter an orange diamond. An elite (eliteTier > 0) wears
  // a gold outline.
  const r = e.radius ?? 15;
  ctx.save();
  ctx.translate(e.x, e.y);
  const pulse = 1 + 0.05 * Math.sin((e.pulse ?? 0) * 4);
  if (e.kind === 'dart') {
    ctx.rotate(Math.atan2(e.vy ?? 0, e.vx ?? -1));
    glow(ctx, '#f87171', 14);
    ctx.fillStyle = '#dc2626';
    ctx.strokeStyle = '#fca5a5';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(r * 1.4, 0);
    ctx.lineTo(-r, -r * 0.8);
    ctx.lineTo(-r * 0.5, 0);
    ctx.lineTo(-r, r * 0.8);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  } else if (e.kind === 'bulwark') {
    ctx.rotate(e.spin ?? 0);
    glow(ctx, '#a78bfa', 16);
    ctx.fillStyle = '#6d28d9';
    ctx.strokeStyle = '#c4b5fd';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let i = 0; i < 6; i += 1) {
      const a = (i / 6) * Math.PI * 2;
      const px = Math.cos(a) * r * pulse;
      const py = Math.sin(a) * r * pulse;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#ede9fe';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2);
    ctx.fill();
  } else if (e.kind === 'spitter') {
    ctx.rotate((e.spin ?? 0) * 0.5);
    glow(ctx, '#fb923c', 14);
    ctx.fillStyle = '#ea580c';
    ctx.strokeStyle = '#fdba74';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -r * 1.2);
    ctx.lineTo(r, 0);
    ctx.lineTo(0, r * 1.2);
    ctx.lineTo(-r, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#ffedd5';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.28, 0, Math.PI * 2);
    ctx.fill();
    // Telegraph: a bright ring while the spitter is about to shoot.
    if ((e.telegraph ?? 0) > 0) {
      ctx.strokeStyle = '#fb923c';
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin((e.pulse ?? 0) * 12);
      ctx.beginPath();
      ctx.arc(0, 0, r + 10, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  } else {
    // Drifter (default): a grey-green spiky blob, slow and tumbling.
    ctx.rotate(e.spin ?? 0);
    glow(ctx, '#a3e635', 12);
    ctx.fillStyle = '#4d7c0f';
    ctx.strokeStyle = '#a3e635';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 8; i += 1) {
      const angle = (i / 8) * Math.PI * 2;
      const outer = r * 1.3 * pulse;
      const inner = r * 0.65;
      const tipX = Math.cos(angle) * outer;
      const tipY = Math.sin(angle) * outer;
      const baseAngle = angle + Math.PI / 8;
      const baseX = Math.cos(baseAngle) * inner;
      const baseY = Math.sin(baseAngle) * inner;
      if (i === 0) ctx.moveTo(tipX, tipY);
      else ctx.lineTo(tipX, tipY);
      ctx.lineTo(baseX, baseY);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#d9f99d';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  // Elite tier: a gold ring over the top, whatever the kind.
  if ((e.eliteTier ?? 0) > 0) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.strokeStyle = GOLD;
    ctx.lineWidth = 3;
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.arc(0, 0, r + 5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

function drawBullet(ctx, b) {
  // A player projectile, by kind: a bolt is a short cyan streak along
  // its flight path; a laser bolt is a longer, brighter beam; a mortar
  // shell is a fat orange round (it bursts on impact or at max range).
  if (b.kind === 'shell') {
    ctx.save();
    ctx.translate(b.x, b.y);
    glow(ctx, '#fb923c', 16);
    ctx.fillStyle = '#fb923c';
    ctx.beginPath();
    ctx.arc(0, 0, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffedd5';
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    return;
  }
  const angle = Math.atan2(b.vy ?? 0, b.vx ?? 1);
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(angle);
  const laser = b.kind === 'laser';
  glow(ctx, laser ? '#e0f2fe' : CYAN, laser ? 16 : 10);
  ctx.fillStyle = laser ? '#e0f2fe' : '#a5f3fc';
  ctx.beginPath();
  ctx.ellipse(0, 0, laser ? 20 : 11, laser ? 2.5 : 3.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ecfeff';
  ctx.beginPath();
  ctx.ellipse(3, 0, laser ? 10 : 5, laser ? 1.5 : 2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawTrap(ctx, t) {
  // A dash mine (chip): an orange spiked round, fading as its 8 s run out.
  ctx.save();
  ctx.globalAlpha = Math.max(0.25, Math.min(1, (t.ttl ?? 8) / 2));
  ctx.translate(t.x, t.y);
  glow(ctx, '#fb923c', 12);
  ctx.fillStyle = '#7c2d12';
  ctx.strokeStyle = '#fb923c';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 6; i += 1) {
    const angle = (i / 6) * Math.PI * 2;
    const outer = (t.r ?? 36) * 0.55;
    const inner = (t.r ?? 36) * 0.3;
    const tipX = Math.cos(angle) * outer;
    const tipY = Math.sin(angle) * outer;
    const baseAngle = angle + Math.PI / 6;
    if (i === 0) ctx.moveTo(tipX, tipY);
    else ctx.lineTo(tipX, tipY);
    ctx.lineTo(Math.cos(baseAngle) * inner, Math.sin(baseAngle) * inner);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#fdba74';
  ctx.beginPath();
  ctx.arc(0, 0, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawPulseFx(ctx, seg) {
  // One chain-lightning jump: a bright violet line that fades fast.
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, (seg.ttl ?? 0.15) / 0.15));
  ctx.strokeStyle = '#c084fc';
  ctx.lineWidth = 3;
  glow(ctx, '#a78bfa', 14);
  ctx.beginPath();
  ctx.moveTo(seg.x1, seg.y1);
  // A jagged middle so the bolt reads as lightning, not a ruler line.
  const mx = (seg.x1 + seg.x2) / 2 + (Math.random() * 24 - 12);
  const my = (seg.y1 + seg.y2) / 2 + (Math.random() * 24 - 12);
  ctx.lineTo(mx, my);
  ctx.lineTo(seg.x2, seg.y2);
  ctx.stroke();
  ctx.restore();
}

function drawEnemyBullet(ctx, b) {
  // An enemy orb: magenta, round, unmistakable next to a cyan bolt.
  ctx.save();
  ctx.translate(b.x, b.y);
  glow(ctx, MAGENTA, 12);
  ctx.fillStyle = MAGENTA;
  ctx.beginPath();
  ctx.arc(0, 0, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fdf2f8';
  ctx.beginPath();
  ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawBoss(ctx, boss) {
  // A boss is a crown-like ring around a burning core: spikes on the
  // rim, a pulsing magenta heart. While telegraph > 0 it is about to
  // fire — a flashing ring warns the player.
  const r = boss.radius ?? 46;
  ctx.save();
  ctx.translate(boss.x, boss.y);
  const throb = 1 + 0.06 * Math.sin((boss.age ?? 0) * 5);
  if ((boss.telegraph ?? 0) > 0) {
    ctx.save();
    ctx.globalAlpha = 0.45 + 0.45 * Math.sin((boss.age ?? 0) * 18);
    ctx.strokeStyle = '#f43f5e';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(0, 0, r + 22, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  ctx.rotate(Math.sin((boss.age ?? 0) * 0.8) * 0.15);
  glow(ctx, '#c084fc', 24);
  ctx.fillStyle = '#4c1d95';
  ctx.strokeStyle = '#c084fc';
  ctx.lineWidth = 3;
  // Crown rim: twelve spikes around the ring.
  ctx.beginPath();
  for (let i = 0; i < 12; i += 1) {
    const angle = (i / 12) * Math.PI * 2;
    const outer = r * 1.25 * throb;
    const inner = r * 0.85;
    const tipX = Math.cos(angle) * outer;
    const tipY = Math.sin(angle) * outer;
    const baseAngle = angle + Math.PI / 12;
    const baseX = Math.cos(baseAngle) * inner;
    const baseY = Math.sin(baseAngle) * inner;
    if (i === 0) ctx.moveTo(tipX, tipY);
    else ctx.lineTo(tipX, tipY);
    ctx.lineTo(baseX, baseY);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#7e22ce';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.62, 0, Math.PI * 2);
  ctx.fill();
  glow(ctx, MAGENTA, 20);
  ctx.fillStyle = MAGENTA;
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.34 * throb, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fdf2f8';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.14, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawBossBar(ctx, boss, width) {
  // Boss HP bar, top-centre (the HUD owns it; the field only draws the
  // boss itself). Name above, bar below.
  const barW = 320;
  const barX = (width - barW) / 2;
  const barY = 34;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  glow(ctx, '#c084fc', 10);
  ctx.fillStyle = '#e9d5ff';
  ctx.font = 'bold 18px sans-serif';
  ctx.fillText(`BOSS  ${boss.name ?? 'VOID WARDEN'}`, width / 2, barY - 8);
  noGlow(ctx);
  ctx.fillStyle = 'rgba(148, 163, 184, 0.4)';
  ctx.fillRect(barX, barY, barW, 12);
  const frac = Math.max(0, Math.min(1, (boss.hp ?? 0) / (boss.maxHp || 1)));
  ctx.fillStyle = '#c084fc';
  ctx.fillRect(barX, barY, barW * frac, 12);
  ctx.strokeStyle = '#e9d5ff';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(barX, barY, barW, 12);
  ctx.restore();
}

function drawShieldCell(ctx, x, y, pulse) {
  ctx.save();
  ctx.translate(x, y);
  const bob = Math.sin(pulse * 2) * 3;
  ctx.translate(0, bob);
  glow(ctx, GREEN, 16);
  ctx.strokeStyle = GREEN;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(0, 0, 13, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = 'rgba(52, 211, 153, 0.25)';
  ctx.fill();
  ctx.fillStyle = GREEN;
  ctx.font = 'bold 15px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('+', 0, 1);
  ctx.restore();
}

function drawShip(ctx, state, skin = SKINS[0], shape = 'skiff') {
  const ship = state.ship;
  const blink = ship.invulnerable > 0 && Math.floor(state.time * 14) % 2 === 0;
  ctx.save();
  // Drawn at the ship's simulated position, in field units: this is the
  // same point the collision checks in world.js use.
  ctx.translate(ship.x, ship.y);
  ctx.rotate(ship.angle);
  if (blink) ctx.globalAlpha = 0.35;
  // Engine flame.
  const flame = 14 + Math.sin(state.time * 30) * 5 + Math.hypot(ship.vx, ship.vy) * 0.02;
  glow(ctx, skin.flameGlow, 12);
  ctx.fillStyle = skin.flame;
  ctx.beginPath();
  ctx.moveTo(-12, -5);
  ctx.lineTo(-12 - flame, 0);
  ctx.lineTo(-12, 5);
  ctx.closePath();
  ctx.fill();
  // Hull: the skin changes hull, glow and trail colours only — the shape
  // (and the hitbox) never change. Three silhouettes, one per ship:
  // 'skiff' the current swept hull, 'dart' a narrow hull with a longer
  // nose, 'wing' a wider hull with swept wings.
  glow(ctx, skin.glow, 18);
  ctx.fillStyle = skin.hull;
  ctx.strokeStyle = skin.glow;
  ctx.lineWidth = 2;
  ctx.beginPath();
  if (shape === 'dart') {
    ctx.moveTo(28, 0);
    ctx.lineTo(-8, -9);
    ctx.lineTo(-16, -4);
    ctx.lineTo(-16, 4);
    ctx.lineTo(-8, 9);
  } else if (shape === 'wing') {
    ctx.moveTo(20, 0);
    ctx.lineTo(-6, -18);
    ctx.lineTo(-14, -18);
    ctx.lineTo(-10, -6);
    ctx.lineTo(-18, -5);
    ctx.lineTo(-18, 5);
    ctx.lineTo(-10, 6);
    ctx.lineTo(-14, 18);
    ctx.lineTo(-6, 18);
  } else {
    ctx.moveTo(22, 0);
    ctx.lineTo(-10, -13);
    ctx.lineTo(-16, -5);
    ctx.lineTo(-16, 5);
    ctx.lineTo(-10, 13);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // Cockpit.
  ctx.fillStyle = '#ecfeff';
  ctx.beginPath();
  ctx.arc(6, 0, 4.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  // Shield ring when a shield is held.
  if (state.shield) {
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.globalAlpha = 0.6 + 0.3 * Math.sin(state.time * 5);
    glow(ctx, GREEN, 14);
    ctx.strokeStyle = GREEN;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 0, SHIP.radius + 9, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

function drawGate(ctx, state, width, height) {
  // The Aurora Gate: a glowing ring that opens as the stage fills with
  // light, then shines wide open on the clear screen. It sits high on
  // the screen (centre at 20% of the height) so it never covers the
  // title text below it.
  const cx = width / 2;
  const cy = height * 0.20;
  const progress = state.gateOpen ? 1 : state.gateProgress;
  const radius = 36 + progress * 44;
  const gradient = ctx.createRadialGradient(cx, cy, radius * 0.2, cx, cy, radius * 1.6);
  gradient.addColorStop(0, `rgba(52, 211, 153, ${0.10 + progress * 0.35})`);
  gradient.addColorStop(0.6, `rgba(34, 211, 238, ${0.08 + progress * 0.22})`);
  gradient.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(cx - radius * 1.8, cy - radius * 1.8, radius * 3.6, radius * 3.6);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(state.time * 0.4);
  glow(ctx, progress >= 1 ? GREEN : CYAN, 22);
  ctx.strokeStyle = progress >= 1 ? GREEN : CYAN;
  ctx.lineWidth = 3;
  ctx.setLineDash([14, 10]);
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  ctx.fillStyle = progress >= 1 ? GREEN : '#a5f3fc';
  ctx.font = `bold ${progress >= 1 ? 20 : 15}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(progress >= 1 ? 'GATE OPEN' : `GATE ${Math.round(progress * 100)}%`, cx, cy);
}

function drawJoystick(ctx, pointer) {
  // Floating joystick: a ring where the steering finger landed, a knob
  // where it has dragged to. Drawn in field coordinates, under the HUD.
  const ox = pointer.dragStartX;
  const oy = pointer.dragStartY;
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.strokeStyle = CYAN;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(ox, oy, 55, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = CYAN;
  ctx.beginPath();
  ctx.arc(ox + pointer.relX * 55, oy + pointer.relY * 55, 18, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawHud(ctx, state, best, width, theme = THEMES[0], extra = {}) {
  const pad = 18;
  ctx.textBaseline = 'alphabetic';
  // Score, big and gold — counted up smoothly (displayScore), not jumped.
  ctx.textAlign = 'left';
  glow(ctx, GOLD, 10);
  ctx.fillStyle = GOLD;
  ctx.font = 'bold 40px sans-serif';
  ctx.fillText(String(Math.round(state.displayScore ?? state.score)), pad, 48);
  noGlow(ctx);
  ctx.fillStyle = '#e2e8f0';
  ctx.font = '16px sans-serif';
  ctx.fillText(`BEST ${Math.max(best, state.score)}`, pad, 72);
  // Combo badge: it pops bigger and jitters as the combo pulse rises.
  if (state.combo > 1) {
    const pulse = state.comboPulse ?? 0;
    ctx.save();
    ctx.translate(pad + (Math.random() * 4 - 2) * pulse, 104);
    ctx.scale(1 + 0.25 * pulse, 1 + 0.25 * pulse);
    ctx.textAlign = 'left';
    glow(ctx, MAGENTA, 12);
    ctx.fillStyle = MAGENTA;
    ctx.font = 'bold 26px sans-serif';
    ctx.fillText(`COMBO x${state.combo}`, 0, 0);
    noGlow(ctx);
    ctx.restore();
  }
  // Hearts, top right — one slot per max heart (upgrades can add to 5).
  const maxHearts = state.maxHearts ?? HEARTS;
  ctx.textAlign = 'right';
  for (let i = 0; i < maxHearts; i += 1) {
    const x = width - pad - i * 34;
    const y = 32;
    ctx.save();
    ctx.translate(x, y);
    if (i < state.hearts) {
      glow(ctx, '#fb7185', 12);
      ctx.fillStyle = '#fb7185';
    } else {
      ctx.fillStyle = 'rgba(148, 163, 184, 0.35)';
    }
    ctx.beginPath();
    ctx.moveTo(0, 8);
    ctx.bezierCurveTo(-12, -4, -6, -12, 0, -5);
    ctx.bezierCurveTo(6, -12, 12, -4, 0, 8);
    ctx.fill();
    ctx.restore();
  }
  // Stage, top right — tinted with the current band's theme accent.
  // LEVEL lives on the upgrade screen only now. The equipped weapon
  // rides next to it, so the loadout is always visible in play.
  ctx.textAlign = 'right';
  ctx.fillStyle = theme.accent;
  ctx.font = 'bold 19px sans-serif';
  const weaponLabel = extra.weaponLabel
    ?? (state.weaponId
      ? `${String(state.weaponId).toUpperCase()} Lv ${state.weaponLevel ?? 1}`
      : 'BLASTER Lv 1');
  ctx.fillText(
    state.endless ? `ENDLESS  •  ${weaponLabel}` : `STAGE ${state.stage ?? 1}  •  ${weaponLabel}`,
    width - pad, 66,
  );
  const dashReady = state.ship.dashCooldown <= 0;
  const dashBase = effectiveDashCooldown(state);
  const dashFrac = dashReady ? 1 : 1 - state.ship.dashCooldown / dashBase;
  ctx.fillStyle = 'rgba(148, 163, 184, 0.5)';
  ctx.fillRect(width - pad - 110, 76, 110, 8);
  ctx.fillStyle = dashReady ? CYAN : '#64748b';
  ctx.fillRect(width - pad - 110, 76, 110 * dashFrac, 8);
  ctx.fillStyle = dashReady ? CYAN : '#94a3b8';
  ctx.font = '12px sans-serif';
  ctx.fillText(dashReady ? 'DASH READY' : 'DASH…', width - pad, 100);
  if (state.shield) {
    ctx.fillStyle = GREEN;
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText('SHIELD UP', width - pad, 120);
  }
  // Progress bar, bottom centre — lifted off the edge. In endless mode
  // the bar tracks progress to the next level; on a boss stage it is the
  // boss's name (the HP bar lives top-centre); otherwise it is the
  // stage target.
  const barWidth = 420;
  const barX = (width - barWidth) / 2;
  const barY = 682;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 15px sans-serif';
  const boss = state.boss ?? null;
  const target = state.stageTarget;
  if (state.endless) {
    ctx.fillText(`ENDLESS DRIFT  •  LEVEL ${state.level}`, width / 2, barY - 8);
  } else if (boss) {
    ctx.fillText(`BOSS  ${boss.name ?? 'VOID WARDEN'}`, width / 2, barY - 8);
  } else if (typeof target === 'number' && target > 0) {
    ctx.fillText(`STAGE ${state.stage ?? 1}  —  ${state.score} / ${target}`, width / 2, barY - 8);
  } else {
    ctx.fillText(`STAGE ${state.stage ?? 1}  —  ${state.score}`, width / 2, barY - 8);
  }
  ctx.fillStyle = 'rgba(148, 163, 184, 0.4)';
  ctx.fillRect(barX, barY, barWidth, 12);
  const gateGradient = ctx.createLinearGradient(barX, 0, barX + barWidth, 0);
  gateGradient.addColorStop(0, CYAN);
  gateGradient.addColorStop(1, GREEN);
  ctx.fillStyle = gateGradient;
  const barFrac = state.endless
    ? (state.score % LEVEL_EVERY) / LEVEL_EVERY
    : (boss
      ? Math.max(0, Math.min(1, 1 - (boss.hp ?? 0) / (boss.maxHp || 1)))
      : (typeof target === 'number' && target > 0 ? state.gateProgress : 0));
  ctx.fillRect(barX, barY, barWidth * barFrac, 12);
  // Boss HP bar, top-centre.
  if (boss) drawBossBar(ctx, boss, width);
}

function panel(ctx, width, height) {
  ctx.fillStyle = 'rgba(11, 16, 38, 0.72)';
  ctx.fillRect(0, 0, width, height);
}

function bigTitle(ctx, text, y, width, color, size) {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  glow(ctx, color, 26);
  ctx.fillStyle = color;
  ctx.font = `bold ${size}px sans-serif`;
  ctx.fillText(text, width / 2, y);
  noGlow(ctx);
}

function wrapText(ctx, text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const word of words) {
    const trial = line ? `${line} ${word}` : word;
    if (ctx.measureText(trial).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else {
      line = trial;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function drawTitle(ctx, state, best, width, height, skin = SKINS[0], lifetimeShards = 0, extra = {}) {
  // Home is PLAY only: logo, one big PLAY button, best score, the next
  // goal, and a gear in the corner. Everything else (hangar, missions,
  // scores, settings, daily reward) is one tap away in the tab bar or a
  // panel — never piled onto this screen. The how-to lives in the game
  // itself now (first-run cues), not in four lines of text here.
  panel(ctx, width, height);
  drawGate(ctx, state, width, height);
  const save = extra.save ?? null;
  const streakInfo = extra.streakInfo ?? null;
  const hasPlayed = save && save.lifetime.runs > 0;
  // Gear (settings), top left.
  ctx.save();
  ctx.strokeStyle = 'rgba(226, 232, 240, 0.75)';
  ctx.lineWidth = 2;
  ctx.strokeRect(GEAR_RECT.x, GEAR_RECT.y, GEAR_RECT.w, GEAR_RECT.h);
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 24px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('⚙', GEAR_RECT.x + GEAR_RECT.w / 2, GEAR_RECT.y + GEAR_RECT.h / 2 + 1);
  ctx.restore();
  // Streak flame (top right): opens the daily-reward calendar. It pulses
  // with a dot while today's reward waits unclaimed.
  if (save && save.streak.count > 0) {
    const pending = save.dailyReward
      && save.dailyReward.pendingReward > 0
      && save.dailyReward.lastClaimDate !== localDate();
    const pulse = pending ? 0.6 + 0.4 * Math.sin(state.time * 5) : 1;
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = pending ? GOLD : 'rgba(251, 191, 36, 0.55)';
    ctx.lineWidth = pending ? 2.5 : 1.5;
    ctx.strokeRect(FLAME_RECT.x, FLAME_RECT.y, FLAME_RECT.w, FLAME_RECT.h);
    ctx.fillStyle = GOLD;
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`🔥${save.streak.count}`, FLAME_RECT.x + FLAME_RECT.w / 2, FLAME_RECT.y + FLAME_RECT.h / 2 + 1);
    ctx.restore();
  }
  // Shard balance (top right, display only).
  ctx.save();
  ctx.strokeStyle = 'rgba(251, 191, 36, 0.55)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(BALANCE_RECT.x, BALANCE_RECT.y, BALANCE_RECT.w, BALANCE_RECT.h);
  ctx.fillStyle = GOLD;
  ctx.font = 'bold 20px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(`◆ ${save ? (save.shardBalance ?? 0) : 0}`, BALANCE_RECT.x + BALANCE_RECT.w / 2, BALANCE_RECT.y + BALANCE_RECT.h / 2 + 1);
  ctx.restore();
  // Coins purse (top right, next to the shard balance, display only).
  ctx.save();
  ctx.strokeStyle = 'rgba(251, 191, 36, 0.55)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(COINS_RECT.x, COINS_RECT.y, COINS_RECT.w, COINS_RECT.h);
  ctx.fillStyle = GOLD;
  ctx.font = 'bold 20px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(`🪙 ${save ? (save.coins ?? 0) : 0}`, COINS_RECT.x + COINS_RECT.w / 2, COINS_RECT.y + COINS_RECT.h / 2 + 1);
  ctx.restore();
  // Pilot level chip (top right, next to the coins — the account level
  // gates weapons, chips and the third chip slot).
  ctx.save();
  ctx.strokeStyle = 'rgba(192, 132, 252, 0.65)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(PILOT_RECT.x, PILOT_RECT.y, PILOT_RECT.w, PILOT_RECT.h);
  ctx.fillStyle = '#c084fc';
  ctx.font = 'bold 20px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(`Lv ${save?.pilot?.level ?? 1}`, PILOT_RECT.x + PILOT_RECT.w / 2, PILOT_RECT.y + PILOT_RECT.h / 2 + 1);
  ctx.restore();
  bigTitle(ctx, 'LUMEN DRIFT', 240, width, CYAN, 72);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fbbf24';
  ctx.font = 'bold 24px sans-serif';
  ctx.fillText('Ride the solar storm. Gather the light.', width / 2, 292);
  // The next goal, always visible: the next locked skin with progress.
  const next = nextUnlock(lifetimeShards);
  if (next) {
    ctx.fillStyle = '#e2e8f0';
    ctx.font = 'bold 19px sans-serif';
    ctx.fillText(`NEXT SKIN ◆ ${next.skin.name} — ${next.have} / ${next.need}`, width / 2, 352);
    const barW = 320;
    const barX = (width - barW) / 2;
    ctx.fillStyle = 'rgba(148, 163, 184, 0.4)';
    ctx.fillRect(barX, 366, barW, 9);
    ctx.fillStyle = next.skin.glow;
    ctx.fillRect(barX, 366, barW * Math.min(1, next.have / next.need), 9);
  } else {
    ctx.fillStyle = GOLD;
    ctx.font = 'bold 19px sans-serif';
    ctx.fillText('★ ALL SHIP SKINS UNLOCKED ★', width / 2, 352);
  }
  // One dominant PLAY button, thumb zone, gently pulsing.
  const pulse = 0.85 + 0.15 * Math.sin(state.time * 3);
  ctx.save();
  ctx.globalAlpha = pulse;
  glow(ctx, GOLD, 22);
  ctx.fillStyle = GOLD;
  ctx.fillRect(PLAY_RECT.x, PLAY_RECT.y, PLAY_RECT.w, PLAY_RECT.h);
  noGlow(ctx);
  ctx.fillStyle = INK;
  ctx.font = 'bold 32px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('▶  PLAY', PLAY_RECT.x + PLAY_RECT.w / 2, PLAY_RECT.y + PLAY_RECT.h / 2 + 1);
  ctx.restore();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  if (best > 0) {
    ctx.fillStyle = GOLD;
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText(`BEST SCORE  ${best}`, width / 2, 522);
  }
  if (save && save.endlessUnlocked) {
    ctx.fillStyle = GREEN;
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText('∞  ENDLESS UNLOCKED — clear a stage, then keep drifting past it!', width / 2, 548);
  }
  // Stage progress: the campaign's next step, always visible.
  if (save) {
    const cleared = save.highestCleared ?? 0;
    ctx.fillStyle = '#a5f3fc';
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText(
      cleared > 0
        ? `STAGE ${cleared} CLEARED — next: STAGE ${Math.min(100, cleared + 1)}`
        : 'STAGE 1 awaits — clear 100 stages, defeat the bosses!',
      width / 2, 578,
    );
  }
  // Bottom tab bar (after the first run only — progressive disclosure:
  // a brand-new player sees nothing but PLAY).
  if (hasPlayed) {
    const tabs = [
      [HANGAR_TAB_RECT, 'HANGAR', CYAN],
      [SHOP_TAB_RECT, 'SHOP', GOLD],
      [PROFILE_TAB_RECT, 'PROFILE', '#c084fc'],
      [MISSIONS_TAB_RECT, 'MISSIONS', GOLD],
      [SCORES_TAB_RECT, 'SCORES', '#e2e8f0'],
    ];
    for (const [rect, label, color] of tabs) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
      ctx.fillStyle = color;
      ctx.font = 'bold 19px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, rect.x + rect.w / 2, rect.y + rect.h / 2 + 1);
      ctx.restore();
    }
  }
  // The streak line lives in the flame badge now; a fresh day's bonus is
  // claimed from the daily-reward panel, not announced in small print.
  void streakInfo;
}

// --- Panels: one centred card over the dimmed home screen. One tap on
// the X (or the backdrop, or Esc) closes back to Home — PLAY is never
// more than one tap away.
function drawPanelShell(ctx, width, height, title, color) {
  ctx.fillStyle = 'rgba(11, 16, 38, 0.62)';
  ctx.fillRect(0, 0, width, height);
  const card = PANEL_CARD;
  ctx.fillStyle = 'rgba(20, 27, 61, 0.97)';
  ctx.fillRect(card.x, card.y, card.w, card.h);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.strokeRect(card.x, card.y, card.w, card.h);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  glow(ctx, color, 16);
  ctx.fillStyle = color;
  ctx.font = 'bold 34px sans-serif';
  ctx.fillText(title, width / 2, card.y + 44);
  noGlow(ctx);
  // Close X, top-right of the card.
  ctx.save();
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 2;
  ctx.strokeRect(PANEL_CLOSE_RECT.x, PANEL_CLOSE_RECT.y, PANEL_CLOSE_RECT.w, PANEL_CLOSE_RECT.h);
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('✕', PANEL_CLOSE_RECT.x + PANEL_CLOSE_RECT.w / 2, PANEL_CLOSE_RECT.y + PANEL_CLOSE_RECT.h / 2 + 1);
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
}

function drawStats(ctx, save, width, height) {
  drawPanelShell(ctx, width, height, 'TOP SCORES', GOLD);
  ctx.textAlign = 'center';
  if (!save) {
    ctx.fillStyle = '#e2e8f0';
    ctx.font = '20px sans-serif';
    ctx.fillText('No runs recorded yet — go drift!', width / 2, 320);
    return;
  }
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 22px sans-serif';
  if (save.top5.length === 0) {
    ctx.fillText('No runs yet — your best runs will live here.', width / 2, 210);
  } else {
    save.top5.forEach((entry, i) => {
      ctx.fillStyle = i === 0 ? GOLD : '#e2e8f0';
      ctx.font = i === 0 ? 'bold 24px sans-serif' : '20px sans-serif';
      ctx.fillText(
        `#${i + 1}   ${entry.score}   —   LEVEL ${entry.level}   •   COMBO x${Math.max(1, entry.bestCombo)}${entry.endless ? '   ∞ ENDLESS' : ''}   •   ${entry.date}`,
        width / 2, 205 + i * 34,
      );
    });
  }
  // Lifetime stats.
  const mins = Math.floor(save.lifetime.playSeconds / 60);
  ctx.fillStyle = '#a5f3fc';
  ctx.font = '19px sans-serif';
  ctx.fillText(
    `RUNS ${save.lifetime.runs}   •   LIFETIME SHARDS ${save.lifetime.shards}   •   PLAY TIME ${mins}m   •   BEST ${save.best}`,
    width / 2, 408,
  );
  // 7-day streak calendar.
  const days = streakCalendar(save, localDate());
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 19px sans-serif';
  ctx.fillText(`🔥 ${save.streak.count}-DAY STREAK`, width / 2, 448);
  const boxW = 44;
  const gap = 10;
  const totalW = 7 * boxW + 6 * gap;
  let bx = (width - totalW) / 2;
  for (const day of days) {
    ctx.strokeStyle = day.isToday ? CYAN : 'rgba(148, 163, 184, 0.5)';
    ctx.lineWidth = day.isToday ? 3 : 2;
    ctx.strokeRect(bx, 468, boxW, boxW);
    if (day.visited) {
      ctx.fillStyle = GOLD;
      ctx.font = 'bold 22px sans-serif';
      ctx.fillText('✓', bx + boxW / 2, 490);
    }
    ctx.fillStyle = '#94a3b8';
    ctx.font = '12px sans-serif';
    ctx.fillText(day.date.slice(5), bx + boxW / 2, 532);
    bx += boxW + gap;
  }
  // Today's missions.
  ctx.fillStyle = '#a5f3fc';
  ctx.font = '19px sans-serif';
  save.missions.list.forEach((m, i) => {
    ctx.fillText(
      `${m.done ? '✓' : '○'} ${m.name} — ${m.progress}/${m.target}   (+${m.reward} shards)`,
      width / 2, 566 + i * 26,
    );
  });
}

function drawMissionsPanel(ctx, save, width, height) {
  drawPanelShell(ctx, width, height, 'DAILY MISSIONS', GOLD);
  if (!save) return;
  const rows = layoutMissionRows();
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  save.missions.list.forEach((m, i) => {
    const row = rows[i];
    if (!row) return;
    ctx.fillStyle = 'rgba(20, 27, 61, 0.96)';
    ctx.fillRect(row.x, row.y, row.w, row.h);
    ctx.strokeStyle = m.done ? GREEN : 'rgba(148, 163, 184, 0.45)';
    ctx.lineWidth = m.done ? 2 : 1.5;
    ctx.strokeRect(row.x, row.y, row.w, row.h);
    // Tier tag + name.
    ctx.fillStyle = m.tier === 'hard' ? MAGENTA : (m.tier === 'medium' ? GOLD : CYAN);
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText(m.tier.toUpperCase(), row.x + 16, row.y + 24);
    ctx.fillStyle = '#e2e8f0';
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText(`${m.done ? '✓ ' : '○ '}${m.name}`, row.x + 16, row.y + 52);
    // Progress bar.
    const barX = row.x + 16;
    const barW = 300;
    ctx.fillStyle = 'rgba(148, 163, 184, 0.4)';
    ctx.fillRect(barX, row.y + 66, barW, 10);
    ctx.fillStyle = m.done ? GREEN : GOLD;
    ctx.fillRect(barX, row.y + 66, barW * Math.min(1, m.progress / m.target), 10);
    ctx.fillStyle = '#e2e8f0';
    ctx.font = '16px sans-serif';
    ctx.fillText(`${m.progress}/${m.target}`, barX + barW + 12, row.y + 76);
    // Reward.
    ctx.fillStyle = GOLD;
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(`◆ +${m.reward}`, row.x + row.w - 84, row.y + 52);
    ctx.textAlign = 'left';
    // Reroll button (incomplete missions only, 1/day).
    const canReroll = !m.done && (save.missions.rerollsUsed ?? 0) < DAILY_REROLLS;
    const rb = row.reroll;
    ctx.fillStyle = canReroll ? 'rgba(34, 211, 238, 0.18)' : 'rgba(148, 163, 184, 0.10)';
    ctx.fillRect(rb.x, rb.y, rb.w, rb.h);
    ctx.strokeStyle = canReroll ? CYAN : 'rgba(148, 163, 184, 0.35)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(rb.x, rb.y, rb.w, rb.h);
    ctx.fillStyle = canReroll ? CYAN : '#64748b';
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('↻', rb.x + rb.w / 2, rb.y + rb.h / 2 + 1);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
  });
  // Complete-all-3 bonus.
  const allDone = save.missions.list.length === 3 && save.missions.list.every((m) => m.done);
  ctx.textAlign = 'center';
  ctx.fillStyle = allDone ? GREEN : '#a5f3fc';
  ctx.font = 'bold 19px sans-serif';
  ctx.fillText(
    allDone
      ? `★ ALL 3 DONE — +${ALL_MISSIONS_BONUS} shards bonus paid! ★`
      : `Complete all 3 for a +${ALL_MISSIONS_BONUS} shard bonus   •   ${(save.missions.rerollsUsed ?? 0) >= DAILY_REROLLS ? 'reroll used up for today' : '1 reroll left today (tap ↻)'}   •   resets daily`,
    width / 2, 552,
  );
}

  ctx.font = '19px sans-serif';

  ctx.fillText('◆  —  collect star shards', width / 2, 534);
  ctx.fillText('DASH  —  dodge mines (SPACE / DASH button)', width / 2, 564);
  ctx.fillStyle = '#94a3b8';
  ctx.font = '15px sans-serif';

function drawRewardPanel(ctx, save, width, height) {
  drawPanelShell(ctx, width, height, 'DAILY REWARD', GOLD);
  if (!save) return;
  const days = dailyRewardCalendar(save, localDate());
  const boxW = 84;
  const boxH = 110;
  const gap = 12;
  const totalW = 7 * boxW + 6 * gap;
  let bx = (width - totalW) / 2;
  const by = 220;
  ctx.textBaseline = 'alphabetic';
  for (const day of days) {
    ctx.fillStyle = day.current ? 'rgba(251, 191, 36, 0.16)' : 'rgba(20, 27, 61, 0.96)';
    ctx.fillRect(bx, by, boxW, boxH);
    ctx.strokeStyle = day.current ? GOLD : (day.done ? GREEN : 'rgba(148, 163, 184, 0.45)');
    ctx.lineWidth = day.current ? 3 : 1.5;
    ctx.strokeRect(bx, by, boxW, boxH);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#94a3b8';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText(`DAY ${day.day}`, bx + boxW / 2, by + 26);
    ctx.fillStyle = day.done ? GREEN : GOLD;
    ctx.font = 'bold 24px sans-serif';
    ctx.fillText(day.done ? '✓' : `◆ ${day.reward}`, bx + boxW / 2, by + 62);
    ctx.fillStyle = '#94a3b8';
    ctx.font = '13px sans-serif';
    ctx.fillText(day.current ? 'TODAY' : (day.done ? 'claimed' : (day.locked ? 'locked' : '')), bx + boxW / 2, by + 92);
    bx += boxW + gap;
  }
  // Claim button (or the claimed state).
  const claimable = save.dailyReward
    && save.dailyReward.pendingReward > 0
    && save.dailyReward.lastClaimDate !== localDate();
  const r = CLAIM_RECT;
  ctx.save();
  if (claimable) {
    glow(ctx, GOLD, 18);
    ctx.fillStyle = GOLD;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    noGlow(ctx);
    ctx.fillStyle = INK;
  } else {
    ctx.fillStyle = 'rgba(148, 163, 184, 0.25)';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = '#94a3b8';
  }
  ctx.font = 'bold 24px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(
    claimable ? `CLAIM  ◆ ${save.dailyReward.pendingReward}` : 'CLAIMED ✓',
    r.x + r.w / 2, r.y + r.h / 2 + 1,
  );
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#a5f3fc';
  ctx.font = '17px sans-serif';
  ctx.fillText(`🔥 ${save.streak.count}-day streak — day 7 pays ◆ 100, the best of the week.`, width / 2, 532);
  ctx.fillStyle = '#94a3b8';
  ctx.font = '15px sans-serif';
  ctx.fillText('Missed a day? Your streak survives once per week — the freeze is automatic.', width / 2, 560);
}

function drawHangar(ctx, save, width, height, skin = SKINS[0], state = null, extra = {}) {
  panel(ctx, width, height);
  bigTitle(ctx, 'HANGAR', 64, width, CYAN, 46);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#a5f3fc';
  ctx.font = '19px sans-serif';
  ctx.fillText('Your ship, upgraded part by part — every purchase stays forever.', width / 2, 96);
  // --- Skin strip: the ship selector moved here from the title, so its
  // name can never overlap an arrow again. The ship, its name and the
  // progress to the next skin each have their own row.
  const preview = {
    ship: { x: 150, y: 152, angle: -Math.PI / 2, vx: 0, vy: 0, invulnerable: 0 },
    time: state ? state.time : 0,
    shield: false,
  };
  drawShip(ctx, preview, skin, extra.shipShape ?? equippedShip(save)?.shape ?? 'skiff');
  for (const [rect, dir] of [[HANGAR_SKIN_LEFT, -1], [HANGAR_SKIN_RIGHT, 1]]) {
    ctx.save();
    ctx.strokeStyle = CYAN;
    ctx.lineWidth = 2;
    ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
    ctx.fillStyle = CYAN;
    ctx.beginPath();
    const cx = rect.x + rect.w / 2;
    const cy = rect.y + rect.h / 2;
    if (dir < 0) {
      ctx.moveTo(cx + 8, cy - 12);
      ctx.lineTo(cx - 8, cy);
      ctx.lineTo(cx + 8, cy + 12);
    } else {
      ctx.moveTo(cx - 8, cy - 12);
      ctx.lineTo(cx + 8, cy);
      ctx.lineTo(cx - 8, cy + 12);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 20px sans-serif';
  ctx.fillText(`SHIP  ${skin.name}`, 330, 152);
  const nextSkin = nextUnlock(save ? save.lifetime.shards : 0);
  if (nextSkin) {
    ctx.fillStyle = '#94a3b8';
    ctx.font = '16px sans-serif';
    ctx.fillText(`Next skin ${nextSkin.skin.name} — ${nextSkin.have} / ${nextSkin.need} shards`, 330, 196);
    const barW = 260;
    ctx.fillStyle = 'rgba(148, 163, 184, 0.4)';
    ctx.fillRect(200, 206, barW, 8);
    ctx.fillStyle = nextSkin.skin.glow;
    ctx.fillRect(200, 206, barW * Math.min(1, nextSkin.have / nextSkin.need), 8);
  } else {
    ctx.fillStyle = GOLD;
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText('All ship skins unlocked!', 330, 196);
  }
  // --- Profile summary (right of the skin strip).
  ctx.textAlign = 'left';
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 19px sans-serif';
  const balance = save ? (save.shardBalance ?? 0) : 0;
  const lifetime = save ? save.lifetime.shards : 0;
  ctx.fillText(
    `BEST ${save ? save.best : 0}   •   RUNS ${save ? save.lifetime.runs : 0}   •   LIFETIME SHARDS ${lifetime}   •   🔥 ${save ? save.streak.count : 0}-DAY STREAK`,
    500, 140,
  );
  ctx.fillStyle = GOLD;
  ctx.font = 'bold 21px sans-serif';
  ctx.fillText(`BALANCE  ${balance} shards — tap a part to buy it (keys 1–5 work too)`, 500, 172);
  // Equipped ship + level (from main's extra, else the save's ships),
  // plus the equipped weapon and the slotted chips — the whole loadout
  // on one line, so the hangar shows what the ship fights with.
  const shipInfo = extra.ship ?? null;
  const shipDef = equippedShip(save);
  const shipLevelNow = shipInfo?.level ?? Math.max(1, shipLevel(save, shipDef.id));
  const shipName = shipInfo?.name ?? shipDef.name;
  const loadout = extra.loadout ?? null;
  const weaponName = loadout?.weapon?.name ?? 'BLASTER';
  const weaponLevelNow = loadout?.weapon?.level
    ?? (save?.weapons?.owned?.[save?.weapons?.equipped ?? 'blaster']?.level ?? 1);
  const chipNames = loadout?.chips
    ?? (save?.chips?.slots ?? []).filter(Boolean).map((id) => chipById(id)?.name ?? String(id).toUpperCase());
  ctx.fillStyle = CYAN;
  ctx.font = 'bold 19px sans-serif';
  ctx.fillText(
    `SHIP ${shipName}  Lv ${shipLevelNow}  •  ${weaponName} Lv ${weaponLevelNow}  •  CHIPS: ${chipNames.length ? chipNames.join(', ') : '—'}`,
    500, 204,
  );
  // One row per part: name, effect, level pips, buy button.
  for (const row of layoutHangarParts()) {
    const level = save ? hangarLevel(save, row.part.id) : 0;
    const cost = hangarNextCost(row.part, level);
    const affordable = cost !== null && balance >= cost;
    ctx.save();
    ctx.fillStyle = 'rgba(20, 27, 61, 0.96)';
    ctx.fillRect(row.x, row.y, row.w, row.h);
    ctx.strokeStyle = affordable ? GOLD : 'rgba(148, 163, 184, 0.45)';
    ctx.lineWidth = affordable ? 2 : 1.5;
    ctx.strokeRect(row.x, row.y, row.w, row.h);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = CYAN;
    ctx.font = 'bold 21px sans-serif';
    ctx.fillText(row.part.name, row.x + 16, row.y + 28);
    ctx.fillStyle = '#e2e8f0';
    ctx.font = '16px sans-serif';
    const descLines = wrapText(ctx, row.part.desc, 600);
    descLines.slice(0, 1).forEach((line, li) => {
      ctx.fillText(line, row.x + 16, row.y + 50 + li * 20);
    });
    // Level pips, ending just left of the buy button.
    const pipGap = 26;
    const totalW = (row.part.max - 1) * pipGap;
    const pipEndX = row.buy.x - 24;
    const pipStartX = pipEndX - totalW;
    for (let p = 0; p < row.part.max; p += 1) {
      ctx.beginPath();
      ctx.arc(pipStartX + p * pipGap, row.y + row.h / 2, 8, 0, Math.PI * 2);
      ctx.fillStyle = p < level ? GOLD : 'rgba(148, 163, 184, 0.35)';
      ctx.fill();
    }
    // Buy button: gold when affordable, grey when maxed or too expensive.
    const b = row.buy;
    if (cost === null) {
      ctx.fillStyle = 'rgba(148, 163, 184, 0.25)';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = '#94a3b8';
    } else if (affordable) {
      ctx.fillStyle = GOLD;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = INK;
    } else {
      ctx.fillStyle = 'rgba(148, 163, 184, 0.18)';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = '#94a3b8';
    }
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(
      cost === null ? 'MAXED' : (affordable ? `BUY ${cost}` : `NEED ${cost}`),
      b.x + b.w / 2, b.y + b.h / 2 + 1,
    );
    ctx.restore();
  }
  // Back button, bottom centre.
  drawButton(ctx, HANGAR_BACK_RECT, '◀  BACK  [H]');
}

// An outlined button with a centred label (pause menu, game-over exits,
// hangar back). One style, so every exit looks the same.
function drawButton(ctx, rect, label) {
  ctx.save();
  ctx.strokeStyle = CYAN;
  ctx.lineWidth = 2;
  ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
  ctx.fillStyle = CYAN;
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, rect.x + rect.w / 2, rect.y + rect.h / 2 + 1);
  ctx.restore();
}

function drawPlayAgain(ctx) {
  const r = PLAY_AGAIN_RECT;
  ctx.save();
  ctx.fillStyle = GOLD;
  ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.fillStyle = INK;
  ctx.font = 'bold 24px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('▶  PLAY AGAIN', r.x + r.w / 2, r.y + r.h / 2 + 1);
  ctx.restore();
  // No "or press R" line here: the button below (HANGAR / CONTINUE —
  // ENDLESS) starts 20 px under it, and the key hints live on the
  // screens' own hint line instead.
}

function drawUpgrade(ctx, state, offers, width, height, age = 0) {
  // The frozen play field stays visible underneath.
  panel(ctx, width, height);
  // Level-up celebration: a gold flash that fades over the first 0.25 s,
  // while the cards slide up into place.
  const p = Math.min(1, age / 0.25);
  const ease = 1 - (1 - p) * (1 - p);
  if (p < 1) {
    ctx.fillStyle = `rgba(251, 191, 36, ${(1 - p) * 0.18})`;
    ctx.fillRect(0, 0, width, height);
  }
  bigTitle(ctx, 'LEVEL UP!', 165, width, GOLD, 56);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e2e8f0';
  ctx.font = '20px sans-serif';
  ctx.fillText(`Level ${state.level} reached — choose one upgrade.`, width / 2, 212);
  const cards = layoutUpgradeCards(offers);
  for (let i = 0; i < cards.length; i += 1) {
    const card = cards[i];
    const up = card.upgrade;
    const count = (state.upgrades && state.upgrades[up.id]) || 0;
    ctx.save();
    ctx.globalAlpha = 0.25 + 0.75 * ease;
    ctx.translate(0, (1 - ease) * 40);
    ctx.fillStyle = 'rgba(20, 27, 61, 0.96)';
    ctx.fillRect(card.x, card.y, card.w, card.h);
    // A MERGE card is unmistakable: a gold border, a MERGE tag, and
    // the two components it evolves from.
    ctx.strokeStyle = up.isMerge ? GOLD : CYAN;
    ctx.lineWidth = up.isMerge ? 3 : 2;
    ctx.strokeRect(card.x, card.y, card.w, card.h);
    if (up.isMerge) {
      ctx.fillStyle = GOLD;
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('◆ MERGE ◆', card.x + card.w - 16, card.y + 32);
      ctx.textAlign = 'center';
    }
    // Key badge: press 1, 2 or 3 — or tap the card.
    ctx.save();
    ctx.translate(card.x + 28, card.y + 30);
    glow(ctx, GOLD, 10);
    ctx.fillStyle = GOLD;
    ctx.beginPath();
    ctx.arc(0, 0, 16, 0, Math.PI * 2);
    ctx.fill();
    noGlow(ctx);
    ctx.fillStyle = INK;
    ctx.font = 'bold 19px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(i + 1), 0, 1);
    ctx.restore();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = up.isMerge ? GOLD : CYAN;
    ctx.font = 'bold 26px sans-serif';
    ctx.fillText(up.name, card.x + card.w / 2, card.y + 84);
    if (up.isMerge) {
      const compNames = (up.components || []).map((id) => upgradeById(id)?.name ?? id);
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText(`${compNames.join('  +  ')}  →`, card.x + card.w / 2, card.y + 108);
    }
    ctx.fillStyle = '#e2e8f0';
    ctx.font = '17px sans-serif';
    const lines = wrapText(ctx, up.desc, card.w - 36);
    lines.forEach((line, li) => {
      ctx.fillText(line, card.x + card.w / 2, card.y + 122 + li * 24);
    });
    // Current level: pips for capped upgrades, a count for AEGIS.
    // A merge is a one-time evolution, not a stack.
    ctx.font = 'bold 16px sans-serif';
    if (up.isMerge) {
      ctx.fillStyle = GOLD;
      ctx.fillText('ONE-TIME EVOLUTION', card.x + card.w / 2, card.y + 200);
    } else if (Number.isFinite(up.max)) {
      const pipGap = 26;
      const totalW = (up.max - 1) * pipGap;
      const startX = card.x + card.w / 2 - totalW / 2;
      for (let p = 0; p < up.max; p += 1) {
        ctx.beginPath();
        ctx.arc(startX + p * pipGap, card.y + 188, 8, 0, Math.PI * 2);
        ctx.fillStyle = p < count ? GOLD : 'rgba(148, 163, 184, 0.35)';
        ctx.fill();
      }
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(`LEVEL ${count} / ${up.max}`, card.x + card.w / 2, card.y + 214);
    } else {
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(`Picked ${count}× so far`, card.x + card.w / 2, card.y + 200);
    }
    ctx.restore();
  }
  ctx.fillStyle = '#a5f3fc';
  ctx.font = '19px sans-serif';
  ctx.fillText('Press 1, 2 or 3 — or tap a card.', width / 2, 540);
}

function drawPaused(ctx, width, height) {
  panel(ctx, width, height);
  bigTitle(ctx, 'PAUSED', 280, width, CYAN, 56);
  ctx.textAlign = 'center';

  ctx.font = '19px sans-serif';
  ctx.fillText('DRAG steer  •  ◆ collect shards  •  DASH dodge mines', width / 2, 330);
  // Pause is an exit, not a trap: resume, restart, hangar, or menu —
  // including during endless, where the run can be left at any time.

  drawButton(ctx, PAUSE_RESTART_RECT, 'RESTART  [R]');
  drawButton(ctx, PAUSE_HANGAR_RECT, 'HANGAR  [H]');
  // No key hint on MENU: M is the global mute toggle.
  drawButton(ctx, PAUSE_MENU_RECT, 'MENU');
}

function drawOver(ctx, state, best, width, height, summary = null, extra = {}) {
  panel(ctx, width, height);
  bigTitle(ctx, 'THE STORM TOOK YOU', 200, width, MAGENTA, 54);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 26px sans-serif';
  ctx.fillText(`SCORE  ${state.score}    •    LEVEL ${state.level}    •    BEST COMBO  x${Math.max(1, state.bestCombo)}`, width / 2, 268);
  let y = 296;
  if (summary && summary.endless) {
    ctx.fillStyle = GREEN;
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText('∞  ENDLESS RUN — you drifted past the Aurora Gate!', width / 2, y);
    y += 28;
  }
  if (state.score >= best && state.score > 0) {
    ctx.fillStyle = GOLD;
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText('★ NEW BEST SCORE ★', width / 2, y);
    y += 28;
  }
  if (summary && summary.rank > 0) {
    ctx.fillStyle = GOLD;
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText(
      summary.rank === 1
        ? '#1 ON TOP SCORES — a new top score!'
        : `#${summary.rank} ON TOP SCORES — just ${summary.gapToFirst} points from #1!`,
      width / 2, y,
    );
    y += 28;
  }
  // Near-miss line (Zeigarnik): how close the stage target was. Only
  // when the player died within 100 points of clearing the stage.
  const stageTarget = state.stageTarget;
  const stage = state.stage ?? 1;
  if (!state.endless && typeof stageTarget === 'number' && stageTarget > 0
    && state.score < stageTarget && stageTarget - state.score <= 100) {
    ctx.fillStyle = '#a5f3fc';
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText(`You died at ${state.score} — just ${stageTarget - state.score} more to clear stage ${stage}!`, width / 2, y);
    y += 28;
  }
  // Missions, one compact line instead of one line per mission.
  if (summary && summary.completed.length) {
    const total = summary.completed.reduce((n, m) => n + m.reward, 0);
    ctx.fillStyle = '#34d399';
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText(`✓ MISSIONS +${total} shards`, width / 2, y);
    y += 28;
  }
  // Newly unlocked achievements (the coins are claimed from the
  // profile screen — never auto-paid). At most two lines; the second
  // folds any further unlocks into a "+N more".
  const unlocked = summary?.achievements ?? [];
  if (unlocked.length) {
    ctx.fillStyle = '#c084fc';
    ctx.font = 'bold 20px sans-serif';
    const first = unlocked[0];
    ctx.fillText(`🏆 ACHIEVEMENT: ${first.name} +${first.reward} 🪙`, width / 2, y);
    y += 28;
    if (unlocked.length > 1) {
      const second = unlocked[1];
      const more = unlocked.length > 2 ? `  (+${unlocked.length - 2} more)` : '';
      ctx.fillText(`🏆 ACHIEVEMENT: ${second.name} +${second.reward} 🪙${more}`, width / 2, y);
      y += 28;
    }
  }
  // The visible next goal: in a campaign run it is the stage itself —
  // a boss stage names the boss. In endless (or with no stage yet) it
  // falls back to the next skin, else the best score.
  const save = extra.save ?? null;
  const next = nextUnlock(save ? save.lifetime.shards : 0);
  ctx.fillStyle = '#a5f3fc';
  ctx.font = 'bold 20px sans-serif';
  if (!state.endless && (isBossStage(stage) || isMidbossStage(stage))) {
    const boss = bossFor(stage) ?? state.boss;
    ctx.fillText(`NEXT GOAL: defeat the ${boss ? boss.name : 'BOSS'}`, width / 2, y);
  } else if (!state.endless && stage >= 1) {
    ctx.fillText(`NEXT GOAL: clear STAGE ${stage}`, width / 2, y);
  } else if (next) {
    ctx.fillText(`NEXT GOAL: ${next.skin.name} skin — ${next.have} / ${next.need} ◆`, width / 2, y);
  } else {
    ctx.fillText(`NEXT GOAL: beat your best ${best}`, width / 2, y);
  }
  drawPlayAgain(ctx);
  // The endless trap fix: from a death screen the player can go straight
  // to the hangar to spend the shards they just earned.
  drawButton(ctx, OVER_HANGAR_RECT, 'HANGAR  [H]');
  ctx.fillStyle = '#94a3b8';
  ctx.font = '17px sans-serif';
  ctx.fillText('R retry  •  H hangar  •  Esc menu', width / 2, 672);
}

function drawClear(ctx, state, best, width, height, summary = null, extra = {}) {
  panel(ctx, width, height);
  drawGate(ctx, state, width, height);
  const stage = summary?.stage ?? state.stage ?? 1;
  const coins = summary?.coins ?? 0;
  const firstClear = summary?.firstClear ?? false;
  bigTitle(ctx, `STAGE ${stage} CLEAR!`, 140, width, GREEN, 56);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fef9c3';
  ctx.font = 'bold 26px sans-serif';
  ctx.fillText(`You cleared stage ${stage} — the storm bows to you.`, width / 2, 196);
  ctx.fillStyle = GOLD;
  ctx.font = 'bold 24px sans-serif';
  ctx.fillText(
    `+${coins} COINS${firstClear ? '  •  FIRST CLEAR!' : '  •  replay reward'}`,
    width / 2, 236,
  );
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText(
    stage >= 100
      ? 'ALL 100 STAGES CLEAR — YOU ARE THE STORM!'
      : `STAGE ${stage + 1} UNLOCKED!`,
    width / 2, 272,
  );
  let y = 296;
  if (summary && summary.rank > 0) {
    ctx.fillStyle = GOLD;
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText(
      summary.rank === 1
        ? '#1 ON TOP SCORES — a new top score!'
        : `#${summary.rank} ON TOP SCORES — just ${summary.gapToFirst} points from #1!`,
      width / 2, y,
    );
    y += 26;
  }
  if (summary && summary.completed.length) {
    const total = summary.completed.reduce((n, m) => n + m.reward, 0);
    ctx.fillStyle = '#34d399';
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText(`✓ MISSIONS +${total} shards`, width / 2, y);
    y += 26;
  }
  // Newly unlocked achievements (coins claimed from the profile —
  // never auto-paid) and the boss chip drop, if any.
  const unlocked = summary?.achievements ?? [];
  if (unlocked.length) {
    ctx.fillStyle = '#c084fc';
    ctx.font = 'bold 20px sans-serif';
    const first = unlocked[0];
    ctx.fillText(`🏆 ACHIEVEMENT: ${first.name} +${first.reward} 🪙`, width / 2, y);
    y += 26;
    if (unlocked.length > 1) {
      const second = unlocked[1];
      const more = unlocked.length > 2 ? `  (+${unlocked.length - 2} more)` : '';
      ctx.fillText(`🏆 ACHIEVEMENT: ${second.name} +${second.reward} 🪙${more}`, width / 2, y);
      y += 26;
    }
  }
  if (summary && summary.bossDrop) {
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText(`🎁 BOSS DROP: ${summary.bossDrop}`, width / 2, y);
    y += 26;
  }
  // NEXT is the gold primary (only while a next stage exists); REPLAY,
  // STAGES and HANGAR are the outlined exits. CONTINUE — ENDLESS shows
  // only once endless is unlocked.
  if (stage < 100) {
    const r = CLEAR_NEXT_RECT;
    ctx.save();
    ctx.fillStyle = GOLD;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = INK;
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`▶  NEXT — STAGE ${stage + 1}`, r.x + r.w / 2, r.y + r.h / 2 + 1);
    ctx.restore();
  }
  ctx.textBaseline = 'alphabetic';
  drawButton(ctx, CLEAR_REPLAY_RECT, '↻  REPLAY  [R]');
  drawButton(ctx, CLEAR_STAGES_RECT, 'STAGES');
  drawButton(ctx, CLEAR_HANGAR_RECT, 'HANGAR  [H]');
  const save = extra.save ?? null;
  if (save && save.endlessUnlocked) {
    const r = CLEAR_ENDLESS_RECT;
    ctx.save();
    ctx.fillStyle = GREEN;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = INK;
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('▶  CONTINUE — ENDLESS', r.x + r.w / 2, r.y + r.h / 2 + 1);
    ctx.restore();
    ctx.textBaseline = 'alphabetic';
  }
  ctx.fillStyle = '#94a3b8';
  ctx.font = '17px sans-serif';
  ctx.fillText('N next  •  R replay  •  H hangar  •  E endless', width / 2, 692);
}
