<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lumen Drift — a neon arcade game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1026; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* On-screen touch buttons: hidden on desktop, shown on touch devices. */
  .touch-btn {
    display: none;
    position: fixed;
    z-index: 10;
    border: 2px solid rgba(34, 211, 238, 0.8);
    background: rgba(11, 16, 38, 0.55);
    color: #a5f3fc;
    font: bold 16px sans-serif;
    border-radius: 999px;
    touch-action: none;
    cursor: pointer;
  }
  .touch-btn:active { background: rgba(34, 211, 238, 0.35); }
  #btn-dash {
    right: max(18px, env(safe-area-inset-right));
    bottom: max(18px, env(safe-area-inset-bottom));
    width: 84px; height: 84px;
    font-size: 17px;
    letter-spacing: 1px;
  }
  #btn-pause {
    right: max(18px, env(safe-area-inset-right));
    top: max(14px, env(safe-area-inset-top));
    width: 48px; height: 48px;
    font-size: 18px;
  }
  #btn-fullscreen {
    right: max(78px, calc(env(safe-area-inset-right) + 60px));
    top: max(14px, env(safe-area-inset-top));
    width: 48px; height: 48px;
    font-size: 18px;
  }
  #btn-fullscreen.on { background: rgba(34, 211, 238, 0.35); }
  /* Nudge portrait phone players toward landscape, where the field is big. */
  #rotate-hint {
    display: none;
    position: fixed;
    left: 50%;
    top: max(10px, env(safe-area-inset-top));
    transform: translateX(-50%);
    z-index: 10;
    color: #fbbf24;
    font: bold 14px sans-serif;
    background: rgba(11, 16, 38, 0.75);
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid rgba(251, 191, 36, 0.6);
    pointer-events: none;
    white-space: nowrap;
  }
  @media (pointer: coarse) {
    .touch-btn { display: block; }
  }
  @media (pointer: coarse) and (orientation: portrait) {
    #rotate-hint { display: block; }
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Lumen Drift: steer the light-skiff, collect star shards, dodge void mines and storm shards, clear 100 stages and defeat the bosses. Buy weapons and chips in the shop, check your pilot level, loadout and achievements on the profile screen."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="rotate-hint">📱 Rotate to landscape — the field is much bigger sideways!</div>
<button id="btn-dash" class="touch-btn" type="button" aria-label="Dash">DASH</button>
<button id="btn-pause" class="touch-btn" type="button" aria-label="Pause">❚❚</button>
<button id="btn-fullscreen" class="touch-btn" type="button" aria-label="Fullscreen">⛶</button>
<!-- On-device diagnostics: a classic (non-module) script, so it runs even
     if the game module fails to load. It records boot progress and any
     uncaught error into this hidden overlay, which only becomes visible
     when an error occurs — on a phone there is no console to read, so the
     error must show itself on the page. -->
<div id="err-overlay" style="display:none;position:fixed;left:8px;top:8px;right:8px;z-index:99;max-height:60vh;overflow:auto;background:rgba(0,0,0,0.85);color:#fca5a5;font:12px/1.5 monospace;white-space:pre-wrap;padding:10px;border:1px solid #ef4444;border-radius:8px;"></div>
<script>
(function () {
  var box = document.getElementById('err-overlay');
  function show() { if (box) box.style.display = 'block'; }
  function line(text) {
    if (!box) return;
    box.textContent += text + '\n';
  }
  window.__diag = function (msg) { line('[boot] ' + msg); };
  window.__diagError = function (text) { show(); line('[error] ' + text); };
  window.onerror = function (msg, src, lineno, colno, err) {
    show();
    line('[error] ' + msg + ' @ ' + (src || '?') + ':' + (lineno || '?') + ':' + (colno || '?'));
    if (err && err.stack) line(String(err.stack).split('\n').slice(0, 5).join('\n'));
    return false;
  };
  window.addEventListener('unhandledrejection', function (e) {
    show();
    line('[error] unhandled rejection: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
  });
})();
</script>
<script type="module">
// ---- src/config.js ----
// Lumen Drift — tuning constants. One place holds every number that shapes
// how the game feels, so balancing is editing values here, never hunting
// through the world or the renderer.
const FIELD = { width: 1280, height: 720 };

// Fixed simulation step: the world advances in 1/60 s slices.
const STEP = 1 / 60;

const HEARTS = 3;

// Star shards: base points, and the combo ladder (consecutive pickups with
// no hit multiply the base; every 3 pickups steps the combo up one rung).
// Combo caps at x5. Base 6 (was 10): the old 10 made stage 1 clear in
// ~8 s for the autopilot — far under Petta's 30–60 s for an early stage.
// At 6, a max-combo shard is 30 and a golden shard is 30 (see world.js).
const SHARD_POINTS = 6;
const COMBO_MAX = 5;

// The skiff: how fast it flies, how hard the dash kicks, how long the dash
// lasts and how long the player waits before dashing again.
const SHIP = {
  radius: 16,
  accel: 2600,
  maxSpeed: 420,
  drag: 2.6,
  dashSpeed: 950,
  dashTime: 0.16,
  dashCooldown: 1.4,
  // Mercy: 1.5 s of flashing invulnerability after every hit.
  invulnerableTime: 1.5,
};

// Grace after resuming from a level-up choice (seconds of invulnerability
// while the player re-orients on the busiest frame of the run).
const UPGRADE_GRACE = 2;

// Difficulty ramps one level every 200 points, uncapped, in both stage
// and endless modes. LEVEL_MAX only clamps the early storm gate.
const LEVEL_EVERY = 200;
const LEVEL_MAX = 5;

// Spawn pacing, in seconds between spawns at level 1; each level multiplies
// the rate by SPAWN_GROWTH, so the field gets busier as the score climbs —
// but more slowly than before (0.88, not 0.82), and never past the caps.
// Shards every 0.85 s (was 0.55): the old rate carpeted the field, so
// the magnet vacuumed a stage clear in seconds.
const SPAWN = {
  shardEvery: 0.85,
  mineEvery: 1.5,
  stormEvery: 2.4,
  shieldEvery: 14,
  growth: 0.88,
};

// Max concurrent threats per level (index = level - 1). The field can no
// longer saturate: level 1 holds at most 8 mines + 2 storms.
const SPAWN_CAPS = {
  mine: [8, 10, 12, 14, 16],
  storm: [2, 2, 3, 3, 4],
};

// Storms are gated early: at level 1 they spawn 3x slower, at level 2
// 1.5x slower (index = level - 1) — almost no storms before level 2-3.
const STORM_GATE = [3, 1.5, 1, 1, 1];

// Nothing spawns within this many field units of the ship.
const SAFE_SPAWN_RADIUS = 150;

// Silent dynamic difficulty (never shown to the player): two hits within
// this window spawn a mercy shield cell, at most once per cooldown.
const DDA_HIT_WINDOW = 10;
const DDA_MERCY_COOLDOWN = 20;

// Drift speeds (pixels per second) at level 1; each level adds SPEED_GROWTH.
const DRIFT = {
  mine: 55,
  storm: 190,
  shard: 40,
  speedGrowth: 0.12,
};

// Endless mode (after the Aurora Gate opens): difficulty keeps scaling
// past level 5, gently — one extra mine cap per level up to 22, one extra
// storm cap every two levels up to 6, spawn rates stop quickening past
// level 9, drift speed caps at 2x. The run ends only when the ship dies.
const ENDLESS_MINE_CAP_MAX = 22;
const ENDLESS_STORM_CAP_MAX = 6;
const ENDLESS_RATE_LEVEL_MAX = 9;
const ENDLESS_SPEED_MAX = 2.0;

// Shard magnet tuning (see upgrades.js): the innate pull radius is ~1.5x
// the ship's width, so the magnet forgives a near-miss on aim instead of
// vacuuming the field. Pull accelerates toward the ship and tops out
// faster than the ship itself, so a shard streaks in on a short arc.
const MAGNET_BASE_RADIUS = 48;
const MAGNET_PULL_ACCEL = 1400;
const MAGNET_PULL_MAX_SPEED = 560;

// Best score is kept in local storage under this key.
const BEST_KEY = 'lumen-drift-best';
// Lifetime star shards (all runs) and the chosen ship skin.
const SHARDS_KEY = 'lumen-drift-shards';
const SKIN_KEY = 'lumen-drift-skin';

// ---- src/random.js ----
// Lumen Drift — a small seeded random generator (mulberry32). The game uses
// it for every spawn, drift angle and star placement, so `?seed=N` replays
// the exact same storm and every screenshot is reproducible. A seed of 0
// is replaced with a fixed fallback so the generator never sits at zero.
function createRandom(seed) {
  let state = (seed >>> 0) || 0x9e3779b9;
  function next() {
    state = (state + 0x6d2b79f5) >>> 0;
    let t = state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  return {
    // A float in [0, 1).
    next,
    // A float in [min, max).
    range(min, max) {
      return min + (max - min) * next();
    },
    // An integer in [min, max] inclusive.
    int(min, max) {
      return min + Math.floor(next() * (max - min + 1));
    },
    // One element of an array, picked at random.
    pick(list) {
      return list[Math.floor(next() * list.length)];
    },
  };
}

// ---- src/upgrades.js ----
// Lumen Drift — in-run upgrades and ship skins.
//
// Upgrades are picked 1-of-3 on every level-up (levels 2-5, so four picks
// per run). Each upgrade is a plain definition: id, English name, one-line
// description, max stacks, an `available(state)` gate and an `apply(state)`
// that mutates the world state. Nothing here touches the DOM or storage,
// so the whole pool is unit-testable from a bare world state.
//
// Derived numbers (dash cooldown/speed, max speed, shard points, magnet
// radius) are computed from the stack counts, with the config constants
// as bases — the world re-derives them every step, so the stored fields
// can never go stale.

const UPGRADE_HEART = 'heart';
const UPGRADE_SWIFT = 'swift';
const UPGRADE_LONG = 'long';
const UPGRADE_MAGNET = 'magnet';
const UPGRADE_AEGIS = 'aegis';
const UPGRADE_GOLDEN = 'golden';

// Hull hearts cap at 5 total (start at 3, so at most 2 heart picks).
const MAX_HEARTS = 5;
// Dash cooldown never drops below this, however many SWIFT DASH stacks.
const DASH_COOLDOWN_FLOOR = 0.6;
// Magnet pull radius per stack (index = stacks held). The innate radius
// (0 stacks) is MAGNET_BASE_RADIUS: ~1.5x the ship's width, so the magnet
// forgives a near-miss on aim. Each stack adds ~+30-35% — the Vampire
// Survivors-proven +25%/rank step, rounded so the radius stays a whole
// number of field units. A maxed magnet (3 stacks) reaches 144 px: a
// visible help, never a vacuum. Compare the old values (160/240/320),
// which pulled shards in from across the screen.
const MAGNET_RADII = [48, 80, 112, 144];
// Extra points per shard, per GOLDEN SHARDS stack.
const GOLDEN_POINTS = 5;

const UPGRADES = [
  {
    id: UPGRADE_HEART,
    name: 'HULL HEART',
    desc: '+1 hull heart (max 5).',
    max: 2,
    available: (state) => state.maxHearts < MAX_HEARTS + (state.hangar?.hull ?? 0),
    apply: (state) => {
      state.maxHearts += 1;
      state.hearts = Math.min(state.maxHearts, state.hearts + 1);
    },
  },
  {
    id: UPGRADE_SWIFT,
    name: 'SWIFT DASH',
    desc: 'Dash recharges 25% faster.',
    max: 3,
    available: (state) => (state.upgrades.swift || 0) < 3,
    apply: () => {},
  },
  {
    id: UPGRADE_LONG,
    name: 'LONG DASH',
    desc: '+12% dash and top speed.',
    max: 3,
    available: (state) => (state.upgrades.long || 0) < 3,
    apply: () => {},
  },
  {
    id: UPGRADE_MAGNET,
    name: 'SHARD MAGNET',
    desc: 'Pulls nearby shards to you.',
    max: 3,
    available: (state) => (state.upgrades.magnet || 0) < 3,
    apply: (state) => {
      state.magnetRadius = MAGNET_RADII[state.upgrades.magnet || 0];
    },
  },
  {
    id: UPGRADE_AEGIS,
    name: 'AEGIS SHIELD',
    desc: 'Gain a shield — blocks one hit.',
    // No stack cap: it can be picked again once the shield is spent.
    // The gate below (no shield held) is what limits it.
    max: Infinity,
    available: (state) => !state.shield,
    apply: (state) => {
      state.shield = true;
      // An Aegis shield supersedes a ward shield (the ward timer
      // keeps ticking, but its expiry must not clear this shield).
      state.wardShield = false;
    },
  },
  {
    id: UPGRADE_GOLDEN,
    name: 'GOLDEN SHARDS',
    desc: '+5 points per star shard.',
    max: 2,
    available: (state) => (state.upgrades.golden || 0) < 2,
    apply: (state) => {
      state.shardBonus = GOLDEN_POINTS * (state.upgrades.golden || 0);
    },
  },
];

function upgradeById(id) {
  return UPGRADES.find((u) => u.id === id) || null;
}

function stacksOf(state, id) {
  return (state.upgrades && state.upgrades[id]) || 0;
}

// --- Derived numbers (config constants as bases) -------------------------

function effectiveDashCooldown(state) {
  // Swift Recovery chip: dash cooldown × its multiplier (0.8 = −20%).
  // Phantom Dash merge: a further −30%.
  return Math.max(
    DASH_COOLDOWN_FLOOR,
    SHIP.dashCooldown * Math.pow(0.75, stacksOf(state, UPGRADE_SWIFT))
    * (state.chipEffects?.dashCooldownMult ?? 1)
    * (state.merged?.['phantom-dash'] ? 0.7 : 1),
  );
}

function effectiveDashSpeed(state) {
  return SHIP.dashSpeed * (1 + 0.12 * stacksOf(state, UPGRADE_LONG))
    * (1 + 0.08 * (state.hangar?.engine ?? 0))
    * (state.shipStats?.speedMult ?? 1)
    // Phantom Dash merge: dash distance +40% (via dash speed).
    * (state.merged?.['phantom-dash'] ? 1.4 : 1);
}

function effectiveMaxSpeed(state) {
  return SHIP.maxSpeed * (1 + 0.12 * stacksOf(state, UPGRADE_LONG))
    * (1 + 0.08 * (state.hangar?.engine ?? 0))
    * (state.shipStats?.speedMult ?? 1);
}

/** Base points one shard is worth, before the combo multiplier. */
function shardPointsFor(state) {
  return SHARD_POINTS
    + GOLDEN_POINTS * stacksOf(state, UPGRADE_GOLDEN)
    + 2 * (state.hangar?.collector ?? 0)
    // Golden Touch chip: +N points per shard.
    + (state.chipEffects?.shardBonus ?? 0)
    // Midas Field merge: shards worth +2 each (replaces GOLDEN SHARDS).
    + (state.merged?.['midas-field'] ? 2 : 0);
}

function magnetRadiusFor(state) {
  // Midas Field merge: magnet radius +50 (replaces SHARD MAGNET).
  return (MAGNET_RADII[stacksOf(state, UPGRADE_MAGNET)] || 0)
    + (state.merged?.['midas-field'] ? 50 : 0);
}

// --- Merges (Stage 2, Spekter "merge skill cards" model) ------------------
//
// In-run upgrade cards can evolve: when a level-up offers its picks
// and two components are already owned, one pick card is replaced by
// a MERGE card. Picking it grants the merged effect and retires the
// two components — their stacks stop counting (set to 0) and they are
// never offered again while the merge is owned. Exactly three merges
// exist; their components are disjoint, so one merge never blocks
// another. This is what keeps picks meaningful past the caps in
// endless runs (the "boring after 5 minutes" complaint).
const MERGES = [
  {
    id: 'midas-field', name: 'MIDAS FIELD', kind: 'merge', isMerge: true,
    components: ['magnet', 'golden'],
    desc: 'Shards are worth +2 pts each and the magnet radius grows +50.',
  },
  {
    id: 'fortress-hull', name: 'FORTRESS HULL', kind: 'merge', isMerge: true,
    components: ['heart', 'aegis'],
    desc: '+1 max heart and a shield, right now.',
  },
  {
    id: 'phantom-dash', name: 'PHANTOM DASH', kind: 'merge', isMerge: true,
    components: ['swift', 'long'],
    desc: 'Dash cooldown −30% and dash distance +40%.',
  },
];

function mergeById(id) {
  return MERGES.find((m) => m.id === id) || null;
}

/**
 * Merges whose prerequisites are met and that are not yet owned.
 * `upgrades` is the stacks object ({ magnet: 1, ... }); `merged` the
 * owned-merges object ({ 'midas-field': true }). A merge needs both
 * components owned (stacks > 0).
 */
function availableMerges(upgrades, merged = {}) {
  const counts = upgrades || {};
  const owned = merged || {};
  return MERGES.filter((m) => !owned[m.id]
    && m.components.every((c) => (counts[c] || 0) > 0));
}

/** True when upgrade `id` is retired by an owned merge. */
function isUpgradeRetired(state, id) {
  const merged = state.merged || {};
  return MERGES.some((m) => merged[m.id] && m.components.includes(id));
}

/**
 * Apply a merge to the world state. Returns false when the merge is
 * unknown, already owned, or its components are not both owned.
 * Components retire (stacks zeroed — the merged effect replaces
 * them); Fortress Hull also grants its heart + shield immediately.
 */
function applyMerge(state, mergeId) {
  const def = mergeById(mergeId);
  if (!def) return false;
  if (!state.upgrades) state.upgrades = {};
  if (!state.merged) state.merged = {};
  if (state.merged[mergeId]) return false;
  if (!def.components.every((c) => (state.upgrades[c] || 0) > 0)) return false;
  for (const c of def.components) state.upgrades[c] = 0;
  state.merged[mergeId] = true;
  if (mergeId === 'fortress-hull') {
    // +1 max heart (and heal 1 now), plus a shield. "Start each stage
    // with a shield" is realised as the shield now: merges are per-run
    // picks, so the next stage starts fresh like every other in-run
    // upgrade — the shield is the pick's immediate value.
    state.maxHearts = (state.maxHearts ?? 3) + 1;
    state.hearts = Math.min(state.maxHearts, (state.hearts ?? 0) + 1);
    state.shield = true;
    // A fresh shield from the merge supersedes a ward shield.
    state.wardShield = false;
  }
  return true;
}

/** Hangar magnet: +30 pickup radius per TRACTOR MAGNET level (was +80 —
the old step vacuumed the field; the new step keeps the magnet a choice,
not a given). */
function hangarMagnetRadius(state) {
  return 30 * (state.hangar?.magnet ?? 0);
}

// --- Picking ---------------------------------------------------------------

/** True when this upgrade may currently be offered (never a retired component). */
function isAvailable(state, def) {
  return def.available(state) && !isUpgradeRetired(state, def.id);
}

/**
 * Apply one upgrade pick to the world state. Returns false when the
 * upgrade is not currently available (maxed out, shield already held,
 * hearts at cap, or retired by a merge) — the caller then offers
 * something else instead.
 */
function applyUpgrade(state, id) {
  const def = upgradeById(id);
  if (!def || !isAvailable(state, def)) return false;
  if (!state.upgrades) state.upgrades = {};
  state.upgrades[id] = (state.upgrades[id] || 0) + 1;
  def.apply(state);
  return true;
}

/**
 * Draw up to 3 DISTINCT upgrades the player may pick right now.
 * `rng` is a () => [0,1) function (defaults to Math.random); passing a
 * seeded one keeps draws deterministic in tests. Returns fewer than 3
 * only when fewer are available — never crashes, never repeats an id.
 *
 * Merges: when a merge's prerequisites are met and it is not yet
 * owned, one of the drawn cards is replaced by the MERGE card (gold
 * border, "MERGE" tag — the renderer draws it distinctly). When no
 * upgrade is available at all but a merge is, the hand is just the
 * merge — a level-up is never an empty choice while an evolution
 * waits.
 */
function drawUpgrades(state, rng = Math.random) {
  const pool = UPGRADES.filter((def) => isAvailable(state, def));
  for (let i = pool.length - 1; i > 0; i -= 1) {
    const j = Math.floor(rng() * (i + 1));
    const tmp = pool[i];
    pool[i] = pool[j];
    pool[j] = tmp;
  }
  const picks = pool.slice(0, 3);
  const merges = availableMerges(state.upgrades || {}, state.merged || {});
  if (merges.length > 0) {
    const merge = merges[Math.floor(rng() * merges.length)];
    if (picks.length > 0) {
      picks[Math.floor(rng() * picks.length)] = { ...merge };
    } else {
      picks.push({ ...merge });
    }
  }
  return picks;
}

// ---- src/stages.js ----
// Lumen Drift — stages 1–100: targets, bosses, coin rewards, enemy
// unlocks and spawn pressure. Pure logic: every function takes plain
// numbers (or the save) and returns plain data — no DOM, no storage.
// The world (Wave B) and the stage-select/shop UI (Wave C) build on
// these exact exports.
//
// Core balance rule (Petta, 2026-11-18): higher stages demand a higher
// ship level + a better ship — ship power gates progress. The boss HP
// table below is tuned so a starter ship cannot brute-force stage 50
// (see the balance check in tests/ships.test.mjs).
const STAGE_COUNT = 100;

const BOSS_NAMES = {
  10: 'STORM TYRANT',
  20: 'ABYSSAL MAW',
  30: 'STAR EATER',
  40: 'VOID HERALD',
  50: 'NEBULA CRUSHER',
  60: 'DARK COMET',
  70: 'EVENT HORIZON',
  80: 'GALAXY REAPER',
  90: 'VOID EMPEROR',
  100: 'THE FINAL STORM',
};

/** Points needed to clear a non-boss stage; boss/midboss stages are 0 (kill the boss).
 * 500 + 50*(n-1) (was 300 + 30*(n-1)): with the slower shard economy
 * (base 6, spawn 0.85 s) the old targets cleared in ~8 s for the
 * autopilot — stage 1 should take a human 30–60 s, growing with stage.
 */
function stageTarget(n) {
  if (isBossStage(n) || isMidbossStage(n)) return 0;
  return 500 + 50 * (n - 1);
}

/** Boss stages: every 10th stage (10, 20, …, 100). */
function isBossStage(n) {
  return n % 10 === 0;
}

/** Midboss stages: every 10th stage offset by 5 (5, 15, …, 95). */
function isMidbossStage(n) {
  return n % 10 === 5;
}

/**
 * The boss (or midboss) of a boss/midboss stage. Returns
 * { name, hp, kind: 'midboss'|'boss', radialEvery, aimedEvery }.
 * Midboss HP: 30 + 10 * floor((n-5)/10) (S5: 30 … S95: 120).
 * Boss HP: 60 + 40 * (n/10 - 1) (S10: 60 … S100: 420).
 * Returns null for non-boss stages.
 */
function bossFor(n) {
  if (isMidbossStage(n)) {
    return {
      name: 'VOID WARDEN',
      hp: 30 + 10 * Math.floor((n - 5) / 10),
      kind: 'midboss',
      radialEvery: 5.5,
      aimedEvery: Infinity,
    };
  }
  if (isBossStage(n)) {
    return {
      name: BOSS_NAMES[n],
      hp: 60 + 40 * (n / 10 - 1),
      kind: 'boss',
      radialEvery: 4.5,
      aimedEvery: 7,
    };
  }
  return null;
}

/** Coins a stage pays: first clear vs replay (25%, rounded). */
function stageCoins(n) {
  const first = 20 + 5 * n;
  return { first, replay: Math.round(first * 0.25) };
}

/** Elite tier of a stage: 0 for 1–10, 1 for 11–20, …, 9 for 91–100. */
function eliteTier(n) {
  return Math.floor((n - 1) / 10);
}

/** Enemy kinds that can spawn on a stage (unlocks at 4 / 8 / 12). */
function enemyKindsFor(n) {
  const kinds = ['drifter'];
  if (n >= 4) kinds.push('dart');
  if (n >= 8) kinds.push('bulwark');
  if (n >= 12) kinds.push('spitter');
  return kinds;
}

/** HP of one enemy of `kind` on stage n (base + elite tier). */
function enemyHp(kind, n) {
  const base = { drifter: 1, dart: 1, bulwark: 5, spitter: 2 }[kind] ?? 1;
  return base + eliteTier(n);
}

/** Spawn pressure for a stage (mine/storm caps, spawn intervals). */
function stageSpawn(n) {
  return {
    mineCap: Math.min(8 + (n - 1), 22),
    stormCap: Math.min(2 + Math.floor((n - 1) / 3), 6),
    enemyEvery: Math.max(2.2 - 0.012 * (n - 1), 1.0),
    mineEvery: 1.5,
    stormEvery: 2.4,
  };
}

/** A stage is playable when it is the next uncleared one or earlier. */
function stageAccessible(save, n) {
  return n >= 1 && n <= STAGE_COUNT && n <= (save.highestCleared || 0) + 1;
}

/**
 * Bank a stage clear. A first clear raises highestCleared, pays the
 * full reward and (at stage 10) unlocks endless mode; a replay pays
 * the smaller replay reward. Returns { coins, firstClear, unlockedEndless }.
 */
function recordStageClear(save, n) {
  const { first, replay } = stageCoins(n);
  if (n > (save.highestCleared || 0)) {
    save.highestCleared = n;
    save.coins = (save.coins ?? 0) + first;
    let unlockedEndless = false;
    if (n === 10) {
      save.endlessUnlocked = true;
      unlockedEndless = true;
    }
    return { coins: first, firstClear: true, unlockedEndless };
  }
  save.coins = (save.coins ?? 0) + replay;
  return { coins: replay, firstClear: false, unlockedEndless: false };
}

// ---- src/hangar.js ----
// Lumen Drift — the hangar: permanent per-part ship upgrades bought with
// lifetime star shards. Unlike the in-run upgrade picks (which reset every
// run), hangar parts stay bought forever, so the ship visibly grows
// stronger run after run — that is the point of this screen.
//
// Economy: two shard counters. `lifetime.shards` counts every shard ever
// earned and NEVER decreases — it is what unlocks ship skins. `shardBalance`
// is the spendable purse: every shard earned adds to it, every hangar
// purchase deducts from it. Spending can therefore never lock a skin.
//
// Balance: a good run earns ~60-120 shards, plus the daily streak bonus
// (10-100) and mission rewards (100/day). The first level of every part
// costs 150-300, so each is affordable after a few runs; maxing all five
// parts costs 9,400 shards — weeks of play, not a day. A fully kitted
// ship is much stronger (up to 6 hearts, +24% speed, a starting shield,
// a wide magnet, +6 points per shard) but the early levels stay hard:
// the first levels only add a little, and the endless ramp (Part 2)
// keeps scaling past anything the hangar can give.
const HANGAR_PARTS = [
  {
    id: 'hull',
    name: 'REINFORCED HULL',
    desc: '+1 max hull heart per level.',
    max: 3,
    costs: [250, 700, 1500],
  },
  {
    id: 'engine',
    name: 'ION ENGINE',
    desc: '+8% top speed and dash speed per level.',
    max: 3,
    costs: [200, 600, 1200],
  },
  {
    id: 'shield',
    name: 'AEGIS PLATING',
    desc: 'Lv1: start each run with a shield. Lv2: shield cells spawn twice as often.',
    max: 2,
    costs: [300, 800],
  },
  {
    id: 'magnet',
    name: 'TRACTOR MAGNET',
    desc: '+30 shard pickup radius per level.',
    max: 3,
    costs: [150, 500, 1100],
  },
  {
    id: 'collector',
    name: 'LIGHT COLLECTOR',
    desc: '+2 points per star shard per level.',
    max: 3,
    costs: [200, 600, 1300],
  },
];

function hangarPartById(id) {
  return HANGAR_PARTS.find((p) => p.id === id) || null;
}

/** Current level of one part (0 when never bought). */
function hangarLevel(save, id) {
  return (save && save.hangar && save.hangar[id]) || 0;
}

/** Every part's level, for the world (missing parts read as 0). */
function hangarBonuses(save) {
  const out = {};
  for (const part of HANGAR_PARTS) out[part.id] = hangarLevel(save, part.id);
  return out;
}

/** Shards the next level costs, or null when the part is maxed. */
function hangarNextCost(part, level) {
  if (!part || level >= part.max) return null;
  return part.costs[level];
}

/**
 * Can this part be bought right now? Returns { ok } or { ok: false,
 * reason } where reason is 'maxed', 'broke' or 'unknown'.
 */
function canBuyHangarPart(save, part) {
  if (!part) return { ok: false, reason: 'unknown' };
  const level = hangarLevel(save, part.id);
  const cost = hangarNextCost(part, level);
  if (cost === null) return { ok: false, reason: 'maxed' };
  if ((save.shardBalance ?? 0) < cost) return { ok: false, reason: 'broke' };
  return { ok: true, cost };
}

/**
 * Buy the next level of one part. Mutates save.hangar and
 * save.shardBalance. Returns { ok: true, cost, level } or
 * { ok: false, reason } — the caller shows the reason, never crashes.
 */
function buyHangarPart(save, partId) {
  const part = hangarPartById(partId);
  const check = canBuyHangarPart(save, part);
  if (!check.ok) return check;
  if (!save.hangar) save.hangar = {};
  save.hangar[part.id] = hangarLevel(save, part.id) + 1;
  save.shardBalance = (save.shardBalance ?? 0) - check.cost;
  return { ok: true, cost: check.cost, level: save.hangar[part.id] };
}

// ---- src/ships.js ----
// Lumen Drift — the ship shop: six ships, their levels, and the coin
// economy. Pure logic: every function takes the save and returns plain
// data or a { ok } / { ok: false, reason } result, like hangar.js.
// Coins are save.coins (spendable); shards (shardBalance) are untouched.
//
// Core balance rule (Petta, 2026-11-18): higher stages demand a higher
// ship level + a better ship. A ship's level is bought with coins in
// the shop (cap Lv 10); each level boosts stats, so the loop is:
// clear stages -> earn coins -> level up / buy a better ship -> clear
// higher stages.
//
// Unique power (Stage 2, Spekter "Agents" model): each ship has ONE
// power beyond its base stats — the thing that makes it play
// differently, not just bigger numbers. Powers never duplicate a
// hangar part or a chip (no dash-recharge power, no start-with-shield,
// no pierce, no drone — those live elsewhere).
const SHIP_LEVEL_MAX = 10;

const SHIPS = [
  {
    id: 'spark', name: 'SPARK', rarity: 'common', unlockStage: 0, price: 0,
    hearts: 3, speedMult: 1.00, blasterDamage: 1, blasterRate: 2.0,
    shape: 'skiff', desc: 'The starter skiff. Reliable, nothing fancy.',
    power: { id: 'second-wind', name: 'SECOND WIND', desc: 'Survive a fatal hit once per run at 1 heart.' },
  },
  {
    id: 'comet', name: 'COMET', rarity: 'common', unlockStage: 3, price: 150,
    hearts: 3, speedMult: 1.05, blasterDamage: 1, blasterRate: 2.2,
    shape: 'dart', desc: 'A quick dart. Fires a little faster.',
    power: { id: 'dual-dash', name: 'DUAL DASH', desc: 'Dash twice before recharging.' },
  },
  {
    id: 'nebula', name: 'NEBULA', rarity: 'rare', unlockStage: 10, price: 500,
    hearts: 4, speedMult: 1.10, blasterDamage: 2, blasterRate: 2.2,
    shape: 'wing', desc: 'A winged cruiser with a heavier blaster.',
    power: { id: 'slow-field', name: 'SLOW FIELD', desc: 'Enemies within 120 px move 25% slower.' },
  },
  {
    id: 'pulsar', name: 'PULSAR', rarity: 'epic', unlockStage: 25, price: 1500,
    hearts: 4, speedMult: 1.15, blasterDamage: 2, blasterRate: 2.6,
    shape: 'dart', desc: 'An epic dart that spits blaster fire.',
    power: { id: 'rapid-fire', name: 'RAPID FIRE', desc: 'Weapon fires 20% faster.' },
  },
  {
    id: 'aurora', name: 'AURORA', rarity: 'legendary', unlockStage: 50, price: 4000,
    hearts: 5, speedMult: 1.20, blasterDamage: 3, blasterRate: 2.6,
    shape: 'wing', desc: 'A legendary wing — the stage-50 gate-breaker.',
    power: { id: 'renewal', name: 'RENEWAL', desc: 'Regain 1 heart when a stage is cleared.' },
  },
  {
    id: 'novaprime', name: 'NOVA PRIME', rarity: 'mythic', unlockStage: 75, price: 8000,
    hearts: 6, speedMult: 1.25, blasterDamage: 4, blasterRate: 3.0,
    shape: 'skiff', desc: 'The mythic skiff. The final storm fears it.',
    power: { id: 'nova-dash', name: 'NOVA DASH', desc: 'Dashing through an enemy deals 1 damage.' },
  },
];

/** Every ship's unique power, as { ship, id, name, desc }. */
const SHIP_POWERS = SHIPS.map((s) => ({ ship: s.id, ...s.power }));

function shipById(id) {
  return SHIPS.find((s) => s.id === id) || null;
}

/** A ship's unique power def (or null for a power-less def). */
function shipPowerById(id) {
  const def = shipById(id);
  return (def && def.power) || null;
}

/** The ship that carries power `powerId` (or null). */
function shipForPower(powerId) {
  return SHIPS.find((s) => s.power && s.power.id === powerId) || null;
}

/** Coins to go from `level` to `level+1` (100/level: Lv1->2 is 100 … Lv9->10 is 900; 4500 to max). */
function shipLevelCost(level) {
  return 100 * level;
}

/**
 * Derived stats for a ship definition at a level:
 * hearts +1 at Lv 5 and Lv 10, +2% speed per level, +1 blaster damage
 * per level (flat), blaster rate unchanged.
 */
function shipStats(def, level) {
  return {
    hearts: def.hearts + (level >= 5 ? 1 : 0) + (level >= 10 ? 1 : 0),
    speedMult: def.speedMult * (1 + 0.02 * (level - 1)),
    blasterDamage: def.blasterDamage + (level - 1),
    blasterRate: def.blasterRate,
    level,
  };
}

/** Current level of a ship (0 when not owned). */
function shipLevel(save, id) {
  return (save && save.ships && save.ships.owned && save.ships.owned[id]
    && save.ships.owned[id].level) || 0;
}

/** The equipped ship's definition (defaults to SPARK when unset). */
function equippedShip(save) {
  const id = (save && save.ships && save.ships.equipped) || 'spark';
  return shipById(id) || shipById('spark');
}

/** Derived stats of the equipped ship at its owned level. */
function equippedShipStats(save) {
  const def = equippedShip(save);
  return shipStats(def, Math.max(1, shipLevel(save, def.id)));
}

/**
 * Can this ship be bought right now? Returns { ok } or
 * { ok: false, reason } where reason is 'owned' | 'locked' | 'broke'
 * | 'unknown'. Locked = highestCleared < unlockStage (spark, unlock 0,
 * is always available; it starts owned).
 */
function canBuyShip(save, id) {
  const def = shipById(id);
  if (!def) return { ok: false, reason: 'unknown' };
  if (shipLevel(save, id) > 0) return { ok: false, reason: 'owned' };
  if ((save.highestCleared || 0) < def.unlockStage) return { ok: false, reason: 'locked' };
  if ((save.coins ?? 0) < def.price) return { ok: false, reason: 'broke' };
  return { ok: true, cost: def.price };
}

/**
 * Buy a ship. Deducts the price from save.coins, owns it at Lv 1 and
 * equips it. Returns { ok: true, cost, level: 1 } or the canBuy reason.
 */
function buyShip(save, id) {
  const check = canBuyShip(save, id);
  if (!check.ok) return check;
  if (!save.ships) save.ships = { owned: {}, equipped: 'spark' };
  if (!save.ships.owned) save.ships.owned = {};
  save.coins = (save.coins ?? 0) - check.cost;
  save.ships.owned[id] = { level: 1 };
  save.ships.equipped = id;
  return { ok: true, cost: check.cost, level: 1 };
}

/**
 * Can this ship be levelled up right now? Returns { ok } or
 * { ok: false, reason } where reason is 'not-owned' | 'maxed' |
 * 'broke' | 'unknown'.
 */
function canLevelShip(save, id) {
  const def = shipById(id);
  if (!def) return { ok: false, reason: 'unknown' };
  const level = shipLevel(save, id);
  if (level === 0) return { ok: false, reason: 'not-owned' };
  if (level >= SHIP_LEVEL_MAX) return { ok: false, reason: 'maxed' };
  const cost = shipLevelCost(level);
  if ((save.coins ?? 0) < cost) return { ok: false, reason: 'broke' };
  return { ok: true, cost };
}

/**
 * Level a ship up one level. Deducts shipLevelCost(level) from
 * save.coins. Returns { ok: true, cost, level } or the reason.
 */
function levelUpShip(save, id) {
  const check = canLevelShip(save, id);
  if (!check.ok) return check;
  save.ships.owned[id].level += 1;
  save.coins = (save.coins ?? 0) - check.cost;
  return { ok: true, cost: check.cost, level: save.ships.owned[id].level };
}

/**
 * Equip an owned ship. Returns { ok } or
 * { ok: false, reason: 'not-owned' } (or 'unknown' for a bad id).
 */
function equipShip(save, id) {
  if (!shipById(id)) return { ok: false, reason: 'unknown' };
  if (shipLevel(save, id) === 0) return { ok: false, reason: 'not-owned' };
  if (!save.ships) save.ships = { owned: {}, equipped: 'spark' };
  save.ships.equipped = id;
  return { ok: true };
}

// Lumen Drift — ship skins: cosmetic hull colours unlocked by lifetime
// star shards (total shards collected across ALL runs). Skins never change

//
// Persistence lives here so it is testable with a fake storage object;
// main.js passes window.localStorage. Every read/write is guarded, so
// private windows (storage off) just fall back to the default skin.

const DEFAULT_SKIN_ID = 'cyan';

// Unlock thresholds: the first skin (EMBER) is earnable on day 1-2
// (~2-3 good runs), so the first trophy lands fast; later skins space
// out by gates, days and score milestones. Skins are milestone trophies,
// not shop filler — the next one is always visible-but-locked as the
// home-screen goal.

    hull: '#be185d', glow: '#f472b6', flame: '#67e8f9', flameGlow: '#22d3ee', trail: '#f472b6',
  },
];

function skinById(id) {
  return SKINS.find((s) => s.id === id) || SKINS[0];
}

/** Every skin the lifetime total has unlocked, in unlock order. */
function unlockedSkins(lifetimeShards) {
  return SKINS.filter((s) => lifetimeShards >= s.unlock);
}

/**
 * The next skin still locked, with progress toward it — or null when
 * every skin is unlocked.
 */
function nextUnlock(lifetimeShards) {
  const next = SKINS.find((s) => lifetimeShards < s.unlock);
  return next ? { skin: next, have: lifetimeShards, need: next.unlock } : null;
}

function loadLifetimeShards(storage) {
  try {
    return Number.parseInt(storage.getItem(SHARDS_KEY) ?? '0', 10) || 0;
  } catch {
    return 0;
  }
}

function saveLifetimeShards(storage, value) {
  try {
    storage.setItem(SHARDS_KEY, String(value));
  } catch {
    // Storage can be off (private windows): progress lasts this visit.
  }
}

/** Saved skin id, falling back to the default when it is locked/unknown. */
function loadSkinId(storage, lifetimeShards) {
  try {
    const id = storage.getItem(SKIN_KEY);
    const skin = id ? SKINS.find((s) => s.id === id) : null;
    if (skin && lifetimeShards >= skin.unlock) return skin.id;
  } catch {
    // Fall through to the default.
  }
  return DEFAULT_SKIN_ID;
}

function saveSkinId(storage, id) {
  try {
    storage.setItem(SKIN_KEY, id);
  } catch {
    // Storage can be off: the choice lasts this visit.
  }
}

// ---- src/pilot.js ----
// Lumen Drift — the pilot: account level / XP, achievements, and the
// profile aggregation (loadout + attributes + collection + totals).
// Pure logic over the save blob; no DOM, no storage. Wave C renders
// this (profile menu); Waves A/C build on the exact names below.
//
// XP model (tuned so an average player hits pilot Lv 5 in ~10-15 runs
// and Lv 10 in ~40 runs — see the simulation test in
// tests/pilot.test.mjs for the assumed average run):
//   xpToNext(level) = 100 * level   (Lv1->2: 100, Lv2->3: 200, ...;
//   cumulative XP to Lv 10 is 4500).
//   awardRunXp: 15 base (showing up counts — every run pays, win or
//   lose) + floor(score / 10) (performance) + 25 per stage cleared
//   (50 on a first clear) + 1 per endless second + 25 flawless
//   (noDamage). A first clear is detected from save.highestCleared,
//   so call awardRunXp BEFORE recordStageClear mutates it — or pass
//   run.firstClear explicitly.
// Pilot level gates gear (PILOT_GATES): weapons, chip rarities and the
// third chip slot unlock by pilot level, never by coins alone — the
// level is the account's seniority, coins are the spend.
//
// Assumptions (chips.js / the full weapon roster are Wave A's and do
// not exist yet): the only weapon is the Blaster, so weaponDamage /
// weaponRate come from the equipped ship's blaster stats; chipEffects
// is empty until the chip roster lands; the weapons collection total
// is 1 (Blaster) and the chips collection total is 0 for the same
// reason. Nothing here imports weapons.js or chips.js.

/** XP to go from pilot level `level` to `level + 1` (100/level). */
function xpToNext(level) {
  return 100 * Math.max(1, level);
}

/** Total XP needed to reach `level` from level 1 (0 for level 1). */
function xpForLevel(level) {
  const n = Math.max(1, level) - 1;
  return 50 * n * (n + 1);
}

/** Pilot level for a lifetime XP total (level 1 at 0 XP). */
function pilotLevelForXp(totalXp) {
  const xp = Math.max(0, totalXp || 0);
  let level = 1;
  while (xp >= xpForLevel(level + 1) && level < 999) level += 1;
  return level;
}

/**
 * Pilot level read from a save blob (defensive: 1 when the pilot
 * block is missing). The single home for this helper — chips.js and
 * weapons.js used to define their own copies, which collided into a
 * duplicate declaration once bundled into one module scope and broke
 * the live game with a SyntaxError (the multi-file tests never saw it).
 */
function pilotLevel(save) {
  return (save && save.pilot && save.pilot.level) || 1;
}

/** Make sure save.pilot exists (a v4 blob, or a hand-edited one). */
function ensurePilot(save) {
  if (!save.pilot || typeof save.pilot !== 'object') save.pilot = { xp: 0, level: 1 };
  if (typeof save.pilot.xp !== 'number') save.pilot.xp = 0;
  if (typeof save.pilot.level !== 'number') save.pilot.level = 1;
  return save.pilot;
}

/**
 * Award XP for a finished run — win OR lose, no battle is wasted.
 * run = { stage, score, cleared, endlessSeconds, kills,
 * bulletsDestroyed, noDamage, firstClear? }. Returns
 * { xpGained, level, leveledUp }. Mutates save.pilot.
 *
 * First-clear detection: run.firstClear when given, else
 * run.cleared && run.stage > (save.highestCleared || 0) — so call
 * this before recordStageClear updates highestCleared.
 */
function awardRunXp(save, run = {}) {
  const pilot = ensurePilot(save);
  const score = Math.max(0, run.score || 0);
  const cleared = !!run.cleared;
  const firstClear = cleared && (run.firstClear !== undefined
    ? !!run.firstClear
    : (run.stage || 0) > (save.highestCleared || 0));
  let xp = 15 + Math.floor(score / 10);
  if (cleared) xp += firstClear ? 50 : 25;
  xp += Math.max(0, Math.floor(run.endlessSeconds || 0));
  if (run.noDamage) xp += 25;
  const oldLevel = pilot.level;
  pilot.xp = (pilot.xp || 0) + xp;
  pilot.level = pilotLevelForXp(pilot.xp);
  return { xpGained: xp, level: pilot.level, leveledUp: pilot.level > oldLevel };
}

  return ACHIEVEMENTS.find((a) => a.id === id) || null;
}

/** Make sure save.achievements exists (a v4 blob, or hand-edited). */
function ensureAchievements(save) {
  if (!save.achievements || typeof save.achievements !== 'object') {
    save.achievements = { unlocked: {}, claimed: {} };
  }
  if (!save.achievements.unlocked || typeof save.achievements.unlocked !== 'object') {
    save.achievements.unlocked = {};
  }
  if (!save.achievements.claimed || typeof save.achievements.claimed !== 'object') {
    save.achievements.claimed = {};
  }
  return save.achievements;
}

/**
 * Check every achievement against the save; unlock the newly earned
 * ones. Returns the array of newly unlocked ids — idempotent: an
 * already-unlocked achievement is never returned again.
 */
function checkAchievements(save) {
  const achievements = ensureAchievements(save);
  const stats = (save.stats && typeof save.stats === 'object') ? save.stats : {};
  const newly = [];
  for (const def of ACHIEVEMENTS) {
    if (achievements.unlocked[def.id]) continue;
    if (def.check(save, stats)) {
      achievements.unlocked[def.id] = true;
      newly.push(def.id);
    }
  }
  return newly;
}

/**
 * Claim an unlocked achievement's coin reward — once only. Returns
 * { ok: true, reward } or { ok: false, reason } where reason is
 * 'unknown' (bad id), 'not-unlocked' or 'claimed'.
 */
function claimAchievement(save, id) {
  const def = achievementById(id);
  if (!def) return { ok: false, reason: 'unknown' };
  const achievements = ensureAchievements(save);
  if (!achievements.unlocked[id]) return { ok: false, reason: 'not-unlocked' };
  if (achievements.claimed[id]) return { ok: false, reason: 'claimed' };
  achievements.claimed[id] = true;
  save.coins = (save.coins ?? 0) + def.reward;
  return { ok: true, reward: def.reward };
}

/**
 * The equipped ship's unique power, for the profile menu. Wave C adds
 * a `power` field { id, name, desc } to each ship def in ships.js;
 * until then (or for a def without one) this is null — read
 * defensively, never crash on a power-less def.
 */
function shipPowerFor(def) {
  const power = def && def.power;
  if (!power || typeof power !== 'object') return null;
  return {
    id: power.id ?? null,
    name: power.name ?? null,
    desc: power.desc ?? null,
  };
}

// --- Profile aggregation ----------------------------------------------------

/**
 * The profile menu's data, aggregated from the save — pure, no
 * mutation. Attribute totals use the same model as the in-game
 * derived numbers: ship level (shipStats) + hangar parts, the
 * Blaster's rate/damage from the equipped ship, dash cooldown from
 * config, magnet radius = base + hangar magnet, shard value = base +
 * hangar collector. In-run upgrade picks are NOT included (they reset
 * every run); chips contribute nothing yet — the chip roster is
 * Wave A's, so chipEffects is [] until it lands.
 */
function profileStats(save) {
  const pilot = ensurePilot(save);
  const level = pilot.level;
  const xp = pilot.xp;
  const xpIntoLevel = xp - xpForLevel(level);
  const next = xpToNext(level);
  const ship = equippedShipStats(save);
  const shipPower = shipPowerFor(equippedShip(save));
  const hangar = save.hangar || {};
  const weapons = (save.weapons && typeof save.weapons === 'object') ? save.weapons : {};
  const ownedWeapons = (weapons.owned && typeof weapons.owned === 'object') ? weapons.owned : {};
  const equippedWeapon = typeof weapons.equipped === 'string' ? weapons.equipped : 'blaster';
  const weaponLevel = (ownedWeapons[equippedWeapon] && ownedWeapons[equippedWeapon].level) || 1;
  const chips = (save.chips && typeof save.chips === 'object') ? save.chips : {};
  const ownedChips = (chips.owned && typeof chips.owned === 'object') ? chips.owned : {};
  const slots = Array.isArray(chips.slots) ? chips.slots : [null, null];
  const stats = (save.stats && typeof save.stats === 'object') ? save.stats : {};
  const lifetimeShards = (save.lifetime && save.lifetime.shards) || 0;
  return {
    pilot: {
      level,
      xp,
      xpToNext: next,
      // 0..1 progress through the current level.
      xpProgress: next > 0 ? xpIntoLevel / next : 0,
    },
    loadout: {
      ship: { id: (save.ships?.equipped) || 'spark', level: ship.level },
      // The equipped ship's unique power (null until Wave C adds the
      // `power` field to the ship defs in ships.js).
      shipPower,
      weapon: { id: equippedWeapon, level: weaponLevel },
      chips: slots.filter((c) => c !== null && c !== undefined),
    },
    attributes: {
      // The ship's unique power, listed with the other attributes so
      // the profile menu shows what makes this ship special.
      shipPower,
      hearts: ship.hearts + (hangarLevel(save, 'hull')),
      speedMult: Math.round(ship.speedMult * (1 + 0.08 * (hangar.engine || 0)) * 1000) / 1000,
      weaponDamage: ship.blasterDamage,
      weaponRate: ship.blasterRate,
      dashCooldown: SHIP.dashCooldown,
      magnetRadius: MAGNET_BASE_RADIUS + 30 * (hangar.magnet || 0),
      shardValue: SHARD_POINTS + 2 * (hangar.collector || 0),
      chipEffects: [],
    },
    collection: {
      ships: {
        owned: Object.keys(save.ships?.owned || {}).length,
        total: SHIPS.length,
      },
      weapons: { owned: Object.keys(ownedWeapons).length, total: 1 },
      chips: { owned: Object.keys(ownedChips).length, total: 0 },
      skins: { owned: unlockedSkins(lifetimeShards).length, total: SKINS.length },
    },
    totals: {
      stagesCleared: stats.stagesCleared || 0,
      enemiesDestroyed: stats.enemiesDestroyed || 0,
      bossesKilled: stats.bossesKilled || 0,
      runsPlayed: stats.runsPlayed || 0,
      totalScore: stats.totalScore || 0,
    },
  };
}

// ---- src/weapons.js ----
// Lumen Drift — the weapon roster (stage 2, Wave A). Pure logic over a
// plain world state — no DOM, no storage, no import of world.js (Wave C
// owns the world; it calls these with its state). The state shape used
// here:
//   ship { x, y }, enemies [{ x, y, kind, hp, radius }], boss null or
//   { x, y, kind, hp, radius }, bullets [], enemyBullets [], score,
//   floaters [], gateProgress, shipStats { blasterDamage, blasterRate },
//   blasterCooldown, weaponCooldown, weaponId, weaponLevels { id: level },
//   chipEffects (see chips.js chipEffectsFor), hearts, maxHearts,
//   shield, shieldTimer, pulseFx []. Bounds come from
//   state.width/height when present, else the FIELD size from config.js.
//
// Weapon model: weapon damage = def.baseDamage + def.damagePerLevel *
// (level-1). The ship's blasterDamage/blasterRate apply ONLY to the
// Blaster (as in stage 1); the other three weapons use their own def +
// level. Ship hearts/speed still matter for all weapons (survival is
// what the balance gate measures).
//
// `pierce` semantics: pierce N means that AFTER its first hit, a bolt
// can pass through N more enemies (total hits = 1 + pierce). The
// Blaster's base pierce is 0 (one hit, as before); the Piercing Rounds
// chip adds +1 to every bolt's pierce, so it is never a no-op.
//
// Chip hooks (effects arrive on state.chipEffects; Wave C sets it from
// chipEffectsFor(equipped chip ids) — see chips.js):
//   pierce:        extra pierce on blaster + laser bolts.
//   overdrive:     +25% weapon damage while hearts == maxHearts
//                  (only when maxHearts is a number; unknown -> off).
//   bulletWard:    destroying an enemy bullet sets state.shield = true
//                  and state.shieldTimer = 2 (Wave C's world step
//                  decays shieldTimer and clears shield at 0).
//   chainSpark:    on an enemy kill, a roll (state.random, else
//                  Math.random) under the chance chains 1 damage to the
//                  nearest other enemy within CHAIN_RADIUS, and records
//                  a pulseFx segment. A chain-spark kill never chains
//                  again.
// Pulse Beam visuals: fireWeapon records each jump in state.pulseFx
// as { x1, y1, x2, y2, ttl } (ttl PULSE_FX_TTL); updateBullets decays
// them. Wave C's renderer reads state.pulseFx.

// --- The roster -------------------------------------------------------

const BLASTER = {
  id: 'blaster', name: 'BLASTER', range: 460, bulletSpeed: 950, bulletRadius: 5,
};

// Enemy bullets (the magenta orbs) are shootable: an orb inside this
// radius of the ship is an immediate threat, so a weapon shoots it
// before anything else. Farther orbs are only mopped up when no enemy
// or boss is in range — shooting orbs must stay defensive, never the
// main job, or boss fights would lose all their pressure. The radius
// is deliberately short (~1 s of orb flight): a wide radius let the
// Blaster spend whole radial bursts on orbs and doubled boss kill
// times in the sim.
const BULLET_DEFENSE_RADIUS = 140;

// Chain-lightning jump radius, shared by Pulse Beam and the Chain
// Spark chip: a chained hit only reaches an enemy this close to the
// last hit.
const CHAIN_RADIUS = 120;

// How long a pulse-beam segment stays visible (seconds). updateBullets
// decays state.pulseFx by dt.
const PULSE_FX_TTL = 0.15;

const WEAPON_LEVEL_MAX = 10;

const WEAPONS = [
  {
    id: 'blaster', name: 'BLASTER', desc: 'The starter auto-fire. Damage and rate come from the equipped ship.',
    range: 460, unlockPilotLevel: 1, price: 0,
    baseDamage: 1, damagePerLevel: 0, rate: 2.0, bulletSpeed: 950, bulletRadius: 5,
  },
  {
    id: 'mortar', name: 'MORTAR', desc: 'Slow lobbed shells that burst on impact or at max range, damaging everything nearby.',
    range: 520, unlockPilotLevel: 3, price: 300,
    baseDamage: 3, damagePerLevel: 1, rate: 0.8, bulletSpeed: 420, bulletRadius: 8,
    blastRadius: 60,
  },
  {
    id: 'laser', name: 'LASER', desc: 'A piercing beam. Each bolt passes through several enemies in a line.',
    range: 460, unlockPilotLevel: 5, price: 800,
    baseDamage: 1.5, damagePerLevel: 0.5, rate: 1.5, bulletSpeed: 1200, bulletRadius: 5,
    pierce: 1,
  },
  {
    id: 'pulse', name: 'PULSE BEAM', desc: 'Instant chain lightning: zaps the nearest enemy, then jumps to nearby ones.',
    range: 300, unlockPilotLevel: 8, price: 1500,
    baseDamage: 3, damagePerLevel: 1, rate: 1.0, bulletSpeed: 0, bulletRadius: 0,
    chains: 1,
  },
];

const ENEMY_KILL_POINTS = { drifter: 25, dart: 30, bulwark: 50, spitter: 40 };

function weaponById(id) {
  return WEAPONS.find((w) => w.id === id) || null;
}

/** Coins to go from `level` to `level+1` (100/level: Lv1->2 is 100 … Lv9->10 is 900; 4500 to max). */
function weaponLevelCost(level) {
  return 100 * level;
}

/**
 * Derived stats for a weapon definition at a level (clamped 1..10):
 *   damage      = baseDamage + damagePerLevel * (level-1)
 *                 — except the Blaster, whose damage/rate come from the
 *                 equipped ship when `shipStats` is passed (the def's
 *                 nominal 1 / 2.0 are the fallback).
 *   rate        = def.rate (Blaster: shipStats.blasterRate when given).
 *   pierce      = extra enemies a bolt passes through after its first
 *                 hit: Laser 1 + floor((level-1)/4) (1 at Lv 1 → 3 at
 *                 Lv 10); 0 for the others (Blaster: 0).
 *   blastRadius = Mortar 60 + floor(20*(level-1)/9) (60 → 80 by Lv 10).
 *   chains      = Pulse 1 + floor((level-1)/3) (1 → 4 by Lv 10).
 *   shells      = Mortar 2 from Lv 5, else 1.
 * Always returns { damage, rate, range, pierce, blastRadius, chains,
 * shells, level }.
 */
function weaponStats(def, level, shipStats) {
  const lv = Math.max(1, Math.min(WEAPON_LEVEL_MAX, level || 1));
  const stats = {
    damage: def.baseDamage + (def.damagePerLevel ?? 0) * (lv - 1),
    rate: def.rate,
    range: def.range,
    pierce: 0,
    blastRadius: 0,
    chains: 0,
    shells: 1,
    level: lv,
  };
  if (def.id === 'blaster') {
    if (shipStats) {
      stats.damage = shipStats.blasterDamage ?? stats.damage;
      stats.rate = shipStats.blasterRate ?? stats.rate;
    }
  } else if (def.id === 'mortar') {
    stats.blastRadius = 60 + Math.floor((20 * (lv - 1)) / 9);
    stats.shells = lv >= 5 ? 2 : 1;
  } else if (def.id === 'laser') {
    stats.pierce = 1 + Math.floor((lv - 1) / 4);
  } else if (def.id === 'pulse') {
    stats.chains = 1 + Math.floor((lv - 1) / 3);
  }
  return stats;
}

// --- Save shape (weapons live in save.weapons) ------------------------
// save.weapons = { owned: { blaster: { level: 1 } }, equipped: 'blaster' }
// Pilot level lives in save.pilot.level (Wave B owns pilot.js); read
// it defensively as save.pilot?.level ?? 1 everywhere below.

function weaponsOf(save) {
  if (save && save.weapons && save.weapons.owned) return save.weapons;
  return { owned: { blaster: { level: 1 } }, equipped: 'blaster' };
}

/** Current level of a weapon (0 when not owned; Blaster is owned from the start). */
function weaponLevel(save, id) {
  const owned = weaponsOf(save).owned;
  return (owned[id] && owned[id].level) || 0;
}

/** The equipped weapon's definition (defaults to BLASTER when unset). */
function equippedWeapon(save) {
  const id = weaponsOf(save).equipped || 'blaster';
  return weaponById(id) || weaponById('blaster');
}

/**
 * Can this weapon be bought right now? Returns { ok } or
 * { ok: false, reason } where reason is 'owned' | 'locked' | 'broke'
 * | 'unknown'. Locked = pilot level < unlockPilotLevel.
 */
function canBuyWeapon(save, id) {
  const def = weaponById(id);
  if (!def) return { ok: false, reason: 'unknown' };
  if (weaponLevel(save, id) > 0) return { ok: false, reason: 'owned' };
  if (pilotLevel(save) < def.unlockPilotLevel) return { ok: false, reason: 'locked' };
  if ((save.coins ?? 0) < def.price) return { ok: false, reason: 'broke' };
  return { ok: true, cost: def.price };
}

/**
 * Buy a weapon. Deducts the price from save.coins, owns it at Lv 1
 * and equips it. Returns { ok: true, cost, level: 1 } or the canBuy
 * reason.
 */
function buyWeapon(save, id) {
  const check = canBuyWeapon(save, id);
  if (!check.ok) return check;
  if (!save.weapons) save.weapons = { owned: {}, equipped: 'blaster' };
  if (!save.weapons.owned) save.weapons.owned = {};
  save.coins = (save.coins ?? 0) - check.cost;
  save.weapons.owned[id] = { level: 1 };
  save.weapons.equipped = id;
  return { ok: true, cost: check.cost, level: 1 };
}

/**
 * Can this weapon be levelled up right now? Returns { ok } or
 * { ok: false, reason } where reason is 'not-owned' | 'maxed' |
 * 'broke' | 'unknown'.
 */
function canLevelWeapon(save, id) {
  const def = weaponById(id);
  if (!def) return { ok: false, reason: 'unknown' };
  const level = weaponLevel(save, id);
  if (level === 0) return { ok: false, reason: 'not-owned' };
  if (level >= WEAPON_LEVEL_MAX) return { ok: false, reason: 'maxed' };
  const cost = weaponLevelCost(level);
  if ((save.coins ?? 0) < cost) return { ok: false, reason: 'broke' };
  return { ok: true, cost };
}

/**
 * Level a weapon up one level. Deducts weaponLevelCost(level) from
 * save.coins. Returns { ok: true, cost, level } or the reason.
 */
function levelUpWeapon(save, id) {
  const check = canLevelWeapon(save, id);
  if (!check.ok) return check;
  save.weapons.owned[id].level += 1;
  save.coins = (save.coins ?? 0) - check.cost;
  return { ok: true, cost: check.cost, level: save.weapons.owned[id].level };
}

/**
 * Equip an owned weapon. Returns { ok } or
 * { ok: false, reason: 'not-owned' } (or 'unknown' for a bad id).
 */
function equipWeapon(save, id) {
  if (!weaponById(id)) return { ok: false, reason: 'unknown' };
  if (weaponLevel(save, id) === 0) return { ok: false, reason: 'not-owned' };
  if (!save.weapons) save.weapons = { owned: {}, equipped: 'blaster' };
  save.weapons.equipped = id;
  return { ok: true };
}

// --- Targeting ---------------------------------------------------------

function distTo(ship, t) {
  return Math.hypot(t.x - ship.x, t.y - ship.y);
}

/**
 * Nearest target, in priority order:
 *   1. an enemy bullet (magenta orb) inside BULLET_DEFENSE_RADIUS —
 *      self-defense: the orb about to hit the ship is shot first;
 *   2. the nearest enemy or boss inside `range`;
 *   3. the nearest enemy bullet inside `range` (idle cleanup).
 * `range` defaults to BLASTER.range. Returns { x, y, kind, ref } or
 * null. Bullet targets carry kind 'enemyBullet' and ref the orb
 * object (1 HP — see updateBullets).
 */
function nearestTarget(state, range = BLASTER.range) {
  const ship = state.ship;
  if (!ship) return null;
  let closeBullet = null;
  let closeDist = BULLET_DEFENSE_RADIUS;
  for (const b of state.enemyBullets || []) {
    const d = distTo(ship, b);
    if (d <= closeDist) {
      closeDist = d;
      closeBullet = { x: b.x, y: b.y, kind: 'enemyBullet', ref: b };
    }
  }
  if (closeBullet) return closeBullet;
  let best = null;
  let bestDist = range;
  for (const enemy of state.enemies || []) {
    const d = distTo(ship, enemy);
    if (d <= bestDist) {
      bestDist = d;
      best = { x: enemy.x, y: enemy.y, kind: enemy.kind || 'drifter', ref: enemy };
    }
  }
  if (state.boss) {
    const d = distTo(ship, state.boss);
    if (d <= bestDist) {
      best = { x: state.boss.x, y: state.boss.y, kind: state.boss.kind || 'boss', ref: state.boss };
    }
  }
  if (best) return best;
  let farBullet = null;
  let farDist = range;
  for (const b of state.enemyBullets || []) {
    const d = distTo(ship, b);
    if (d <= farDist) {
      farDist = d;
      farBullet = { x: b.x, y: b.y, kind: 'enemyBullet', ref: b };
    }
  }
  return farBullet;
}

// --- Firing ------------------------------------------------------------

function hitRadius(target) {
  return target.radius ?? target.r ?? 15;
}

function blasterCooldownLeft(state) {
  return state.blasterCooldown ?? state.weaponCooldown ?? 0;
}

function weaponCooldownLeft(state) {
  return state.weaponCooldown ?? state.blasterCooldown ?? 0;
}

function setCooldown(state, rate) {
  const cd = 1 / rate;
  state.weaponCooldown = cd;
  state.blasterCooldown = cd;
}

/** +25% damage while at full hearts with the Overdrive chip, else 1x. */
function overdriveMult(state) {
  if (!state.chipEffects?.overdrive) return 1;
  if (typeof state.maxHearts !== 'number') return 1;
  return (state.hearts ?? 0) >= state.maxHearts ? 1.25 : 1;
}

function pushBullet(state, bullet) {
  if (!state.bullets) state.bullets = [];
  state.bullets.push(bullet);
}

function aimAt(state, target, speed) {
  const dx = target.x - state.ship.x;
  const dy = target.y - state.ship.y;
  const len = Math.hypot(dx, dy) || 1;
  return { vx: (dx / len) * speed, vy: (dy / len) * speed };
}

/**
 * Fire one blaster bolt at the nearest target, when the cooldown has
 * expired and a target exists. The bolt starts at the ship and flies
 * toward the target at BLASTER.bulletSpeed, carrying the ship's
 * blaster damage (times the Overdrive multiplier when active).
 * Sets both state.blasterCooldown and state.weaponCooldown to
 * 1 / blasterRate. Returns true when a bolt was fired, false otherwise.
 */
function fireBlaster(state) {
  if (blasterCooldownLeft(state) > 0) return false;
  const target = nearestTarget(state);
  if (!target) return false;
  const stats = state.shipStats || {};
  const damage = (stats.blasterDamage ?? 1) * overdriveMult(state);
  const { vx, vy } = aimAt(state, target, BLASTER.bulletSpeed);
  pushBullet(state, {
    x: state.ship.x,
    y: state.ship.y,
    vx, vy,
    damage,
    radius: BLASTER.bulletRadius,
    kind: 'bolt',
    pierce: 1 + (state.chipEffects?.pierce ?? 0),
    hitRefs: [],
  });
  setCooldown(state, stats.blasterRate ?? 2);
  return true;
}

function fireMortar(state, level) {
  if (weaponCooldownLeft(state) > 0) return false;
  const def = weaponById('mortar');
  const stats = weaponStats(def, level);
  const target = nearestTarget(state, stats.range);
  if (!target) return false;
  const damage = stats.damage * overdriveMult(state);
  const baseAngle = Math.atan2(target.y - state.ship.y, target.x - state.ship.x);
  // Two shells (Lv 5+) fan out slightly so they do not stack on one line.
  const spread = stats.shells > 1 ? [-0.1, 0.1] : [0];
  for (const off of spread) {
    const angle = baseAngle + off;
    pushBullet(state, {
      x: state.ship.x,
      y: state.ship.y,
      vx: Math.cos(angle) * def.bulletSpeed,
      vy: Math.sin(angle) * def.bulletSpeed,
      damage,
      radius: def.bulletRadius,
      kind: 'shell',
      blastRadius: stats.blastRadius,
      dist: 0,
      maxDist: stats.range,
    });
  }
  setCooldown(state, stats.rate);
  return true;
}

function fireLaser(state, level) {
  if (weaponCooldownLeft(state) > 0) return false;
  const def = weaponById('laser');
  const stats = weaponStats(def, level);
  const target = nearestTarget(state, stats.range);
  if (!target) return false;
  const damage = stats.damage * overdriveMult(state);
  const { vx, vy } = aimAt(state, target, def.bulletSpeed);
  pushBullet(state, {
    x: state.ship.x,
    y: state.ship.y,
    vx, vy,
    damage,
    radius: def.bulletRadius,
    kind: 'laser',
    pierce: 1 + stats.pierce + (state.chipEffects?.pierce ?? 0),
    hitRefs: [],
  });
  setCooldown(state, stats.rate);
  return true;
}

function pushPulseFx(state, x1, y1, x2, y2) {
  if (!state.pulseFx) state.pulseFx = [];
  state.pulseFx.push({ x1, y1, x2, y2, ttl: PULSE_FX_TTL });
}

function firePulse(state, level) {
  if (weaponCooldownLeft(state) > 0) return false;
  const def = weaponById('pulse');
  const stats = weaponStats(def, level);
  const first = nearestTarget(state, stats.range);
  if (!first) return false;
  const mult = overdriveMult(state);
  const hitRefs = [first.ref];
  pushPulseFx(state, state.ship.x, state.ship.y, first.x, first.y);
  applyPulseHit(state, first, stats.damage * mult);
  let from = first;
  for (let jump = 0; jump < stats.chains; jump += 1) {
    const next = nearestChainTarget(state, from, hitRefs);
    if (!next) break;
    hitRefs.push(next.ref);
    pushPulseFx(state, from.x, from.y, next.x, next.y);
    applyPulseHit(state, next, stats.damage * 0.7 * mult);
    from = next;
  }
  setCooldown(state, stats.rate);
  return true;
}

/** Nearest enemy/boss/orb within CHAIN_RADIUS of `from`, excluding already-hit refs. */
function nearestChainTarget(state, from, hitRefs) {
  let best = null;
  let bestDist = CHAIN_RADIUS;
  const consider = (x, y, kind, ref) => {
    if (hitRefs.includes(ref)) return;
    const d = Math.hypot(x - from.x, y - from.y);
    if (d <= bestDist) {
      bestDist = d;
      best = { x, y, kind, ref };
    }
  };
  for (const enemy of state.enemies || []) consider(enemy.x, enemy.y, enemy.kind || 'drifter', enemy);
  if (state.boss) consider(state.boss.x, state.boss.y, state.boss.kind || 'boss', state.boss);
  for (const orb of state.enemyBullets || []) consider(orb.x, orb.y, 'enemyBullet', orb);
  return best;
}

/** Apply one pulse hit: enemies take damage (kills score, chain spark may fire), the boss loses hp, orbs pop. */
function applyPulseHit(state, target, damage) {
  const effects = state.chipEffects ?? null;
  if (target.kind === 'enemyBullet') {
    destroyOrb(state, target.ref, null, effects);
  } else if (target.ref === state.boss) {
    state.boss.hp -= damage;
  } else {
    damageEnemy(state, target.ref, damage, null, true, effects);
  }
}

/**
 * Fire the equipped weapon (state.weaponId, default 'blaster').
 * Weapon level comes from state.weaponLevels[id] (default 1 — Wave C
 * fills it from save.weapons). Blaster delegates to fireBlaster.
 * Sets both cooldown fields. Returns true when a shot fired.
 */
function fireWeapon(state) {
  const id = state.weaponId ?? 'blaster';
  const def = weaponById(id);
  if (!def) return false;
  const level = (state.weaponLevels && state.weaponLevels[id]) || 1;
  if (id === 'blaster') return fireBlaster(state);
  if (id === 'mortar') return fireMortar(state, level);
  if (id === 'laser') return fireLaser(state, level);
  if (id === 'pulse') return firePulse(state, level);
  return false;
}

// --- Bullet updates ----------------------------------------------------

function rollRandom(state) {
  const r = state.random;
  if (typeof r === 'function') return r();
  if (r && typeof r.next === 'function') return r.next();
  return Math.random();
}

/** Destroy one enemy bullet (orb). With the Bullet Ward chip, grants a shield (see header). */
function destroyOrb(state, orb, burst, effects) {
  const orbs = state.enemyBullets || [];
  const idx = orbs.indexOf(orb);
  if (idx < 0) return false;
  orbs.splice(idx, 1);
  if (burst) burst(orb.x, orb.y);
  if (effects?.bulletWard) {
    state.shield = true;
    state.shieldTimer = 2;
  }
  return true;
}

/**
 * Damage one enemy; on death remove it, award its kill points (plus a
 * floater and gate progress), and — when allowChainSpark and the Chain
 * Spark chip is equipped — roll to chain 1 damage to the nearest
 * other enemy within CHAIN_RADIUS (with a pulseFx segment). A
 * chain-spark kill never chains again.
 */
function damageEnemy(state, enemy, damage, burst, allowChainSpark, effects) {
  if (!state.enemies || !state.enemies.includes(enemy)) return false;
  enemy.hp -= damage;
  if (burst) burst(enemy.x, enemy.y);
  if (enemy.hp > 0) return false;
  const idx = state.enemies.indexOf(enemy);
  if (idx >= 0) state.enemies.splice(idx, 1);
  const points = ENEMY_KILL_POINTS[enemy.kind] ?? 25;
  state.score = (state.score ?? 0) + points;
  if (!state.floaters) state.floaters = [];
  state.floaters.push({ x: enemy.x, y: enemy.y, text: `+${points}` });
  if (typeof state.stageTarget === 'number' && state.stageTarget > 0) {
    state.gateProgress = Math.min(1, state.score / state.stageTarget);
  }
  if (allowChainSpark && (effects?.chainSpark ?? 0) > 0 && rollRandom(state) < effects.chainSpark) {
    let best = null;
    let bestDist = CHAIN_RADIUS;
    for (const other of state.enemies) {
      const d = Math.hypot(other.x - enemy.x, other.y - enemy.y);
      if (d <= bestDist) {
        bestDist = d;
        best = other;
      }
    }
    if (best) {
      pushPulseFx(state, enemy.x, enemy.y, best.x, best.y);
      damageEnemy(state, best, 1, burst, false, effects);
    }
  }
  return true;
}

/** A shell bursts: everything within blastRadius takes its damage (enemies, boss, orbs). */
function explodeShell(state, shell, burst, effects) {
  const radius = shell.blastRadius ?? 60;
  if (burst) burst(shell.x, shell.y);
  for (const enemy of [...(state.enemies || [])]) {
    if (Math.hypot(enemy.x - shell.x, enemy.y - shell.y) <= radius + hitRadius(enemy)) {
      damageEnemy(state, enemy, shell.damage, burst, true, effects);
    }
  }
  if (state.boss && Math.hypot(state.boss.x - shell.x, state.boss.y - shell.y) <= radius + hitRadius(state.boss)) {
    state.boss.hp -= shell.damage;
    if (burst) burst(state.boss.x, state.boss.y);
  }
  for (const orb of [...(state.enemyBullets || [])]) {
    if (Math.hypot(orb.x - shell.x, orb.y - shell.y) <= radius + (orb.radius ?? 6)) {
      destroyOrb(state, orb, burst, effects);
    }
  }
}

/**
 * Consume one hit of a piercing bolt/laser: record the ref so the
 * same target is never hit twice, decrement pierce, and return true
 * when the bolt is spent.
 */
function consumePierce(bullet, ref) {
  if (typeof bullet.pierce !== 'number') return true;
  if (!bullet.hitRefs) bullet.hitRefs = [];
  bullet.hitRefs.push(ref);
  bullet.pierce -= 1;
  return bullet.pierce <= 0;
}

/**
 * Move bullets, resolve hits, drop spent/offscreen ones. A hit on an
 * enemy reduces its hp (a `burst` spark on hit when the callback is
 * given); at hp <= 0 the enemy is removed, its kill points are added
 * to state.score, a '+N' floater is pushed, and state.gateProgress is
 * refreshed when state.stageTarget is a finite number. A hit on the
 * boss reduces state.boss.hp (boss death is the world's job — it
 * watches state.boss.hp <= 0). A hit on an enemy bullet (magenta orb)
 * destroys the orb with a spark and no score — shooting orbs is
 * defensive, not a farm. `burst` is an optional (x, y) callback.
 *
 * Extended for the stage-2 roster (bullet.kind 'bolt' | 'shell' |
 * 'laser'; bullets without a kind behave as plain 'bolt's):
 *   bolt/laser: pierce — bullet.pierce is the remaining hits (1 for a
 *     plain bolt); each hit consumes one and the bolt is spent at 0.
 *     A bolt never hits the same target twice (bullet.hitRefs).
 *   shell: bursts on impact (AoE damage within bullet.blastRadius)
 *     and on fuse expiry (bullet.dist >= bullet.maxDist). Offscreen
 *     shells just despawn.
 * Also decays state.pulseFx entries by dt.
 */
function updateBullets(state, dt, burst) {
  const width = state.width ?? FIELD.width;
  const height = state.height ?? FIELD.height;
  const margin = 60;
  const effects = state.chipEffects ?? null;
  if (state.pulseFx) {
    state.pulseFx = state.pulseFx
      .map((seg) => ({ ...seg, ttl: seg.ttl - dt }))
      .filter((seg) => seg.ttl > 0);
  }
  const bullets = state.bullets || [];
  const kept = [];
  for (const b of bullets) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (typeof b.dist === 'number') b.dist += Math.hypot(b.vx, b.vy) * dt;
    if (b.x < -margin || b.x > width + margin || b.y < -margin || b.y > height + margin) continue;
    let spent = false;
    // Shell fuse expiry: burst where the shell ends its flight.
    if (!spent && b.kind === 'shell' && typeof b.dist === 'number'
      && typeof b.maxDist === 'number' && b.dist >= b.maxDist) {
      explodeShell(state, b, burst, effects);
      spent = true;
    }
    // Enemies first (snapshot: kills splice state.enemies mid-loop).
    if (!spent) {
      for (const enemy of [...(state.enemies || [])]) {
        if (spent) break;
        if (!state.enemies.includes(enemy)) continue;
        if (b.hitRefs && b.hitRefs.includes(enemy)) continue;
        if (Math.hypot(enemy.x - b.x, enemy.y - b.y) <= (b.radius ?? BLASTER.bulletRadius) + hitRadius(enemy)) {
          if (b.kind === 'shell') {
            explodeShell(state, b, burst, effects);
            spent = true;
            break;
          }
          damageEnemy(state, enemy, b.damage, burst, true, effects);
          spent = consumePierce(b, enemy);
        }
      }
    }
    // Then the boss.
    if (!spent && state.boss) {
      const boss = state.boss;
      if (!(b.hitRefs && b.hitRefs.includes(boss))
        && Math.hypot(boss.x - b.x, boss.y - b.y) <= (b.radius ?? BLASTER.bulletRadius) + hitRadius(boss)) {
        if (b.kind === 'shell') {
          explodeShell(state, b, burst, effects);
          spent = true;
        } else {
          boss.hp -= b.damage;
          if (burst) burst(b.x, b.y);
          spent = consumePierce(b, boss);
        }
      }
    }
    // Last: an enemy bullet (magenta orb) is 1 HP — the bolt pops it
    // with a spark and no score. Enemies and the boss are checked
    // first, so one bolt never wastes itself on an orb in their way.
    if (!spent) {
      const orbs = state.enemyBullets || [];
      for (const orb of [...orbs]) {
        if (spent) break;
        if (!orbs.includes(orb)) continue;
        if (b.hitRefs && b.hitRefs.includes(orb)) continue;
        if (Math.hypot(orb.x - b.x, orb.y - b.y) <= (b.radius ?? BLASTER.bulletRadius) + (orb.radius ?? 6)) {
          if (b.kind === 'shell') {
            explodeShell(state, b, burst, effects);
            spent = true;
            break;
          }
          destroyOrb(state, orb, burst, effects);
          spent = consumePierce(b, orb);
        }
      }
    }
    if (!spent) kept.push(b);
  }
  state.bullets = kept;
}

// ---- src/world.js ----
// Lumen Drift — the world: the skiff, the storm field, and the rules.
// Everything the game simulates lives in one plain state object so the
// renderer, the screenshots and the tests all read the same truth.
//
// Entities: star shards (collect for points), void mines (slow, spiky,
// drifting), storm shards (fast, sharp), shield cells (one free hit),
// enemies (drifters, darts, bulwarks, spitters) and stage bosses.
// Picking up shards in a row without a hit raises the combo x1..x5; a hit
// resets it. Every 200 points the level rises: spawns quicken and
// everything drifts faster, with no cap — upgrade picks keep coming.
// A stage clears when its score target is reached (or its boss dies).

const KIND_SHARD = 'shard';
const KIND_MINE = 'mine';
const KIND_STORM = 'storm';
const KIND_SHIELD = 'shield';

const EVENT_NONE = 0;
const EVENT_PICKUP = 1;
const EVENT_HIT = 2;
const EVENT_SHIELD = 4;
const EVENT_OVER = 8;
const EVENT_DASH = 32;
const EVENT_LEVELUP = 64;
const EVENT_NEARMISS = 128;
const EVENT_CLEAR = 256;

// Spark Lv 1: the starter ship's stats, used when the caller passes no
// shipStats (the world never reads the save — the caller passes plain
// stats, see ships.js shipStats()).
const DEFAULT_SHIP_STATS = {
  hearts: 3, speedMult: 1, blasterDamage: 1, blasterRate: 2, level: 1,
};

// Enemy shape per kind: radius, drift speed and the weight in the spawn
// pick (renormalised over the kinds a stage has unlocked).
const ENEMY_DEFS = {
  drifter: { radius: 15, speed: 55, weight: 0.5 },
  dart: { radius: 11, speed: 190, weight: 0.25 },
  bulwark: { radius: 24, speed: 30, weight: 0.15 },
  spitter: { radius: 14, speed: 40, weight: 0.1 },
};

// Seconds between a spitter's shots; the last 0.5 s is its telegraph.
const SPITTER_SHOOT_EVERY = 3;
const SPITTER_TELEGRAPH = 0.5;
// Seconds after a boss stage starts before the boss arrives.
const BOSS_SPAWN_DELAY = 1.5;
// Seconds of telegraph before a boss attack fires (renderer flashes it).
const BOSS_TELEGRAPH = 0.8;

function freshUpgrades() {
  const counts = {};
  for (const def of UPGRADES) counts[def.id] = 0;
  return counts;
}

function makeShip() {
  return {
    x: FIELD.width / 2,
    y: FIELD.height * 0.62,
    vx: 0,
    vy: 0,
    angle: -Math.PI / 2,
    dashTime: 0,
    dashCooldown: 0,
    invulnerable: 0,
  };
}

// No chip equipped: every effect off (chipEffectsFor returns this
// shape too — see chips.js).
function zeroChipEffects() {
  return {
    pierce: 0,
    dashMine: false,
    shardBonus: 0,
    dashCooldownMult: 1,
    chainSpark: 0,
    bulletWard: false,
    heartSiphon: 0,
    overdrive: false,
  };
}

function freshRunStats() {
  return { kills: 0, bulletsDestroyed: 0, bossKilled: false, noDamage: true };
}

function createWorld(random, hangarLevels = {}, shipStats = null, loadout = {}) {
  const state = {
    // The seeded random source, kept on state so weapons.js can roll
    // the Chain Spark chance deterministically (state.random).
    random,
    time: 0,
    score: 0,
    bestCombo: 0,
    combo: 0,
    comboCount: 0,
    hearts: HEARTS,
    maxHearts: HEARTS,
    upgrades: freshUpgrades(),
    shardsCollected: 0,
    goldenCollected: 0,
    nearMisses: 0,
    magnetRadius: 0,
    // Seconds left of the faint ring that visualises the magnet radius
    // once, right after it grows (a new SHARD MAGNET stack).
    magnetFlash: 0,
    prevMagnetRadius: null,
    shardBonus: 0,
    pendingLevelUps: 0,
    level: 1,
    shield: false,
    // Permanent hangar bonuses (levels per part; all 0 for a fresh ship).
    hangar: { hull: 0, engine: 0, shield: 0, magnet: 0, collector: 0, ...hangarLevels },
    // Equipped ship's stats (plain data, passed by the caller — never
    // the save). Speed and blaster read these live; hearts apply on reset().
    shipStats: { ...DEFAULT_SHIP_STATS, ...(shipStats || {}) },
    // Endless mode: true once the player continues past a stage clear.
    endless: false,
    // Stage mode: the stage being played (1..100) and its score target;
    // endless runs use stage 0 and an Infinite target.
    stage: 1,
    stageTarget: stageTarget(1),
    ship: makeShip(),
    shards: [],
    mines: [],
    storms: [],
    shields: [],
    enemies: [],
    bullets: [],
    enemyBullets: [],
    boss: null,
    blasterCooldown: 0,
    // The equipped weapon (Wave A roster): id, level, and every owned
    // weapon's level — fireWeapon reads weaponLevels[id].
    weaponId: 'blaster',
    weaponLevel: 1,
    weaponLevels: { blaster: 1 },
    weaponCooldown: 0,
    // The equipped ship's unique power (ships.js) and its id.
    shipId: 'spark',
    powerId: 'second-wind',
    // Slotted chips' live effects (chips.js chipEffectsFor). Pierce,
    // Overdrive, Chain Spark and Bullet Ward are applied inside
    // weapons.js from this object; the world applies the rest.
    chipEffects: zeroChipEffects(),
    // Chain-lightning visuals (pulseFx segments, ttl-decayed by
    // updateBullets) and dash mines (traps: {x, y, r, damage, ttl}).
    pulseFx: [],
    traps: [],
    // Bullet Ward (chip): weapons.js sets shield + shieldTimer = 2
    // when an orb is destroyed. wardShield marks the current shield
    // as the ward's — only the ward's shield is cleared when the
    // timer runs out (a cell / Aegis / hangar shield supersedes it).
    shieldTimer: 0,
    wardShield: false,
    // Ship-power state: Second Wind used, dash charges (Dual Dash),
    // per-dash Nova Dash hit set, shards since the last Heart Siphon
    // heal, and the per-run counters for XP / achievements.
    secondWindUsed: false,
    dashCharges: 1,
    dashMaxCharges: 1,
    novaHit: new Set(),
    shardsSinceHeal: 0,
    runStats: freshRunStats(),
    // Merged in-run upgrades (upgrades.js MERGES), cleared per run.
    merged: {},
    cleared: false,
    bossSpawnTimer: 0,
    particles: [],
    trail: [],
    stars: [],
    gateOpen: false,
    gateProgress: 0,
    spawnTimers: { shard: 0.2, mine: 1.2, storm: 2.0, shield: 8, enemy: 1.5 },
    shieldEvery: SPAWN.shieldEvery,
    flashes: 0,
    // Juice state (Stage 4): floating score texts, the animated score,
    // hit-stop freeze, screen shake, and the combo pop pulse.
    floaters: [],
    displayScore: 0,
    hitStop: 0,
    shakeTime: 0,
    shakeMag: 0,
    comboPulse: 0,
    // Silent mercy bookkeeping: recent hit times (for the DDA shield).
    hitTimes: [],
    lastMercyAt: -999,
  };

  // The loadout (weapon, chips, ship) applies on top of the defaults
  // above; setLoadout is hoisted, so this runs before any step.
  setLoadout(loadout);

  // Three parallax star layers, seeded once per world.
  for (let layer = 0; layer < 3; layer += 1) {
    for (let i = 0; i < 42 - layer * 10; i += 1) {
      state.stars.push({
        x: random.range(0, FIELD.width),
