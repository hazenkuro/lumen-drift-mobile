<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lumen Drift — a neon arcade game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1026; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* On-screen touch buttons: hidden on desktop, shown on touch devices. */
  .touch-btn {
    display: none;
    position: fixed;
    z-index: 10;
    border: 2px solid rgba(34, 211, 238, 0.8);
    background: rgba(11, 16, 38, 0.55);
    color: #a5f3fc;
    font: bold 16px sans-serif;
    border-radius: 999px;
    touch-action: none;
    cursor: pointer;
  }
  .touch-btn:active { background: rgba(34, 211, 238, 0.35); }
  #btn-dash {
    right: max(18px, env(safe-area-inset-right));
    bottom: max(18px, env(safe-area-inset-bottom));
    width: 84px; height: 84px;
    font-size: 17px;
    letter-spacing: 1px;
  }
  #btn-pause {
    right: max(18px, env(safe-area-inset-right));
    top: max(14px, env(safe-area-inset-top));
    width: 48px; height: 48px;
    font-size: 18px;
  }
  #btn-fullscreen {
    right: max(78px, calc(env(safe-area-inset-right) + 60px));
    top: max(14px, env(safe-area-inset-top));
    width: 48px; height: 48px;
    font-size: 18px;
  }
  #btn-fullscreen.on { background: rgba(34, 211, 238, 0.35); }
  /* Nudge portrait phone players toward landscape, where the field is big. */
  #rotate-hint {
    display: none;
    position: fixed;
    left: 50%;
    top: max(10px, env(safe-area-inset-top));
    transform: translateX(-50%);
    z-index: 10;
    color: #fbbf24;
    font: bold 14px sans-serif;
    background: rgba(11, 16, 38, 0.75);
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid rgba(251, 191, 36, 0.6);
    pointer-events: none;
    white-space: nowrap;
  }
  @media (pointer: coarse) {
    .touch-btn { display: block; }
  }
  @media (pointer: coarse) and (orientation: portrait) {
    #rotate-hint { display: block; }
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Lumen Drift: steer the light-skiff, collect star shards, dodge void mines and storm shards, reach 1,200 points to open the Aurora Gate"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="rotate-hint">📱 Rotate to landscape — the field is much bigger sideways!</div>
<button id="btn-dash" class="touch-btn" type="button" aria-label="Dash">DASH</button>
<button id="btn-pause" class="touch-btn" type="button" aria-label="Pause">❚❚</button>
<button id="btn-fullscreen" class="touch-btn" type="button" aria-label="Fullscreen">⛶</button>
<script type="module">
// ---- src/config.js ----
// Lumen Drift — tuning constants. One place holds every number that shapes
// how the game feels, so balancing is editing values here, never hunting
// through the world or the renderer.
const FIELD = { width: 1280, height: 720 };

// Fixed simulation step: the world advances in 1/60 s slices.
const STEP = 1 / 60;

// The goal: reach this score and the Aurora Gate opens.
const WIN_SCORE = 1200;
const HEARTS = 3;

// Star shards: base points, and the combo ladder (consecutive pickups with
// no hit multiply the base; every 3 pickups steps the combo up one rung).
// Combo caps at x5.
const SHARD_POINTS = 10;
const COMBO_MAX = 5;

// The skiff: how fast it flies, how hard the dash kicks, how long the dash
// lasts and how long the player waits before dashing again.
const SHIP = {
  radius: 16,
  accel: 2600,
  maxSpeed: 420,
  drag: 2.6,
  dashSpeed: 950,
  dashTime: 0.16,
  dashCooldown: 1.4,
  // Mercy: 1.5 s of flashing invulnerability after every hit.
  invulnerableTime: 1.5,
};

// Grace after resuming from a level-up choice (seconds of invulnerability
// while the player re-orients on the busiest frame of the run).
const UPGRADE_GRACE = 2;

// Difficulty ramps one level every 200 points, up to level 5.
const LEVEL_EVERY = 200;
const LEVEL_MAX = 5;

// Spawn pacing, in seconds between spawns at level 1; each level multiplies
// the rate by SPAWN_GROWTH, so the field gets busier as the score climbs —
// but more slowly than before (0.88, not 0.82), and never past the caps.
const SPAWN = {
  shardEvery: 0.55,
  mineEvery: 1.5,
  stormEvery: 2.4,
  shieldEvery: 14,
  growth: 0.88,
};

// Max concurrent threats per level (index = level - 1). The field can no
// longer saturate: level 1 holds at most 8 mines + 2 storms.
const SPAWN_CAPS = {
  mine: [8, 10, 12, 14, 16],
  storm: [2, 2, 3, 3, 4],
};

// Storms are gated early: at level 1 they spawn 3x slower, at level 2
// 1.5x slower (index = level - 1) — almost no storms before level 2-3.
const STORM_GATE = [3, 1.5, 1, 1, 1];

// Nothing spawns within this many field units of the ship.
const SAFE_SPAWN_RADIUS = 150;

// Silent dynamic difficulty (never shown to the player): two hits within
// this window spawn a mercy shield cell, at most once per cooldown.
const DDA_HIT_WINDOW = 10;
const DDA_MERCY_COOLDOWN = 20;

// Drift speeds (pixels per second) at level 1; each level adds SPEED_GROWTH.
const DRIFT = {
  mine: 55,
  storm: 190,
  shard: 40,
  speedGrowth: 0.12,
};

// Endless mode (after the Aurora Gate opens): difficulty keeps scaling
// past level 5, gently — one extra mine cap per level up to 22, one extra
// storm cap every two levels up to 6, spawn rates stop quickening past
// level 9, drift speed caps at 2x. The run ends only when the ship dies.
const ENDLESS_MINE_CAP_MAX = 22;
const ENDLESS_STORM_CAP_MAX = 6;
const ENDLESS_RATE_LEVEL_MAX = 9;
const ENDLESS_SPEED_MAX = 2.0;

// Shard magnet tuning (see upgrades.js): the innate pull radius is ~1.5x
// the ship's width, so the magnet forgives a near-miss on aim instead of
// vacuuming the field. Pull accelerates toward the ship and tops out
// faster than the ship itself, so a shard streaks in on a short arc.
const MAGNET_BASE_RADIUS = 48;
const MAGNET_PULL_ACCEL = 1400;
const MAGNET_PULL_MAX_SPEED = 560;

// Best score is kept in local storage under this key.
const BEST_KEY = 'lumen-drift-best';
// Lifetime star shards (all runs) and the chosen ship skin.
const SHARDS_KEY = 'lumen-drift-shards';
const SKIN_KEY = 'lumen-drift-skin';

// ---- src/random.js ----
// Lumen Drift — a small seeded random generator (mulberry32). The game uses
// it for every spawn, drift angle and star placement, so `?seed=N` replays
// the exact same storm and every screenshot is reproducible. A seed of 0
// is replaced with a fixed fallback so the generator never sits at zero.
function createRandom(seed) {
  let state = (seed >>> 0) || 0x9e3779b9;
  function next() {
    state = (state + 0x6d2b79f5) >>> 0;
    let t = state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  return {
    // A float in [0, 1).
    next,
    // A float in [min, max).
    range(min, max) {
      return min + (max - min) * next();
    },
    // An integer in [min, max] inclusive.
    int(min, max) {
      return min + Math.floor(next() * (max - min + 1));
    },
    // One element of an array, picked at random.
    pick(list) {
      return list[Math.floor(next() * list.length)];
    },
  };
}

// ---- src/upgrades.js ----
// Lumen Drift — in-run upgrades and ship skins.
//
// Upgrades are picked 1-of-3 on every level-up (levels 2-5, so four picks
// per run). Each upgrade is a plain definition: id, English name, one-line
// description, max stacks, an `available(state)` gate and an `apply(state)`
// that mutates the world state. Nothing here touches the DOM or storage,
// so the whole pool is unit-testable from a bare world state.
//
// Derived numbers (dash cooldown/speed, max speed, shard points, magnet
// radius) are computed from the stack counts, with the config constants
// as bases — the world re-derives them every step, so the stored fields
// can never go stale.

const UPGRADE_HEART = 'heart';
const UPGRADE_SWIFT = 'swift';
const UPGRADE_LONG = 'long';
const UPGRADE_MAGNET = 'magnet';
const UPGRADE_AEGIS = 'aegis';
const UPGRADE_GOLDEN = 'golden';

// Hull hearts cap at 5 total (start at 3, so at most 2 heart picks).
const MAX_HEARTS = 5;
// Dash cooldown never drops below this, however many SWIFT DASH stacks.
const DASH_COOLDOWN_FLOOR = 0.6;
// Magnet pull radius per stack (index = stacks held). The innate radius
// (0 stacks) is MAGNET_BASE_RADIUS: ~1.5x the ship's width, so the magnet
// forgives a near-miss on aim. Each stack adds ~+30-35% — the Vampire
// Survivors-proven +25%/rank step, rounded so the radius stays a whole
// number of field units. A maxed magnet (3 stacks) reaches 144 px: a
// visible help, never a vacuum. Compare the old values (160/240/320),
// which pulled shards in from across the screen.
const MAGNET_RADII = [48, 80, 112, 144];
// Extra points per shard, per GOLDEN SHARDS stack.
const GOLDEN_POINTS = 5;

const UPGRADES = [
  {
    id: UPGRADE_HEART,
    name: 'HULL HEART',
    desc: '+1 hull heart (max 5).',
    max: 2,
    available: (state) => state.maxHearts < MAX_HEARTS + (state.hangar?.hull ?? 0),
    apply: (state) => {
      state.maxHearts += 1;
      state.hearts = Math.min(state.maxHearts, state.hearts + 1);
    },
  },
  {
    id: UPGRADE_SWIFT,
    name: 'SWIFT DASH',
    desc: 'Dash recharges 25% faster.',
    max: 3,
    available: (state) => (state.upgrades.swift || 0) < 3,
    apply: () => {},
  },
  {
    id: UPGRADE_LONG,
    name: 'LONG DASH',
    desc: '+12% dash and top speed.',
    max: 3,
    available: (state) => (state.upgrades.long || 0) < 3,
    apply: () => {},
  },
  {
    id: UPGRADE_MAGNET,
    name: 'SHARD MAGNET',
    desc: 'Pulls nearby shards to you.',
    max: 3,
    available: (state) => (state.upgrades.magnet || 0) < 3,
    apply: (state) => {
      state.magnetRadius = MAGNET_RADII[state.upgrades.magnet || 0];
    },
  },
  {
    id: UPGRADE_AEGIS,
    name: 'AEGIS SHIELD',
    desc: 'Gain a shield — blocks one hit.',
    // No stack cap: it can be picked again once the shield is spent.
    // The gate below (no shield held) is what limits it.
    max: Infinity,
    available: (state) => !state.shield,
    apply: (state) => {
      state.shield = true;
    },
  },
  {
    id: UPGRADE_GOLDEN,
    name: 'GOLDEN SHARDS',
    desc: '+5 points per star shard.',
    max: 2,
    available: (state) => (state.upgrades.golden || 0) < 2,
    apply: (state) => {
      state.shardBonus = GOLDEN_POINTS * (state.upgrades.golden || 0);
    },
  },
];

function upgradeById(id) {
  return UPGRADES.find((u) => u.id === id) || null;
}

function stacksOf(state, id) {
  return (state.upgrades && state.upgrades[id]) || 0;
}

// --- Derived numbers (config constants as bases) -------------------------

function effectiveDashCooldown(state) {
  return Math.max(
    DASH_COOLDOWN_FLOOR,
    SHIP.dashCooldown * Math.pow(0.75, stacksOf(state, UPGRADE_SWIFT)),
  );
}

function effectiveDashSpeed(state) {
  return SHIP.dashSpeed * (1 + 0.12 * stacksOf(state, UPGRADE_LONG))
    * (1 + 0.08 * (state.hangar?.engine ?? 0));
}

function effectiveMaxSpeed(state) {
  return SHIP.maxSpeed * (1 + 0.12 * stacksOf(state, UPGRADE_LONG))
    * (1 + 0.08 * (state.hangar?.engine ?? 0));
}

/** Base points one shard is worth, before the combo multiplier. */
function shardPointsFor(state) {
  return SHARD_POINTS
    + GOLDEN_POINTS * stacksOf(state, UPGRADE_GOLDEN)
    + 2 * (state.hangar?.collector ?? 0);
}

function magnetRadiusFor(state) {
  return MAGNET_RADII[stacksOf(state, UPGRADE_MAGNET)] || 0;
}

/** Hangar magnet: +30 pickup radius per TRACTOR MAGNET level (was +80 —
the old step vacuumed the field; the new step keeps the magnet a choice,
not a given). */
function hangarMagnetRadius(state) {
  return 30 * (state.hangar?.magnet ?? 0);
}

// --- Picking ---------------------------------------------------------------

/** True when this upgrade may currently be offered. */
function isAvailable(state, def) {
  return def.available(state);
}

/**
 * Apply one upgrade pick to the world state. Returns false when the
 * upgrade is not currently available (maxed out, shield already held,
 * hearts at cap) — the caller then offers something else instead.
 */
function applyUpgrade(state, id) {
  const def = upgradeById(id);
  if (!def || !def.available(state)) return false;
  if (!state.upgrades) state.upgrades = {};
  state.upgrades[id] = (state.upgrades[id] || 0) + 1;
  def.apply(state);
  return true;
}

/**
 * Draw up to 3 DISTINCT upgrades the player may pick right now.
 * `rng` is a () => [0,1) function (defaults to Math.random); passing a
 * seeded one keeps draws deterministic in tests. Returns fewer than 3
 * only when fewer are available — never crashes, never repeats an id.
 */
function drawUpgrades(state, rng = Math.random) {
  const pool = UPGRADES.filter((def) => def.available(state));
  for (let i = pool.length - 1; i > 0; i -= 1) {
    const j = Math.floor(rng() * (i + 1));
    const tmp = pool[i];
    pool[i] = pool[j];
    pool[j] = tmp;
  }
  return pool.slice(0, 3);
}

// ---- src/world.js ----
// Lumen Drift — the world: the skiff, the storm field, and the rules.
// Everything the game simulates lives in one plain state object so the
// renderer, the screenshots and the tests all read the same truth.
//
// Entities: star shards (collect for points), void mines (slow, spiky,
// drifting), storm shards (fast, sharp), shield cells (one free hit).
// Picking up shards in a row without a hit raises the combo x1..x5; a hit
// resets it. Every 200 points the level rises (1..5): spawns quicken and
// everything drifts faster. At 1,200 points the Aurora Gate opens: win.

const KIND_SHARD = 'shard';
const KIND_MINE = 'mine';
const KIND_STORM = 'storm';
const KIND_SHIELD = 'shield';

const EVENT_NONE = 0;
const EVENT_PICKUP = 1;
const EVENT_HIT = 2;
const EVENT_SHIELD = 4;
const EVENT_OVER = 8;
const EVENT_WIN = 16;
const EVENT_DASH = 32;
const EVENT_LEVELUP = 64;
const EVENT_NEARMISS = 128;

function freshUpgrades() {
  const counts = {};
  for (const def of UPGRADES) counts[def.id] = 0;
  return counts;
}

function makeShip() {
  return {
    x: FIELD.width / 2,
    y: FIELD.height * 0.62,
    vx: 0,
    vy: 0,
    angle: -Math.PI / 2,
    dashTime: 0,
    dashCooldown: 0,
    invulnerable: 0,
  };
}

function createWorld(random, hangarLevels = {}) {
  const state = {
    time: 0,
    score: 0,
    bestCombo: 0,
    combo: 0,
    comboCount: 0,
    hearts: HEARTS,
    maxHearts: HEARTS,
    upgrades: freshUpgrades(),
    shardsCollected: 0,
    goldenCollected: 0,
    nearMisses: 0,
    magnetRadius: 0,
    // Seconds left of the faint ring that visualises the magnet radius
    // once, right after it grows (a new SHARD MAGNET stack).
    magnetFlash: 0,
    prevMagnetRadius: null,
    shardBonus: 0,
    pendingLevelUps: 0,
    level: 1,
    shield: false,
    // Permanent hangar bonuses (levels per part; all 0 for a fresh ship).
    hangar: { hull: 0, engine: 0, shield: 0, magnet: 0, collector: 0, ...hangarLevels },
    // Endless mode: true once the player continues past the Aurora Gate.
    endless: false,
    ship: makeShip(),
    shards: [],
    mines: [],
    storms: [],
    shields: [],
    particles: [],
    trail: [],
    stars: [],
    gateOpen: false,
    gateProgress: 0,
    spawnTimers: { shard: 0.2, mine: 1.2, storm: 2.0, shield: 8 },
    shieldEvery: SPAWN.shieldEvery,
    flashes: 0,
    // Juice state (Stage 4): floating score texts, the animated score,
    // hit-stop freeze, screen shake, and the combo pop pulse.
    floaters: [],
    displayScore: 0,
    hitStop: 0,
    shakeTime: 0,
    shakeMag: 0,
    comboPulse: 0,
    // Silent mercy bookkeeping: recent hit times (for the DDA shield).
    hitTimes: [],
    lastMercyAt: -999,
  };

  // Three parallax star layers, seeded once per world.
  for (let layer = 0; layer < 3; layer += 1) {
    for (let i = 0; i < 42 - layer * 10; i += 1) {
      state.stars.push({
        x: random.range(0, FIELD.width),
        y: random.range(0, FIELD.height),
        layer,
        size: random.range(0.6, 1.4 + layer * 0.5),
        twinkle: random.range(0, Math.PI * 2),
      });
    }
  }

  function levelFor(score) {
    // The campaign caps at level 5; endless keeps counting past it, one
    // level per 200 points, so upgrade picks keep coming.
    if (state.endless) return 1 + Math.floor(score / LEVEL_EVERY);
    return Math.min(LEVEL_MAX, 1 + Math.floor(score / LEVEL_EVERY));
  }

  function speedScale() {
    // Drift speed grows with level but caps at 2x, even in endless.
    return Math.min(ENDLESS_SPEED_MAX, 1 + (state.level - 1) * DRIFT.speedGrowth);
  }

  function spawnRate(base) {
    // Spawn pacing stops quickening past level 9, even in endless.
    const rateLevel = Math.min(state.level, ENDLESS_RATE_LEVEL_MAX);
    return base * Math.pow(SPAWN.growth, rateLevel - 1);
  }

  // Max concurrent threats at the current level. In endless the mine cap
  // climbs +1 per level (to 22) and the storm cap +1 every two levels
  // (to 6) — the field keeps getting busier, but never saturates.
  function mineCap() {
    if (state.level <= LEVEL_MAX) return SPAWN_CAPS.mine[state.level - 1];
    return Math.min(SPAWN_CAPS.mine[LEVEL_MAX - 1] + (state.level - LEVEL_MAX), ENDLESS_MINE_CAP_MAX);
  }

  function stormCap() {
    if (state.level <= LEVEL_MAX) return SPAWN_CAPS.storm[state.level - 1];
    return Math.min(
      SPAWN_CAPS.storm[LEVEL_MAX - 1] + Math.floor((state.level - LEVEL_MAX) / 2),
      ENDLESS_STORM_CAP_MAX,
    );
  }

  // True when a candidate spawn point is clear of the ship.
  function farFromShip(x, y) {
    return Math.hypot(x - state.ship.x, y - state.ship.y) >= SAFE_SPAWN_RADIUS;
  }

  function burst(x, y, color, count, speed) {
    for (let i = 0; i < count; i += 1) {
      const angle = random.range(0, Math.PI * 2);
      const v = random.range(speed * 0.3, speed);
      state.particles.push({
        x, y,
        vx: Math.cos(angle) * v,
        vy: Math.sin(angle) * v,
        life: random.range(0.3, 0.8),
        maxLife: 0.8,
        size: random.range(1.5, 4),
        color,
      });
    }
  }

  function spawnShard() {
    state.shards.push({
      x: random.range(40, FIELD.width - 40),
      y: -20,
      vy: DRIFT.shard * speedScale() * random.range(0.7, 1.4),
      vx: random.range(-18, 18),
      radius: 10,
      spin: random.range(0, Math.PI * 2),
      spinSpeed: random.range(1.5, 3.5),
      pulse: random.range(0, Math.PI * 2),
      // Rare variable reward: ~1 in 30 shards is golden, worth 50 points.
      golden: random.next() < 1 / 30,
      // Magnet pull velocity (world units/s); the magnet block below
      // accelerates it toward the ship, the drift loop applies it.
      pvx: 0,
      pvy: 0,
    });
  }

  // Returns false when no safe spot was found in 8 tries — the spawn is
  // skipped instead of dropping a mine on the player.
  function spawnMine() {
    for (let attempt = 0; attempt < 8; attempt += 1) {
      const fromLeft = random.next() < 0.5;
      const x = fromLeft ? -24 : FIELD.width + 24;
      const y = random.range(60, FIELD.height - 60);
      if (!farFromShip(x, y)) continue;
      state.mines.push({
        x,
        y,
        vx: (fromLeft ? 1 : -1) * DRIFT.mine * speedScale() * random.range(0.8, 1.3),
        vy: random.range(-14, 14),
        radius: random.range(15, 20),
        spin: random.range(0, Math.PI * 2),
        spinSpeed: random.range(0.6, 1.6),
        pulse: random.range(0, Math.PI * 2),
        // Telegraph: age ramps 0 -> 1 over the first ~0.3 s; the renderer
        // fades the mine in and draws a warning ring while it is young.
        age: 0,
        nearMissed: false,
      });
      return true;
    }
    return false;
  }

  function spawnStorm() {
    for (let attempt = 0; attempt < 8; attempt += 1) {
      const angle = random.range(Math.PI * 0.15, Math.PI * 0.85);
      const fromTop = random.next() < 0.6;
      const x = random.range(40, FIELD.width - 40);
      const y = fromTop ? -24 : FIELD.height + 24;
      if (!farFromShip(x, y)) continue;
      state.storms.push({
        x,
        y,
        vx: Math.cos(angle) * DRIFT.storm * speedScale() * random.range(0.85, 1.25) * (random.next() < 0.5 ? -1 : 1),
        vy: (fromTop ? 1 : -1) * Math.sin(angle) * DRIFT.storm * speedScale() * random.range(0.85, 1.25),
        radius: 9,
        spin: random.range(0, Math.PI * 2),
        spinSpeed: random.range(4, 7),
        age: 0,
        nearMissed: false,
      });
      return true;
    }
    return false;
  }

  function spawnShield() {
    state.shields.push({
      x: random.range(60, FIELD.width - 60),
      y: -20,
      vy: 55,
      radius: 13,
      pulse: random.range(0, Math.PI * 2),
    });
  }

  function reset() {
    state.time = 0;
    state.score = 0;
    state.bestCombo = 0;
    state.combo = 0;
    state.comboCount = 0;
    // Hangar bonuses apply from the start of every run: extra max hearts
    // (and the hearts to fill them), a starting shield at AEGIS Lv1.
    state.hearts = HEARTS + (state.hangar.hull || 0);
    state.maxHearts = HEARTS + (state.hangar.hull || 0);
    state.upgrades = freshUpgrades();
    state.shardsCollected = 0;
    state.nearMisses = 0;
    state.magnetRadius = 0;
    state.magnetFlash = 0;
    state.prevMagnetRadius = null;
    state.shardBonus = 0;
    state.pendingLevelUps = 0;
    state.level = 1;
    state.shield = (state.hangar.shield || 0) >= 1;
    state.endless = false;
    state.ship = makeShip();
    state.shards = [];
    state.mines = [];
    state.storms = [];
    state.shields = [];
    state.particles = [];
    state.trail = [];
    state.gateOpen = false;
    state.gateProgress = 0;
    state.goldenCollected = 0;
    state.spawnTimers = { shard: 0.2, mine: 1.2, storm: 2.0, shield: 8 };
    // AEGIS PLATING Lv2: shield cells spawn twice as often.
    state.shieldEvery = (state.hangar.shield || 0) >= 2 ? SPAWN.shieldEvery / 2 : SPAWN.shieldEvery;
    state.flashes = 0;
    state.floaters = [];
    state.displayScore = 0;
    state.hitStop = 0;
    state.shakeTime = 0;
    state.shakeMag = 0;
    state.comboPulse = 0;
    state.hitTimes = [];
    state.lastMercyAt = -999;
  }

  // Advance the world one fixed step. `steer` is the normalised keyboard
  // vector, `pointer` the mouse target (or null), `dash` a dash request.
  // Returns a bitmask of events that happened this step.
  function step(dt, steer, pointer, dash) {
    let events = EVENT_NONE;
    state.time += dt;
    state.level = levelFor(state.score);
    const levelAtStart = state.level;
    // Derived upgrade numbers are re-computed every step from the stack
    // counts, so they can never go stale. The magnet radius is the hangar
    // magnet plus the in-run SHARD MAGNET stacks.
    state.magnetRadius = hangarMagnetRadius(state) + magnetRadiusFor(state);
    state.shardBonus = shardPointsFor(state) - SHARD_POINTS;
    // The magnet ring flashes once when the radius grows mid-run (a new
    // SHARD MAGNET stack) — it teaches the radius, then hides. The first
    // step of a run seeds the previous radius instead of flashing.
    if (state.prevMagnetRadius === null) {
      state.prevMagnetRadius = state.magnetRadius;
    } else if (state.magnetRadius > state.prevMagnetRadius) {
      state.magnetFlash = 1.5;
      state.prevMagnetRadius = state.magnetRadius;
    }
    state.magnetFlash = Math.max(0, state.magnetFlash - dt);
    const ship = state.ship;

    // --- Spawning ---------------------------------------------------------
    state.spawnTimers.shard -= dt;
    state.spawnTimers.mine -= dt;
    state.spawnTimers.storm -= dt;
    state.spawnTimers.shield -= dt;
    if (state.spawnTimers.shard <= 0) { spawnShard(); state.spawnTimers.shard = spawnRate(SPAWN.shardEvery); }
    // Spawn caps: the field never holds more than the per-level max.
    if (state.spawnTimers.mine <= 0) {
      if (state.mines.length < mineCap()) spawnMine();
      state.spawnTimers.mine = spawnRate(SPAWN.mineEvery);
    }
    if (state.spawnTimers.storm <= 0) {
      if (state.storms.length < stormCap()) spawnStorm();
      // Storms are gated early (nearly none at level 1-2); past level 5
      // the gate stays at its level-5 value.
      state.spawnTimers.storm = spawnRate(SPAWN.stormEvery) * STORM_GATE[Math.min(state.level, LEVEL_MAX) - 1];
    }
    if (state.spawnTimers.shield <= 0 && !state.shield) { spawnShield(); state.spawnTimers.shield = state.shieldEvery; }

    // --- Ship steering ----------------------------------------------------
    // Keyboard steers directly. With no keys, a held pointer steers:
    // touch is RELATIVE (the ship follows the finger's delta from where
    // it landed — relX/relY already carry direction and magnitude, with
    // a dead zone applied in input.js), mouse stays ABSOLUTE (the ship
    // chases the cursor, exactly as before).
    let ax = steer.x * SHIP.accel;
    let ay = steer.y * SHIP.accel;
    if ((steer.x === 0 && steer.y === 0) && pointer && pointer.active && pointer.down) {
      if (pointer.mode === 'relative') {
        ax = pointer.relX * SHIP.accel;
        ay = pointer.relY * SHIP.accel;
      } else {
        const dx = pointer.x - ship.x;
        const dy = pointer.y - ship.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 12) {
          ax = (dx / dist) * SHIP.accel;
          ay = (dy / dist) * SHIP.accel;
        }
      }
    }
    if (ship.dashTime > 0) {
      ship.dashTime -= dt;
    } else {
      ship.vx += ax * dt;
      ship.vy += ay * dt;
      const drag = Math.max(0, 1 - SHIP.drag * dt);
      ship.vx *= drag;
      ship.vy *= drag;
      const speed = Math.hypot(ship.vx, ship.vy);
      const maxSpeed = effectiveMaxSpeed(state);
      if (speed > maxSpeed) {
        ship.vx = (ship.vx / speed) * maxSpeed;
        ship.vy = (ship.vy / speed) * maxSpeed;
      }
    }
    if (dash && ship.dashCooldown <= 0 && ship.dashTime <= 0) {
      let dx = steer.x;
      let dy = steer.y;
      if (dx === 0 && dy === 0) {
        dx = Math.cos(ship.angle);
        dy = Math.sin(ship.angle);
      }
      const len = Math.hypot(dx, dy) || 1;
      ship.vx = (dx / len) * effectiveDashSpeed(state);
      ship.vy = (dy / len) * effectiveDashSpeed(state);
      ship.dashTime = SHIP.dashTime;
      ship.dashCooldown = effectiveDashCooldown(state);
      ship.invulnerable = Math.max(ship.invulnerable, SHIP.dashTime + 0.08);
      events |= EVENT_DASH;
      burst(ship.x, ship.y, '#22d3ee', 10, 160);
    }
    ship.dashCooldown = Math.max(0, ship.dashCooldown - dt);
    ship.invulnerable = Math.max(0, ship.invulnerable - dt);
    ship.x += ship.vx * dt;
    ship.y += ship.vy * dt;
    ship.x = Math.max(SHIP.radius, Math.min(FIELD.width - SHIP.radius, ship.x));
    ship.y = Math.max(SHIP.radius, Math.min(FIELD.height - SHIP.radius, ship.y));
    if (Math.hypot(ship.vx, ship.vy) > 40) {
      ship.angle = Math.atan2(ship.vy, ship.vx);
    }

    // Engine trail: a fading ribbon behind the skiff.
    state.trail.push({ x: ship.x, y: ship.y, life: 0.35, maxLife: 0.35 });
    if (state.trail.length > 26) state.trail.shift();
    for (const dot of state.trail) dot.life -= dt;
    state.trail = state.trail.filter((dot) => dot.life > 0);

    // --- Entities drift ---------------------------------------------------
    // SHARD MAGNET: shards inside the magnet radius accelerate toward the
    // skiff (up to MAGNET_PULL_MAX_SPEED, faster than the ship) instead
    // of teleporting at a constant speed — a short streaking arc, not a
    // vacuum. The pull velocity fades fast outside the radius, so a shard
    // that slips past keeps its drift. Mines are never pulled.
    if (state.magnetRadius > 0) {
      for (const s of state.shards) {
        const dx = ship.x - s.x;
        const dy = ship.y - s.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 1 && dist < state.magnetRadius) {
          s.pvx = (s.pvx ?? 0) + (dx / dist) * MAGNET_PULL_ACCEL * dt;
          s.pvy = (s.pvy ?? 0) + (dy / dist) * MAGNET_PULL_ACCEL * dt;
          const pv = Math.hypot(s.pvx, s.pvy);
          if (pv > MAGNET_PULL_MAX_SPEED) {
            s.pvx = (s.pvx / pv) * MAGNET_PULL_MAX_SPEED;
            s.pvy = (s.pvy / pv) * MAGNET_PULL_MAX_SPEED;
          }
        } else {
          s.pvx = (s.pvx ?? 0) * 0.8;
          s.pvy = (s.pvy ?? 0) * 0.8;
        }
      }
    }
    for (const s of state.shards) {
      s.y += s.vy * dt;
      s.x += s.vx * dt + Math.sin(state.time * 2 + s.pulse) * 12 * dt;
      s.x += (s.pvx ?? 0) * dt;
      s.y += (s.pvy ?? 0) * dt;
      s.spin += s.spinSpeed * dt;
      s.pulse += dt;
    }
    for (const m of state.mines) {
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      m.spin += m.spinSpeed * dt;
      m.pulse += dt;
      m.age = (m.age ?? 0) + dt;
    }
    for (const s of state.storms) {
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.spin += s.spinSpeed * dt;
      s.age = (s.age ?? 0) + dt;
    }
    for (const s of state.shields) {
      s.y += s.vy * dt;
      s.pulse += dt;
    }
    const offscreen = (e) => e.y > FIELD.height + 40 || e.y < -60 || e.x < -60 || e.x > FIELD.width + 60;
    state.shards = state.shards.filter((e) => !offscreen(e));
    state.mines = state.mines.filter((e) => !offscreen(e));
    state.storms = state.storms.filter((e) => !offscreen(e));
    state.shields = state.shields.filter((e) => !offscreen(e));

    // --- Particles --------------------------------------------------------
    for (const p of state.particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.98;
      p.vy *= 0.98;
      p.life -= dt;
    }
    state.particles = state.particles.filter((p) => p.life > 0);
    state.flashes = Math.max(0, state.flashes - dt * 3);

    // --- Near misses ------------------------------------------------------
    // A mine/storm that slips past within ~40 px of the hitbox without
    // touching earns a one-time "CLOSE! +5" (never while invulnerable,
    // so i-frames cannot be farmed).
    if (ship.invulnerable <= 0) {
      for (const list of [state.mines, state.storms]) {
        for (const e of list) {
          if (e.nearMissed) continue;
          const d = Math.hypot(e.x - ship.x, e.y - ship.y);
          const hitDist = SHIP.radius * 0.8 + e.radius * 0.85;
          if (d >= hitDist && d < hitDist + 40) {
            e.nearMissed = true;
            state.nearMisses += 1;
            state.score += 5;
            state.gateProgress = Math.min(1, state.score / WIN_SCORE);
            state.floaters.push({
              x: e.x, y: e.y - 10, text: 'CLOSE! +5',
              life: 0.9, maxLife: 0.9, color: '#a5f3fc',
            });
            events |= EVENT_NEARMISS;
            if (state.score >= WIN_SCORE && !state.gateOpen) {
              state.gateOpen = true;
              events |= EVENT_WIN;
            }
          }
        }
      }
    }

    // --- Pickups ----------------------------------------------------------
    const collect = (list, radius, onCollect) => {
      for (let i = list.length - 1; i >= 0; i -= 1) {
        const e = list[i];
        if (Math.hypot(e.x - ship.x, e.y - ship.y) < radius + e.radius) {
          list.splice(i, 1);
          onCollect(e);
        }
      }
    };
    collect(state.shards, SHIP.radius, (e) => {
      state.comboCount += 1;
      state.shardsCollected += 1;
      state.combo = Math.min(COMBO_MAX, 1 + Math.floor(state.comboCount / 3));
      state.bestCombo = Math.max(state.bestCombo, state.combo);
      // A golden shard pays a flat 50 (no combo multiplier) — the rare
      // spike is the reward, not the multiplier.
      const gained = e.golden ? 50 : shardPointsFor(state) * state.combo;
      if (e.golden) state.goldenCollected = (state.goldenCollected || 0) + 1;
      state.score += gained;
      state.level = levelFor(state.score);
      state.gateProgress = Math.min(1, state.score / WIN_SCORE);
      state.floaters.push({
        x: e.x, y: e.y - 10,
        text: e.golden ? 'GOLDEN +50' : `+${gained}`,
        life: 0.9, maxLife: 0.9, color: e.golden ? '#fde047' : '#fbbf24',
      });
      state.comboPulse = 1;
      burst(e.x, e.y, e.golden ? '#fde047' : '#fbbf24', e.golden ? 22 : 12, e.golden ? 320 : 200);
      events |= EVENT_PICKUP;
      if (state.score >= WIN_SCORE && !state.gateOpen) {
        state.gateOpen = true;
        events |= EVENT_WIN;
      }
    });
    // A level risen during this step queues one upgrade choice per level
    // (normally exactly one — a shard is worth at most 60 points).
    if (state.level > levelAtStart) {
      state.pendingLevelUps += state.level - levelAtStart;
      events |= EVENT_LEVELUP;
    }
    collect(state.shields, SHIP.radius, (e) => {
      state.shield = true;
      burst(e.x, e.y, '#34d399', 14, 180);
      events |= EVENT_SHIELD;
    });

    // --- Hits -------------------------------------------------------------
    const hitBy = (list) => {
      if (ship.invulnerable > 0) return false;
      for (let i = list.length - 1; i >= 0; i -= 1) {
        const e = list[i];
        if (Math.hypot(e.x - ship.x, e.y - ship.y) < SHIP.radius * 0.8 + e.radius * 0.85) {
          list.splice(i, 1);
          return true;
        }
      }
      return false;
    };
    const hit = hitBy(state.mines) || hitBy(state.storms);
    if (hit) {
      state.combo = 0;
      state.comboCount = 0;
      state.flashes = 1;
      // Juice: freeze ~0.06 s on the hit and jolt the field ~3 px.
      state.hitStop = 0.06;
      state.shakeTime = 0.1;
      state.shakeMag = 3;
      state.comboPulse = 0;
      burst(ship.x, ship.y, '#f472b6', 22, 320);
      if (state.shield) {
        state.shield = false;
        ship.invulnerable = SHIP.invulnerableTime;
        events |= EVENT_SHIELD;
      } else {
        state.hearts -= 1;
        ship.invulnerable = SHIP.invulnerableTime;
        events |= EVENT_HIT;
        if (state.hearts <= 0) events |= EVENT_OVER;
        // Silent mercy (DDA — never announced): two quick hits drop a
        // shield cell near the ship so one mistake does not end the run.
        state.hitTimes.push(state.time);
        state.hitTimes = state.hitTimes.filter((t) => state.time - t <= DDA_HIT_WINDOW);
        if (state.hitTimes.length >= 2 && !state.shield && state.shields.length === 0
          && state.time - state.lastMercyAt > DDA_MERCY_COOLDOWN) {
          state.lastMercyAt = state.time;
          state.shields.push({
            x: Math.max(60, Math.min(FIELD.width - 60, ship.x + 180)),
            y: Math.max(60, Math.min(FIELD.height - 60, ship.y - 120)),
            vy: 55,
            radius: 13,
            pulse: 0,
          });
        }
      }
    }

    // --- Juice decay + animated score -------------------------------------
    // Floaters rise and fade; the combo pop and the shake decay; the
    // displayed score counts up toward the real score instead of jumping.
    for (const f of state.floaters) {
      f.y -= 30 * dt;
      f.life -= dt;
    }
    state.floaters = state.floaters.filter((f) => f.life > 0);
    state.comboPulse = Math.max(0, state.comboPulse - dt * 3);
    state.shakeTime = Math.max(0, state.shakeTime - dt);
    if (state.displayScore !== state.score) {
      const diff = state.score - state.displayScore;
      const stepAmt = Math.max(1, Math.abs(diff) * Math.min(1, dt * 8));
      state.displayScore += Math.sign(diff) * Math.min(Math.abs(diff), stepAmt);
      if (Math.abs(state.score - state.displayScore) < 1) state.displayScore = state.score;
    }

    return events;
  }

  // Invulnerability for a few seconds (e.g. after resuming from a
  // level-up); never shortens invulnerability already held.
  function grantGrace(seconds) {
    state.ship.invulnerable = Math.max(state.ship.invulnerable, seconds);
  }

  // Replace the hangar levels (e.g. after loading the save) — they apply
  // on the next reset(), i.e. at the start of the next run.
  function setHangar(levels) {
    state.hangar = { hull: 0, engine: 0, shield: 0, magnet: 0, collector: 0, ...levels };
  }

  // Continue past the Aurora Gate: the run goes endless. The gate is
  // already open, so the win can never re-trigger; levels keep rising
  // one per 200 points and upgrade picks keep coming with them.
  function enterEndless() {
    state.endless = true;
    state.gateOpen = true;
    state.gateProgress = 1;
  }

  return { state, reset, step, burst, grantGrace, setHangar, enterEndless };
}

// ---- src/skins.js ----
// Lumen Drift — ship skins: cosmetic hull colours unlocked by lifetime
// star shards (total shards collected across ALL runs). Skins never change
// the ship shape or hitbox — hull, glow, flame and trail colours only.
//
// Persistence lives here so it is testable with a fake storage object;
// main.js passes window.localStorage. Every read/write is guarded, so
// private windows (storage off) just fall back to the default skin.

const DEFAULT_SKIN_ID = 'cyan';

// Unlock thresholds: the first skin (EMBER) is earnable on day 1-2
// (~2-3 good runs), so the first trophy lands fast; later skins space
// out by gates, days and score milestones. Skins are milestone trophies,
// not shop filler — the next one is always visible-but-locked as the
// home-screen goal.
const SKINS = [
  {
    id: 'cyan', name: 'CYAN', unlock: 0,
    hull: '#0891b2', glow: '#22d3ee', flame: '#f97316', flameGlow: '#fb923c', trail: '#22d3ee',
  },
  {
    id: 'ember', name: 'EMBER', unlock: 200,
    hull: '#c2410c', glow: '#fb923c', flame: '#fbbf24', flameGlow: '#fb923c', trail: '#fb923c',
  },
  {
    id: 'violet', name: 'VIOLET', unlock: 1000,
    hull: '#6d28d9', glow: '#a78bfa', flame: '#e879f9', flameGlow: '#c084fc', trail: '#a78bfa',
  },
  {
    id: 'aurora', name: 'AURORA', unlock: 2500,
    hull: '#059669', glow: '#34d399', flame: '#6ee7b7', flameGlow: '#34d399', trail: '#34d399',
  },
  {
    id: 'solar', name: 'SOLAR', unlock: 4500,
    hull: '#b45309', glow: '#fbbf24', flame: '#fde68a', flameGlow: '#f59e0b', trail: '#fbbf24',
  },
  {
    id: 'nova', name: 'NOVA', unlock: 7500,
    hull: '#be185d', glow: '#f472b6', flame: '#67e8f9', flameGlow: '#22d3ee', trail: '#f472b6',
  },
];

function skinById(id) {
  return SKINS.find((s) => s.id === id) || SKINS[0];
}

/** Every skin the lifetime total has unlocked, in unlock order. */
function unlockedSkins(lifetimeShards) {
  return SKINS.filter((s) => lifetimeShards >= s.unlock);
}

/**
 * The next skin still locked, with progress toward it — or null when
 * every skin is unlocked.
 */
function nextUnlock(lifetimeShards) {
  const next = SKINS.find((s) => lifetimeShards < s.unlock);
  return next ? { skin: next, have: lifetimeShards, need: next.unlock } : null;
}

function loadLifetimeShards(storage) {
  try {
    return Number.parseInt(storage.getItem(SHARDS_KEY) ?? '0', 10) || 0;
  } catch {
    return 0;
  }
}

function saveLifetimeShards(storage, value) {
  try {
    storage.setItem(SHARDS_KEY, String(value));
  } catch {
    // Storage can be off (private windows): progress lasts this visit.
  }
}

/** Saved skin id, falling back to the default when it is locked/unknown. */
function loadSkinId(storage, lifetimeShards) {
  try {
    const id = storage.getItem(SKIN_KEY);
    const skin = id ? SKINS.find((s) => s.id === id) : null;
    if (skin && lifetimeShards >= skin.unlock) return skin.id;
  } catch {
    // Fall through to the default.
  }
  return DEFAULT_SKIN_ID;
}

function saveSkinId(storage, id) {
  try {
    storage.setItem(SKIN_KEY, id);
  } catch {
    // Storage can be off: the choice lasts this visit.
  }
}

// ---- src/view.js ----
// Lumen Drift — the one mapping between the world (1280x720) and the screen.
// The renderer AND the pointer input both use this, so what you see is where
// the game thinks things are.
//
// The field is scaled UNIFORMLY and letterboxed: one factor for both axes,
// centred, so a circle in the world is a circle on screen, the ship's drawn
// position is its collision position, and a touch lands where the finger is.
//
// (The old code scaled X and Y separately — scale vs scaleY — and drew the
// ship with the X factor on both axes, so on any screen that is not exactly
// 16:9 the ship appeared somewhere else than where it collided.)

/** Uniform scale + letterbox offsets for a CSS-pixel box. */
function viewTransform(cssWidth, cssHeight) {
  const scale = Math.min(cssWidth / FIELD.width, cssHeight / FIELD.height);
  const ox = (cssWidth - FIELD.width * scale) / 2;
  const oy = (cssHeight - FIELD.height * scale) / 2;
  return { scale, ox, oy };
}

/** A client (pointer) position, in CSS pixels, converted to world units. */
function toWorld(clientX, clientY, rect) {
  const t = viewTransform(rect.width, rect.height);
  return {
    x: (clientX - rect.left - t.ox) / t.scale,
    y: (clientY - rect.top - t.oy) / t.scale,
  };
}

/** A world position converted to CSS-pixel screen coordinates. */
function toScreen(worldX, worldY, cssWidth, cssHeight) {
  const t = viewTransform(cssWidth, cssHeight);
  return { x: t.ox + worldX * t.scale, y: t.oy + worldY * t.scale };
}

// ---- src/input.js ----
// Lumen Drift — keyboard, mouse and touch input. Arrows/WASD steer, Space
// or a click dashes, P pauses, R restarts, M mutes, F toggles fullscreen,
// Enter/click confirms.
// The pointer also steers: holding the mouse down — or dragging a finger —
// pulls the skiff toward it, in world coordinates (view.js), so the ship
// goes where the finger actually points on any screen shape.
//
// On touch, a drag only steers: it never dashes (every touch used to dash,
// which made the game unplayable on phones). Dashing on touch is the
// on-screen DASH button, bound through bindButton(). Input is polled each
// frame, and one-shot actions (dash, pause, restart) are edge-triggered so
// holding a key does not repeat them.

const ACTION_CONFIRM = 'confirm';
const ACTION_PAUSE = 'pause';
const ACTION_RESTART = 'restart';
const ACTION_MUTE = 'mute';
const ACTION_DASH = 'dash';
const ACTION_FULLSCREEN = 'fullscreen';
const ACTION_PICK_1 = 'pick-1';
const ACTION_PICK_2 = 'pick-2';
const ACTION_PICK_3 = 'pick-3';

const KEY_ACTIONS = {
  Enter: ACTION_CONFIRM,
  Space: ACTION_DASH,
  KeyP: ACTION_PAUSE,
  Escape: ACTION_PAUSE,
  KeyR: ACTION_RESTART,
  KeyM: ACTION_MUTE,
  KeyF: ACTION_FULLSCREEN,
  Digit1: ACTION_PICK_1,
  Digit2: ACTION_PICK_2,
  Digit3: ACTION_PICK_3,
};

function isTouchDevice() {
  return (typeof window !== 'undefined' && window.matchMedia
    && window.matchMedia('(pointer: coarse)').matches)
    || (typeof window !== 'undefined' && 'ontouchstart' in window);
}

function createInput(canvas) {
  const keys = new Set();
  const pressed = new Set();
  // The steering pointer, in field coordinates. Touch steers RELATIVE
  // (a floating joystick: the ship follows the finger's delta from where
  // it landed, so the thumb never covers the ship); mouse keeps the old
  // absolute behaviour (the ship chases the cursor). `relX/relY` is the
  // normalised joystick vector (-1..1, magnitude = how far the finger
  // has dragged past the dead zone); `dragStartX/Y` is the joystick
  // origin the renderer draws. `dragLocked` flips on once the finger has
  // moved past the tap threshold — from then on this pointer is a drag,
  // never a tap.
  const pointer = {
    x: 0, y: 0, down: false, active: false,
    id: null, isTouch: false, mode: 'absolute',
    relX: 0, relY: 0,
    dragStartX: 0, dragStartY: 0, dragLocked: false,
  };
  // Relative-steering tuning (field units): moves inside the dead zone
  // steer nothing; past it the vector grows to full deflection at
  // DEAD_ZONE + REL_RANGE; past REL_RANGE it stays clamped.
  const DEAD_ZONE = 10;
  const REL_RANGE = 80;
  const DRAG_LOCK_DIST = 12;
  // The most recent canvas press, in field coordinates, waiting to be
  // read once (upgrade-card and title skin-preview taps). DOM buttons
  // never set it: they are not children of the canvas and bindButton
  // stops their presses, so a DASH/pause tap can never pick a card.
  let tap = null;
  // Upgrade-screen input gate (Stage 1 fix for the stale-tap bug): after
  // armGate(), input is ignored until the lockout has elapsed AND the
  // steering finger has been lifted. A tap stored during play can never
  // auto-pick a card, because armGate() clears it and the gate swallows
  // anything pressed while it is closed.
  let gateUntil = 0;
  let liftNeeded = false;

  function nowMs() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now();
    return Date.now();
  }

  function onKeyDown(event) {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(event.code)) {
      event.preventDefault();
    }
    if (!event.repeat) pressed.add(KEY_ACTIONS[event.code] ?? event.code);
    keys.add(event.code);
  }

  function onKeyUp(event) {
    keys.delete(event.code);
  }

  function pointerPosition(event) {
    const rect = canvas.getBoundingClientRect();
    const world = toWorld(event.clientX, event.clientY, rect);
    pointer.x = world.x;
    pointer.y = world.y;
  }

  function onPointerDown(event) {
    pointerPosition(event);
    // Touches that start on the letterbox bars (outside the field) are
    // ignored: they used to drag the ship to the edge and stick it there.
    if (pointer.x < 0 || pointer.x > FIELD.width || pointer.y < 0 || pointer.y > FIELD.height) return;
    // Multi-touch isolation: the first finger owns steering; a second
    // finger on the canvas cannot reset the drag or trigger a tap/card.
    if (pointer.down) return;
    pointer.down = true;
    pointer.active = true;
    pointer.id = event.pointerId ?? null;
    pointer.isTouch = event.pointerType === 'touch';
    pointer.mode = pointer.isTouch ? 'relative' : 'absolute';
    pointer.dragStartX = pointer.x;
    pointer.dragStartY = pointer.y;
    pointer.dragLocked = false;
    pointer.relX = 0;
    pointer.relY = 0;
    tap = { x: pointer.x, y: pointer.y };
    // A press confirms on menus. A mouse click also dashes in play;
    // a touch drag only steers — startGame() drains the queue on launch,
    // so a launch press never dashes by accident.
    pressed.add(ACTION_CONFIRM);
    if (event.pointerType !== 'touch') pressed.add(ACTION_DASH);
  }

  function onPointerUp(event) {
    // Only the steering finger's release ends the drag; another finger
    // lifting must not stop steering. (Events without an id clear all.)
    if (event && event.pointerId != null && pointer.id != null && event.pointerId !== pointer.id) return;
    pointer.down = false;
    pointer.id = null;
    pointer.relX = 0;
    pointer.relY = 0;
    pointer.dragLocked = false;
    // The steering finger is up: a gated screen may accept input now.
    liftNeeded = false;
  }

  function onPointerCancel(event) {
    onPointerUp(event);
  }

  function onPointerMove(event) {
    pointerPosition(event);
    pointer.active = true;
    // Only the steering finger moves the joystick.
    if (!pointer.down || (event.pointerId != null && pointer.id != null && event.pointerId !== pointer.id)) return;
    if (pointer.mode !== 'relative') return;
    const dx = pointer.x - pointer.dragStartX;
    const dy = pointer.y - pointer.dragStartY;
    const dist = Math.hypot(dx, dy);
    if (dist > DRAG_LOCK_DIST && !pointer.dragLocked) {
      // Drag-lock: this pointer is a drag now, never a tap.
      pointer.dragLocked = true;
      tap = null;
    }
    if (dist <= DEAD_ZONE) {
      pointer.relX = 0;
      pointer.relY = 0;
      return;
    }
    const mag = Math.min(1, (dist - DEAD_ZONE) / REL_RANGE);
    pointer.relX = (dx / dist) * mag;
    pointer.relY = (dy / dist) * mag;
  }

  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  canvas.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerCancel);
  canvas.addEventListener('pointermove', onPointerMove);

  return {
    // Steering vector from keys, normalised (-1..1 on each axis).
    steer() {
      let x = 0;
      let y = 0;
      if (keys.has('ArrowLeft') || keys.has('KeyA')) x -= 1;
      if (keys.has('ArrowRight') || keys.has('KeyD')) x += 1;
      if (keys.has('ArrowUp') || keys.has('KeyW')) y -= 1;
      if (keys.has('ArrowDown') || keys.has('KeyS')) y += 1;
      if (x !== 0 && y !== 0) {
        const inv = 1 / Math.hypot(x, y);
        x *= inv;
        y *= inv;
      }
      return { x, y };
    },
    // Where the pointer is (world units), and whether it is steering now.
    pointer() {
      return pointer;
    },
    // True once for each press of the named action since the last poll.
    consume(action) {
      if (pressed.has(action)) {
        pressed.delete(action);
        return true;
      }
      return false;
    },
    // Drain one-shot presses (used when changing screens).
    clearPressed() {
      pressed.clear();
    },
    // Drop the stored tap without reading it. Call on EVERY screen
    // transition, together with clearPressed(): a steering tap left over
    // from play must never be read as a menu tap on the next screen.
    clearTap() {
      tap = null;
    },
    // Close the input gate for 400 ms and require the steering finger to
    // be lifted first (when it is down now). Call when an overlay that
    // takes taps appears (the LEVEL UP cards). `now` is injectable so
    // tests can drive the clock.
    armGate(now = nowMs()) {
      gateUntil = now + 400;
      liftNeeded = pointer.down;
      tap = null;
    },
    // True when a gated screen may accept taps / pick keys again: the
    // lockout has elapsed and no steering finger is still held down.
    gateOpen(now = nowMs()) {
      return now >= gateUntil && !liftNeeded;
    },
    // The last canvas tap (field coordinates), or null when none is
    // waiting. Reading it consumes it, so one tap picks at most once.
    takeTap() {
      const taken = tap;
      tap = null;
      return taken;
    },
    // Wire an on-screen button (e.g. the touch DASH / pause buttons) to
    // a one-shot action. The button swallows the press so the canvas
    // never also steers or dashes from it.
    bindButton(element, action) {
      element.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        event.stopPropagation();
        pressed.add(action);
      });
    },
  };
}

// ---- src/audio.js ----
// Lumen Drift — all sound is synthesised with WebAudio: short oscillator
// bleeps shaped by a gain envelope. No audio files, no network, and nothing
// plays until the player first interacts (browsers require a gesture).
const NOTE = {
  pickup: [880, 1320],
  dash: [220, 440],
  hit: [160, 90],
  shield: [520, 780, 1040],
  win: [523, 659, 784, 1047],
  levelup: [660, 880, 1320],
  over: [392, 311, 233],
  click: [660],
};

function createAudio() {
  let context = null;
  let muted = false;

  // Lazily create the context on first use, inside a user gesture.
  function ensure() {
    if (context === null) {
      const AudioContext = window.AudioContext ?? window.webkitAudioContext;
      if (!AudioContext) return null;
      context = new AudioContext();
    }
    if (context.state === 'suspended') void context.resume();
    return context;
  }

  // Play one note: a sine/triangle blip that rises or falls in pitch.
  function tone(freq, when, duration, type, volume) {
    const ctx = ensure();
    if (ctx === null || muted) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime + when);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime + when);
    gain.gain.exponentialRampToValueAtTime(volume, ctx.currentTime + when + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + when + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime + when);
    osc.stop(ctx.currentTime + when + duration + 0.05);
  }

  function play(name, type = 'sine', volume = 0.12) {
    const notes = NOTE[name];
    if (!notes) return;
    notes.forEach((freq, index) => {
      tone(freq, index * 0.07, 0.16, type, volume);
    });
  }

  return {
    // Unlock audio from a gesture (start click / key press).
    unlock() {
      ensure();
    },
    // A higher combo sings higher, and a little louder: the pitch climbs
    // with the streak, so a good run sounds like a good run. Each pickup
    // also jitters ±5% so repeated pickups never sound identical.
    pickup(combo) {
      const jitter = 0.95 + Math.random() * 0.1;
      const base = (660 + combo * 90) * jitter;
      tone(base, 0, 0.12, 'sine', 0.1);
      tone(base * 1.5, 0.05, 0.14, 'sine', 0.09);
    },
    // Near-miss whoosh: a short high blip, distinct from a pickup.
    close() {
      tone(1560, 0, 0.09, 'sine', 0.08);
      tone(2080, 0.04, 0.1, 'sine', 0.06);
    },
    dash() {
      play('dash', 'triangle', 0.1);
    },
    hit() {
      play('hit', 'sawtooth', 0.14);
    },
    shield() {
      play('shield', 'sine', 0.11);
    },
    win() {
      play('win', 'sine', 0.13);
    },
    levelup() {
      play('levelup', 'sine', 0.11);
    },
    over() {
      play('over', 'triangle', 0.13);
    },
    click() {
      play('click', 'sine', 0.07);
    },
    toggleMute() {
      muted = !muted;
      return muted;
    },
    // The settings panel drives these (muted is persisted in the save).
    setMuted(value) {
      muted = !!value;
      return muted;
    },
    isMuted() {
      return muted;
    },
  };
}

// ---- src/progress.js ----
// Lumen Drift — local progress: one versioned localStorage blob holding
// the best score, local top-5 + run history, lifetime stats, the daily
// streak and the daily missions. Everything is local (no server, no
// account): a global leaderboard needs the CrazyGames SDK at Full Launch
// and is out of scope. Loads are defensive — a corrupt or old save falls
// back to a fresh one, seeded from the legacy best/shards keys.
//
// Daily rewards: a 7-day escalating calendar (day 7 is the big one). The
// streak NEVER resets to zero on one missed day — one free miss per
// 7-day cycle (a streak-freeze) keeps it alive; only two missed days in
// a row restart the count at 1. The reward is claimed from the calendar
// panel (shown on day-2 opens, or from the flame badge) — it is never
// silently auto-granted, so the calendar is the reason to open tomorrow.
//
// Missions: three a day, one per tier (easy / medium / hard), picked
// deterministically by date from a pool — completable in one session,
// rewards above the passive earn rate, finishing all three pays a bonus
// chest (+100 shards), and one mission can be rerolled per day.
const SAVE_KEY = 'lumen-drift-save';
const SAVE_VERSION = 3;

// Daily-reward calendar: shards per cycle day (day 7 is visibly best).
const DAILY_REWARDS = [10, 15, 20, 30, 40, 50, 100];
// Bonus chest for completing all three daily missions.
const ALL_MISSIONS_BONUS = 100;
// One mission reroll per day.
const DAILY_REROLLS = 1;

// Daily missions, one per tier each day. `stat` names the run-stat field
// they read; every mission is a single-run achievement, so progress is
// the best run of the day.
const MISSION_POOLS = {
  easy: [
    { id: 'shards30', name: 'Collect 30 shards', stat: 'shards', target: 30, reward: 25, tier: 'easy' },
    { id: 'score300', name: 'Score 300 in one run', stat: 'score', target: 300, reward: 25, tier: 'easy' },
    { id: 'dash5', name: 'Dash 5 times', stat: 'dashes', target: 5, reward: 25, tier: 'easy' },
  ],
  medium: [
    { id: 'shards50', name: 'Collect 50 shards', stat: 'shards', target: 50, reward: 40, tier: 'medium' },
    { id: 'level3', name: 'Reach level 3', stat: 'level', target: 3, reward: 40, tier: 'medium' },
    { id: 'near3', name: 'Score 3 near-misses', stat: 'nearMisses', target: 3, reward: 40, tier: 'medium' },
  ],
  hard: [
    { id: 'dash10', name: 'Dash 10 times', stat: 'dashes', target: 10, reward: 75, tier: 'hard' },
    { id: 'survive90', name: 'Survive 90 seconds', stat: 'playSeconds', target: 90, reward: 75, tier: 'hard' },
    { id: 'level5', name: 'Reach level 5', stat: 'level', target: 5, reward: 75, tier: 'hard' },
  ],
};

/** Every mission definition, flat (all tiers). */
const MISSION_DEFS = [
  ...MISSION_POOLS.easy, ...MISSION_POOLS.medium, ...MISSION_POOLS.hard,
];

function localDate(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function shiftDate(dateStr, days) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const date = new Date(y, m - 1, d + days);
  return localDate(date);
}

// Small deterministic hash of a string (for the daily mission pick).
function hashStr(text) {
  let h = 0;
  for (let i = 0; i < text.length; i += 1) h = (h * 31 + text.charCodeAt(i)) >>> 0;
  return h;
}

/** One mission per tier for the given date, deterministic across loads. */
function pickMissionsFor(dateStr) {
  const h = hashStr(dateStr);
  return ['easy', 'medium', 'hard'].map((tier, i) => {
    const pool = MISSION_POOLS[tier];
    return pool[(h + i * 7) % pool.length];
  });
}

function freshMissions(dateStr) {
  return {
    date: dateStr,
    list: pickMissionsFor(dateStr).map((def) => ({
      id: def.id, name: def.name, target: def.target, reward: def.reward,
      tier: def.tier, progress: 0, done: false,
    })),
    rerollsUsed: 0,
    allBonusPaid: false,
  };
}

function freshSave(today) {
  return {
    version: SAVE_VERSION,
    best: 0,
    top5: [],
    history: [],
    lifetime: { runs: 0, shards: 0, playSeconds: 0 },
    // Spendable shard purse (hangar purchases deduct from this only).
    // `lifetime.shards` counts every shard ever earned and never drops —
    // it is what unlocks ship skins, so spending can never lock a skin.
    shardBalance: 0,
    // Permanent per-part ship upgrades (see hangar.js).
    hangar: { hull: 0, engine: 0, shield: 0, magnet: 0, collector: 0 },
    // True once the player has beaten the Aurora Gate: endless mode is
    // offered on every win screen after that.
    endlessUnlocked: false,
    // freeMissUsed: the streak-freeze — one missed day per 7-day cycle
    // is forgiven instead of breaking the streak.
    streak: { lastDate: null, count: 0, visitedDays: [], freeMissUsed: false },
    // The daily reward is CLAIMED from the calendar panel, never
    // auto-granted: pendingReward/pendingDate hold today's unclaimed
    // reward, lastClaimDate the last day it was claimed.
    dailyReward: { lastClaimDate: null, pendingReward: 0, pendingDate: null },
    missions: freshMissions(today),
    // One-time teaching cues already shown (first-run steering/dash).
    ftue: { dashCueShown: false },
    // Player settings (persisted).
    settings: { muted: false, reduceShake: false },
  };
}

function isSaveShapeV3(save) {
  return save && typeof save === 'object'
    && save.version === 3
    && Array.isArray(save.top5) && Array.isArray(save.history)
    && save.lifetime && typeof save.lifetime === 'object'
    && typeof save.shardBalance === 'number'
    && save.hangar && typeof save.hangar === 'object'
    && typeof save.endlessUnlocked === 'boolean'
    && save.streak && typeof save.streak === 'object'
    && save.missions && Array.isArray(save.missions.list);
}

function isSaveShapeV2(save) {
  return save && typeof save === 'object'
    && save.version === 2
    && Array.isArray(save.top5) && Array.isArray(save.history)
    && save.lifetime && typeof save.lifetime === 'object'
    && typeof save.shardBalance === 'number'
    && save.hangar && typeof save.hangar === 'object'
    && typeof save.endlessUnlocked === 'boolean'
    && save.streak && typeof save.streak === 'object'
    && save.missions && Array.isArray(save.missions.list);
}

// The v1 shape (before the hangar): same core, no hangar fields.
function isSaveShapeV1(save) {
  return save && typeof save === 'object'
    && save.version === 1
    && Array.isArray(save.top5) && Array.isArray(save.history)
    && save.lifetime && typeof save.lifetime === 'object'
    && save.streak && typeof save.streak === 'object'
    && save.missions && Array.isArray(save.missions.list);
}

/**
 * Migrate a v1 save to v2. Nothing earned is lost: the spendable purse
 * starts at the full lifetime total (every shard the player ever earned
 * is theirs to spend), the hangar starts empty, endless starts locked.
 * (The loader chains this into migrateSaveV2toV3, so a v1 blob ends up
 * at the current version.)
 */
function migrateSave(save) {
  const migrated = { ...save, version: 2 };
  migrated.hangar = { hull: 0, engine: 0, shield: 0, magnet: 0, collector: 0 };
  migrated.shardBalance = Math.max(0, save.lifetime.shards || 0);
  migrated.endlessUnlocked = false;
  return migrated;
}

// Old v2 mission ids -> their v3 tiered equivalents (same stat/target).
const MISSION_ID_MAP = { shards: 'shards50', level: 'level3', dash: 'dash10' };

/**
 * Migrate a v2 save to v3. Nothing earned is lost: the streak, best,
 * top-5, hangar and shard counters carry over untouched. Today's
 * missions translate to their tiered equivalents with progress kept
 * (a fresh tiered set is picked tomorrow); the daily reward starts
 * unclaimed for today, and the streak-freeze starts unused.
 */
function migrateSaveV2toV3(save) {
  const migrated = { ...save, version: SAVE_VERSION };
  migrated.streak = {
    lastDate: save.streak.lastDate ?? null,
    count: save.streak.count ?? 0,
    visitedDays: Array.isArray(save.streak.visitedDays) ? save.streak.visitedDays : [],
    freeMissUsed: false,
  };
  migrated.dailyReward = { lastClaimDate: null, pendingReward: 0, pendingDate: null };
  const oldList = Array.isArray(save.missions?.list) ? save.missions.list : [];
  const translated = oldList.map((m) => {
    const def = MISSION_DEFS.find((d) => d.id === (MISSION_ID_MAP[m.id] || m.id));
    if (!def) return null;
    return {
      id: def.id, name: def.name, target: def.target, reward: def.reward,
      tier: def.tier, progress: Math.min(def.target, m.progress || 0), done: !!m.done,
    };
  }).filter(Boolean);
  // A v2 day always had exactly 3 missions; if any failed to translate,
  // fill the missing tiers from today's deterministic pick.
  const haveTiers = new Set(translated.map((m) => m.tier));
  for (const def of pickMissionsFor(save.missions?.date ?? localDate())) {
    if (translated.length >= 3) break;
    if (haveTiers.has(def.tier)) continue;
    translated.push({
      id: def.id, name: def.name, target: def.target, reward: def.reward,
      tier: def.tier, progress: 0, done: false,
    });
    haveTiers.add(def.tier);
  }
  migrated.missions = {
    date: save.missions?.date ?? localDate(),
    list: translated.slice(0, 3),
    rerollsUsed: 0,
    allBonusPaid: translated.length === 3 && translated.every((m) => m.done),
  };
  migrated.ftue = { dashCueShown: false };
  migrated.settings = { muted: false, reduceShake: false };
  return migrated;
}

/** Fill any v3 field a hand-edited or partial blob is missing. */
function fillDefaults(save) {
  const fresh = freshSave(save.missions?.date ?? localDate());
  if (!save.streak || typeof save.streak !== 'object') save.streak = fresh.streak;
  if (typeof save.streak.freeMissUsed !== 'boolean') save.streak.freeMissUsed = false;
  if (!Array.isArray(save.streak.visitedDays)) save.streak.visitedDays = [];
  if (!save.dailyReward || typeof save.dailyReward !== 'object') save.dailyReward = fresh.dailyReward;
  if (!save.missions || typeof save.missions !== 'object') save.missions = fresh.missions;
  if (typeof save.missions.rerollsUsed !== 'number') save.missions.rerollsUsed = 0;
  if (typeof save.missions.allBonusPaid !== 'boolean') save.missions.allBonusPaid = false;
  if (!save.ftue || typeof save.ftue !== 'object') save.ftue = fresh.ftue;
  if (!save.settings || typeof save.settings !== 'object') save.settings = fresh.settings;
  return save;
}

/**
 * Load the save blob. A corrupt/old blob falls back to a fresh save, and
 * the legacy best/shards keys seed it when no blob exists yet.
 * `legacy` is { best, shards } read from the old keys (may be zeros).
 */
function loadSave(storage, today, legacy = { best: 0, shards: 0 }) {
  let save = null;
  try {
    const raw = storage.getItem(SAVE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (isSaveShapeV3(parsed)) save = fillDefaults(parsed);
      else if (isSaveShapeV2(parsed)) save = migrateSaveV2toV3(parsed);
      else if (isSaveShapeV1(parsed)) save = migrateSaveV2toV3(migrateSave(parsed));
    }
  } catch {
    save = null;
  }
  if (!save) {
    save = freshSave(today);
    save.best = Math.max(0, legacy.best || 0);
    save.lifetime.shards = Math.max(0, legacy.shards || 0);
    save.shardBalance = save.lifetime.shards;
    if (save.best > 0) {
      save.top5 = [{ score: save.best, level: 1, bestCombo: 1, date: today }];
    }
  }
  // Missions roll over to a fresh set on a new day.
  if (save.missions.date !== today) save.missions = freshMissions(today);
  return save;
}

function saveSave(storage, save) {
  try {
    storage.setItem(SAVE_KEY, JSON.stringify(save));
  } catch {
    // Storage can be off (private windows): progress lasts this visit.
  }
}

/** Cycle day (1-7) for a streak count: day 8 starts a fresh cycle. */
function cycleDayFor(count) {
  return ((Math.max(1, count) - 1) % 7) + 1;
}

/** Shards the daily reward pays on a given cycle day (1-7). */
function dailyRewardFor(cycleDay) {
  return DAILY_REWARDS[Math.min(7, Math.max(1, cycleDay)) - 1];
}

/**
 * Touch the daily streak for today. Returns { reward, cycleDay, isNewDay,
 * milestone, count, forgiven }: the reward is NOT granted here — it waits
 * in save.dailyReward.pendingReward for the player to claim it from the
 * calendar panel (see claimDailyReward). One missed day per 7-day cycle
 * is forgiven (forgiven: true, the streak-freeze is spent); two missed
 * days in a row restart the count at 1. The streak never reads 0 after
 * a day of play — a restart still counts today as day 1.
 */
function touchStreak(save, today) {
  if (save.streak.lastDate === today) {
    return {
      reward: save.dailyReward.pendingReward || 0,
      cycleDay: cycleDayFor(save.streak.count),
      isNewDay: false,
      milestone: save.streak.count >= 7,
      count: save.streak.count,
      forgiven: false,
    };
  }
  const yesterday = shiftDate(today, -1);
  const twoDaysAgo = shiftDate(today, -2);
  let forgiven = false;
  if (save.streak.lastDate === yesterday) {
    save.streak.count += 1;
  } else if (save.streak.lastDate === twoDaysAgo && !save.streak.freeMissUsed) {
    // One missed day, freeze unspent: the streak survives.
    save.streak.count += 1;
    save.streak.freeMissUsed = true;
    forgiven = true;
  } else {
    save.streak.count = 1;
    save.streak.freeMissUsed = false;
  }
  save.streak.lastDate = today;
  if (!save.streak.visitedDays.includes(today)) {
    save.streak.visitedDays.push(today);
    save.streak.visitedDays = save.streak.visitedDays.slice(-14);
  }
  // A fresh cycle refreshes the freeze.
  const cycleDay = cycleDayFor(save.streak.count);
  if (cycleDay === 1) save.streak.freeMissUsed = false;
  const reward = dailyRewardFor(cycleDay);
  save.dailyReward.pendingReward = reward;
  save.dailyReward.pendingDate = today;
  return {
    reward,
    cycleDay,
    isNewDay: true,
    milestone: save.streak.count >= 7,
    count: save.streak.count,
    forgiven,
  };
}

/**
 * Claim today's daily reward from the calendar panel. Grants the pending
 * reward once; a second claim the same day, or a claim with nothing
 * pending, pays nothing. Returns { claimed, reward }.
 */
function claimDailyReward(save, today) {
  if (save.dailyReward.pendingDate !== today
    || save.dailyReward.lastClaimDate === today
    || !(save.dailyReward.pendingReward > 0)) {
    return { claimed: false, reward: 0 };
  }
  const reward = save.dailyReward.pendingReward;
  save.lifetime.shards += reward;
  save.shardBalance = (save.shardBalance ?? 0) + reward;
  save.dailyReward.lastClaimDate = today;
  save.dailyReward.pendingReward = 0;
  save.dailyReward.pendingDate = null;
  return { claimed: true, reward };
}

/**
 * Record a finished run. `run` is { score, level, bestCombo, shards,
 * dashes, upgrades, playSeconds, date, endless }. Returns
 * { rank, gapToFirst, entry, historyEntry }: rank is the 1-based top-5
 * position (0 when the run did not make it), gapToFirst is the points to
 * #1, and entry/historyEntry are the stored objects (the caller keeps
 * them to replace a mid-run bank — see below).
 *
 * `opts.replace` is for a run that was already banked once mid-run and
 * then kept going: the endless continuation of a win. The earlier banked
 * entry is removed from the top-5/history first, and its shards are
 * taken back out of the counters before the full final run is banked —
 * so the run is counted exactly once, with its final score.
 */
function recordRun(save, run, opts = {}) {
  if (opts.replace) {
    const { entry, historyEntry, shards: oldShards } = opts.replace;
    const ti = save.top5.indexOf(entry);
    if (ti >= 0) save.top5.splice(ti, 1);
    const hi = save.history.indexOf(historyEntry);
    if (hi >= 0) save.history.splice(hi, 1);
    save.lifetime.shards -= oldShards || 0;
    save.shardBalance = (save.shardBalance ?? 0) - (oldShards || 0);
    save.lifetime.runs -= 1;
  }
  save.lifetime.runs += 1;
  save.lifetime.shards += run.shards;
  save.shardBalance = (save.shardBalance ?? 0) + run.shards;
  save.lifetime.playSeconds += run.playSeconds || 0;
  if (run.score > save.best) save.best = run.score;
  const entry = {
    score: run.score, level: run.level, bestCombo: run.bestCombo,
    date: run.date, endless: !!run.endless,
  };
  save.top5.push(entry);
  save.top5.sort((a, b) => b.score - a.score);
  save.top5 = save.top5.slice(0, 5);
  const rank = save.top5.indexOf(entry) + 1;
  const historyEntry = {
    score: run.score, level: run.level, bestCombo: run.bestCombo,
    shards: run.shards, dashes: run.dashes, upgrades: run.upgrades || [],
    date: run.date, endless: !!run.endless,
  };
  save.history.unshift(historyEntry);
  save.history = save.history.slice(0, 20);
  const gapToFirst = save.top5.length ? save.top5[0].score - run.score : 0;
  return { rank, gapToFirst, entry, historyEntry };
}

/**
 * Bank the run's stats into today's missions. Returns the missions that
 * were just completed (each pays its shard reward immediately). When the
 * third mission completes, the all-missions bonus chest (+100 shards)
 * pays once and is reported as a synthetic completion entry.
 */
function updateMissions(save, run) {
  const completed = [];
  for (const mission of save.missions.list) {
    if (mission.done) continue;
    const def = MISSION_DEFS.find((d) => d.id === mission.id);
    if (!def) continue;
    mission.progress = Math.min(def.target, Math.max(mission.progress, run[def.stat] || 0));
    if (mission.progress >= def.target) {
      mission.done = true;
      save.lifetime.shards += mission.reward;
      save.shardBalance = (save.shardBalance ?? 0) + mission.reward;
      completed.push({ id: mission.id, name: mission.name, reward: mission.reward });
    }
  }
  if (save.missions.list.length === 3
    && save.missions.list.every((m) => m.done)
    && !save.missions.allBonusPaid) {
    save.missions.allBonusPaid = true;
    save.lifetime.shards += ALL_MISSIONS_BONUS;
    save.shardBalance = (save.shardBalance ?? 0) + ALL_MISSIONS_BONUS;
    completed.push({ id: 'all', name: 'All 3 missions', reward: ALL_MISSIONS_BONUS });
  }
  return completed;
}

/**
 * Reroll one incomplete mission for another from the same tier (1/day).
 * Returns { ok, mission } or { ok: false, reason } ('used', 'done',
 * 'unknown'). The replacement resets progress — a reroll is a fresh
 * mission, not a free completion.
 */
function rerollMission(save, missionId) {
  if ((save.missions.rerollsUsed ?? 0) >= DAILY_REROLLS) return { ok: false, reason: 'used' };
  const mission = save.missions.list.find((m) => m.id === missionId);
  if (!mission) return { ok: false, reason: 'unknown' };
  if (mission.done) return { ok: false, reason: 'done' };
  const pool = MISSION_POOLS[mission.tier] || [];
  const alternatives = pool.filter((d) => d.id !== mission.id);
  if (alternatives.length === 0) return { ok: false, reason: 'unknown' };
  const pick = alternatives[hashStr(`${save.missions.date}:${missionId}`) % alternatives.length];
  mission.id = pick.id;
  mission.name = pick.name;
  mission.target = pick.target;
  mission.reward = pick.reward;
  mission.tier = pick.tier;
  mission.progress = 0;
  mission.done = false;
  save.missions.rerollsUsed = (save.missions.rerollsUsed ?? 0) + 1;
  return { ok: true, mission };
}

/** The 7-day calendar ending today: [{ date, visited, isToday }]. */
function streakCalendar(save, today) {
  const days = [];
  for (let i = 6; i >= 0; i -= 1) {
    const date = shiftDate(today, -i);
    days.push({
      date,
      visited: save.streak.visitedDays.includes(date),
      isToday: i === 0,
    });
  }
  return days;
}

/**
 * The daily-reward calendar: one box per cycle day (1-7) with its reward,
 * whether it is done (claimed in this cycle), current (today's, unclaimed)
 * or locked (a later cycle day). `claimedToday` is true once today's
 * reward has been claimed.
 */
function dailyRewardCalendar(save, today) {
  const cycleDay = cycleDayFor(save.streak.count);
  const claimedToday = save.dailyReward.lastClaimDate === today;
  return DAILY_REWARDS.map((reward, i) => {
    const day = i + 1;
    return {
      day,
      reward,
      done: day < cycleDay || (day === cycleDay && claimedToday),
      current: day === cycleDay && !claimedToday,
      locked: day > cycleDay,
    };
  });
}

// ---- src/hangar.js ----
// Lumen Drift — the hangar: permanent per-part ship upgrades bought with
// lifetime star shards. Unlike the in-run upgrade picks (which reset every
// run), hangar parts stay bought forever, so the ship visibly grows
// stronger run after run — that is the point of this screen.
//
// Economy: two shard counters. `lifetime.shards` counts every shard ever
// earned and NEVER decreases — it is what unlocks ship skins. `shardBalance`
// is the spendable purse: every shard earned adds to it, every hangar
// purchase deducts from it. Spending can therefore never lock a skin.
//
// Balance: a good run earns ~60-120 shards, plus the daily streak bonus
// (10-100) and mission rewards (100/day). The first level of every part
// costs 150-300, so each is affordable after a few runs; maxing all five
// parts costs 9,400 shards — weeks of play, not a day. A fully kitted
// ship is much stronger (up to 6 hearts, +24% speed, a starting shield,
// a wide magnet, +6 points per shard) but the early levels stay hard:
// the first levels only add a little, and the endless ramp (Part 2)
// keeps scaling past anything the hangar can give.
const HANGAR_PARTS = [
  {
    id: 'hull',
    name: 'REINFORCED HULL',
    desc: '+1 max hull heart per level.',
    max: 3,
    costs: [250, 700, 1500],
  },
  {
    id: 'engine',
    name: 'ION ENGINE',
    desc: '+8% top speed and dash speed per level.',
    max: 3,
    costs: [200, 600, 1200],
  },
  {
    id: 'shield',
    name: 'AEGIS PLATING',
    desc: 'Lv1: start each run with a shield. Lv2: shield cells spawn twice as often.',
    max: 2,
    costs: [300, 800],
  },
  {
    id: 'magnet',
    name: 'TRACTOR MAGNET',
    desc: '+30 shard pickup radius per level.',
    max: 3,
    costs: [150, 500, 1100],
  },
  {
    id: 'collector',
    name: 'LIGHT COLLECTOR',
    desc: '+2 points per star shard per level.',
    max: 3,
    costs: [200, 600, 1300],
  },
];

function hangarPartById(id) {
  return HANGAR_PARTS.find((p) => p.id === id) || null;
}

/** Current level of one part (0 when never bought). */
function hangarLevel(save, id) {
  return (save && save.hangar && save.hangar[id]) || 0;
}

/** Every part's level, for the world (missing parts read as 0). */
function hangarBonuses(save) {
  const out = {};
  for (const part of HANGAR_PARTS) out[part.id] = hangarLevel(save, part.id);
  return out;
}

/** Shards the next level costs, or null when the part is maxed. */
function hangarNextCost(part, level) {
  if (!part || level >= part.max) return null;
  return part.costs[level];
}

/**
 * Can this part be bought right now? Returns { ok } or { ok: false,
 * reason } where reason is 'maxed', 'broke' or 'unknown'.
 */
function canBuyHangarPart(save, part) {
  if (!part) return { ok: false, reason: 'unknown' };
  const level = hangarLevel(save, part.id);
  const cost = hangarNextCost(part, level);
  if (cost === null) return { ok: false, reason: 'maxed' };
  if ((save.shardBalance ?? 0) < cost) return { ok: false, reason: 'broke' };
  return { ok: true, cost };
}

/**
 * Buy the next level of one part. Mutates save.hangar and
 * save.shardBalance. Returns { ok: true, cost, level } or
 * { ok: false, reason } — the caller shows the reason, never crashes.
 */
function buyHangarPart(save, partId) {
  const part = hangarPartById(partId);
  const check = canBuyHangarPart(save, part);
  if (!check.ok) return check;
  if (!save.hangar) save.hangar = {};
  save.hangar[part.id] = hangarLevel(save, part.id) + 1;
  save.shardBalance = (save.shardBalance ?? 0) - check.cost;
  return { ok: true, cost: check.cost, level: save.hangar[part.id] };
}

function layoutUpgradeCards(offers) {
