const CYAN = '#22d3ee';
const MAGENTA = '#f472b6';
const GOLD = '#fbbf24';
const GREEN = '#34d399';
const INK = '#0b1026';

function glow(ctx, color, blur) {
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
}

function noGlow(ctx) {
  ctx.shadowBlur = 0;
}

function drawStars(ctx, state) {
  for (const star of state.stars) {
    const depth = 0.25 + star.layer * 0.35;
    const x = ((star.x - state.time * 8 * depth) % FIELD.width + FIELD.width) % FIELD.width;
    const y = star.y;
    const alpha = 0.35 + 0.65 * Math.abs(Math.sin(state.time * 1.5 + star.twinkle));
    ctx.globalAlpha = alpha * (0.5 + star.layer * 0.25);
    ctx.fillStyle = star.layer === 2 ? '#e0f2fe' : '#a5f3fc';
    ctx.beginPath();
    ctx.arc(x, y, star.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawNebula(ctx, width, height) {
  const blobs = [
    { x: 0.18, y: 0.22, r: 0.34, color: 'rgba(124, 58, 237, 0.20)' },
    { x: 0.85, y: 0.75, r: 0.38, color: 'rgba(219, 39, 119, 0.14)' },
    { x: 0.72, y: 0.12, r: 0.28, color: 'rgba(34, 211, 238, 0.10)' },
  ];
  for (const blob of blobs) {
    const gradient = ctx.createRadialGradient(
      blob.x * width, blob.y * height, 0,
      blob.x * width, blob.y * height, blob.r * width,
    );
    gradient.addColorStop(0, blob.color);
    gradient.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);
  }
}

function drawShard(ctx, x, y, spin, pulse, golden = false) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(spin);
  const twinkle = 0.75 + 0.25 * Math.sin(pulse * 3);
  // A golden shard is bigger, brighter, and spins with a wider glow.
  const scale = golden ? 1.45 : 1;
  ctx.scale(scale, scale);
  glow(ctx, golden ? '#fde047' : GOLD, golden ? 24 : 14);
  ctx.fillStyle = golden ? '#fde047' : GOLD;
  ctx.globalAlpha = twinkle;
  ctx.beginPath();
  ctx.moveTo(0, -11);
  ctx.lineTo(4, -4);
  ctx.lineTo(11, 0);
  ctx.lineTo(4, 4);
  ctx.lineTo(0, 11);
  ctx.lineTo(-4, 4);
  ctx.lineTo(-11, 0);
  ctx.lineTo(-4, -4);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#fffbeb';
  ctx.beginPath();
  ctx.arc(0, 0, 3.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawMine(ctx, x, y, radius, spin, pulse, age = 1) {
  // Telegraph: a fresh mine fades in over ~0.3 s with a shrinking
  // warning ring, so nothing appears at full strength without warning.
  const fade = Math.min(1, 0.3 + (age ?? 1) / 0.3);
  ctx.save();
  ctx.globalAlpha = fade;
  if ((age ?? 1) < 0.5) {
    ctx.strokeStyle = MAGENTA;
    ctx.lineWidth = 2;
    ctx.globalAlpha = (0.5 - age) * 1.2;
    ctx.beginPath();
    ctx.arc(x, y, radius + (0.5 - age) * 70, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = fade;
  }
  ctx.translate(x, y);
  ctx.rotate(spin);
  const throb = 1 + 0.08 * Math.sin(pulse * 4);
  glow(ctx, MAGENTA, 16);
  ctx.fillStyle = '#3b0764';
  ctx.strokeStyle = MAGENTA;
  ctx.lineWidth = 2;
  // Eight spikes around a dark core.
  ctx.beginPath();
  for (let i = 0; i < 8; i += 1) {
    const angle = (i / 8) * Math.PI * 2;
    const outer = radius * 1.35 * throb;
    const inner = radius * 0.7;
    const tipX = Math.cos(angle) * outer;
    const tipY = Math.sin(angle) * outer;
    const baseAngle = angle + Math.PI / 8;
    const baseX = Math.cos(baseAngle) * inner;
    const baseY = Math.sin(baseAngle) * inner;
    if (i === 0) ctx.moveTo(tipX, tipY);
    else ctx.lineTo(tipX, tipY);
    ctx.lineTo(baseX, baseY);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#f472b6';
  ctx.beginPath();
  ctx.arc(0, 0, radius * 0.34, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawStorm(ctx, x, y, spin, age = 1) {
  const fade = Math.min(1, 0.3 + (age ?? 1) / 0.3);
  ctx.save();
  ctx.globalAlpha = fade;
  if ((age ?? 1) < 0.5) {
    ctx.strokeStyle = '#a78bfa';
    ctx.lineWidth = 2;
    ctx.globalAlpha = (0.5 - age) * 1.2;
    ctx.beginPath();
    ctx.arc(x, y, 13 + (0.5 - age) * 70, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = fade;
  }
  ctx.translate(x, y);
  ctx.rotate(spin);
  glow(ctx, '#a78bfa', 14);
  ctx.fillStyle = '#c4b5fd';
  ctx.beginPath();
  ctx.moveTo(0, -13);
  ctx.lineTo(5, -2);
  ctx.lineTo(13, 0);
  ctx.lineTo(5, 3);
  ctx.lineTo(0, 13);
  ctx.lineTo(-5, 3);
  ctx.lineTo(-13, 0);
  ctx.lineTo(-5, -2);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#ede9fe';
  ctx.beginPath();
  ctx.arc(0, 0, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawShieldCell(ctx, x, y, pulse) {
  ctx.save();
  ctx.translate(x, y);
  const bob = Math.sin(pulse * 2) * 3;
  ctx.translate(0, bob);
  glow(ctx, GREEN, 16);
  ctx.strokeStyle = GREEN;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(0, 0, 13, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = 'rgba(52, 211, 153, 0.25)';
  ctx.fill();
  ctx.fillStyle = GREEN;
  ctx.font = 'bold 15px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('+', 0, 1);
  ctx.restore();
}

function drawShip(ctx, state, skin = SKINS[0]) {
  const ship = state.ship;
  const blink = ship.invulnerable > 0 && Math.floor(state.time * 14) % 2 === 0;
  ctx.save();
  // Drawn at the ship's simulated position, in field units: this is the
  // same point the collision checks in world.js use.
  ctx.translate(ship.x, ship.y);
  ctx.rotate(ship.angle);
  if (blink) ctx.globalAlpha = 0.35;
  // Engine flame.
  const flame = 14 + Math.sin(state.time * 30) * 5 + Math.hypot(ship.vx, ship.vy) * 0.02;
  glow(ctx, skin.flameGlow, 12);
  ctx.fillStyle = skin.flame;
  ctx.beginPath();
  ctx.moveTo(-12, -5);
  ctx.lineTo(-12 - flame, 0);
  ctx.lineTo(-12, 5);
  ctx.closePath();
  ctx.fill();
  // Hull: a swept light-skiff. The skin changes hull, glow and trail
  // colours only — the shape (and the hitbox) never change.
  glow(ctx, skin.glow, 18);
  ctx.fillStyle = skin.hull;
  ctx.strokeStyle = skin.glow;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(22, 0);
  ctx.lineTo(-10, -13);
  ctx.lineTo(-16, -5);
  ctx.lineTo(-16, 5);
  ctx.lineTo(-10, 13);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // Cockpit.
  ctx.fillStyle = '#ecfeff';
  ctx.beginPath();
  ctx.arc(6, 0, 4.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  // Shield ring when a shield is held.
  if (state.shield) {
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.globalAlpha = 0.6 + 0.3 * Math.sin(state.time * 5);
    glow(ctx, GREEN, 14);
    ctx.strokeStyle = GREEN;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 0, SHIP.radius + 9, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

function drawGate(ctx, state, width, height) {
  // The Aurora Gate: a glowing ring that opens as the score approaches
  // 1,200, then shines wide open on the win screen. It sits high on the
  // screen (centre at 20% of the height) so it never covers the title
  // text below it.
  const cx = width / 2;
  const cy = height * 0.20;
  const progress = state.gateOpen ? 1 : state.gateProgress;
  const radius = 36 + progress * 44;
  const gradient = ctx.createRadialGradient(cx, cy, radius * 0.2, cx, cy, radius * 1.6);
  gradient.addColorStop(0, `rgba(52, 211, 153, ${0.10 + progress * 0.35})`);
  gradient.addColorStop(0.6, `rgba(34, 211, 238, ${0.08 + progress * 0.22})`);
  gradient.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(cx - radius * 1.8, cy - radius * 1.8, radius * 3.6, radius * 3.6);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(state.time * 0.4);
  glow(ctx, progress >= 1 ? GREEN : CYAN, 22);
  ctx.strokeStyle = progress >= 1 ? GREEN : CYAN;
  ctx.lineWidth = 3;
  ctx.setLineDash([14, 10]);
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  ctx.fillStyle = progress >= 1 ? GREEN : '#a5f3fc';
  ctx.font = `bold ${progress >= 1 ? 20 : 15}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(progress >= 1 ? 'GATE OPEN' : `GATE ${Math.round(progress * 100)}%`, cx, cy);
}

function drawJoystick(ctx, pointer) {
  // Floating joystick: a ring where the steering finger landed, a knob
  // where it has dragged to. Drawn in field coordinates, under the HUD.
  const ox = pointer.dragStartX;
  const oy = pointer.dragStartY;
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.strokeStyle = CYAN;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(ox, oy, 55, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = CYAN;
  ctx.beginPath();
  ctx.arc(ox + pointer.relX * 55, oy + pointer.relY * 55, 18, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawHud(ctx, state, best, width) {
  const pad = 18;
  ctx.textBaseline = 'alphabetic';
  // Score, big and gold — counted up smoothly (displayScore), not jumped.
  ctx.textAlign = 'left';
  glow(ctx, GOLD, 10);
  ctx.fillStyle = GOLD;
  ctx.font = 'bold 40px sans-serif';
  ctx.fillText(String(Math.round(state.displayScore ?? state.score)), pad, 48);
  noGlow(ctx);
  ctx.fillStyle = '#e2e8f0';
  ctx.font = '16px sans-serif';
  ctx.fillText(`BEST ${Math.max(best, state.score)}`, pad, 72);
  // Combo badge: it pops bigger and jitters as the combo pulse rises.
  if (state.combo > 1) {
    const pulse = state.comboPulse ?? 0;
    ctx.save();
    ctx.translate(pad + (Math.random() * 4 - 2) * pulse, 104);
    ctx.scale(1 + 0.25 * pulse, 1 + 0.25 * pulse);
    ctx.textAlign = 'left';
    glow(ctx, MAGENTA, 12);
    ctx.fillStyle = MAGENTA;
    ctx.font = 'bold 26px sans-serif';
    ctx.fillText(`COMBO x${state.combo}`, 0, 0);
    noGlow(ctx);
    ctx.restore();
  }
  // Hearts, top right — one slot per max heart (upgrades can add to 5).
  const maxHearts = state.maxHearts ?? HEARTS;
  ctx.textAlign = 'right';
  for (let i = 0; i < maxHearts; i += 1) {
    const x = width - pad - i * 34;
    const y = 32;
    ctx.save();
    ctx.translate(x, y);
    if (i < state.hearts) {
      glow(ctx, '#fb7185', 12);
      ctx.fillStyle = '#fb7185';
    } else {
      ctx.fillStyle = 'rgba(148, 163, 184, 0.35)';
    }
    ctx.beginPath();
    ctx.moveTo(0, 8);
    ctx.bezierCurveTo(-12, -4, -6, -12, 0, -5);
    ctx.bezierCurveTo(6, -12, 12, -4, 0, 8);
    ctx.fill();
    ctx.restore();
  }
  // Level and dash, top centre-right.
  ctx.textAlign = 'right';
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 19px sans-serif';
  ctx.fillText(`LEVEL ${state.level}`, width - pad, 66);
  const dashReady = state.ship.dashCooldown <= 0;
  const dashBase = effectiveDashCooldown(state);
  const dashFrac = dashReady ? 1 : 1 - state.ship.dashCooldown / dashBase;
  ctx.fillStyle = 'rgba(148, 163, 184, 0.5)';
  ctx.fillRect(width - pad - 110, 76, 110, 8);
  ctx.fillStyle = dashReady ? CYAN : '#64748b';
  ctx.fillRect(width - pad - 110, 76, 110 * dashFrac, 8);
  ctx.fillStyle = dashReady ? CYAN : '#94a3b8';
  ctx.font = '12px sans-serif';
  ctx.fillText(dashReady ? 'DASH READY' : 'DASH…', width - pad, 100);
  if (state.shield) {
    ctx.fillStyle = GREEN;
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText('SHIELD UP', width - pad, 120);
  }
  // Progress bar to the Aurora Gate, bottom centre — lifted off the edge.
  // In endless mode the gate is already open: the bar tracks progress to
  // the next level instead.
  const barWidth = 420;
  const barX = (width - barWidth) / 2;
  const barY = 682;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 15px sans-serif';
  if (state.endless) {
    ctx.fillText(`ENDLESS DRIFT  •  LEVEL ${state.level}`, width / 2, barY - 8);
  } else {
    ctx.fillText(`AURORA GATE  ${state.score} / ${WIN_SCORE}`, width / 2, barY - 8);
  }
  ctx.fillStyle = 'rgba(148, 163, 184, 0.4)';
  ctx.fillRect(barX, barY, barWidth, 12);
  const gateGradient = ctx.createLinearGradient(barX, 0, barX + barWidth, 0);
  gateGradient.addColorStop(0, CYAN);
  gateGradient.addColorStop(1, GREEN);
  ctx.fillStyle = gateGradient;
  const barFrac = state.endless
    ? (state.score % LEVEL_EVERY) / LEVEL_EVERY
    : state.gateProgress;
  ctx.fillRect(barX, barY, barWidth * barFrac, 12);
}

function panel(ctx, width, height) {
  ctx.fillStyle = 'rgba(11, 16, 38, 0.72)';
  ctx.fillRect(0, 0, width, height);
}

function bigTitle(ctx, text, y, width, color, size) {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  glow(ctx, color, 26);
  ctx.fillStyle = color;
  ctx.font = `bold ${size}px sans-serif`;
  ctx.fillText(text, width / 2, y);
  noGlow(ctx);
}

function wrapText(ctx, text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const word of words) {
    const trial = line ? `${line} ${word}` : word;
    if (ctx.measureText(trial).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else {
      line = trial;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function drawTitle(ctx, state, best, width, height, skin = SKINS[0], lifetimeShards = 0, extra = {}) {
  // Home is PLAY only: logo, one big PLAY button, best score, the next
  // goal, and a gear in the corner. Everything else (hangar, missions,
  // scores, settings, daily reward) is one tap away in the tab bar or a
  // panel — never piled onto this screen. The how-to lives in the game
  // itself now (first-run cues), not in four lines of text here.
  panel(ctx, width, height);
  drawGate(ctx, state, width, height);
  const save = extra.save ?? null;
  const streakInfo = extra.streakInfo ?? null;
  const hasPlayed = save && save.lifetime.runs > 0;
  // Gear (settings), top left.
  ctx.save();
  ctx.strokeStyle = 'rgba(226, 232, 240, 0.75)';
  ctx.lineWidth = 2;
  ctx.strokeRect(GEAR_RECT.x, GEAR_RECT.y, GEAR_RECT.w, GEAR_RECT.h);
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 24px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('⚙', GEAR_RECT.x + GEAR_RECT.w / 2, GEAR_RECT.y + GEAR_RECT.h / 2 + 1);
  ctx.restore();
  // Streak flame (top right): opens the daily-reward calendar. It pulses
  // with a dot while today's reward waits unclaimed.
  if (save && save.streak.count > 0) {
    const pending = save.dailyReward
      && save.dailyReward.pendingReward > 0
      && save.dailyReward.lastClaimDate !== localDate();
    const pulse = pending ? 0.6 + 0.4 * Math.sin(state.time * 5) : 1;
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = pending ? GOLD : 'rgba(251, 191, 36, 0.55)';
    ctx.lineWidth = pending ? 2.5 : 1.5;
    ctx.strokeRect(FLAME_RECT.x, FLAME_RECT.y, FLAME_RECT.w, FLAME_RECT.h);
    ctx.fillStyle = GOLD;
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`🔥${save.streak.count}`, FLAME_RECT.x + FLAME_RECT.w / 2, FLAME_RECT.y + FLAME_RECT.h / 2 + 1);
    ctx.restore();
  }
  // Shard balance (top right, display only).
  ctx.save();
  ctx.strokeStyle = 'rgba(251, 191, 36, 0.55)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(BALANCE_RECT.x, BALANCE_RECT.y, BALANCE_RECT.w, BALANCE_RECT.h);
  ctx.fillStyle = GOLD;
  ctx.font = 'bold 20px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(`◆ ${save ? (save.shardBalance ?? 0) : 0}`, BALANCE_RECT.x + BALANCE_RECT.w / 2, BALANCE_RECT.y + BALANCE_RECT.h / 2 + 1);
  ctx.restore();
  bigTitle(ctx, 'LUMEN DRIFT', 240, width, CYAN, 72);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fbbf24';
  ctx.font = 'bold 24px sans-serif';
  ctx.fillText('Ride the solar storm. Gather the light.', width / 2, 292);
  // The next goal, always visible: the next locked skin with progress.
  const next = nextUnlock(lifetimeShards);
  if (next) {
    ctx.fillStyle = '#e2e8f0';
    ctx.font = 'bold 19px sans-serif';
    ctx.fillText(`NEXT SKIN ◆ ${next.skin.name} — ${next.have} / ${next.need}`, width / 2, 352);
    const barW = 320;
    const barX = (width - barW) / 2;
    ctx.fillStyle = 'rgba(148, 163, 184, 0.4)';
    ctx.fillRect(barX, 366, barW, 9);
    ctx.fillStyle = next.skin.glow;
    ctx.fillRect(barX, 366, barW * Math.min(1, next.have / next.need), 9);
  } else {
    ctx.fillStyle = GOLD;
    ctx.font = 'bold 19px sans-serif';
    ctx.fillText('★ ALL SHIP SKINS UNLOCKED ★', width / 2, 352);
  }
  // One dominant PLAY button, thumb zone, gently pulsing.
  const pulse = 0.85 + 0.15 * Math.sin(state.time * 3);
  ctx.save();
  ctx.globalAlpha = pulse;
  glow(ctx, GOLD, 22);
  ctx.fillStyle = GOLD;
  ctx.fillRect(PLAY_RECT.x, PLAY_RECT.y, PLAY_RECT.w, PLAY_RECT.h);
  noGlow(ctx);
  ctx.fillStyle = INK;
  ctx.font = 'bold 32px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('▶  PLAY', PLAY_RECT.x + PLAY_RECT.w / 2, PLAY_RECT.y + PLAY_RECT.h / 2 + 1);
  ctx.restore();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  if (best > 0) {
    ctx.fillStyle = GOLD;
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText(`BEST SCORE  ${best}`, width / 2, 522);
  }
  if (save && save.endlessUnlocked) {
    ctx.fillStyle = GREEN;
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText('∞  ENDLESS UNLOCKED — win again to keep drifting past the gate!', width / 2, 548);
  }
  // Bottom tab bar (after the first run only — progressive disclosure:
  // a brand-new player sees nothing but PLAY).
  if (hasPlayed) {
    const tabs = [
      [HANGAR_TAB_RECT, 'HANGAR', CYAN],
      [MISSIONS_TAB_RECT, 'MISSIONS', GOLD],
      [SCORES_TAB_RECT, 'SCORES', '#e2e8f0'],
    ];
    for (const [rect, label, color] of tabs) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
      ctx.fillStyle = color;
      ctx.font = 'bold 19px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, rect.x + rect.w / 2, rect.y + rect.h / 2 + 1);
      ctx.restore();
    }
  }
  // The streak line lives in the flame badge now; a fresh day's bonus is
  // claimed from the daily-reward panel, not announced in small print.
  void streakInfo;
}

// --- Panels: one centred card over the dimmed home screen. One tap on
// the X (or the backdrop, or Esc) closes back to Home — PLAY is never
// more than one tap away.
function drawPanelShell(ctx, width, height, title, color) {
  ctx.fillStyle = 'rgba(11, 16, 38, 0.62)';
  ctx.fillRect(0, 0, width, height);
  const card = PANEL_CARD;
  ctx.fillStyle = 'rgba(20, 27, 61, 0.97)';
  ctx.fillRect(card.x, card.y, card.w, card.h);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.strokeRect(card.x, card.y, card.w, card.h);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  glow(ctx, color, 16);
  ctx.fillStyle = color;
  ctx.font = 'bold 34px sans-serif';
  ctx.fillText(title, width / 2, card.y + 44);
  noGlow(ctx);
  // Close X, top-right of the card.
  ctx.save();
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 2;
  ctx.strokeRect(PANEL_CLOSE_RECT.x, PANEL_CLOSE_RECT.y, PANEL_CLOSE_RECT.w, PANEL_CLOSE_RECT.h);
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('✕', PANEL_CLOSE_RECT.x + PANEL_CLOSE_RECT.w / 2, PANEL_CLOSE_RECT.y + PANEL_CLOSE_RECT.h / 2 + 1);
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
}

function drawStats(ctx, save, width, height) {
  drawPanelShell(ctx, width, height, 'TOP SCORES', GOLD);
  ctx.textAlign = 'center';
  if (!save) {
    ctx.fillStyle = '#e2e8f0';
    ctx.font = '20px sans-serif';
    ctx.fillText('No runs recorded yet — go drift!', width / 2, 320);
    return;
  }
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 22px sans-serif';
  if (save.top5.length === 0) {
    ctx.fillText('No runs yet — your best runs will live here.', width / 2, 210);
  } else {
    save.top5.forEach((entry, i) => {
      ctx.fillStyle = i === 0 ? GOLD : '#e2e8f0';
      ctx.font = i === 0 ? 'bold 24px sans-serif' : '20px sans-serif';
      ctx.fillText(
        `#${i + 1}   ${entry.score}   —   LEVEL ${entry.level}   •   COMBO x${Math.max(1, entry.bestCombo)}${entry.endless ? '   ∞ ENDLESS' : ''}   •   ${entry.date}`,
        width / 2, 205 + i * 34,
      );
    });
  }
  // Lifetime stats.
  const mins = Math.floor(save.lifetime.playSeconds / 60);
  ctx.fillStyle = '#a5f3fc';
  ctx.font = '19px sans-serif';
  ctx.fillText(
    `RUNS ${save.lifetime.runs}   •   LIFETIME SHARDS ${save.lifetime.shards}   •   PLAY TIME ${mins}m   •   BEST ${save.best}`,
    width / 2, 408,
  );
  // 7-day streak calendar.
  const days = streakCalendar(save, localDate());
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 19px sans-serif';
  ctx.fillText(`🔥 ${save.streak.count}-DAY STREAK`, width / 2, 448);
  const boxW = 44;
  const gap = 10;
  const totalW = 7 * boxW + 6 * gap;
  let bx = (width - totalW) / 2;
  for (const day of days) {
    ctx.strokeStyle = day.isToday ? CYAN : 'rgba(148, 163, 184, 0.5)';
    ctx.lineWidth = day.isToday ? 3 : 2;
    ctx.strokeRect(bx, 468, boxW, boxW);
    if (day.visited) {
      ctx.fillStyle = GOLD;
      ctx.font = 'bold 22px sans-serif';
      ctx.fillText('✓', bx + boxW / 2, 490);
    }
    ctx.fillStyle = '#94a3b8';
    ctx.font = '12px sans-serif';
    ctx.fillText(day.date.slice(5), bx + boxW / 2, 532);
    bx += boxW + gap;
  }
  // Today's missions.
  ctx.fillStyle = '#a5f3fc';
  ctx.font = '19px sans-serif';
  save.missions.list.forEach((m, i) => {
    ctx.fillText(
      `${m.done ? '✓' : '○'} ${m.name} — ${m.progress}/${m.target}   (+${m.reward} shards)`,
      width / 2, 566 + i * 26,
    );
  });
}

function drawMissionsPanel(ctx, save, width, height) {
  drawPanelShell(ctx, width, height, 'DAILY MISSIONS', GOLD);
  if (!save) return;
  const rows = layoutMissionRows();
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  save.missions.list.forEach((m, i) => {
    const row = rows[i];
    if (!row) return;
    ctx.fillStyle = 'rgba(20, 27, 61, 0.96)';
    ctx.fillRect(row.x, row.y, row.w, row.h);
    ctx.strokeStyle = m.done ? GREEN : 'rgba(148, 163, 184, 0.45)';
    ctx.lineWidth = m.done ? 2 : 1.5;
    ctx.strokeRect(row.x, row.y, row.w, row.h);
    // Tier tag + name.
    ctx.fillStyle = m.tier === 'hard' ? MAGENTA : (m.tier === 'medium' ? GOLD : CYAN);
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText(m.tier.toUpperCase(), row.x + 16, row.y + 24);
    ctx.fillStyle = '#e2e8f0';
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText(`${m.done ? '✓ ' : '○ '}${m.name}`, row.x + 16, row.y + 52);
    // Progress bar.
    const barX = row.x + 16;
    const barW = 300;
    ctx.fillStyle = 'rgba(148, 163, 184, 0.4)';
    ctx.fillRect(barX, row.y + 66, barW, 10);
    ctx.fillStyle = m.done ? GREEN : GOLD;
    ctx.fillRect(barX, row.y + 66, barW * Math.min(1, m.progress / m.target), 10);
    ctx.fillStyle = '#e2e8f0';
    ctx.font = '16px sans-serif';
    ctx.fillText(`${m.progress}/${m.target}`, barX + barW + 12, row.y + 76);
    // Reward.
    ctx.fillStyle = GOLD;
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(`◆ +${m.reward}`, row.x + row.w - 84, row.y + 52);
    ctx.textAlign = 'left';
    // Reroll button (incomplete missions only, 1/day).
    const canReroll = !m.done && (save.missions.rerollsUsed ?? 0) < DAILY_REROLLS;
    const rb = row.reroll;
    ctx.fillStyle = canReroll ? 'rgba(34, 211, 238, 0.18)' : 'rgba(148, 163, 184, 0.10)';
    ctx.fillRect(rb.x, rb.y, rb.w, rb.h);
    ctx.strokeStyle = canReroll ? CYAN : 'rgba(148, 163, 184, 0.35)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(rb.x, rb.y, rb.w, rb.h);
    ctx.fillStyle = canReroll ? CYAN : '#64748b';
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('↻', rb.x + rb.w / 2, rb.y + rb.h / 2 + 1);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
  });
  // Complete-all-3 bonus.
  const allDone = save.missions.list.length === 3 && save.missions.list.every((m) => m.done);
  ctx.textAlign = 'center';
  ctx.fillStyle = allDone ? GREEN : '#a5f3fc';
  ctx.font = 'bold 19px sans-serif';
  ctx.fillText(
    allDone
      ? `★ ALL 3 DONE — +${ALL_MISSIONS_BONUS} shards bonus paid! ★`
      : `Complete all 3 for a +${ALL_MISSIONS_BONUS} shard bonus   •   ${(save.missions.rerollsUsed ?? 0) >= DAILY_REROLLS ? 'reroll used up for today' : '1 reroll left today (tap ↻)'}   •   resets daily`,
    width / 2, 552,
  );
}

function drawSettingsPanel(ctx, save, width, height, extra = {}) {
  drawPanelShell(ctx, width, height, 'SETTINGS', CYAN);
  const settings = save?.settings ?? { muted: false, reduceShake: false };
  const rows = [
    { rect: SETTINGS_SOUND_RECT, label: 'SOUND', on: !settings.muted, note: settings.muted ? 'muted — tap to turn on' : 'on — tap to mute' },
    { rect: SETTINGS_FULLSCREEN_RECT, label: 'FULLSCREEN', on: extra.fullscreenOn ?? false, note: 'tap to toggle' },
    { rect: SETTINGS_SHAKE_RECT, label: 'REDUCE SHAKE', on: !!settings.reduceShake, note: settings.reduceShake ? 'shake softened' : 'full shake on hits' },
  ];
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  for (const row of rows) {
    ctx.fillStyle = '#e2e8f0';
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText(row.label, 300, row.rect.y + 30);
    ctx.fillStyle = '#94a3b8';
    ctx.font = '16px sans-serif';
    ctx.fillText(row.note, 470, row.rect.y + 30);
    const b = row.rect;
    ctx.fillStyle = row.on ? GREEN : 'rgba(148, 163, 184, 0.25)';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = row.on ? INK : '#e2e8f0';
    ctx.font = 'bold 17px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(row.on ? 'ON' : 'OFF', b.x + b.w / 2, b.y + b.h / 2 + 1);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
  }
  // How to play: three icons, no paragraphs.
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 19px sans-serif';
  ctx.fillText('HOW TO PLAY', width / 2, 470);
  ctx.fillStyle = '#a5f3fc';
  ctx.font = '19px sans-serif';
  ctx.fillText('DRAG  —  steer the ship', width / 2, 504);
  ctx.fillText('◆  —  collect star shards', width / 2, 534);
  ctx.fillText('DASH  —  dodge mines (SPACE / DASH button)', width / 2, 564);
  ctx.fillStyle = '#94a3b8';
  ctx.font = '15px sans-serif';
  ctx.fillText('Reach 1,200 to open the Aurora Gate — then keep drifting, endless.', width / 2, 600);
}

function drawRewardPanel(ctx, save, width, height) {
  drawPanelShell(ctx, width, height, 'DAILY REWARD', GOLD);
  if (!save) return;
  const days = dailyRewardCalendar(save, localDate());
  const boxW = 84;
  const boxH = 110;
  const gap = 12;
  const totalW = 7 * boxW + 6 * gap;
  let bx = (width - totalW) / 2;
  const by = 220;
  ctx.textBaseline = 'alphabetic';
  for (const day of days) {
    ctx.fillStyle = day.current ? 'rgba(251, 191, 36, 0.16)' : 'rgba(20, 27, 61, 0.96)';
    ctx.fillRect(bx, by, boxW, boxH);
    ctx.strokeStyle = day.current ? GOLD : (day.done ? GREEN : 'rgba(148, 163, 184, 0.45)');
    ctx.lineWidth = day.current ? 3 : 1.5;
    ctx.strokeRect(bx, by, boxW, boxH);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#94a3b8';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText(`DAY ${day.day}`, bx + boxW / 2, by + 26);
    ctx.fillStyle = day.done ? GREEN : GOLD;
    ctx.font = 'bold 24px sans-serif';
    ctx.fillText(day.done ? '✓' : `◆ ${day.reward}`, bx + boxW / 2, by + 62);
    ctx.fillStyle = '#94a3b8';
    ctx.font = '13px sans-serif';
    ctx.fillText(day.current ? 'TODAY' : (day.done ? 'claimed' : (day.locked ? 'locked' : '')), bx + boxW / 2, by + 92);
    bx += boxW + gap;
  }
  // Claim button (or the claimed state).
  const claimable = save.dailyReward
    && save.dailyReward.pendingReward > 0
    && save.dailyReward.lastClaimDate !== localDate();
  const r = CLAIM_RECT;
  ctx.save();
  if (claimable) {
    glow(ctx, GOLD, 18);
    ctx.fillStyle = GOLD;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    noGlow(ctx);
    ctx.fillStyle = INK;
  } else {
    ctx.fillStyle = 'rgba(148, 163, 184, 0.25)';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = '#94a3b8';
  }
  ctx.font = 'bold 24px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(
    claimable ? `CLAIM  ◆ ${save.dailyReward.pendingReward}` : 'CLAIMED ✓',
    r.x + r.w / 2, r.y + r.h / 2 + 1,
  );
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#a5f3fc';
  ctx.font = '17px sans-serif';
  ctx.fillText(`🔥 ${save.streak.count}-day streak — day 7 pays ◆ 100, the best of the week.`, width / 2, 532);
  ctx.fillStyle = '#94a3b8';
  ctx.font = '15px sans-serif';
  ctx.fillText('Missed a day? Your streak survives once per week — the freeze is automatic.', width / 2, 560);
}

function drawHangar(ctx, save, width, height, skin = SKINS[0], state = null) {
  panel(ctx, width, height);
  bigTitle(ctx, 'HANGAR', 64, width, CYAN, 46);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#a5f3fc';
  ctx.font = '19px sans-serif';
  ctx.fillText('Your ship, upgraded part by part — every purchase stays forever.', width / 2, 96);
  // --- Skin strip: the ship selector moved here from the title, so its
  // name can never overlap an arrow again. The ship, its name and the
  // progress to the next skin each have their own row.
  const preview = {
    ship: { x: 150, y: 152, angle: -Math.PI / 2, vx: 0, vy: 0, invulnerable: 0 },
    time: state ? state.time : 0,
    shield: false,
  };
  drawShip(ctx, preview, skin);
  for (const [rect, dir] of [[HANGAR_SKIN_LEFT, -1], [HANGAR_SKIN_RIGHT, 1]]) {
    ctx.save();
    ctx.strokeStyle = CYAN;
    ctx.lineWidth = 2;
    ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
    ctx.fillStyle = CYAN;
    ctx.beginPath();
    const cx = rect.x + rect.w / 2;
    const cy = rect.y + rect.h / 2;
    if (dir < 0) {
      ctx.moveTo(cx + 8, cy - 12);
      ctx.lineTo(cx - 8, cy);
      ctx.lineTo(cx + 8, cy + 12);
    } else {
      ctx.moveTo(cx - 8, cy - 12);
      ctx.lineTo(cx + 8, cy);
      ctx.lineTo(cx - 8, cy + 12);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 20px sans-serif';
  ctx.fillText(`SHIP  ${skin.name}`, 330, 152);
  const nextSkin = nextUnlock(save ? save.lifetime.shards : 0);
  if (nextSkin) {
    ctx.fillStyle = '#94a3b8';
    ctx.font = '16px sans-serif';
    ctx.fillText(`Next skin ${nextSkin.skin.name} — ${nextSkin.have} / ${nextSkin.need} shards`, 330, 196);
    const barW = 260;
    ctx.fillStyle = 'rgba(148, 163, 184, 0.4)';
    ctx.fillRect(200, 206, barW, 8);
    ctx.fillStyle = nextSkin.skin.glow;
    ctx.fillRect(200, 206, barW * Math.min(1, nextSkin.have / nextSkin.need), 8);
  } else {
    ctx.fillStyle = GOLD;
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText('All ship skins unlocked!', 330, 196);
  }
  // --- Profile summary (right of the skin strip).
  ctx.textAlign = 'left';
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 19px sans-serif';
  const balance = save ? (save.shardBalance ?? 0) : 0;
  const lifetime = save ? save.lifetime.shards : 0;
  ctx.fillText(
    `BEST ${save ? save.best : 0}   •   RUNS ${save ? save.lifetime.runs : 0}   •   LIFETIME SHARDS ${lifetime}   •   🔥 ${save ? save.streak.count : 0}-DAY STREAK`,
    500, 140,
  );
  ctx.fillStyle = GOLD;
  ctx.font = 'bold 21px sans-serif';
  ctx.fillText(`BALANCE  ${balance} shards — tap a part to buy it (keys 1–5 work too)`, 500, 172);
  // One row per part: name, effect, level pips, buy button.
  for (const row of layoutHangarParts()) {
    const level = save ? hangarLevel(save, row.part.id) : 0;
    const cost = hangarNextCost(row.part, level);
    const affordable = cost !== null && balance >= cost;
    ctx.save();
    ctx.fillStyle = 'rgba(20, 27, 61, 0.96)';
    ctx.fillRect(row.x, row.y, row.w, row.h);
    ctx.strokeStyle = affordable ? GOLD : 'rgba(148, 163, 184, 0.45)';
    ctx.lineWidth = affordable ? 2 : 1.5;
    ctx.strokeRect(row.x, row.y, row.w, row.h);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = CYAN;
    ctx.font = 'bold 21px sans-serif';
    ctx.fillText(row.part.name, row.x + 16, row.y + 28);
    ctx.fillStyle = '#e2e8f0';
    ctx.font = '16px sans-serif';
    const descLines = wrapText(ctx, row.part.desc, 600);
    descLines.slice(0, 1).forEach((line, li) => {
      ctx.fillText(line, row.x + 16, row.y + 50 + li * 20);
    });
    // Level pips, ending just left of the buy button.
    const pipGap = 26;
    const totalW = (row.part.max - 1) * pipGap;
    const pipEndX = row.buy.x - 24;
    const pipStartX = pipEndX - totalW;
    for (let p = 0; p < row.part.max; p += 1) {
      ctx.beginPath();
      ctx.arc(pipStartX + p * pipGap, row.y + row.h / 2, 8, 0, Math.PI * 2);
      ctx.fillStyle = p < level ? GOLD : 'rgba(148, 163, 184, 0.35)';
      ctx.fill();
    }
    // Buy button: gold when affordable, grey when maxed or too expensive.
    const b = row.buy;
    if (cost === null) {
      ctx.fillStyle = 'rgba(148, 163, 184, 0.25)';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = '#94a3b8';
    } else if (affordable) {
      ctx.fillStyle = GOLD;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = INK;
    } else {
      ctx.fillStyle = 'rgba(148, 163, 184, 0.18)';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = '#94a3b8';
    }
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(
      cost === null ? 'MAXED' : (affordable ? `BUY ${cost}` : `NEED ${cost}`),
      b.x + b.w / 2, b.y + b.h / 2 + 1,
    );
    ctx.restore();
  }
  // Back button, bottom centre.
  drawButton(ctx, HANGAR_BACK_RECT, '◀  BACK  [H]');
}

// An outlined button with a centred label (pause menu, game-over exits,
// hangar back). One style, so every exit looks the same.
function drawButton(ctx, rect, label) {
  ctx.save();
  ctx.strokeStyle = CYAN;
  ctx.lineWidth = 2;
  ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
  ctx.fillStyle = CYAN;
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, rect.x + rect.w / 2, rect.y + rect.h / 2 + 1);
  ctx.restore();
}

function drawPlayAgain(ctx) {
  const r = PLAY_AGAIN_RECT;
  ctx.save();
  ctx.fillStyle = GOLD;
  ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.fillStyle = INK;
  ctx.font = 'bold 24px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('▶  PLAY AGAIN', r.x + r.w / 2, r.y + r.h / 2 + 1);
  ctx.restore();
  // No "or press R" line here: the button below (HANGAR / CONTINUE —
  // ENDLESS) starts 20 px under it, and the key hints live on the
  // screens' own hint line instead.
}

function drawUpgrade(ctx, state, offers, width, height, age = 0) {
  // The frozen play field stays visible underneath.
  panel(ctx, width, height);
  // Level-up celebration: a gold flash that fades over the first 0.25 s,
  // while the cards slide up into place.
  const p = Math.min(1, age / 0.25);
  const ease = 1 - (1 - p) * (1 - p);
  if (p < 1) {
    ctx.fillStyle = `rgba(251, 191, 36, ${(1 - p) * 0.18})`;
    ctx.fillRect(0, 0, width, height);
  }
  bigTitle(ctx, 'LEVEL UP!', 165, width, GOLD, 56);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e2e8f0';
  ctx.font = '20px sans-serif';
  ctx.fillText(`Level ${state.level} reached — choose one upgrade.`, width / 2, 212);
  const cards = layoutUpgradeCards(offers);
  for (let i = 0; i < cards.length; i += 1) {
    const card = cards[i];
    const up = card.upgrade;
    const count = (state.upgrades && state.upgrades[up.id]) || 0;
    ctx.save();
    ctx.globalAlpha = 0.25 + 0.75 * ease;
    ctx.translate(0, (1 - ease) * 40);
    ctx.fillStyle = 'rgba(20, 27, 61, 0.96)';
    ctx.fillRect(card.x, card.y, card.w, card.h);
    ctx.strokeStyle = CYAN;
    ctx.lineWidth = 2;
    ctx.strokeRect(card.x, card.y, card.w, card.h);
    // Key badge: press 1, 2 or 3 — or tap the card.
    ctx.save();
    ctx.translate(card.x + 28, card.y + 30);
    glow(ctx, GOLD, 10);
    ctx.fillStyle = GOLD;
    ctx.beginPath();
    ctx.arc(0, 0, 16, 0, Math.PI * 2);
    ctx.fill();
    noGlow(ctx);
    ctx.fillStyle = INK;
    ctx.font = 'bold 19px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(i + 1), 0, 1);
    ctx.restore();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = CYAN;
    ctx.font = 'bold 26px sans-serif';
    ctx.fillText(up.name, card.x + card.w / 2, card.y + 84);
    ctx.fillStyle = '#e2e8f0';
    ctx.font = '17px sans-serif';
    const lines = wrapText(ctx, up.desc, card.w - 36);
    lines.forEach((line, li) => {
      ctx.fillText(line, card.x + card.w / 2, card.y + 122 + li * 24);
    });
    // Current level: pips for capped upgrades, a count for AEGIS.
    ctx.font = 'bold 16px sans-serif';
    if (Number.isFinite(up.max)) {
      const pipGap = 26;
      const totalW = (up.max - 1) * pipGap;
      const startX = card.x + card.w / 2 - totalW / 2;
      for (let p = 0; p < up.max; p += 1) {
        ctx.beginPath();
        ctx.arc(startX + p * pipGap, card.y + 188, 8, 0, Math.PI * 2);
        ctx.fillStyle = p < count ? GOLD : 'rgba(148, 163, 184, 0.35)';
        ctx.fill();
      }
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(`LEVEL ${count} / ${up.max}`, card.x + card.w / 2, card.y + 214);
    } else {
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(`Picked ${count}× so far`, card.x + card.w / 2, card.y + 200);
    }
    ctx.restore();
  }
  ctx.fillStyle = '#a5f3fc';
  ctx.font = '19px sans-serif';
  ctx.fillText('Press 1, 2 or 3 — or tap a card.', width / 2, 540);
}

function drawOver(ctx, state, best, width, height, summary = null, extra = {}) {
  panel(ctx, width, height);
  bigTitle(ctx, 'THE STORM TOOK YOU', 200, width, MAGENTA, 54);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 26px sans-serif';
  ctx.fillText(`SCORE  ${state.score}    •    LEVEL ${state.level}    •    BEST COMBO  x${Math.max(1, state.bestCombo)}`, width / 2, 268);
  let y = 306;
  if (summary && summary.endless) {
    ctx.fillStyle = GREEN;
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText('∞  ENDLESS RUN — you drifted past the Aurora Gate!', width / 2, y);
    y += 36;
  }
  if (state.score >= best && state.score > 0) {
    ctx.fillStyle = GOLD;
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText('★ NEW BEST SCORE ★', width / 2, y);
    y += 36;
  }
  if (summary && summary.rank > 0) {
    ctx.fillStyle = GOLD;
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText(
      summary.rank === 1
        ? '#1 ON TOP SCORES — a new top score!'
        : `#${summary.rank} ON TOP SCORES — just ${summary.gapToFirst} points from #1!`,
      width / 2, y,
    );
    y += 36;
  }
  // Near-miss line (Zeigarnik): how close the gate was.
  if (state.score >= 800 && state.score < WIN_SCORE) {
    ctx.fillStyle = '#a5f3fc';
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText(`You died at ${state.score} — just ${WIN_SCORE - state.score} more to the gate!`, width / 2, y);
    y += 36;
  }
  // Missions, one compact line instead of one line per mission.
  if (summary && summary.completed.length) {
    const total = summary.completed.reduce((n, m) => n + m.reward, 0);
    ctx.fillStyle = '#34d399';
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText(`✓ MISSIONS +${total} shards`, width / 2, y);
    y += 36;
  }
  // The visible next goal: the next locked skin, else the gate, else the best.
  const save = extra.save ?? null;
  const next = nextUnlock(save ? save.lifetime.shards : 0);
  ctx.fillStyle = '#a5f3fc';
  ctx.font = 'bold 20px sans-serif';
  if (next) {
    ctx.fillText(`NEXT GOAL: ${next.skin.name} skin — ${next.have} / ${next.need} ◆`, width / 2, y);
  } else if (state.score < WIN_SCORE) {
    ctx.fillText(`NEXT GOAL: Aurora Gate — ${WIN_SCORE - state.score} points to go`, width / 2, y);
  } else {
    ctx.fillText(`NEXT GOAL: beat your best ${best}`, width / 2, y);
  }
  drawPlayAgain(ctx);
  // The endless trap fix: from a death screen the player can go straight
  // to the hangar to spend the shards they just earned.
  drawButton(ctx, OVER_HANGAR_RECT, 'HANGAR  [H]');
  ctx.fillStyle = '#94a3b8';
  ctx.font = '17px sans-serif';
  ctx.fillText('R retry  •  H hangar  •  Esc menu', width / 2, 622);
}

  let y = 415;
  if (summary && summary.rank > 0) {
    ctx.fillStyle = GOLD;
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText(
      summary.rank === 1
        ? '#1 ON TOP SCORES — a new top score!'

  ctx.font = '17px sans-serif';
  ctx.fillText('R retry  •  E endless  •  H hangar', width / 2, 692);

function createRenderer(canvas) {
  const ctx = canvas.getContext('2d');

  // CSS-pixel size of the canvas box, plus the device pixel ratio used
  // for a crisp backing store on phones (capped at 3 for speed).
  function resize() {
    const rect = canvas.getBoundingClientRect();
    const width = Math.max(320, Math.floor(rect.width));
    const height = Math.max(240, Math.floor(rect.height));
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const backingWidth = Math.floor(width * dpr);
    const backingHeight = Math.floor(height * dpr);
    if (canvas.width !== backingWidth || canvas.height !== backingHeight) {
      canvas.width = backingWidth;
      canvas.height = backingHeight;
    }
    return { width, height, dpr };
  }

  function draw(state, screen, best, extra = {}) {
    const skin = extra.skin ?? SKINS[0];
    const offers = extra.offers ?? [];
    const lifetimeShards = extra.lifetimeShards ?? 0;
    const pointer = extra.pointer ?? null;
    const upgradeAge = extra.upgradeAge ?? 0;
    const save = extra.save ?? null;
    const streakInfo = extra.streakInfo ?? null;
    const summary = extra.summary ?? null;
    const { width, height, dpr } = resize();
    // Work in CSS pixels; the backing store is denser on hi-DPI screens.
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // Deep indigo sky, full screen (it also fills the letterbox bars).
    const sky = ctx.createLinearGradient(0, 0, 0, height);
    sky.addColorStop(0, '#0b1026');
    sky.addColorStop(0.55, '#141b3d');
    sky.addColorStop(1, '#1e1b4b');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, width, height);
    drawNebula(ctx, width, height);

    // Hit flash, full screen.
    if (state.flashes > 0) {
      ctx.fillStyle = `rgba(244, 114, 182, ${state.flashes * 0.25})`;
      ctx.fillRect(0, 0, width, height);
    }

    // The field, letterboxed with one uniform scale: everything below is
    // drawn in field coordinates, so drawn position == simulated position.
    const { scale, ox, oy } = viewTransform(width, height);
    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(scale, scale);
    // Hit shake: the field jolts ~3 px for 0.1 s. The HUD and overlays
    // are drawn after the matching restore(), so they stay steady.
    // REDUCE SHAKE (settings) softens it to a 1 px nudge.
    ctx.save();
    if (state.shakeTime > 0) {
      const mag = ((state.shakeMag || 3) * (save && save.settings.reduceShake ? 0.33 : 1)) * Math.max(0, state.shakeTime / 0.1);
      ctx.translate((Math.random() * 2 - 1) * mag, (Math.random() * 2 - 1) * mag);
    }
    drawStars(ctx, state);

    if (screen === SCREEN_TITLE) {
      drawGate(ctx, state, FIELD.width, FIELD.height);
    }

    // Particles, under the entities.
    for (const p of state.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Trail ribbon, in the skin's trail colour.
    for (let i = 0; i < state.trail.length; i += 1) {
      const dot = state.trail[i];
      ctx.globalAlpha = (dot.life / dot.maxLife) * 0.5 * (i / state.trail.length);
      ctx.fillStyle = skin.trail;
      ctx.beginPath();
      ctx.arc(dot.x, dot.y, 3 + 3 * (i / state.trail.length), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (screen === SCREEN_PLAY || screen === SCREEN_PAUSED || screen === SCREEN_OVER || screen === SCREEN_WIN || screen === SCREEN_UPGRADE) {
      for (const s of state.shards) drawShard(ctx, s.x, s.y, s.spin, s.pulse, s.golden);
      for (const s of state.shields) drawShieldCell(ctx, s.x, s.y, s.pulse);
      for (const m of state.mines) drawMine(ctx, m.x, m.y, m.radius, m.spin, m.pulse, m.age);
      for (const s of state.storms) drawStorm(ctx, s.x, s.y, s.spin, s.age);
      if (screen === SCREEN_PLAY || screen === SCREEN_PAUSED || screen === SCREEN_UPGRADE) drawShip(ctx, state, skin);
    }
    if (screen === SCREEN_PLAY && pointer && pointer.down && pointer.mode === 'relative') {
      drawJoystick(ctx, pointer);
    }
    // Magnet ring: when the pickup radius grows mid-run, a brief cyan
    // ring shows the new reach — the pull is visible, not invisible.
    if (screen === SCREEN_PLAY && state.magnetFlash > 0) {
      ctx.save();
      ctx.globalAlpha = 0.35 * Math.max(0, state.magnetFlash / 1.5);
      ctx.strokeStyle = CYAN;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(state.ship.x, state.ship.y, state.magnetRadius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    // First-run cues (teach by doing, not by a wall of text): while the
    // player has collected fewer than 3 shards in their very first run,
    // a pulsing hint floats over the ship; the dash cue appears the
    // first time a mine comes close while dash is ready.
    if (screen === SCREEN_PLAY && extra.firstRun && (state.shardsCollected ?? 0) < 3 && state.time < 10) {
      const pulse = 0.6 + 0.4 * Math.sin(state.time * 4);
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('DRAG TO STEER', state.ship.x, state.ship.y - 70);
      ctx.fillText('↓', state.ship.x, state.ship.y - 42);
      ctx.restore();
      ctx.textBaseline = 'alphabetic';
    }
    if (screen === SCREEN_PLAY && extra.dashCue) {
      const pulse = 0.6 + 0.4 * Math.sin(state.time * 4);
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.fillStyle = GOLD;
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('TAP DASH TO DODGE!', FIELD.width - 170, 540);
      ctx.restore();
      ctx.textBaseline = 'alphabetic';
    }
    // Floating score texts ("+10", "CLOSE! +5") rise and fade — only
    // while playing. On the game-over / win screens they would bleed
    // through the dim overlay onto the score lines, so they are not
    // drawn there.
    if (screen === SCREEN_PLAY || screen === SCREEN_PAUSED || screen === SCREEN_UPGRADE) {
      for (const f of state.floaters ?? []) {
        ctx.globalAlpha = Math.max(0, f.life / f.maxLife);
        ctx.fillStyle = f.color;
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(f.text, f.x, f.y);
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (screen === SCREEN_PLAY || screen === SCREEN_PAUSED || screen === SCREEN_UPGRADE) drawHud(ctx, state, best, FIELD.width);
    if (screen === SCREEN_TITLE) drawTitle(ctx, state, best, FIELD.width, FIELD.height, skin, lifetimeShards, { save, streakInfo });
    if (screen === SCREEN_HANGAR) drawHangar(ctx, save, FIELD.width, FIELD.height, skin, state);
    if (screen === SCREEN_PAUSED) drawPaused(ctx, FIELD.width, FIELD.height);
    if (screen === SCREEN_OVER) drawOver(ctx, state, best, FIELD.width, FIELD.height, summary, { save });
    if (screen === SCREEN_WIN) drawWin(ctx, state, best, FIELD.width, FIELD.height, summary);
    if (screen === SCREEN_STATS) drawStats(ctx, save, FIELD.width, FIELD.height);
    if (screen === SCREEN_MISSIONS) drawMissionsPanel(ctx, save, FIELD.width, FIELD.height);
    if (screen === SCREEN_SETTINGS) drawSettingsPanel(ctx, save, FIELD.width, FIELD.height, { fullscreenOn: extra.fullscreenOn ?? false });
    if (screen === SCREEN_REWARD) drawRewardPanel(ctx, save, FIELD.width, FIELD.height);
    if (screen === SCREEN_UPGRADE) drawUpgrade(ctx, state, offers, FIELD.width, FIELD.height, upgradeAge);
    ctx.restore();
    noGlow(ctx);
  }

  return { draw };
}

// ---- src/shots.js ----
// Lumen Drift — the screenshot scenes behind ?shot=start|play|end|win.
// Each scene plays the real rules forward from a fresh world for a fixed
// number of steps, steered by a simple autopilot (chase the nearest shard,
// keep clear of mines and storm shards), so the frame is what a real game
// looks like and the same seed always gives the same frame.
//
// - start: the title screen over a live, drifting field.
// - play: a busy mid-game — score ~340, combo x3, 2 hearts left.
// - end: the autopilot flies carelessly and the storm takes the skiff.
// - win: the gate opens at 1,200 points.

const START_SECONDS = 6;
const PLAY_TARGET = 340;
const END_LIMIT_SECONDS = 600;

/** Steer toward `target` while dodging the nearest hazard in the way. */
function autopilot(state, careless) {
  const ship = state.ship;
  // Nearest shard to chase.
  let shard = null;
  let shardDist = Infinity;
  for (const s of state.shards) {
    const d = Math.hypot(s.x - ship.x, s.y - ship.y);
    if (d < shardDist) { shardDist = d; shard = s; }
  }
  let tx = shard ? shard.x : state.ship.x;
  let ty = shard ? shard.y : state.ship.y;
  // Dodge: if a mine or storm is close and ahead, veer away from it.
  const horizon = careless ? 60 : 130;
  for (const list of [state.mines, state.storms]) {
    for (const e of list) {
      const d = Math.hypot(e.x - ship.x, e.y - ship.y);
      if (d < horizon) {
        const away = Math.atan2(ship.y - e.y, ship.x - e.x);
        tx = ship.x + Math.cos(away) * 160;
        ty = ship.y + Math.sin(away) * 160;
      }
    }
  }
  const dx = tx - ship.x;
  const dy = ty - ship.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 10) return { x: 0, y: 0 };
  return { x: dx / dist, y: dy / dist };
}

/** Set `world` to the named scene and return the screen to draw over it. */
function stageShot(name, world) {
  world.reset();
  const state = world.state;
  if (name === 'win') {
    // Play forward until the gate opens, then let the victory settle.
    for (let i = 0; i < 60 * 240; i += 1) {
      const events = world.step(STEP, autopilot(state, false), null, false);
      if (events & EVENT_WIN) break;
    }
    state.score = Math.max(state.score, WIN_SCORE);
    state.gateOpen = true;
    state.gateProgress = 1;
    for (let i = 0; i < 30; i += 1) world.step(STEP, { x: 0, y: 0 }, null, false);
    return { screen: SCREEN_WIN, best: state.score };
  }
  if (name === 'play') {
    for (let i = 0; i < 60 * 240; i += 1) {
      world.step(STEP, autopilot(state, false), null, false);
      if (state.score >= PLAY_TARGET) break;
    }
    // Let the field settle for a moment, then stage the exact HUD the
    // brief asks for: ~340 points, combo x3, two hearts. The autopilot
    // keeps the skiff alive; the numbers below are the scene's floor.
    for (let i = 0; i < 12; i += 1) world.step(STEP, autopilot(state, false), null, false);
    state.score = PLAY_TARGET;
    state.combo = 3;
    state.comboCount = 6;
    state.bestCombo = Math.max(3, state.bestCombo);
    state.hearts = 2;
    state.gateProgress = Math.min(1, state.score / WIN_SCORE);
    return { screen: SCREEN_PLAY, best: state.score };
  }
  if (name === 'end') {
    // A reckless pilot: it wanders the middle of the field, never chases
    // a shard and never dodges, so the storm catches it early with a
    // modest score — a real game over, not a high-score run cut short.
    for (let i = 0; i < END_LIMIT_SECONDS / STEP; i += 1) {
      const wander = {
        x: Math.sin(state.time * 0.7) * 0.4,
        y: Math.cos(state.time * 0.5) * 0.3,
      };
      const events = world.step(STEP, wander, null, false);
      if (events & EVENT_OVER) break;
    }
    // Guarantee the game-over frame: if the reckless pilot survived the
    // whole limit (it should not), drain the hearts directly.
    if (state.hearts > 0) state.hearts = 0;
    for (let i = 0; i < 20; i += 1) world.step(STEP, { x: 0, y: 0 }, null, false);
    return { screen: SCREEN_OVER, best: state.score };
  }
  // start (and any unknown name): a live field behind the title.
  for (let i = 0; i < START_SECONDS / STEP; i += 1) {
    world.step(STEP, { x: 0, y: 0 }, null, false);
  }
  return { screen: SCREEN_TITLE, best: 0 };
}

// ---- src/main.js ----
// Lumen Drift — boot and the one loop. Input is read every frame, the world
// advances in fixed 1/60 s steps (several in a slow frame, none in a fast
// one), and the renderer paints what is there. The game moves between
// eleven screens: title, hangar, play, upgrade (level-up choice), paused,
// game over and win (which can continue into endless mode), plus the
// panels over Home — top scores, daily missions, settings and daily reward.
//
// ?seed=N fixes the storm's pattern. ?shot=start|play|end|win (with
// &seed=N) stages that scene instead of running the loop, paints it twice
// and sets window.__shotReady for a screenshot. ?debug=win starts a live
// game one shard away from the Aurora Gate, for testing the win path.

/** The longest frame the loop catches up on; a longer stall is dropped. */
const MAX_FRAME = 0.25;

const params = new URLSearchParams(window.location.search);
const shot = params.get('shot');
const seedParam = Number.parseInt(params.get('seed') ?? '', 10);
const seed = Number.isInteger(seedParam) ? seedParam : Math.floor(Math.random() * 4294967296);

const canvas = document.getElementById('game');
const status = document.getElementById('status');
const world = createWorld(createRandom(seed));
const renderer = createRenderer(canvas);
const audio = createAudio();

function readBest() {
  try {
    return Number.parseInt(window.localStorage.getItem(BEST_KEY) ?? '0', 10) || 0;
  } catch {
    return 0;
  }
}

function saveBest(value) {
  try {
    window.localStorage.setItem(BEST_KEY, String(value));
  } catch {
    // Storage can be off (private windows): the best then lasts this visit.
  }
}

function runShot(name) {
  const scene = stageShot(name, world);
  let painted = 0;
  function paint() {
    renderer.draw(world.state, scene.screen, scene.best);
    painted += 1;
    if (painted < 2) requestAnimationFrame(paint);
    else window.__shotReady = true;
  }
  requestAnimationFrame(paint);
}

function runGame() {
  const input = createInput(canvas);
  // On-screen touch buttons (shown only on touch devices by CSS).
  const dashBtn = document.getElementById('btn-dash');
  if (dashBtn) input.bindButton(dashBtn, ACTION_DASH);
  const pauseBtn = document.getElementById('btn-pause');
  if (pauseBtn) input.bindButton(pauseBtn, ACTION_PAUSE);
  // Fullscreen: the F key or the on-screen button. The button hides
  // itself where the browser cannot fullscreen the page (e.g. iPhone
  // Safari); the game plays the same either way.
  const fsBtn = document.getElementById('btn-fullscreen');
  const fsSupported = typeof document.documentElement.requestFullscreen === 'function';
  if (fsBtn && !fsSupported) fsBtn.style.display = 'none';
  if (fsBtn && fsSupported) input.bindButton(fsBtn, ACTION_FULLSCREEN);
  function toggleFullscreen() {
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    } else {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  }
  function syncFullscreenButton() {
    if (!fsBtn) return;
    const on = !!document.fullscreenElement;
    fsBtn.classList.toggle('on', on);
    fsBtn.setAttribute('aria-label', on ? 'Exit fullscreen' : 'Fullscreen');
  }
  document.addEventListener('fullscreenchange', syncFullscreenButton);
  let screen = SCREEN_TITLE;
  // Local progress: one versioned save blob (best, top-5, history,
  // lifetime stats, streak, missions), seeded from the legacy keys.
  const today = localDate();
  let save = loadSave(window.localStorage, today, {
    best: readBest(),
    shards: loadLifetimeShards(window.localStorage),
  });
  const streakInfo = touchStreak(save, today);
  saveSave(window.localStorage, save);
  // The settings panel's mute toggle is persisted in the save.
  audio.setMuted(save.settings.muted);
  let best = save.best;
  let lifetimeShards = save.lifetime.shards;
  let skinId = loadSkinId(window.localStorage, lifetimeShards);
  // The dash cue (first-time teaching) has been displayed this run.
  let dashCueSeen = false;
  // Whether the dash cue should show right now (computed each frame).
  let dashCue = false;
  // Hangar bonuses apply from the start of every run.
  world.setHangar(hangarBonuses(save));
  // The last run's summary (top-5 rank, missions) for the game-over screen.
  let lastSummary = null;
  // The win bank of the current run: when a win continues into endless,
  // the endless death replaces this bank instead of adding a second one.
  let lastBanked = null;
  // True while the current run is an endless continuation of a win.
  let endlessRun = false;
  // Per-run stats for missions and the run history.
  let runStats = { dashes: 0, maxLevel: 1, playSeconds: 0 };
  let offers = [];
  let accumulator = 0;
  let last = performance.now();
  // Seconds since the LEVEL UP cards appeared (drives their animation).
  let upgradeAge = 0;

  // Debug hook for testing the win path: one shard from the gate.
  if (params.get('debug') === 'win') {
    world.state.score = WIN_SCORE - 10;
    world.state.gateProgress = (WIN_SCORE - 10) / WIN_SCORE;
    screen = SCREEN_PLAY;
  }

  function announce(text) {
    status.textContent = text;
  }

  function startGame() {
    world.reset();
    screen = SCREEN_PLAY;
    runStats = { dashes: 0, maxLevel: 1, playSeconds: 0 };
    lastBanked = null;
    endlessRun = false;
    input.clearPressed();
    input.clearTap();
    audio.unlock();
    audio.click();
    announce('Lumen Drift started. Collect star shards, dodge the mines.');
  }

  function endGame(won) {
    screen = won ? SCREEN_WIN : SCREEN_OVER;
    input.clearPressed();
    input.clearTap();
    // Bank the run into the local save: top-5, history, lifetime stats,
    // and today's missions (which pay their shard rewards immediately).
    const run = {
      score: world.state.score,
      level: world.state.level,
      bestCombo: world.state.bestCombo,
      shards: world.state.shardsCollected,
      dashes: runStats.dashes,
      upgrades: Object.entries(world.state.upgrades)
        .filter(([, n]) => n > 0).map(([id]) => id),
      playSeconds: Math.round(runStats.playSeconds),
      date: today,
      endless: world.state.endless,
    };
    let result;
    if (won) {
      // Beating the gate unlocks endless mode from now on. The win is
      // banked now — if the player continues into endless, the death at
      // the end of that same run REPLACES this bank (see below), so the
      // run is counted exactly once, with its final score.
      save.endlessUnlocked = true;
      result = recordRun(save, run);
      lastBanked = { entry: result.entry, historyEntry: result.historyEntry, shards: run.shards };
    } else if (endlessRun && lastBanked) {
      result = recordRun(save, run, { replace: lastBanked });
      lastBanked = null;
    } else {
      result = recordRun(save, run);
    }
    // The first-run cue is over once the run ends; the dash cue is
    // retired the same way, so it teaches exactly once.
    if (dashCueSeen) save.ftue.dashCueShown = true;
    const completed = updateMissions(save, run);
    saveSave(window.localStorage, save);
    best = save.best;
    lifetimeShards = save.lifetime.shards;
    // The legacy best/shards keys stay in sync for older readers.
    saveBest(best);
    saveLifetimeShards(window.localStorage, lifetimeShards);
    lastSummary = { rank: result.rank, gapToFirst: result.gapToFirst, completed, endless: world.state.endless };
    if (won) audio.win();
    else audio.over();
    announce(won
      ? `You win! Aurora Gate open with ${world.state.score} points. Press R or tap PLAY AGAIN.`
      : `Game over. Score ${world.state.score}. Press R or tap PLAY AGAIN.`);
  }

  // Keep drifting past the Aurora Gate: the run goes endless — no reset,
  // the score keeps counting and the difficulty keeps scaling.
  function continueEndless() {
    world.enterEndless();
    screen = SCREEN_PLAY;
    endlessRun = true;
    accumulator = 0;
    input.clearPressed();
    input.clearTap();
    world.grantGrace(UPGRADE_GRACE);
    audio.levelup();
    announce('Endless drift — the storm never ends now. Keep collecting!');
  }

  // Buy one hangar part level with lifetime shards. The world picks the
  // new bonuses up on the next reset (the next run).
  function tryBuyHangar(index) {
    const part = HANGAR_PARTS[index];
    if (!part) return;
    const bought = buyHangarPart(save, part.id);
    if (bought.ok) {
      world.setHangar(hangarBonuses(save));
      saveSave(window.localStorage, save);
      audio.click();
      announce(`Bought ${part.name} level ${bought.level} for ${bought.cost} shards.`);
    } else if (bought.reason === 'broke') {
      announce(`Not enough shards for ${part.name}.`);
    } else if (bought.reason === 'maxed') {
      announce(`${part.name} is already maxed.`);
    }
  }

  // Open the hangar from the title. The input gate stops the tap that
  // opened it from also buying a part on the first frame.
  function enterHangar() {
    screen = SCREEN_HANGAR;
    input.clearPressed();
    input.clearTap();
    input.armGate();
    audio.click();
    announce('Hangar. Buy permanent ship upgrades with your shards. Press H to go back.');
  }

  // Cycle the ship skin through the skins already unlocked (title only).
  function cycleSkin(direction) {
    const unlocked = unlockedSkins(lifetimeShards);
    const index = unlocked.findIndex((s) => s.id === skinId);
    const next = unlocked[(index + direction + unlocked.length) % unlocked.length];
    if (!next || next.id === skinId) return;
    skinId = next.id;
    saveSkinId(window.localStorage, skinId);
    const following = nextUnlock(lifetimeShards);
    announce(following
      ? `Ship skin ${next.name}. Next skin ${following.skin.name} at ${following.need} shards.`
      : `Ship skin ${next.name}. All skins unlocked.`);
  }

  // Open a panel over Home (top scores, missions, settings, daily
  // reward). One tap on the X, the backdrop, Esc or Enter closes it.
  function openPanel(panelScreen, label) {
    screen = panelScreen;
    input.clearPressed();
    input.clearTap();
    audio.click();
    announce(`${label}. Tap ✕, the backdrop, or press Esc to go back.`);
  }

  function inRect(tap, rect) {
    return tap
      && tap.x >= rect.x && tap.x <= rect.x + rect.w
      && tap.y >= rect.y && tap.y <= rect.y + rect.h;
  }

  // A level rose: stop the world and offer one upgrade per level risen.
  function enterUpgrade() {
    offers = drawUpgrades(world.state, () => Math.random());
    if (offers.length === 0) {
      world.state.pendingLevelUps = 0;
      return;
    }
    screen = SCREEN_UPGRADE;
    accumulator = 0;
    upgradeAge = 0;
    input.clearPressed();
    input.clearTap();
    input.armGate();
    audio.levelup();
    announce(`Level ${world.state.level}! Choose an upgrade: ${
      offers.map((up, i) => `${i + 1} ${up.name}`).join(', ')
    }.`);
  }

  function applyPick(index) {
    const up = offers[index];
    if (!up || !applyUpgrade(world.state, up.id)) return;
    world.state.pendingLevelUps = Math.max(0, world.state.pendingLevelUps - 1);
    audio.levelup();
    if (world.state.pendingLevelUps > 0) {
      // Rare: one step crossed two levels — offer the next choice too.
      offers = drawUpgrades(world.state, () => Math.random());
      if (offers.length === 0) {
        world.state.pendingLevelUps = 0;
        screen = SCREEN_PLAY;
        accumulator = 0;
        input.clearPressed();
        input.clearTap();
        return;
      }
      announce(`Upgrade picked: ${up.name}. Choose another!`);
      upgradeAge = 0;
      input.clearPressed();
      input.clearTap();
      input.armGate();
      return;
    }
    screen = SCREEN_PLAY;
    accumulator = 0;
    input.clearPressed();
    input.clearTap();
    world.grantGrace(UPGRADE_GRACE);
    announce(`Upgrade picked: ${up.name} — ${up.desc} Back to the drift!`);
  }

  function frame(now) {
    requestAnimationFrame(frame);
    window.__lumen.screenName = screen;
    const elapsed = Math.min(MAX_FRAME, (now - last) / 1000);
    last = now;

    if (input.consume(ACTION_MUTE)) {
      const muted = audio.toggleMute();
      announce(muted ? 'Sound muted.' : 'Sound on.');
    }

    if (input.consume(ACTION_FULLSCREEN)) toggleFullscreen();

    if (screen === SCREEN_TITLE) {
      // The title floats over a live drifting field. Home is PLAY only:
      // the gear opens settings, the flame opens the daily reward, the
      // bottom tab bar (after the first run) opens hangar / missions /
      // scores. The skin selector lives in the hangar now.
      world.step(STEP, { x: 0, y: 0 }, null, false);
      const tap = input.takeTap();
      if (inRect(tap, GEAR_RECT)) {
        openPanel(SCREEN_SETTINGS, 'Settings');
      } else if (inRect(tap, FLAME_RECT) && save.streak.count > 0) {
        openPanel(SCREEN_REWARD, 'Daily reward');
      } else if (inRect(tap, PLAY_RECT)) {
        startGame();
      } else if (inRect(tap, HANGAR_TAB_RECT) && save.lifetime.runs > 0) {
        enterHangar();
      } else if (inRect(tap, MISSIONS_TAB_RECT) && save.lifetime.runs > 0) {
        openPanel(SCREEN_MISSIONS, 'Daily missions');
      } else if (inRect(tap, SCORES_TAB_RECT) && save.lifetime.runs > 0) {
        openPanel(SCREEN_STATS, 'Top scores');
      } else if (input.consume('KeyT')) {
        openPanel(SCREEN_STATS, 'Top scores');
      } else if (input.consume('KeyH')) {
        enterHangar();
      } else if (input.consume(ACTION_CONFIRM) || input.consume(ACTION_RESTART)) {
        startGame();
      }
    } else if (screen === SCREEN_HANGAR) {
      // Buy with keys 1-5 or by tapping a part's BUY button; ◀ ▶ (or
      // ←/→) cycles the ship skin; H, Esc or the BACK button returns to
      // the title. While the input gate is closed (the tap that opened
      // the hangar, or its first 400 ms), swallow everything — a stale
      // tap must never buy a part.
      if (!input.gateOpen()) {
        input.takeTap();
        input.clearPressed();
      } else {
        const tap = input.takeTap();
        if (inRect(tap, HANGAR_BACK_RECT)) {
          screen = SCREEN_TITLE;
          input.clearPressed();
          input.clearTap();
          announce('Lumen Drift. Press Enter or click to launch.');
        } else if (inRect(tap, HANGAR_SKIN_LEFT)) {
          cycleSkin(-1);
          input.clearPressed();
        } else if (inRect(tap, HANGAR_SKIN_RIGHT)) {
          cycleSkin(1);
          input.clearPressed();
        } else {
          const rows = layoutHangarParts();
          const bought = rows.findIndex((row) => inRect(tap, row.buy));
          if (bought >= 0) tryBuyHangar(bought);
          else if (input.consume(ACTION_PICK_1)) tryBuyHangar(0);
          else if (input.consume(ACTION_PICK_2)) tryBuyHangar(1);
          else if (input.consume(ACTION_PICK_3)) tryBuyHangar(2);
          else if (input.consume('Digit4')) tryBuyHangar(3);
          else if (input.consume('Digit5')) tryBuyHangar(4);
          else if (input.consume('ArrowLeft') || input.consume('KeyA')) cycleSkin(-1);
          else if (input.consume('ArrowRight') || input.consume('KeyD')) cycleSkin(1);
          else if (input.consume(ACTION_PAUSE) || input.consume('KeyH')) {
            screen = SCREEN_TITLE;
            input.clearPressed();
            input.clearTap();
            announce('Lumen Drift. Press Enter or click to launch.');
          }
        }
      }
    } else if (screen === SCREEN_STATS || screen === SCREEN_MISSIONS || screen === SCREEN_SETTINGS || screen === SCREEN_REWARD) {
      // Panels over Home: the X, a tap on the backdrop, Esc/P or T
      // closes back to Home. Each panel also has its own taps — those
      // are checked FIRST, because the same press that taps a button
      // also counts as a confirm (input adds ACTION_CONFIRM on every
      // canvas press); checking close first would close the panel
      // instead of claiming / rerolling / toggling.
      const tap = input.takeTap();
      let handled = false;
      if (screen === SCREEN_MISSIONS) {
        const rows = layoutMissionRows();
        const rerolled = rows.findIndex((row) => inRect(tap, row.reroll));
        if (rerolled >= 0 && save.missions.list[rerolled]) {
          const result = rerollMission(save, save.missions.list[rerolled].id);
          if (result.ok) {
            saveSave(window.localStorage, save);
            audio.click();
            announce(`Mission rerolled: ${result.mission.name}.`);
          } else {
            announce('No rerolls left today — missions reset at midnight.');
          }
          handled = true;
        }
      } else if (screen === SCREEN_SETTINGS) {
        if (inRect(tap, SETTINGS_SOUND_RECT)) {
          save.settings.muted = !save.settings.muted;
          audio.setMuted(save.settings.muted);
          saveSave(window.localStorage, save);
          announce(save.settings.muted ? 'Sound muted.' : 'Sound on.');
          handled = true;
        } else if (inRect(tap, SETTINGS_FULLSCREEN_RECT)) {
          toggleFullscreen();
          handled = true;
        } else if (inRect(tap, SETTINGS_SHAKE_RECT)) {
          save.settings.reduceShake = !save.settings.reduceShake;
          saveSave(window.localStorage, save);
          announce(save.settings.reduceShake ? 'Screen shake reduced.' : 'Full screen shake on.');
          handled = true;
        }
      } else if (screen === SCREEN_REWARD) {
        if (inRect(tap, CLAIM_RECT)) {
          const claimed = claimDailyReward(save, today);
          if (claimed.claimed) {
            saveSave(window.localStorage, save);
            lifetimeShards = save.lifetime.shards;
            audio.levelup();
            announce(`Daily reward claimed: +${claimed.reward} shards!`);
          }
          handled = true;
        }
      }
      if (handled) {
        // Drain the confirm this press also raised, so it cannot leak
        // into the next screen.
        input.clearPressed();
        input.clearTap();
      } else if (inRect(tap, PANEL_CLOSE_RECT)
        || (tap && !inRect(tap, PANEL_CARD))
        || input.consume(ACTION_PAUSE)
        || input.consume('KeyT')) {
        screen = SCREEN_TITLE;
        input.clearPressed();
        input.clearTap();
        announce('Lumen Drift. Press Enter or click to launch.');
      }
    } else if (screen === SCREEN_PLAY) {
      if (input.consume(ACTION_PAUSE)) {
        screen = SCREEN_PAUSED;
        announce('Paused. Press P to resume.');
      } else if (world.state.hitStop > 0) {
        // Hit-stop: the world freezes for ~0.06 s after a hit while the
        // frame still renders — the impact reads instead of blurring past.
        world.state.hitStop -= elapsed;
      } else {
        const dash = input.consume(ACTION_DASH);
        runStats.playSeconds += elapsed;
        accumulator += elapsed;
        while (accumulator >= STEP) {
          accumulator -= STEP;
          const events = world.step(STEP, input.steer(), input.pointer(), dash);
          if (events & EVENT_PICKUP) audio.pickup(world.state.combo);
          if (events & EVENT_NEARMISS) audio.close();
          if (events & EVENT_DASH) { audio.dash(); runStats.dashes += 1; }
          if (events & EVENT_SHIELD) audio.shield();
          if (events & EVENT_HIT) audio.hit();
          if (events & EVENT_WIN) { endGame(true); break; }
          if (events & EVENT_OVER) { endGame(false); break; }
        }
        runStats.maxLevel = Math.max(runStats.maxLevel, world.state.level);
        // Dash cue (teach by doing): the first time a mine drifts close
        // while the dash is ready, and the cue has never been shown, a
        // "TAP DASH TO DODGE!" hint appears in play. Once the player has
        // seen it (a dash, or the run ending), it never shows again.
        dashCue = false;
        if (!save.ftue.dashCueShown) {
          const ship = world.state.ship;
          const dashReady = ship.dashCooldown <= 0 && ship.dashTime <= 0;
          if (dashReady) {
            dashCue = world.state.mines.some((m) => {
              const dx = m.x - ship.x;
              const dy = m.y - ship.y;
              return dx * dx + dy * dy < 150 * 150;
            });
            // Retire the cue the moment it first shows (one save write),
            // so quitting mid-run cannot make it pop up again next run.
            if (dashCue && !dashCueSeen) {
              dashCueSeen = true;
              save.ftue.dashCueShown = true;
              saveSave(window.localStorage, save);
            }
          }
        }
        // A level rose and the run is still going: pause the action and
        // offer the upgrade choice. (Win/over above already changed the
        // screen, so this only fires while still playing.)
        if (screen === SCREEN_PLAY && world.state.pendingLevelUps > 0) enterUpgrade();
      }
    } else if (screen === SCREEN_UPGRADE) {
      upgradeAge += elapsed;
      // The world is frozen: no stepping, no accumulator build-up.
      // Pick with 1/2/3 or by tapping a card. Other presses are drained
      // so a pause/DASH tap here cannot leak into play on resume.
      // While the input gate is closed (first 400 ms after the cards
      // appear, or the steering finger is still down), swallow every
      // tap and pick key — this is what stops the stale-tap auto-pick.
      if (!input.gateOpen()) {
        input.takeTap();
        input.clearPressed();
      } else {
        let picked = -1;
        if (input.consume(ACTION_PICK_1)) picked = 0;
        else if (input.consume(ACTION_PICK_2)) picked = 1;
        else if (input.consume(ACTION_PICK_3)) picked = 2;
        else {
          const tap = input.takeTap();
          if (tap) {
            const cards = layoutUpgradeCards(offers);
            picked = cards.findIndex((card) =>
              tap.x >= card.x && tap.x <= card.x + card.w
              && tap.y >= card.y && tap.y <= card.y + card.h);
          }
        }
        if (picked >= 0 && picked < offers.length) applyPick(picked);
        input.clearPressed();
      }
    } else if (screen === SCREEN_PAUSED) {
      // The pause menu is an exit, not a trap: resume, restart, hangar
      // or menu — including during endless, where the run can be left
      // at any time. The button taps are checked FIRST: the same press
      // that taps a button also counts as a confirm (input adds
      // ACTION_CONFIRM on every canvas press), and checking resume
      // first would resume the game instead of opening the hangar.
      const tap = input.takeTap();
      if (inRect(tap, PAUSE_RESUME_RECT)) {
        screen = SCREEN_PLAY;
        input.clearPressed();
        input.clearTap();
        announce('Resumed.');
      } else if (inRect(tap, PAUSE_RESTART_RECT)) {
        startGame();
      } else if (inRect(tap, PAUSE_HANGAR_RECT)) {
        enterHangar();
      } else if (inRect(tap, PAUSE_MENU_RECT)) {
        // No key for MENU here: KeyM is the global mute toggle, so the
        // menu is the button (keyboard players go H, H: hangar, back).
        screen = SCREEN_TITLE;
        input.clearPressed();
        input.clearTap();
        announce('Lumen Drift. Press Enter or click to launch.');
      } else if (input.consume(ACTION_PAUSE) || input.consume(ACTION_CONFIRM)) {
        screen = SCREEN_PLAY;
        input.clearPressed();
        input.clearTap();
        announce('Resumed.');
      } else if (input.consume(ACTION_RESTART)) {
        startGame();
      } else if (input.consume('KeyH')) {
        enterHangar();
      }
    } else if (screen === SCREEN_OVER || screen === SCREEN_WIN) {
      // Deliberate restart only: the PLAY AGAIN button, or the R key.
      // A tap anywhere else no longer restarts — the player gets to read
      // the score, the rank and the near-miss line first. On the win
      // screen, E (or the green button) keeps the run going, endless.
      // H (or the HANGAR button) banks the run and goes to the hangar
      // to spend — the endless trap is closed from both screens.
      const tap = input.takeTap();
      if (input.consume(ACTION_RESTART)) {
        startGame();
      } else if (screen === SCREEN_WIN && input.consume('KeyE')) {
        continueEndless();
      } else if (input.consume('KeyH')) {
        enterHangar();
      } else if (inRect(tap, PLAY_AGAIN_RECT)) {
        input.clearPressed();
        startGame();
      } else if (screen === SCREEN_WIN && inRect(tap, ENDLESS_RECT)) {
        input.clearPressed();
        continueEndless();
      } else if (inRect(tap, OVER_HANGAR_RECT)) {
        input.clearPressed();
        enterHangar();
      } else if (screen === SCREEN_WIN && inRect(tap, WIN_HANGAR_RECT)) {
        input.clearPressed();
        enterHangar();
      }
    }

    renderer.draw(world.state, screen, best, {
      skin: skinById(skinId),
      offers: screen === SCREEN_UPGRADE ? offers : [],
      lifetimeShards,
      pointer: input.pointer(),
      upgradeAge,
      save,
      streakInfo,
      summary: lastSummary,
      firstRun: save.lifetime.runs === 0,
      dashCue,
      fullscreenOn: !!document.fullscreenElement,
    });
  }

  announce(streakInfo.isNewDay && streakInfo.reward > 0
    ? `Lumen Drift. Day ${save.streak.count} streak — your daily reward (◆ ${streakInfo.reward}) is ready! Tap the flame to claim.`
    : 'Lumen Drift. Press Enter or click to launch.');
  requestAnimationFrame(frame);
}

// Expose the live state for automated play-testing (harmless in play).
// `screen` is a window global, so the current screen lives under
// `screenName` instead; the frame loop below keeps it up to date.
window.__lumen = {
  state: world.state,
  screenName: SCREEN_TITLE,
};

if (shot) runShot(shot);
else runGame();
</script>
</body>
</html>
